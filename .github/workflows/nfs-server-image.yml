name: NFS server image

on:
  push:
    branches: [master]
    paths:
      - targets/srv0/k3s-base/nfs-server-src/**
  pull_request:
    paths:
      - targets/srv0/k3s-base/nfs-server-src/**
  schedule:
    # Rebuild weekly so unpinned Alpine packages (notably nfs-utils) pick up
    # security updates even when no source file changes.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to push
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: nfs-server-image
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: targets/srv0/k3s-base/nfs-server-src
          file: targets/srv0/k3s-base/nfs-server-src/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: nfs-server:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=nfs-server

      - name: Verify image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh nfs-server:ci -c '
            set -eu
            grep -E "^(ID|VERSION_ID)=" /etc/os-release
            test -x /usr/sbin/rpc.nfsd
            test -x /usr/sbin/rpc.mountd
            test -x /usr/sbin/exportfs
            sh -n /usr/local/bin/entrypoint.sh
            apk list --installed nfs-utils
            echo image-ok
          '

  publish:
    # Never publish from a PR or a branch dispatch: the real tag must only move for master.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/imranr98/nfs-server
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: targets/srv0/k3s-base/nfs-server-src
          file: targets/srv0/k3s-base/nfs-server-src/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:candidate
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nfs-server
          cache-to: type=gha,mode=max,scope=nfs-server

      - name: Verify image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE@${{ steps.build.outputs.digest }}" -c '
            set -eu
            grep -E "^(ID|VERSION_ID)=" /etc/os-release
            test -x /usr/sbin/rpc.nfsd
            test -x /usr/sbin/rpc.mountd
            test -x /usr/sbin/exportfs
            sh -n /usr/local/bin/entrypoint.sh
            apk list --installed nfs-utils
            echo image-ok
          '

      - name: Promote verified image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:$IMAGE_TAG" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" | grep -q "Digest:.*${DIGEST#sha256:}"
          echo "promoted $DIGEST to $IMAGE:$IMAGE_TAG"
