name: Openclaw image

on:
  push:
    branches: [master]
    paths:
      - targets/srv0/k3s-apps/openclaw-src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/imranr98/openclaw:latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: targets/srv0/k3s-apps/openclaw-src
          file: targets/srv0/k3s-apps/openclaw-src/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=openclaw
          cache-to: type=gha,mode=max,scope=openclaw

      - name: Verify image
        run: |
          set -euo pipefail
          expected_gh="$(sed -n 's/^ARG GH_VERSION=//p' targets/srv0/k3s-apps/openclaw-src/Dockerfile | head -1)"
          expected_opencode="$(sed -n 's/^ARG OPENCODE_VERSION=//p' targets/srv0/k3s-apps/openclaw-src/Dockerfile | head -1)"
          docker run --rm \
            -e HOME=/tmp \
            -e XDG_DATA_HOME=/tmp/oc/data \
            -e XDG_STATE_HOME=/tmp/oc/state \
            -e XDG_CONFIG_HOME=/tmp/oc/config \
            -e XDG_CACHE_HOME=/tmp/oc/cache \
            --entrypoint sh "$IMAGE" -c '
              set -eu
              mkdir -p /tmp/oc/data /tmp/oc/state /tmp/oc/config /tmp/oc/cache
              gh --version | head -1 | tee /tmp/gh-version
              opencode --version | tee /tmp/opencode-version
              node --version | tee /tmp/node-version
            ' > /tmp/openclaw-verify.log
          cat /tmp/openclaw-verify.log
          grep -q "gh version ${expected_gh}" /tmp/openclaw-verify.log
          grep -q "${expected_opencode}" /tmp/openclaw-verify.log
          echo "gh ${expected_gh} / opencode ${expected_opencode} verified"

      - name: Update digest and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "no image digest" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E \
            "s#image: ghcr\\.io/imranr98/openclaw:latest(@sha256:[a-f0-9]+)?#image: ghcr.io/imranr98/openclaw:latest@${DIGEST}#" \
            targets/srv0/k3s-apps/templates/openclaw.yaml
          if git diff --quiet; then
            echo "digest unchanged; no PR needed"
            exit 0
          fi
          git checkout -B automation/openclaw-digest
          git add targets/srv0/k3s-apps/templates/openclaw.yaml
          git commit -m "openclaw: re-pin image digest to ${DIGEST}"
          git push --force origin automation/openclaw-digest
          pr="$(gh pr list --head automation/openclaw-digest --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Rebuilt the openclaw image at ${DIGEST}."
          else
            gh pr create \
              --base master \
              --head automation/openclaw-digest \
              --title "openclaw: re-pin image digest" \
              --body "Rebuilt the openclaw image from \`openclaw-src\` and re-pinned the digest.

          Digest: \`${DIGEST}\`

          The image verification step confirmed the Dockerfile's GH_VERSION and OPENCODE_VERSION. Deploy with the srv0-apps release after review."
          fi
