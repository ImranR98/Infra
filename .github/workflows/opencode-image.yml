name: Opencode image

on:
  push:
    branches: [master]
    paths:
      - targets/srv0/k3s-apps/opencode-src/**
  schedule:
    # debian:trixie-slim is a floating base; rebuild weekly to pick up security
    # updates even when no source file changes.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/imranr98/opencode:latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: targets/srv0/k3s-apps/opencode-src
          file: targets/srv0/k3s-apps/opencode-src/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=opencode
          cache-to: type=gha,mode=max,scope=opencode

      - name: Verify image
        run: |
          set -euo pipefail
          expected_opencode="$(sed -n 's/^ARG OPENCODE_VERSION=//p' targets/srv0/k3s-apps/opencode-src/Dockerfile | head -1)"
          expected_node="$(sed -n 's/^ARG NODE_VERSION=//p' targets/srv0/k3s-apps/opencode-src/Dockerfile | head -1)"
          docker run --rm --entrypoint /usr/local/bin/docker-entrypoint.sh "$IMAGE" /bin/bash -c '
            set -eu
            opencode --version | tee /tmp/opencode-version
            node --version | tee /tmp/node-version
            brew --version | head -1
          ' > /tmp/opencode-verify.log
          cat /tmp/opencode-verify.log
          grep -q "$expected_opencode" /tmp/opencode-verify.log
          grep -q "v${expected_node}" /tmp/opencode-verify.log
          echo "opencode ${expected_opencode} / node ${expected_node} verified"

      - name: Update digest and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "no image digest" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E \
            "s#image: (imranrdev/opencode|ghcr\\.io/imranr98/opencode):latest(@sha256:[a-f0-9]+)?#image: ghcr.io/imranr98/opencode:latest@${DIGEST}#" \
            targets/srv0/k3s-apps/templates/opencode.yaml
          if git diff --quiet; then
            echo "digest unchanged; no PR needed"
            exit 0
          fi
          git checkout -B automation/opencode-digest
          git add targets/srv0/k3s-apps/templates/opencode.yaml
          git commit -m "opencode: re-pin image digest to ${DIGEST}"
          git push --force origin automation/opencode-digest
          pr="$(gh pr list --head automation/opencode-digest --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Rebuilt the opencode image at ${DIGEST}."
          else
            gh pr create \
              --base master \
              --head automation/opencode-digest \
              --title "opencode: re-pin image digest" \
              --body "Rebuilt the opencode image from \`opencode-src\` and re-pinned the digest.

          Digest: \`${DIGEST}\`

          The image verification step confirmed the Dockerfile's OPENCODE_VERSION and NODE_VERSION. Deploy with the srv0-apps release after review."
          fi
