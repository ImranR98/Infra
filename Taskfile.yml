# Taskfile.yml — Infra CLI dispatch. Target commands live in targets/<t>/Taskfile.yml,
# included below as namespaces. Universal tasks run without a target; target
# compose/validate operations are Ansible playbooks (ops/ansible/) executed
# against the committed inventory with `-l <target>`.
version: '3'

includes:
  srv0: ./targets/srv0/Taskfile.yml
  vps0: ./targets/vps0/Taskfile.yml
  bigpc: ./targets/bigpc/Taskfile.yml
  pc: ./targets/pc/Taskfile.yml
  rpi: ./targets/rpi/Taskfile.yml

tasks:
  default:
    desc: Show usage and list all available tasks
    cmds:
      - cmd: |
          echo "Infra CLI — run 'task <target>:<command>' or 'task <universal-command>'"
          echo ""
          echo "Examples:"
          echo "  task srv0:validate"
          echo "  task srv0:compose:install"
          echo "  task srv0:k3s:group:base:apply"
          echo "  task srv0:k3s:deploy -- base diff"
          echo "  task renovate"
          echo ""
          task --list-all

  prereqs:
    desc: Install system prerequisites via Ansible (packages, task, Docker, collections, lint tools)
    cmds:
      - cmd: |
          if ! command -v ansible-playbook >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ansible-core
            elif command -v dnf >/dev/null 2>&1; then sudo dnf install -y ansible-core
            else echo "Error: unsupported package manager. Install ansible-core manually." >&2; exit 1; fi
          fi
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook -i localhost, {{.ROOT_DIR}}/ops/ansible/playbooks/prereqs.yml {{.CLI_ARGS}}

  renovate:
    desc: Run Renovate against ImranR98/Infra — opens update PRs on GitHub (needs RENOVATE_GITHUB_TOKEN in secrets/VARS.env)
    cmds:
      - INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/renovate.sh {{.CLI_ARGS}}

  wireguard:
    desc: Install WireGuard and deploy a config file (pass the .conf path after --)
    cmds:
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook -i localhost, {{.ROOT_DIR}}/ops/ansible/playbooks/wireguard.yml -e "wireguard_conf_src=$(readlink -f {{.CLI_ARGS}})"

  lint:
    desc: Run ShellCheck on all shell scripts (must be installed)
    cmds:
      - cmd: |
          set -e
          mapfile -t scripts < <(find lib commands targets -name '*.sh' -not -path '*/plugins/*' | sort)
          shellcheck "${scripts[@]}"
