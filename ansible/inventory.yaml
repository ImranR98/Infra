---
# Committed inventory for local (connection=local) operations: compose
# install/restart/backup-state, validate, preboot. Node provisioning
# (k3s_server/k3s_join) builds its hosts at runtime — never add host metadata
# here beyond the per-target policy vars below.
# `-l <target>` selects the machine; playbooks run on the machine itself and
# assert the hostname matches the selected target.
all:
  hosts:
    srv0:
      # preboot variant (ansible/playbooks/preboot.yaml): initramfs frpc →
      # FRPS :8887 (mTLS certs rendered from the compose templates first).
      preboot_module: frpc
    vps0: {}
    bigpc:
      # preboot variant: crypt-ssh dropbear, direct LAN on preboot_port.
      preboot_module: crypt-ssh
    pc: {}
    rpi: {}
  vars:
    ansible_connection: local
