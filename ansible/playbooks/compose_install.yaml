---
# compose_install.yaml — render templates + start the Compose stack for the
# machine you are on (no inventory: the target is this machine's hostname,
# overridable with -e target=).
# Usage: ansible-playbook ansible/playbooks/compose_install.yaml
- name: Install compose stack
  hosts: localhost
  gather_facts: true

  vars:
    infra_root: "{{ playbook_dir }}/../.."
    target: "{{ ansible_hostname }}"

  tasks:
    - name: Compose render + environment
      ansible.builtin.include_role:
        name: compose
      vars:
        compose_infra_root: "{{ infra_root }}"

    - name: Compose up
      ansible.builtin.command:
        cmd: docker compose -p {{ target }} {{ compose_files | join(' ') }} up -d --remove-orphans
      environment: "{{ compose_env }}"
      changed_when: true
      tags: [up]
      become: true  # docker socket is sudo-only on the nodes (see AGENTS.md)
