---
# compose_restart.yaml — re-render templates and restart one Compose service
# of one target (explicit; must be this machine — the compose role asserts it).
# Usage: ansible-playbook ansible/playbooks/compose_restart.yaml -e target=<t> -e compose_service=<svc>
#        (or: infra <t> compose-restart <svc>)
- name: Restart compose service
  hosts: localhost
  gather_facts: true

  vars:
    infra_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Service name required
      ansible.builtin.assert:
        that: compose_service | default('') | length > 0
        fail_msg: "No service specified. Usage: ansible-playbook compose_restart.yaml -e compose_service=<svc>"

    - name: Target required
      ansible.builtin.assert:
        that: target | default('') | length > 0
        fail_msg: "No target set. Pass -e target=<hostname> (or use: infra <target> compose-restart <svc>)"

    - name: Compose render + environment
      ansible.builtin.include_role:
        name: compose
      vars:
        compose_infra_root: "{{ infra_root }}"

    - name: Stop service
      ansible.builtin.command:
        cmd: docker compose -p {{ target }} {{ compose_files | join(' ') }} down "{{ compose_service }}"
      environment: "{{ compose_env }}"
      failed_when: false
      changed_when: true
      become: true  # docker socket is sudo-only on the nodes (see AGENTS.md)

    - name: Start service
      ansible.builtin.command:
        cmd: docker compose -p {{ target }} {{ compose_files | join(' ') }} up -d "{{ compose_service }}"
      environment: "{{ compose_env }}"
      changed_when: true
      become: true
