---
# Bootstrap this machine as the K3s control plane (cluster-init).
# The installer/config.yaml/systemd service are handled by the k3s_install
# role; k3s_node_extra adds the node-prep extras (sysctls, CDI drop-in,
# firewall, kubectl group) and k3s_configure the post-install node labels.
# Usage: ansible-playbook ansible/playbooks/k3s_server.yaml  (run ON the node, no args)
- name: Bootstrap the K3s control-plane node
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars_files:
    - vars/k3s.yaml
  vars:
    k3s_role: server
    k3s_mode: server
    k3s_server_config: >-
      {{ k3s_server_config_base
         | combine({'cluster-init': true,
                    'node-ip': k3s_node_ip | default(ansible_default_ipv4.address),
                    'node-label': ['hostpath-main=true', 'hostpath-extra-storage=true', 'external-exposed=true']}) }}
  roles:
    - k3s_node_extra
    - k3s_install
    - k3s_configure
