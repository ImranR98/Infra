---
# Bootstrap this machine as the K3s control plane (cluster-init).
# The installer, config.yaml, and systemd service are managed by the
# k3s-io/k3s-ansible collection (k3s.orchestration); this repo adds the
# node-prep extras (sysctls, CDI drop-in, firewall, kubectl group) and the
# post-install node labels via kubectl.
# Usage: ansible-playbook ansible/playbooks/k3s_server.yaml  (run ON the node, no args)
- name: Bootstrap the K3s control-plane node
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    k3s_role: server
    k3s_version: stable
    # The collection reads group membership for HA joins; a single control
    # plane lives in 'ungrouped', so point it there.
    server_group: ungrouped
    server_config_yaml: |
      selinux: true
      write-kubeconfig-mode: "0640"
      flannel-backend: wireguard-native
      flannel-iface-regex: "^(eth|ens|enp|eno|enx|wlan|wlp|wlo|bond|ib)"
      cluster-init: true
      node-ip: {{ k3s_node_ip | default(ansible_default_ipv4.address) }}
      node-label:
        - hostpath-main=true
        - hostpath-extra-storage=true
        - external-exposed=true
  roles:
    - k3s_node_extra
    - k3s.orchestration.k3s_server
    - k3s_configure
