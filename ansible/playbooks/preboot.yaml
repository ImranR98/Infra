---
# Install the preboot initramfs LUKS-unlock module. The variant is derived
# from the machine hostname (srv0: frpc — initramfs frpc tunnels SSH via
# FRPS :8887 with mTLS certs rendered from the compose templates first;
# bigpc: crypt-ssh — dropbear SSH directly on the LAN).
# Usage: ansible-playbook ansible/playbooks/preboot.yaml   (run ON the node)
# Re-run after rotating the preboot mTLS certs (srv0).
- name: Install preboot LUKS unlock (initramfs)
  hosts: localhost
  gather_facts: true

  vars:
    infra_root: "{{ playbook_dir }}/../.."
    target: "{{ ansible_hostname }}"
    preboot_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

  tasks:
    - name: Preboot variant known
      ansible.builtin.assert:
        that: target in ['srv0', 'bigpc']
        fail_msg: >-
          No preboot variant for host '{{ target }}' — preboot targets srv0
          (frpc) or bigpc (crypt-ssh) only.

    - name: Derive the preboot module from the hostname
      ansible.builtin.set_fact:
        preboot_module: "{{ {'srv0': 'frpc', 'bigpc': 'crypt-ssh'}[target] }}"

    - name: Stat frpc compose inputs
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ infra_root }}/targets/{{ target }}/VARS.template.yaml"
        - "{{ infra_root }}/targets/{{ target }}/compose/compose.private.yaml"
      register: _compose_inputs
      when: preboot_module == 'frpc'

    - name: Set compose availability facts
      ansible.builtin.set_fact:
        compose_has_vars_template: "{{ _compose_inputs.results[0].stat.exists }}"
        compose_private_exists: "{{ _compose_inputs.results[1].stat.exists }}"
      when: preboot_module == 'frpc'

    - name: Render the frpc compose templates (mTLS certs for the initramfs)
      ansible.builtin.include_role:
        name: compose
      vars:
        compose_infra_root: "{{ infra_root }}"
      when: preboot_module == 'frpc'

    - name: Install the preboot initramfs module
      ansible.builtin.include_role:
        name: preboot
      vars:
        preboot_module: "{{ preboot_module }}"
        preboot_infra_root: "{{ infra_root }}"

    - name: Reminder
      ansible.builtin.debug:
        msg: >-
          Preboot {{ preboot_module }} installed — on the next boot, LUKS
          unlock runs before root is mounted (frpc: via FRPS :8887,
          crypt-ssh: direct LAN :{{ preboot_port | default('8887') }}).
