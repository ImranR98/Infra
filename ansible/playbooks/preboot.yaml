---
# Install the preboot initramfs LUKS-unlock module.
# Variants: frpc — initramfs frpc tunnels SSH via FRPS (the frpc compose
# templates are rendered first for the mTLS certs); crypt-ssh — dropbear SSH
# directly on the LAN, patched to preboot_port.
# Usage: ansible-playbook ansible/playbooks/preboot.yaml \
#          -e preboot_module=frpc|crypt-ssh   (run ON the node)
# Re-run the frpc variant after rotating the preboot mTLS certs.
- name: Install preboot LUKS unlock (initramfs)
  hosts: localhost
  gather_facts: true

  vars:
    infra_root: "{{ playbook_dir }}/../.."
    target: "{{ ansible_hostname }}"
    preboot_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

  tasks:
    - name: Preboot variant given
      ansible.builtin.assert:
        that: preboot_module | default('') in ['frpc', 'crypt-ssh']
        fail_msg: >-
          preboot_module required: -e preboot_module=frpc (tunnel via FRPS)
          or -e preboot_module=crypt-ssh (direct-LAN dropbear).

    - name: Stat frpc compose inputs
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ infra_root }}/targets/{{ target }}/VARS.template.yaml"
        - "{{ infra_root }}/targets/{{ target }}/compose/compose.private.yaml"
      register: _compose_inputs
      when: preboot_module == 'frpc'

    - name: Set compose availability facts
      ansible.builtin.set_fact:
        compose_has_vars_template: "{{ _compose_inputs.results[0].stat.exists }}"
        compose_private_exists: "{{ _compose_inputs.results[1].stat.exists }}"
      when: preboot_module == 'frpc'

    - name: Render the frpc compose templates (mTLS certs for the initramfs)
      ansible.builtin.include_role:
        name: compose
      vars:
        compose_infra_root: "{{ infra_root }}"
      when: preboot_module == 'frpc'

    - name: Install the preboot initramfs module
      ansible.builtin.include_role:
        name: preboot
      vars:
        preboot_module: "{{ preboot_module }}"
        preboot_infra_root: "{{ infra_root }}"

    - name: Reminder
      ansible.builtin.debug:
        msg: >-
          Preboot {{ preboot_module }} installed — on the next boot, LUKS
          unlock runs before root is mounted (frpc: via FRPS, crypt-ssh:
          direct LAN :{{ preboot_port | default('8887') }}).
