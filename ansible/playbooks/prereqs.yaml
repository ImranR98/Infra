---
# Install system prerequisites: packages, Docker (official bootstrap), and the
# Ansible collections/roles.
# Usage: ansible-playbook ansible/playbooks/prereqs.yaml  (run on the machine
# to prepare — ansible-playbook must already exist; `infra prereqs` bootstraps
# ansible-core via the package manager first when it is missing).
- name: Install system prerequisites
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  roles:
    - prereqs
