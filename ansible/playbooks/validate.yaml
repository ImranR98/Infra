---
# validate.yaml — config validation for one target (yq, compose config, helm).
# Target = this machine's hostname (overridable with -e target=, e.g. to check
# another target's files from this checkout).
# Usage: ansible-playbook ansible/playbooks/validate.yaml
- name: Validate configs
  hosts: localhost
  gather_facts: true

  vars:
    infra_root: "{{ playbook_dir }}/../.."
    target: "{{ ansible_hostname }}"
    target_dir: "{{ infra_root }}/targets/{{ target }}"

  pre_tasks:
    - name: Stat optional inputs
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ target_dir }}/VARS.template.yaml"
        - "{{ target_dir }}/compose/compose.yaml"
        - "{{ target_dir }}/k3s"
        - "{{ infra_root }}/secrets/VARS.{{ target }}.yaml"
      register: _stats

    - name: Set availability facts
      ansible.builtin.set_fact:
        _vars_tpl: "{{ _stats.results[0].stat.exists }}"
        _compose_yaml: "{{ _stats.results[1].stat.exists }}"
        _k3s_chart: "{{ _stats.results[2].stat.exists }}"
        _vars_file: "{{ _stats.results[3].stat.exists }}"

  tasks:
    - name: Include VARS template (key list)
      ansible.builtin.include_vars:
        file: "{{ target_dir }}/VARS.template.yaml"
        name: template_vars
      when: _vars_tpl and _vars_file

    - name: Include VARS (dict)
      ansible.builtin.include_vars:
        file: "{{ infra_root }}/secrets/VARS.{{ target }}.yaml"
        name: secret_vars
      when: _vars_file

    - name: VARS completeness
      ansible.builtin.assert:
        that: template_vars.keys() | difference(secret_vars.keys()) | length == 0
        fail_msg: >-
          secrets/VARS.{{ target }}.yaml is missing required
          variables: {{ template_vars.keys() | difference(secret_vars.keys()) }}
      when: _vars_tpl and _vars_file

    - name: VARS placeholders
      ansible.builtin.assert:
        that: "not (_v is string and (_v | trim in _placeholders or _v is regex('^<.*>$')))"
        fail_msg: "secrets/VARS.{{ target }}.yaml: '{{ item }}' has a placeholder value"
      loop: "{{ secret_vars.keys() | list }}"
      when: _vars_tpl and _vars_file
      vars:
        _v: "{{ secret_vars[item] }}"
        _placeholders: ["change_me", "changeme", "abc", "REPLACE_ME"]

    - name: Compose check env
      ansible.builtin.set_fact:
        _compose_check_env: >-
          {{ dict(secret_vars | default({}) | dict2items | map(attribute='key') | zip(secret_vars | default({}) | dict2items | map(attribute='value') | map('string')))
             | combine({'MY_UID': (1000 if ansible_user_id == 'root' else (ansible_user_uid | default(1000))) | string,
                        'COMPOSE_STATE_DIR': infra_root ~ '/current_target/compose_live_state',
                        'TARGET': target}) }}

    - name: Compose YAML syntax
      ansible.builtin.shell: |
        errs=0
        for f in "{{ target_dir }}/compose/compose.yaml" "{{ target_dir }}/compose/compose.private.yaml"; do
          [ -f "$f" ] || continue
          if yq eval '.' "$f" >/dev/null 2>&1; then
            echo "OK: $(basename "$f")"
          elif grep -qP '^\s+\$[A-Z_][A-Z_0-9]*\s*$' "$f"; then
            echo "WARN: $(basename "$f") YAML syntax skipped (structural \$VARIABLE placeholder)"
          else
            echo "ERROR: $(basename "$f") has invalid YAML syntax"; errs=1
          fi
        done
        exit $errs
      changed_when: false
      when: _compose_yaml

    - name: Compose config validation
      ansible.builtin.shell: |
        files="-f {{ target_dir }}/compose/compose.yaml"
        [ -f "{{ target_dir }}/compose/compose.private.yaml" ] && files="$files -f {{ target_dir }}/compose/compose.private.yaml"
        docker compose $files config --dry-run >/dev/null && echo "OK: docker compose config"
      environment: "{{ _compose_check_env }}"
      changed_when: false
      failed_when: false
      when: _compose_yaml

    - name: Helm lint (per-target k3s chart)
      ansible.builtin.shell: |
        errs=0
        helm lint "{{ target_dir }}/k3s" -f "{{ target_dir }}/k3s/values.yaml" \
          {% if _vars_file %}-f "{{ infra_root }}/secrets/VARS.{{ target }}.yaml"{% endif %} >/dev/null 2>&1 \
          || { echo "ERROR: helm lint failed"; errs=1; }
        exit $errs
      changed_when: false
      when: _k3s_chart

    - name: Helm template (per-target k3s chart, both scopes)
      ansible.builtin.shell: |
        errs=0
        for scope in base apps; do
          if [ "$scope" = base ]; then other=apps; else other=base; fi
          out=$(helm template "{{ target }}-$scope" "{{ target_dir }}/k3s" -n "$scope" \
            -f "{{ target_dir }}/k3s/values.yaml" \
            {% if _vars_file %}-f "{{ infra_root }}/secrets/VARS.{{ target }}.yaml"{% endif %} \
            --set "$other.enabled=false" 2>&1) || { echo "ERROR: helm template ($scope) failed"; errs=1; continue; }
          if echo "$out" | grep -q '<no value>'; then
            echo "ERROR: helm template ($scope) rendered missing values (<no value>)"; errs=1
          fi
        done
        exit $errs
      changed_when: false
      when: _k3s_chart
