---
# Compose role: render templates (jinja2), stage the environment for
# docker-compose native interpolation, create host dirs, and run `docker compose`.

- name: Target derived from the machine hostname
  ansible.builtin.assert:
    that: ansible_hostname == target
    fail_msg: "Refusing: running on host '{{ ansible_hostname }}' but target is '{{ target }}'"

- name: compose_infra_root required
  ansible.builtin.assert:
    that: compose_infra_root | default('') | length > 0
    fail_msg: "compose_infra_root not set — include this role from a playbook that passes it"

- name: Set local facts
  ansible.builtin.set_fact:
    infra_root: "{{ compose_infra_root }}"
    compose_state_dir: "{{ compose_infra_root }}/current_target/compose_live_state"
    target_dir: "{{ compose_infra_root }}/targets/{{ target }}"

- name: Resolve docker group id
  ansible.builtin.shell: "getent group docker | cut -d: -f3"
  register: _docker_gid
  changed_when: false
  check_mode: false

- name: Docker group must exist
  ansible.builtin.assert:
    that: _docker_gid.stdout != ''
    fail_msg: "docker group not found. Is Docker installed?"

- name: Built-in vars (compose interpolation + templates)
  ansible.builtin.set_fact:
    MY_UID: "{{ 1000 if ansible_user_id == 'root' else (ansible_user_uid | default(1000)) }}"
    DOCKER_GID: "{{ _docker_gid.stdout }}"
    COMPOSE_STATE_DIR: "{{ compose_state_dir }}"
    TARGET: "{{ target }}"
    USER: "{{ ansible_user_id }}"

- name: Include VARS template (key list)
  ansible.builtin.include_vars:
    file: "{{ target_dir }}/VARS.template.yaml"
    name: template_vars
  when: compose_has_vars_template | default(false)

- name: Include VARS (flat, for jinja templates)
  ansible.builtin.include_vars:
    file: "{{ infra_root }}/secrets/VARS.{{ target }}.yaml"
  when: compose_has_vars_template | default(false)

- name: Include VARS (dict, for compose interpolation)
  ansible.builtin.include_vars:
    file: "{{ infra_root }}/secrets/VARS.{{ target }}.yaml"
    name: secret_vars
  when: compose_has_vars_template | default(false)

# Completeness + placeholder checks. Fail messages print key names only —
# values never reach argv, stdout, or stderr.
- name: VARS completeness
  ansible.builtin.assert:
    that: template_vars.keys() | difference(secret_vars.keys()) | length == 0
    fail_msg: >-
      secrets/VARS.{{ target }}.yaml is missing required
      variables: {{ template_vars.keys() | difference(secret_vars.keys()) }}
  when: compose_has_vars_template | default(false)

- name: VARS placeholders
  ansible.builtin.assert:
    that: "not (_v is string and (_v | trim in _placeholders or _v is regex('^<.*>$')))"
    fail_msg: "secrets/VARS.{{ target }}.yaml: '{{ item }}' has a placeholder value"
  loop: "{{ secret_vars.keys() | list }}"
  when: compose_has_vars_template | default(false)
  vars:
    _v: "{{ secret_vars[item] }}"
    _placeholders: ["change_me", "changeme", "abc", "REPLACE_ME"]

- name: Resolve PROXY_IP
  ansible.builtin.shell: getent hosts "{{ PROXY_HOST }}" | awk '{print $1; exit}'
  register: _proxy_ip
  changed_when: false
  failed_when: false
  check_mode: false
  when: PROXY_HOST is defined

- name: PROXY_IP fact
  ansible.builtin.set_fact:
    PROXY_IP: "{{ _proxy_ip.stdout | default('') }}"

- name: Compose environment dict (native interpolation)
  ansible.builtin.set_fact:
    compose_env: >-
      {{ dict(secret_vars | default({}) | dict2items | map(attribute='key') | zip(secret_vars | default({}) | dict2items | map(attribute='value') | map('string')))
         | combine({'MY_UID': MY_UID, 'DOCKER_GID': DOCKER_GID, 'COMPOSE_STATE_DIR': COMPOSE_STATE_DIR,
                    'TARGET': TARGET, 'USER': USER, 'PROXY_IP': PROXY_IP | default('')}) }}

- name: Render .secret/.plain compose templates
  block:
    - name: Parent dirs for rendered files
      ansible.builtin.file:
        path: "{{ compose_state_dir }}/{{ (item.path | regex_replace('^' ~ target_dir ~ '/compose/templates/', '')) | regex_replace('\\.(secret|plain)$', '') | dirname }}"
        state: directory
        mode: "0750"
        owner: "{{ MY_UID }}"
        group: "{{ MY_UID }}"
      with_filetree: "{{ target_dir }}/compose/templates"
      when: item.state == 'file'
    - name: Jinja2 templates
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ compose_state_dir }}/{{ (item.path | regex_replace('^' ~ target_dir ~ '/compose/templates/', '')) | regex_replace('\\.secret$', '') }}"
        mode: "{{ '0600' if item.path.endswith('.secret') else '0644' }}"
        owner: "{{ MY_UID }}"
        group: "{{ MY_UID }}"
      with_filetree: "{{ target_dir }}/compose/templates"
      when:
        - item.state == 'file'
        - not item.path.endswith('.plain')
      no_log: "{{ item.path.endswith('.secret') }}"
    - name: Verbatim copies (.plain)
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ compose_state_dir }}/{{ (item.path | regex_replace('^' ~ target_dir ~ '/compose/templates/', '')) | regex_replace('\\.plain$', '') }}"
        mode: "0644"
        owner: "{{ MY_UID }}"
        group: "{{ MY_UID }}"
      with_filetree: "{{ target_dir }}/compose/templates"
      when:
        - item.state == 'file'
        - item.path.endswith('.plain')

- name: Check for traefik templates
  ansible.builtin.stat:
    path: "{{ target_dir }}/compose/templates/traefik"
  register: _traefik_templates

- name: Seed traefik acme.json (first run only)
  ansible.builtin.copy:
    content: "{}"
    dest: "{{ compose_state_dir }}/traefik/acme.json"
    mode: "0600"
    owner: "{{ MY_UID }}"
    group: "{{ MY_UID }}"
    force: false
  when: _traefik_templates.stat.exists

- name: Compose file list
  ansible.builtin.set_fact:
    compose_files: >-
      {{ ['-f', target_dir ~ '/compose/compose.yaml'] + (['-f', target_dir ~ '/compose/compose.private.yaml']
         if compose_private_exists | default(false) else []) }}

# Host bind dirs come from `docker compose config` itself (the resolved,
# interpolated output) rather than a hand-written list — the compose file is
# the single source of truth. Docker would create missing dirs as root; doing
# it here keeps them owned by $MY_UID so containers can write.
- name: Resolve host bind dirs from compose config
  ansible.builtin.shell: |
    docker compose {{ compose_files | join(' ') }} config --format yaml 2>/dev/null |
      yq -r '.services[] | select(.volumes) | .volumes[] | (.source? // .) | split(":") | .[0]' |
      grep -F "{{ compose_state_dir }}/" || true
  register: _host_binds
  changed_when: false
  environment: "{{ compose_env }}"

- name: Create host bind dirs
  ansible.builtin.file:
    # A dot in the final component means it's a file bind — create its parent.
    path: "{{ item | regex_replace('/[^/]*\\.[^/]*$', '') }}"
    state: directory
    mode: "0755"
    owner: "{{ MY_UID }}"
    group: "{{ MY_UID }}"
  become: true
  loop: "{{ _host_binds.stdout_lines | default([]) | unique }}"
  when: _host_binds.stdout_lines | default([]) | length > 0
