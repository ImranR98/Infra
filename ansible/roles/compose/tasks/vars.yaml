---
# Shared VARS loading + validation (compose role and validate.yaml).
# Completeness and placeholder asserts print key names only — values never
# reach argv, stdout, or stderr.
# Callers supply target, target_dir, secrets_vars_file.

- name: Include VARS template (key list)
  ansible.builtin.include_vars:
    file: "{{ target_dir }}/VARS.template.yaml"
    name: template_vars

- name: Include VARS (flat, for jinja templates)
  ansible.builtin.include_vars:
    file: "{{ secrets_vars_file }}"

- name: Include VARS (dict, for compose interpolation)
  ansible.builtin.include_vars:
    file: "{{ secrets_vars_file }}"
    name: secret_vars

- name: VARS completeness
  ansible.builtin.assert:
    that: template_vars.keys() | difference(secret_vars.keys()) | length == 0
    fail_msg: >-
      secrets/VARS.{{ target }}.yaml is missing required
      variables: {{ template_vars.keys() | difference(secret_vars.keys()) }}

- name: VARS placeholders
  ansible.builtin.assert:
    that: "not (_v is string and (_v | trim in _placeholders or _v is regex('^<.*>$')))"
    fail_msg: "secrets/VARS.{{ target }}.yaml: '{{ item }}' has a placeholder value"
  loop: "{{ secret_vars.keys() | list }}"
  vars:
    _v: "{{ secret_vars[item] }}"
    _placeholders: ["change_me", "changeme", "abc", "REPLACE_ME"]
