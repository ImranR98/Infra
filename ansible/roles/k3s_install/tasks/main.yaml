---
# Installs K3s via the official get.k3s.io installer. The installer only
# re-runs when the installed version is older than k3s_version ("stable" →
# effectively first install only), so provision runs never fight
# system-upgrade-controller's ownership of upgrades.

- name: Check the installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_install_version_output
  changed_when: false
  failed_when: false
  check_mode: false  # read-only; keeps the decide-fact valid under --check

- name: Record the installed K3s version
  when:
    - not ansible_check_mode
    - k3s_install_version_output.rc == 0
  ansible.builtin.set_fact:
    k3s_install_installed_version: "{{ k3s_install_version_output.stdout_lines[0].split(' ')[2] }}"

- name: Decide whether the installer must run
  ansible.builtin.set_fact:
    k3s_install_required: >-
      {{ k3s_install_version_output.rc != 0
         or (k3s_install_installed_version | default('')) is version(k3s_version, '<') }}

- name: Download the K3s installer
  when:
    - not ansible_check_mode
    - k3s_install_required | bool
  ansible.builtin.get_url:
    url: https://get.k3s.io/
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
    timeout: 120

- name: Run the K3s installer
  when:
    - not ansible_check_mode
    - k3s_install_required | bool
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_SKIP_START: "true"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "{{ k3s_install_exec if k3s_mode == 'agent' else '' }}"
  changed_when: true

- name: Write the server config
  when: k3s_mode != 'agent'
  ansible.builtin.copy:
    content: "{{ k3s_server_config | to_nice_yaml }}"
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"

- name: Write the agent token
  when: k3s_mode == 'agent'
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s-agent.service.env
    regexp: '^K3S_TOKEN='
    line: "K3S_TOKEN={{ k3s_token }}"
    mode: "0600"
    create: true
  no_log: true

- name: Reload systemd
  when: ansible_facts['service_mgr'] == 'systemd'
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and restart K3s
  ansible.builtin.systemd:
    name: "{{ 'k3s' if k3s_mode != 'agent' else 'k3s-agent' }}"
    enabled: true
    state: restarted

- name: Wait for the server token (first server)
  when: k3s_mode == 'server'
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/token

- name: Wait for the Kubernetes API
  when: k3s_mode == 'server'
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 120
