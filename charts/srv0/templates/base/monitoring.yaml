{{- if .Values.base.enabled }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: monitoring
  namespace: base
spec:
  chart: kube-prometheus-stack
  repo: https://prometheus-community.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 89.2.3
  valuesContent: |-
    # No receivers configured yet; enable later with an ntfy webhook.
    alertmanager:
      enabled: false

    prometheus:
      prometheusSpec:
        replicas: 1
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi
        remoteWrite:
          - url: http://mimir.base.svc.cluster.local:8080/api/v1/push

    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin-secret
        passwordKey: admin-password
      envFromSecret: grafana-oidc-secret
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: longhorn
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 2Gi
      grafana.ini:
        server:
          root_url: https://grafana.$SERVICES_DOMAIN
        auth:
          # OIDC-only UI: no local username/password form. Recovery if
          # Authelia ever breaks: kubectl -n base exec deploy/... grafana-cli
          # admin reset-admin-password.
          disable_login_form: true
        auth.generic_oauth:
          enabled: true
          name: Authelia
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://auth.$SERVICES_DOMAIN/api/oidc/authorization
          token_url: https://auth.$SERVICES_DOMAIN/api/oidc/token
          api_url: https://auth.$SERVICES_DOMAIN/api/oidc/userinfo
          use_pkce: true
          allow_sign_up: true
          role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
      additionalDataSources:
        - name: Mimir
          type: prometheus
          url: http://mimir.base.svc.cluster.local:8080/prometheus
          access: proxy
          isDefault: false
        - name: Loki
          type: loki
          url: http://loki.base.svc.cluster.local:3100
          access: proxy
          isDefault: false

    kube-state-metrics: {}

    prometheus-node-exporter: {}

    # K3s runs etcd/controller-manager/scheduler/kube-proxy embedded without
    # scrapeable endpoints - their ServiceMonitors would just fail forever.
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
---
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-prod-tls
  namespace: base
spec:
  secretName: grafana-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - grafana.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress
  namespace: base
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`grafana.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
        - name: crowdsec-bouncer
        - name: forwardauth-authelia
      services:
        - name: monitoring-grafana
          port: 80
  tls:
    secretName: grafana-prod-tls
---
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
  namespace: base
spec:
  chart: loki
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 7.3.0
  # S3 keys live in base/loki-values via loki-values-secret.yaml (merged as a
  # later values file) so this CR stays free of plaintext secrets.
  valuesSecrets:
    - name: loki-values
      keys:
        - values.yaml
  valuesContent: |-
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 2Gi
    # Chart validation: scalable targets must stay at 0 replicas while
    # singleBinary.replicas > 0 (the defaults are non-zero).
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # No canary/gateway: promtail and Grafana talk to the loki Service directly.
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    loki:
      auth_enabled: false
      ingester:
        lifecycler:
          ring:
            # SingleBinary single replica: one ingester is the whole write path.
            replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin
        s3:
          endpoint: rustfs-svc.base.svc.cluster.local:9000
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: s3
      limits_config:
        # 90 days of logs; compactor enforces this against the object store.
        retention_period: 2160h
        # NOTE: keep reject_old_samples at its default (true). Disabling it
        # once shipped months of historical docker logs through Loki ->
        # RustFS -> Longhorn and saturated the node's storage path.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # Prebuilt Loki dashboards (chart-bundled mixin) auto-imported by the
    # Grafana sidecar via the grafana_dashboard: "1" label, plus the
    # ServiceMonitor and recording rules that feed them.
    monitoring:
      dashboards:
        enabled: true
      serviceMonitor:
        enabled: true
        # The kube-prometheus-stack Prometheus CR selects ServiceMonitors
        # by release: monitoring.
        labels:
          release: monitoring
      rules:
        enabled: true
        labels:
          release: monitoring
        # Alert rules included in the rules bundle will evaluate but have no
        # alertmanager to fire into (disabled in the monitoring stack);
        # recording rules are what the dashboards need.
        alerting: true
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: base
  labels:
    app: mimir
spec:
  replicas: 1
  # Single replica + RWO PVC: Recreate avoids two pods fighting for the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mimir
          image: grafana/mimir:3.2.0
          args:
            # Flags instead of a config file: any config change is a
            # Deployment change, so the pod rolls automatically on apply.
            - -server.http-listen-port=8080
            - -auth.multitenancy-enabled=false
            # Object storage (RustFS): blocks/ruler/alertmanager inherit the
            # endpoint and credentials from common.storage; only the bucket
            # names are per-component.
            - -common.storage.backend=s3
            - -common.storage.s3.endpoint=rustfs-svc.base.svc.cluster.local:9000
            - -common.storage.s3.insecure=true
            - -common.storage.s3.access-key-id=$RUSTFS_ACCESS_KEY
            - -common.storage.s3.secret-access-key=$RUSTFS_SECRET_KEY
            - -blocks-storage.s3.bucket-name=mimir-blocks
            - -blocks-storage.tsdb.dir=/data/tsdb
            - -blocks-storage.bucket-store.sync-dir=/data/tsdb-sync
            - -compactor.data-dir=/data/compactor
            # Single ingester: the whole write path is one replica.
            - -ingester.ring.replication-factor=1
            - -ruler-storage.s3.bucket-name=mimir-ruler
            - -alertmanager-storage.s3.bucket-name=mimir-alertmanager
            # 1 year of blocks.
            - -compactor.blocks-retention-period=8760h
            # Single trusted tenant (Prometheus): generous limits so backlog
            # flushes after downtime are never rejected, and the >150k series
            # the cluster scrapes fit under the per-user cap.
            - -distributor.ingestion-rate-limit=1000000
            - -distributor.ingestion-burst-size=1000000
            - -ingester.max-global-series-per-user=1000000
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: base
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: http
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mimir-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app: mimir
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-metrics-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 3000
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-metrics-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app: kube-prometheus-stack-operator
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 10250
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 9090
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ksm-metrics-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 3100
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oidc-secret
  namespace: base
type: Opaque
stringData:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "$AUTHELIA_GRAFANA_CLIENT_SECRET_HASHABLE"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: base
type: Opaque
stringData:
  admin-user: admin
  admin-password: "$GRAFANA_ADMIN_PASSWORD"
---
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: promtail
  namespace: base
spec:
  chart: promtail
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 6.17.1
  valuesContent: |-
    config:
      clients:
        - url: http://loki.base.svc.cluster.local:3100/loki/api/v1/push
      snippets:
        extraRelabelConfigs:
          # __tmp_controller_name is computed by the chart's default relabels
          # (controller name with the ReplicaSet hash stripped) - expose it as
          # a `deployment` label so logs can be filtered by workload.
          - source_labels:
              - __tmp_controller_name
            target_label: deployment
    # Kubernetes pod logs only (no docker-side scraping; the Compose sidecar
    # is out of scope for the logging stack).
    # SELinux host: spc_t (not privileged) is enough to read /var/log/pods
    # (hostPath, container_log_t) and write positions to /run/promtail.
    podSecurityContext:
      seLinuxOptions:
        type: spc_t
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
    defaultVolumes:
      - name: run
        hostPath:
          path: /run/promtail
      - name: pods
        hostPath:
          path: /var/log/pods
    defaultVolumeMounts:
      - name: run
        mountPath: /run/promtail
      - name: pods
        mountPath: /var/log/pods
        readOnly: true
---
apiVersion: v1
kind: Secret
metadata:
  name: loki-values
  namespace: base
type: Opaque
stringData:
  values.yaml: |-
    loki:
      storage:
        s3:
          # RustFS S3 keys. Kept in this Secret via spec.valuesSecrets (merged
          # as a later values file) rather than the HelmChart CR — the loki
          # chart's unified config handling makes existingSecretForConfig too
          # risky, but a plain values merge sidesteps the chart entirely.
          accessKeyId: "$RUSTFS_ACCESS_KEY"
          secretAccessKey: "$RUSTFS_SECRET_KEY"
{{- end }}
