{{- if .Values.base.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: base
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      initContainers:
        - name: nfs-modules
          image: busybox:1.38.0-uclibc
          command:
            - modprobe
            - nfs
            - nfsd
          securityContext:
            privileged: true
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          volumeMounts:
            - mountPath: /lib/modules
              name: modules
              readOnly: true
      containers:
        - name: nfs-server
          image: ghcr.io/trexx/docker-nfs-server:v3.22.2-2
          ports:
            - name: nfsv4
              containerPort: 2049
              protocol: TCP
          securityContext:
            privileged: true
          readinessProbe:
            tcpSocket:
              port: 2049
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 2049
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          volumeMounts:
            - mountPath: /exports
              name: exports-root
            - mountPath: /exports/music
              name: music-storage
            - mountPath: /exports/jellyfin-tv
              name: tv-storage
            - mountPath: /exports/jellyfin-youtube
              name: youtube-storage
            - mountPath: /exports/arrstack-media
              name: arrstack-media-storage
            - mountPath: /exports/frigate
              name: frigate-storage
            - mountPath: /exports/backups
              name: backups-storage

            - mountPath: /var/lib/nfs/etab
              name: nfs-exports
              subPath: etab
              readOnly: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hostpath-main
                    operator: In
                    values:
                      - "true"
      volumes:
        - name: modules
          hostPath:
            path: /lib/modules
        - name: exports-root
          emptyDir: {}
        - name: nfs-exports
          configMap:
            name: nfs-etab
        - name: music-storage
          hostPath:
            path: $MEDIA_DIR_PATH/Music
            type: DirectoryOrCreate
        - name: tv-storage
          hostPath:
            path: $MEDIA_DIR_PATH/TV
            type: DirectoryOrCreate
        - name: youtube-storage
          hostPath:
            path: $MEDIA_DIR_PATH/YouTube
            type: DirectoryOrCreate
        - name: arrstack-media-storage
          hostPath:
            path: $SECONDARY_STORAGE_PATH/arrstack_media
            type: DirectoryOrCreate
        - name: frigate-storage
          hostPath:
            path: $SECONDARY_STORAGE_PATH/frigate
            type: DirectoryOrCreate
        - name: backups-storage
          hostPath:
            path: $PVC_BACKUP_DIR
            type: DirectoryOrCreate
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-etab
  namespace: base
data:
  etab: |
    /exports *(rw,fsid=0,crossmnt,no_subtree_check,insecure,root_squash)
    /exports/music *(ro,fsid=1,no_subtree_check,insecure,root_squash)
    /exports/jellyfin-tv *(ro,fsid=2,no_subtree_check,insecure,root_squash)
    /exports/jellyfin-youtube *(ro,fsid=3,no_subtree_check,insecure,root_squash)
    /exports/arrstack-media *(rw,fsid=4,no_subtree_check,insecure,no_root_squash)
    /exports/frigate *(rw,fsid=6,no_subtree_check,insecure,no_root_squash)
    /exports/backups *(rw,fsid=5,no_subtree_check,insecure,no_root_squash)
---
---
# NFS clients are exclusively the csi-nfs-node plugin (hostNetwork: true —
# mounts originate from node IPs) and its kernel mounts. All shares use
# nfsvers=4.2 (see storageclass.yaml + PV mountOptions), so only TCP 2049
# is ever needed (no rpcbind/mountd). Pods cannot mount NFS directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nfs-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app: nfs-server
  ingress:
    - from:
        # hostNetwork CSI node plugin — traffic arrives from node IPs
        - ipBlock:
            cidr: 192.168.8.0/24
      ports:
        - protocol: TCP
          port: 2049
  policyTypes:
    - Ingress
---
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: base
spec:
  type: ClusterIP
  ports:
    - port: 2049
      targetPort: 2049
  selector:
    app: nfs-server
{{- end }}
