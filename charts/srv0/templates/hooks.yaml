{{- if .Values.apps.enabled }}
# Seeding hooks, previously host-side post.sh scripts run by deploy.sh.
# Helm re-runs these Jobs on every install/upgrade (post-install,post-upgrade).
# They run in-cluster via kubectl with scoped RBAC (see role below).

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-hooks
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-hooks
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-hooks
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-hooks
subjects:
  - kind: ServiceAccount
    name: helm-hooks
    namespace: apps
---
# Immich OAuth/password seeding (formerly immich/post.sh). Idempotent: skips
# when OAuth is already configured. Runs in-cluster with scoped RBAC.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-seed
  namespace: apps
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: immich-seed
    spec:
      serviceAccountName: helm-hooks
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: bitnami/kubectl:latest
          env:
            - name: DOMAIN_OWNER_EMAIL
              value: "$DOMAIN_OWNER_EMAIL"
            - name: SERVICES_DOMAIN
              value: "$SERVICES_DOMAIN"
            - name: AUTHELIA_IMMICH_CLIENT_SECRET
              value: "$AUTHELIA_IMMICH_CLIENT_SECRET_HASHABLE"
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== Checking Immich configuration ==="
              kubectl -n apps wait --for=condition=Ready pod -l app.kubernetes.io/name=server,app.kubernetes.io/instance=immich --timeout=600s
              PWD=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
              kubectl exec -n apps deploy/immich-server -- immich-admin enable-password-login 2>/dev/null || true
              _try_login() {
                TOKEN=$(printf '{"email":"%s","password":"%s"}' "$DOMAIN_OWNER_EMAIL" "$1" | \
                  kubectl exec -i -n apps deploy/immich-server -- \
                  curl -sk -X POST http://localhost:2283/api/auth/login \
                    -H "Content-Type: application/json" \
                    -d @- 2>/dev/null | jq -r '.accessToken // empty' 2>/dev/null || echo "")
                [ -n "$TOKEN" ]
              }
              { printf '%s\n%s\n' "$PWD" "$PWD"; sleep 3; printf 'Y\n'; } | kubectl exec -i -n apps deploy/immich-server -- \
                timeout 30 immich-admin reset-admin-password 2>/dev/null || true
              sleep 2
              if ! _try_login "$PWD"; then
                printf '{"email":"%s","name":"Admin","password":"%s"}' "$DOMAIN_OWNER_EMAIL" "$PWD" | \
                  kubectl exec -i -n apps deploy/immich-server -- \
                  curl -sk -X POST "http://localhost:2283/api/auth/admin-sign-up" \
                    -H "Content-Type: application/json" \
                    -d @- 2>/dev/null
                sleep 2
                if ! _try_login "$PWD"; then
                  echo "Error: could not create or authenticate as admin" >&2
                  exit 1
                fi
              fi
              CLIENT_ID=$(printf '%s\n' "$TOKEN" | kubectl exec -i -n apps deploy/immich-server -- \
                sh -c 'IFS= read -r tok; curl -sk "http://localhost:2283/api/system-config" \
                    -H "Authorization: Bearer $tok" 2>/dev/null' | jq -r '.oauth.clientId // empty' 2>/dev/null || echo "")
              if [ -n "$CLIENT_ID" ] && [ "$CLIENT_ID" != "null" ]; then
                echo "OAuth already configured (clientId=$CLIENT_ID). Skipping."
                exit 0
              fi
              echo "OAuth not yet configured. Seeding configuration..."
              CONFIG_JSON=$(printf '%s\n' "$TOKEN" | kubectl exec -i -n apps deploy/immich-server -- \
                sh -c 'IFS= read -r tok; curl -sk "http://localhost:2283/api/system-config" \
                    -H "Authorization: Bearer $tok" 2>/dev/null')
              UPDATED_JSON=$(jq -c \
                --arg sec "$AUTHELIA_IMMICH_CLIENT_SECRET" \
                --arg iss "https://auth.$SERVICES_DOMAIN" \
                '.oauth.enabled=true
                 | .oauth.issuerUrl=$iss
                 | .oauth.clientId="immich"
                 | .oauth.clientSecret=$sec
                 | .oauth.buttonText="Login with Authelia"
                 | .oauth.autoRegister=true
                 | .oauth.autoLaunch=true
                 | .oauth.scope="openid profile email"
                 | .ffmpeg.accel="vaapi"
                 | .passwordLogin.enabled=false
                 | .library.watch.enabled=true' <<< "$CONFIG_JSON")
              { printf '%s\n' "$TOKEN"; printf '%s\n' "$UPDATED_JSON"; } | kubectl exec -i -n apps deploy/immich-server -- \
                sh -c 'IFS= read -r tok; curl -sk -X PUT "http://localhost:2283/api/system-config" \
                    -H "Authorization: Bearer $tok" \
                    -H "Content-Type: application/json" \
                    -d @- 2>/dev/null'
              echo "Immich configuration seeded."

---
# qBittorrent password/preferences seeding (formerly qbittorrent/post.sh).
# The linuxserver image ignores QBT_WEBUI_PASSWORD — API is the only way.
# Idempotent: skips when no temporary password is found (config exists).
apiVersion: batch/v1
kind: Job
metadata:
  name: qbittorrent-seed
  namespace: apps
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: qbittorrent-seed
    spec:
      serviceAccountName: helm-hooks
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: bitnami/kubectl:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== qBittorrent Setup ==="
              kubectl -n apps wait --for=condition=ready pod -l app=qbittorrent --timeout=600s
              TMP_PASS=""
              for i in $(seq 1 10); do
                TMP_PASS=$(kubectl -n apps logs deploy/qbittorrent 2>&1 | grep -oP 'A temporary password is provided for this session: \K\S+' || true)
                [ -n "$TMP_PASS" ] && break
                sleep 2
              done
              if [ -n "$TMP_PASS" ]; then
                PASSWORD="adminadmin"
                echo "Setting permanent password and preferences via API..."
                { printf '%s\n' "$TMP_PASS"; printf '%s\n' "$PASSWORD"; } | kubectl -n apps exec -i deploy/qbittorrent -- sh -c '
                  set -e
                  IFS= read -r tmp_pass
                  IFS= read -r password
                  curl -s -c /tmp/qbt-cookies -X POST -d "username=admin&password=$tmp_pass" http://localhost:8080/api/v2/auth/login > /dev/null
                  curl -s -b /tmp/qbt-cookies -X POST \
                    -d "json={\"listen_port\":56881,\"upnp\":false,\"save_path\":\"/data/downloads\",\"temp_path\":\"/data/downloads/incomplete/\",\"temp_path_enabled\":true,\"web_ui_password\":\"$password\"}" \
                    http://localhost:8080/api/v2/app/setPreferences > /dev/null
                  rm -f /tmp/qbt-cookies
                '
                echo "Password set."
              else
                echo "No temporary password found (config already exists, skipping API setup)."
              fi
{{- end }}

{{- if .Values.base.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-hooks
  namespace: base
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-hooks
  namespace: base
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-hooks
subjects:
  - kind: ServiceAccount
    name: helm-hooks
    namespace: base
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-hooks
  namespace: base
---
# Seed the initial GeoLite2 DB so the geoip service pod becomes ready
# immediately (formerly geoip/post.sh's init-job step).
apiVersion: batch/v1
kind: Job
metadata:
  name: geoipupdate-init
  namespace: base
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: geoipupdate-init
    spec:
      serviceAccountName: helm-hooks
      restartPolicy: OnFailure
      containers:
        - name: init
          image: bitnami/kubectl:latest
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              kubectl -n base delete job geoipupdate-init-once --ignore-not-found
              kubectl -n base create job geoipupdate-init-once --from=cronjob/geoipupdate
              kubectl -n base wait --for=condition=complete job/geoipupdate-init-once --timeout=600s
              kubectl -n base delete job geoipupdate-init-once --ignore-not-found
{{- end }}
