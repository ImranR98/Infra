x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

x-socket-proxy: &socket-proxy
    image: wollomatic/socket-proxy:1
    restart: unless-stopped
    read_only: true
    mem_limit: 64M
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges
    user: "65534:$DOCKER_GID"
    healthcheck:
        test: ["CMD", "./healthcheck"]
        interval: 10s
        timeout: 5s
        retries: 2
    logging: *logging

services:
    # https://github.com/wollomatic/socket-proxy for Traefik and other read-only needs
    dockerproxy:
        <<: *socket-proxy
        container_name: dockerproxy
        command:
            - "-loglevel=debug"
            - '-allowGET=(/v1\..{1,2})?/(version|containers/.*|events.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy:/socket/
        labels:
            - "com.centurylinklabs.watchtower.enable=false"

    # https://github.com/wollomatic/socket-proxy for Watchtower and other read-write needs
    dockerproxy_priv:
        <<: *socket-proxy
        container_name: dockerproxy_priv
        command:
            - "-loglevel=debug"
            - '-allowGET=/v1\..{2}/(containers/.*|images/.*)'
            - '-allowPOST=/v1\..{2}/(containers/.*|images/.*|networks/.*)'
            - '-allowDELETE=/v1\..{2}/(containers/.*|images/.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy_priv:/socket/
        labels:
            - "com.centurylinklabs.watchtower.enable=false"

    # Watchtower - Container Updater
    watchtower:
        container_name: watchtower
        restart: unless-stopped
        mem_limit: 128M
        image: nickfedor/watchtower
        volumes:
            - dockerproxy_priv:/socket/:ro
        depends_on:
            - dockerproxy_priv
        environment:
            WATCHTOWER_CLEANUP: "true"
            WATCHTOWER_POLL_INTERVAL: 7200
            DOCKER_HOST: "unix:///socket/docker.sock"
        logging: *logging

    # Authelia - 2FA Authentication
    authelia:
        image: authelia/authelia
        container_name: authelia
        user: "$MY_UID:$MY_UID"
        depends_on:
            - authelia-db
        volumes:
            - $STATE_DIR/authelia/config:/config
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.authelia.rule=Host(`luna.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.authelia.entryPoints=websecure"
            - "traefik.http.routers.authelia.tls.certresolver=le"
            - "traefik.http.routers.authelia.tls=true"
            - "traefik.http.routers.authelia.middlewares=authelia@file,geoblock@file"
        expose:
            - 9091
        restart: unless-stopped
        mem_limit: 256M
        logging: *logging

    authelia-db:
        image: redis:alpine
        container_name: authelia-db
        user: "$MY_UID:$MY_UID"
        volumes:
            - $STATE_DIR/authelia/db:/data
        networks:
            - traefik
        expose:
            - 6379
        restart: unless-stopped
        mem_limit: 128M
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping || exit 1"]
            start_period: 1m
        logging: *logging

    # Traefik - Reverse Proxy
    traefik:
        image: traefik:latest
        container_name: traefik
        depends_on:
            - authelia
            - dockerproxy
        command:
            - "--api=true"
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--global.sendAnonymousUsage=false"
            - "--global.checkNewVersion=true"
            - "--log.level=DEBUG"
            - "--accesslog=true"
            - "--accesslog.filePath=/var/log/traefik/access.log"
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--providers.file.filename=/etc/traefik/dynamic-configuration.yaml"
            - "--entryPoints.web=true"
            - "--entryPoints.web.address=:80"
            - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
            - "--entryPoints.websecure=true"
            - "--entryPoints.websecure.address=:443"
            - "--certificatesresolvers.le.acme.email=$DOMAIN_OWNER_EMAIL"
            - "--certificatesresolvers.le.acme.storage=/acme.json"
            - "--certificatesresolvers.le.acme.tlschallenge=true"
            - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
            - "--experimental.plugins.geoblock.version=v0.3.7"
            - "--providers.docker.endpoint=unix:///socket/docker.sock"
            - "--providers.docker.network=traefik"
        ports:
            - "80:80"
            - "443:443"
            - "127.0.0.1:8080:8080" # Traefik dashboard. To view remotely, tunnel: ssh -L 8080:localhost:8080 user@your-server
        volumes:
            - $STATE_DIR/traefik/acme.json:/acme.json
            - $STATE_DIR/traefik/dynamic-configuration.yaml:/etc/traefik/dynamic-configuration.yaml
            - $STATE_DIR/traefik/logs:/var/log/traefik/
            - dockerproxy:/socket/:ro
        restart: unless-stopped
        mem_limit: 256M
        networks:
            - traefik
        logging: *logging

    # Plausible - Web Analytics
    plausible_db:
        image: postgres:16-alpine
        container_name: plausible_db
        restart: unless-stopped
        mem_limit: 512M
        volumes:
            - $STATE_DIR/plausible/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            start_period: 1m
        networks:
            - traefik
        user: "$MY_UID:$MY_UID"
        logging: *logging
    plausible_events_db:
        image: clickhouse/clickhouse-server:24.12-alpine
        restart: unless-stopped
        mem_limit: 1G
        container_name: plausible_events_db
        networks:
            - traefik
        volumes:
            - $STATE_DIR/plausible/event_data:/var/lib/clickhouse
            - $STATE_DIR/plausible/event_logs:/var/log/clickhouse-server
            - $STATE_DIR/plausible/config/clickhouse-config.xml:/etc/clickhouse-server/config.d/clickhouse-config.xml:ro
        environment:
            - CLICKHOUSE_SKIP_USER_SETUP=1
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
                ]
            start_period: 1m
        logging: *logging
    plausible-init:
        image: alpine
        container_name: plausible-init
        restart: no
        volumes:
            - $STATE_DIR/plausible/data:/var/lib/plausible
        command: chown -R 999:999 /var/lib/plausible

    plausible:
        image: ghcr.io/plausible/community-edition:v3
        restart: unless-stopped
        mem_limit: 512M
        container_name: plausible
        command: sh -c "for i in \$(seq 1 30); do /entrypoint.sh db createdb 2>/dev/null && break; sleep 2; done && /entrypoint.sh db migrate && /entrypoint.sh run"
        depends_on:
            plausible-init:
                condition: service_completed_successfully
            traefik:
                condition: service_started
            plausible_db:
                condition: service_healthy
            plausible_events_db:
                condition: service_healthy
        networks:
            - traefik
        volumes:
            - $STATE_DIR/plausible/data:/var/lib/plausible
        ulimits:
            nofile:
                soft: 65535
                hard: 65535
        environment:
            - BASE_URL=https://plausible.$SERVICES_DOMAIN
            - SECRET_KEY_BASE=$PLAUSIBLE_SECRET_KEY
            - TOTP_VAULT_KEY=$PLAUSIBLE_TOTP_VAULT_KEY
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.plausible.rule=Host(`plausible.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.plausible.entrypoints=websecure"
            - "traefik.http.routers.plausible.tls.certresolver=le"
            - "traefik.http.routers.plausible.tls=true"
            - "traefik.http.routers.plausible.middlewares=authelia@file"
            - "traefik.http.services.plausible.loadbalancer.server.port=8000"
        logging: *logging

    # Send - File Sharing
    send:
        container_name: send
        image: registry.gitlab.com/timvisee/send:latest
        restart: unless-stopped
        mem_limit: 256M
        depends_on:
            - traefik
            - send-db
        volumes:
            - $STATE_DIR/send/uploads:/uploads
        environment:
            - DHPARAM_GENERATION=false
            - NODE_ENV=production
            - BASE_URL=https://share.$SERVICES_DOMAIN
            - PORT=80
            - REDIS_HOST=send-db
            - FILE_DIR=/uploads
            - MAX_FILES_PER_ARCHIVE=512
            - MAX_FILE_SIZE=137438953472
            - MAX_EXPIRE_SECONDS=31536000
            - MAX_DOWNLOADS=1000000000
            - DOWNLOAD_COUNTS=10,1,2,5,10,15,25,50,100,1000,1000000000
            - EXPIRE_TIMES_SECONDS=3600,86400,604800,2592000,31536000
            - DEFAULT_DOWNLOADS=100
            - DEFAULT_EXPIRE_SECONDS=2592000
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.send.rule=Host(`share.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.send.entrypoints=websecure"
            - "traefik.http.routers.send.tls.certresolver=le"
            - "traefik.http.routers.send.tls=true"
            - "traefik.http.routers.send.middlewares=authelia@file"
            - "traefik.http.services.send.loadbalancer.server.port=80"
        networks:
            - traefik
        logging: *logging
    send-db:
        container_name: send-db
        image: "redis:alpine"
        restart: unless-stopped
        mem_limit: 128M
        volumes:
            - $STATE_DIR/send/db:/data
        networks:
            - traefik
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping || exit 1"]
            start_period: 1m
        logging: *logging

    # PixelNtfy - Tracking Pixels
    pixelntfy:
        container_name: pixelntfy
        image: imranrdev/pixel-ntfy
        restart: unless-stopped
        mem_limit: 128M
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.pixelntfy.rule=Host(`pixelntfy.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.pixelntfy.entrypoints=websecure"
            - "traefik.http.routers.pixelntfy.tls.certresolver=le"
            - "traefik.http.routers.pixelntfy.tls=true"
            - "traefik.http.routers.pixelntfy.middlewares=authelia@file"
            - "traefik.http.services.pixelntfy.loadbalancer.server.port=80"
        environment:
            - NTFY_TOPIC=$PIXELNTFY_TOPIC
            - NTFY_SERVER_URL=https://ntfy.sh
            - PORT=80
            - ANALYTICS_SCRIPT_ELEMENT=<script defer data-domain="pixelntfy.$SERVICES_DOMAIN" src="https://plausible.$SERVICES_DOMAIN/js/script.js"></script>
        networks:
            - traefik
        logging: *logging

    # ISBN Lookup
    isbn-lookup:
        container_name: isbn-lookup
        image: imranrdev/isbn-lookup
        restart: unless-stopped
        mem_limit: 128M
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.isbn-lookup.rule=Host(`isbn.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.isbn-lookup.entrypoints=websecure"
            - "traefik.http.routers.isbn-lookup.tls.certresolver=le"
            - "traefik.http.routers.isbn-lookup.tls=true"
            - "traefik.http.routers.isbn-lookup.middlewares=authelia@file"
            - "traefik.http.services.isbn-lookup.loadbalancer.server.port=80"
        environment:
            - PORT=80
            - ANALYTICS_SCRIPT_ELEMENT=<script defer data-domain="isbn.$SERVICES_DOMAIN" src="https://plausible.$SERVICES_DOMAIN/js/script.js"></script>
        networks:
            - traefik
        logging: *logging

    # MeTube - YouTube Downloader
    metube:
        image: ghcr.io/alexta69/metube:latest
        container_name: metube
        volumes:
            - $STATE_DIR/metube:/downloads
        networks:
            - traefik
        depends_on:
            - traefik
        restart: unless-stopped
        mem_limit: 256M
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.metube.rule=Host(`ytdl.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.metube.entrypoints=websecure"
            - "traefik.http.routers.metube.tls.certresolver=le"
            - "traefik.http.routers.metube.tls=true"
            - "traefik.http.routers.metube.middlewares=authelia@file"
            - "traefik.http.services.metube.loadbalancer.server.port=8081"
        logging: *logging

    # Obtainium Apps
    obtainium_apps:
        container_name: obtainium_apps
        image: imranrdev/apps.obtainium.example.org
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.obtainium_apps.rule=Host(`example.org`)"
            - "traefik.http.routers.obtainium_apps.entrypoints=websecure"
            - "traefik.http.routers.obtainium_apps.tls.certresolver=le"
            - "traefik.http.routers.obtainium_apps.tls=true"
            - "traefik.http.services.obtainium_apps.loadbalancer.server.port=8080"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 128M
        logging: *logging

    # IKOM - IKOM
    ikom:
        container_name: ikom
        image: imranrdev/order-manager
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.ikom.rule=Host(`ikom.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.ikom.entrypoints=websecure"
            - "traefik.http.routers.ikom.tls.certresolver=le"
            - "traefik.http.routers.ikom.tls=true"
            - "traefik.http.routers.ikom.middlewares=authelia@file"
            - "traefik.http.services.ikom.loadbalancer.server.port=3000"
        volumes:
            - "$STATE_DIR/ikom:/app/data"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 256M
        logging: *logging

    # SB25 - private birthday page
    sb25:
        container_name: sb25
        image: imranrdev/sb25
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.sb25.rule=Host(`sb25.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.sb25.entrypoints=websecure"
            - "traefik.http.routers.sb25.tls.certresolver=le"
            - "traefik.http.routers.sb25.tls=true"
            - "traefik.http.routers.sb25.middlewares=authelia@file"
            - "traefik.http.services.sb25.loadbalancer.server.port=3000"
        environment:
            - AUTH_TOKEN=$SB25_AUTH_TOKEN
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 128M
        logging: *logging

    # strelaysrv - Syncthing Relay Server
    strelaysrv:
        image: syncthing/relaysrv:latest
        container_name: strelaysrv
        restart: unless-stopped
        volumes:
            - strelaysrv:/var/strelaysrv
        command:
            - "-global-rate=5000000"
            - "-provided-by=$STRELAYSRV_PROVIDED_BY"
        ports:
            - "22067:22067"
            - "22070:22070"
        logging: *logging

networks:
    traefik:
        name: traefik
        ipam:
            config:
                - subnet: 172.19.0.0/16

volumes:
    dockerproxy:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
    dockerproxy_priv:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
    strelaysrv:
