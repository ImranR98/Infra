x-logging: &logging
    options:
        max-size: 10m
        max-file: 5
services:

    frps-with-multiuser:
        image: imranrdev/frps-with-multiuser:latest
        container_name: frps-with-multiuser
        restart: always
        volumes:
          - $STATE_DIR/frps/tokens.txt:/workdir/service-data/frps-tokens.txt:ro
        network_mode: host
        logging: *logging

    logtfy:
        image: imranrdev/logtfy:latest
        container_name: logtfy
        hostname: $HOSTNAME
        network_mode: host
        restart: unless-stopped
        mem_limit: 256M
        volumes:
          - $STATE_DIR/logtfy/config.json:/logtfy/config.json:ro
          - /var/log/journal:/var/log/journal:ro
        logging: *logging

volumes:
    logtfy_tmp: {}
