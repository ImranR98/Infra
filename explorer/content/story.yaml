- id: home
  stage: Shape
  title: The service is actually at home
  body: 'The service runs on **srv0**, the K3s control plane at home. `srv0` also runs one Compose sidecar: the public-exposure WireGuard client.


    `vps0` and `srv0` are joined by the public-exposure tunnel. It carries selected public ports into the cluster without exposing the LAN.'
  deepDive: 'The sidecar is the one piece of `srv0` that is not Kubernetes. It owns `pubexp-client0` (`10.99.0.2/32`) and removes the interface when the container stops.


    `bigpc` is an optional K3s worker with a discrete AMD GPU; it is not a peer machine in this request path.'
  reveal:
  - srv0
  focus:
