- id: config
  stage: Operations
  title: Configuration layers
  body: 'Manual automation secrets live in `config/VARS.env`. `srv0` Helm values live in `config/srv0/values.yaml`, including the Renovate token and repo inputs rendered into the CronJob Secret. `vps0` uses `config/vps0/compose.env`, plus real files for Authelia users/rules and public-exposure keys.


    The committed templates under `targets/*/config_template/` document every key and generation command. `init-config.sh` copies them without overwriting; `validate.sh` rejects placeholders.'
  deepDive: 'Only `MAIN_PARENT_DIR` and `SECONDARY_STORAGE_PATH` are required path roots; the rest derive. Machine facts are generated into `targets/<t>/compose/.env`, not config envs.


    Secrets never touch git. `config/` is gitignored; values sit there as plain text.



    `COMPOSE_PROFILES=dscpln-agent` enables the optional vps0 archive agent. Generated files — `targets/<t>/compose/.env`, the public-exposure keys, `current_target/`, and the rendered Authelia config — are not hand-edited.


    `config/VARS.env` is for manual `scripts/renovate.sh`; the scheduled CronJob reads its chart Secret (`renovate-secrets`) and does not mount the repo.'
