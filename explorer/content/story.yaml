- id: restore
  stage: Maintenance
  title: Restore
  body: 'The State Backups task is backup-only. `scripts/restic-restore.sh list` lists snapshots; `pvc <name>` and `compose srv0|vps0` stage by default and accept `--live`.


    The script works on a fresh cluster with the repository, password, and key. It does not depend on Task Runner being deployed.

    '
  deepDive: 'The repository is at `state_backups/restic` in the Syncthing-replicated Main/Infra tree. Only srv0 writes it; wait for Syncthing to settle before restoring from a peer.


    The restic password lives in the private `dscpln-config` checkout. Record it off-cluster; a fresh restore needs it.'
