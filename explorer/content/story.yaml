- id: amneziawg
  stage: Access
  title: Remote-access VPN
  body: 'The full-tunnel **AmneziaWG VPN server** runs as a hostNetwork pod pinned by `nodeSelector: infra.local/external-exposed`. It uses the userspace `amneziawg-go` implementation and creates `ra-amneziawg0` at `10.100.0.1/24`.


    The companion `remote-access-dns` pod binds `10.100.0.1:53` and answers every `*.$SERVICES_DOMAIN` name with `10.100.0.1`, so clients keep using the normal service URLs.'
  deepDive: '`vps0` DNATs `51820/udp` to `10.99.0.2:51830` over the public-exposure tunnel; flannel owns 51820 inside the cluster. Only AmneziaWG-capable clients can connect; vanilla WireGuard clients cannot.


    Profiles are fetched with `scripts/remote-access-client.sh <client>`; DNS `10.100.0.1`, MTU `1180`, and keepalive `25` are part of the generated profile. To regenerate, delete `/wg/ra-amneziawg0.conf` or the PVC and restart the pod.'
  reveal:
