- id: storage-migration
  stage: Maintenance
  title: Storage migration
  body: 'The current storage path for application PVCs is the NFS-backed `nfs-apps` class: the `nfs-server` pod plus `csi-driver-nfs`. Sizes are advisory and PVCs are `ReadWriteMany`.


    Restores use `scripts/restic-restore.sh`; there is no tar-based PVC path.'
  deepDive: 'The app-data export is `/exports/apps` → `current_target/k3s_live_state/nfs-apps` with `no_root_squash`. `IGNORE_DATABASE_FSTYPE=true` is required for Immich Postgres on NFS.


    The tradeoff is measured: about 3× SQLite p95 and 2.6× Postgres latency under load compared with block storage.'
