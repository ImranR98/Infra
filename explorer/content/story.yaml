- id: k3s-model
  stage: App
  title: The K3s split
  body: '`srv0` runs K3s. The Helm chart `srv0-base` installs the platform in `base`; `srv0-apps` installs the workload catalog in `apps`.


    Base owns the Gateway and certificates, storage, auth and security, observability, node lifecycle, and the Renovate CronJob. Apps assume those pieces exist.

    '
  deepDive: 'The charts produce `srv0-base` and `srv0-apps`; apply base before apps and delete in reverse. Upstream app charts are `HelmChart` CRs owned by k3s''s helm-controller, not dependencies of our chart.


    `descheduler` and `system-upgrade-controller` are base components. K3s version changes are owned by the system-upgrade plans. Most app templates are file-scoped: the resources in one file are the app''s ownership and security record.'
