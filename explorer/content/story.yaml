- id: wireguard-basics
  stage: Tunnel
  title: WireGuard basics
  body: 'A WireGuard interface is a private network link between two peers. Each peer has a private key and a public key; each interface has a tunnel address and an allowed-address set.


    `vps0` has the public IP and listens on `51822/udp`. `srv0` has no public address. The public-exposure link gives them point-to-point `/32` addresses: `vps0` is `10.99.0.1/32`, and `srv0` is `10.99.0.2/32`.'
  deepDive: 'WireGuard carries only the traffic its `AllowedIPs` match. This tunnel is not a general VPN and does not expose the LAN; it forwards selected public ports.


    The separate AmneziaWG VPN is a full-tunnel service for remote clients. Keys and peer configs are generated by `scripts/public-exposure-keygen.sh`; do not hand-edit them.'
  reveal:
  - concept/public-exposure
  focus:
  - vps0
  - concept/public-exposure
  - srv0
  edges:
  - from: vps0
    to: concept/public-exposure
    type: tunnels-to
    label: 10.99.0.1/32
  - from: concept/public-exposure
    to: srv0
    type: tunnels-to
    label: 10.99.0.2/32
  code:
  - path: scripts/public-exposure-keygen.sh
    summary: Generates the public-exposure keys and peer configs.
  - path: targets/vps0/compose/files/public-exposure/forwards.conf
    summary: Public ports forwarded into the tunnel.
  flow:
