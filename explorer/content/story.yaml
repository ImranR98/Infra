- id: tunnel
  stage: Tunnel
  title: The tunnel
  body: '`vps0` forwards selected public ports over the tunnel with kernel DNAT. For `home.$BASE_SERVICES_DOMAIN` and `*.home.$BASE_SERVICES_DOMAIN`, it does not terminate `srv0`''s TLS: the file provider forwards to `10.99.0.2:80` / `10.99.0.2:8443` with `tls.passthrough` and PROXY protocol v2.


    `public-exposure-server-wg` on `vps0` (host network, `NET_ADMIN`, linuxserver/wireguard) creates `pubexp-server0` (`10.99.0.1/32`, ListenPort `51822/udp`). `public-exposure-client-wg` on `srv0` is a Compose sidecar and owns `pubexp-client0` (`10.99.0.2/32`).'
  deepDive: 'The MTU is 1340 because the `srv0`↔`vps0` path is 1420, and both sides clamp TCP MSS. All host effects are applied on container start and removed through a SIGTERM trap.


    The hub also DNATs the preboot port (`8887/tcp`) to `10.99.0.4:22` and the AmneziaWG endpoint (`51820/udp`) to `srv0`''s listener. A `masq` flag SNATs flows whose target would otherwise reply through its own default route; qBittorrent keeps real peer source IPs.'
  reveal:
  - concept/public-exposure
  - vps0/service/public-exposure-server-wg
  - srv0/service/public-exposure-client-wg
  focus:
  - vps0
  - concept/public-exposure
  - vps0/service/public-exposure-server-wg
  - srv0/service/public-exposure-client-wg
  - srv0
  edges:
