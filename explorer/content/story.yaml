- id: repo-layout
  stage: Operations
  title: The working tree
  body: 'Everything a target needs lives in `targets/<t>/`; shared logic lives in `scripts/`; secrets live in the gitignored `config/`. There is no build step.


    Target-selecting scripts take `<target>` as their first argument. Machine-local scripts (`prereqs`, `renovate`, `preboot`, `wireguard`, `kubeconfig-unlock`, `k3s-server`, `k3s-join`, `restic-restore`) act on the machine they run on.'
  deepDive: '`current_target/` is runtime state; leave it alone. `config/` mirrors each target''s `config_template/`. `compose.sh` supplies the config env, generated machine facts, private overlay, and profiles, and renders vps0 Authelia before `up`.


    Run `validate.sh <target>` before every `helm upgrade --install`; it is read-only. Hostnames must match the target directory; scripts warn or hard-fail.


    Scripts share one shape: `# DESC:`, `set -euo pipefail`, `usage()`, and `common.sh`; target-selecting scripts call `require_target`, and mutating ones call `require_target_host`. The common environment includes `$INFRA_ROOT`, `$TARGET`, `$COMPOSE_STATE_DIR`, `$STATE_BACKUP_DIR`, and `$MY_UID`.'
