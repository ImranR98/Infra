- id: decisions
  stage: Operations
  title: Accepted tradeoffs
  body: 'The current design accepts a small set of deliberate tradeoffs: full NFS storage with higher SQLite/Postgres latency, static singleton node labels, claims-based scheduling, a public geoblock API, shared multi-SAN edge certificates, and backups that are backup-only with restore outside the app.


    These are current decisions, not migration history. Do not re-flag one without reading the source that implements it.

    '
  deepDive: 'Each card names the source that implements the choice. Read it before changing one.


    The remaining accepted choices are the removed header gate (`BOOTSTRAP_PRIVATE_APPS`), Prometheus instead of Mimir, Authelia ownership split between chart and config, shared multi-SAN edge certificates, public GHCR packages for app images, the NFS image tracking latest branch packages, the sale-site subdomain audiences, Falco as runtime security, the Renovate app/Infra split, and the accepted duplication list. Do not consolidate the accepted duplication without reading the reasoning.'
