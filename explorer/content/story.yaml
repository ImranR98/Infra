- id: gpu
  stage: App
  title: Hardware resources
  body: 'The generic device plugin scans each node''s sysfs and `/dev` and advertises hardware as resources: `infra.local/intel-gpu`, `amd-igpu`, `amd-dgpu`, `vaapi`, and `conbee`.


    Workloads request the resource they need. On the current Intel `srv0`, that is `intel-gpu` + `vaapi`; after the board swap it is `amd-igpu` + `vaapi`. Immich ML uses `intel-gpu` (OpenVINO) or `bigpc`''s `amd-dgpu` (ROCm). `GPU_PROFILE` (`intel|amd|none`) selects the media/ML backends. A node without the device advertises zero.'
  deepDive: 'The plugin normalizes device names to `renderD128`/`card0`/`ttyACM0`, so a workload does not depend on enumeration order or a node label.


    bigpc is an optional K3s worker with the RX 9070. It is not a peer machine in this walk; it supplies `amd-dgpu` when present.'
