- id: schedules
  stage: Operations
  title: Schedules
  body: 'The six-hourly Renovate CronJob (`0 */6 * * *`, America/Toronto) is a pure PR run with overlap forbidden. The suspended `renovate-infra` template is not on a schedule; the skill creates a Job from it after app images publish.


    The `vps0` image-prune timer runs monthly. The State Backups task defaults to Sundays 04:00. The Task Runner owns the backup schedule; the CronJob owns update discovery. Neither is a watchtower-style continuous updater.'
  deepDive: 'Renovate''s `startingDeadlineSeconds` and 7200s `activeDeadlineSeconds` keep a hung run from blocking the next six-hour slot. The `vps0` timer is a systemd oneshot service; the Task Runner backup task is backup-only and restore is `scripts/restic-restore.sh`.


    Host packages are separate. `vps0` runs `unattended-upgrades`. `srv0` and `bigpc` are Fedora: `dnf5-plugin-automatic` is not installed by default; enable security-only updates with `upgrade_type = security` and `reboot = never`, then check `dnf5 needs-restarting -r` and reboot in a maintenance window.'
