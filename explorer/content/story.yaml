- id: request
  stage: Request
  title: You open a URL
  body: A request to `https://immich.$SERVICES_DOMAIN` resolves to **vps0**, the only machine with a public IP. `vps0` is a cloud VPS running Docker Compose for public-facing services.
  deepDive: '`srv0` is the home server: a K3s control plane with a LUKS-encrypted root, most workloads, and the data. It has no public address. The public edge stays small: `vps0` terminates public TLS; `srv0` owns the apps and the storage.'
