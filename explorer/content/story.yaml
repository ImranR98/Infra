- id: app-inside
  stage: App
  title: Inside Immich
  body: 'The chart runs four moving parts: the **server**, **machine learning**, **Postgres**, and **Valkey**.


    The server uses the vendor-neutral `infra.local/vaapi` resource. Machine learning uses `intel-gpu` (OpenVINO) or bigpc''s `amd-dgpu` (ROCm), with CPU fallbacks. `GPU_PROFILE` (`intel|amd|none`) selects the media/ML backends. Frigate recordings and the Jellyfin libraries stay on NFS.

    '
  deepDive: 'The database claim is backed up; the library claim is the primary photo store on `nfs-apps`. Immich''s external library is the read-only media local PV.


    The seed hook creates the first admin through the sign-up API and persists the generated password in the `immich-seed-admin` Secret. The security group holds the NetworkPolicies and RBAC that bound the chart.

    '
