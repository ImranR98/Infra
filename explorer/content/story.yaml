- id: isolation
  stage: Operations
  title: Isolation and secrets
  body: 'K3s enforces NetworkPolicies through kube-router. `namespaces` installs the baseline policies; each app template adds its own. The kube-system policy admits ports 80/443/8000/8443 to Traefik, and `allow-traefik-ingress` admits the public-exposure hub (`10.99.0.1/32`) and remote-access clients (`10.100.0.0/24`).


    On Fedora, SELinux labels hostPath data. Pods that share a host tree need pod-level `seLinuxOptions.level: s0`; syncthing, Falco, and node-exporter use `spc_t`. Secrets stay in gitignored `config/`. HelmChart values are readable by anyone who can `get` the CR, so namespace access is the boundary.'
  deepDive: '`nfs-apps` uses `no_root_squash` and is reachable only from the LAN CIDR; backup and restore pods run as root. `hostpath-main` is a singleton. SSH hardening and fail2ban live outside the repo.


    Several routes are public by design: `gpt`, `fmd`, and `rss` are geoblock + CrowdSec only; `seerr` is geoblock only; `owncast`''s RTMP ingest is protected only by its stream key. Do not add SSO or geoblock without accepting the constraint.


    `vps0` exposes the Docker socket only through read-only `socket-proxy` containers; watchtower on `pc`/`bigpc` uses the read-write proxy with `cap_drop: ALL`, a read-only root, and a 512M limit. qBittorrent''s default password is accepted because Authelia, geoblock, and CrowdSec gate the UI.

    Charts that support secret references use them; where a chart only accepts plain YAML, the component uses `valuesSecrets` projected from a namespaced Secret.'
  reveal:
  - srv0/base/namespaces
  - srv0/base/falco
  - srv0/base/nfs-server
  focus:
  - srv0/base/namespaces
  - srv0/base/gateway
  - srv0/base/falco
  - srv0/base/nfs-server
