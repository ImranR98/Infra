    - vps0/service/traefik
- id: vps-security
  stage: Edge
  title: vps0 security
  body: 'Authelia, CrowdSec, and geoblock are **per-router middlewares**, not properties of a domain. A `$CLOUD_SERVICES_DOMAIN` host is not automatically protected, and a `$BASE_SERVICES_DOMAIN` host is not automatically open.


    CrowdSec is the baseline on public routers. Geoblock is an allowlist with explicit exceptions. Authelia is applied to selected cloud routers, not every cloud host.'
  deepDive: 'The base-domain routers are CrowdSec-only: `plausible`, `apps.obtainium`, and `ln` (Shlink). The `ikom` base-domain name is only a redirect.


    Cloud routers with Authelia include `auth`, `traefik`, `crowdsec`, `ytdl`, `ikom`, `times`, `sale`, `ui.ln`, `docker`, and `uptime`. `pixelntfy`, `isbn`, and `attentiongame` use CrowdSec only; `owncast` adds `owncast-auth` and geoblock. `ytdl` and `ikom` skip geoblock, and `times` has a static-asset router without Authelia. The router label is the source of truth.'
  reveal:
  - vps0/service/crowdsec
  - vps0/service/authelia
  focus:
  - vps0/service/traefik
  - vps0/service/crowdsec
  - vps0/service/authelia
  edges:
  - from: vps0/service/traefik
    to: vps0/service/crowdsec
    type: guarded-by
    label: baseline
  - from: vps0/service/traefik
    to: vps0/service/authelia
    type: guarded-by
    label: selected
  code:
