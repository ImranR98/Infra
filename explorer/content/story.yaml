- id: cluster-entry
  stage: Cluster
  title: srv0's front door
  body: 'The shared Gateway `srv0` in `base` exposes `web:80` (HTTP, plik only), `websecure:443` (LAN/VPN) and `websecure-proxy:8443` (PROXY protocol v2 from the public-exposure hub; trustedIPs are exactly `10.99.0.1/32`).


    TLS terminates on the listeners with two shared exact-name Certificates in `base` (`edge-certs.yaml`): `edge-public-tls` (the `PUBLIC_HOSTS` list) is attached to both secure listeners, and `edge-private-tls` (`PRIVATE_HOSTS`, currently `files`/`traefik`) only to `websecure`, so the private names never reach the public-exposure listener.

    '
  deepDive: 'HTTPRoutes and Middlewares live in `base` because Traefik resolves Middleware `ExtensionRef` filters only in the route''s namespace.


    The names are exact, not a wildcard, but all public names share one key; adding a public app means adding its label to `PUBLIC_HOSTS` and re-issuing. Traefik runs as a pod-network DaemonSet with hostPorts 80/443/8443 and no Service, so the CNI hostPort DNAT is the only way in and it preserves real client sources.



    Traefik can also route to any address reachable from its pods using a selectorless Service plus a hand-written EndpointSlice. The HTTPRoute and certificate setup is the same as for a pod-backed Service.'
  reveal:
  - srv0/base/gateway
  - srv0/base/edge-certs
  focus:
  - srv0/service/public-exposure-client-wg
  - srv0/base/gateway
  - srv0/base/edge-certs
  edges:
  - from: srv0/service/public-exposure-client-wg
    to: srv0/base/gateway
    type: forwards-to
    label: 10.99.0.2:8443
  - from: srv0/base/gateway
    to: srv0/base/edge-certs
    type: presents
    label: shared TLS
  flow:
