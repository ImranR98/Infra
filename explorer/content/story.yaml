- id: windows-remote
  stage: Maintenance
  title: Windows remote desktop
  body: 'Guacamole runs in `srv0-apps`; the public path is `vps0` Traefik → public-exposure tunnel → `srv0` Traefik → Guacamole → guacd → Windows:3389.


    Authelia gates the route; the Windows credentials are prompted by guacd on each connection and are not stored. `win` has no geoblock.'
  deepDive: 'The Authelia rule lives in `AUTHELIA_ACCESS_CONTROL_RULES` in `config/srv0/values.yaml`, not the chart. `guacadmin` is disabled; the seeded connection has `max_connections=1`.


    The Windows firewall allows RDP from the LAN, so the Guacamole stack is not pinned. `win-header-auth` sets `X-Guac-User: shared` after forward-auth; the Service is ClusterIP and NetworkPolicies admit only Traefik.'
  reveal:
  - srv0/apps/home/guacamole
  - srv0/base/gateway
