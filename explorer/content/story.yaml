- id: updates
  stage: Operations
  title: How changes arrive
  body: 'The scheduled Renovate runner is one pure K3s CronJob on `srv0` (`base`, `targets/srv0/k3s-base/templates/renovate.yaml`), `renovate-daily`, every six hours (`0 */6 * * *`). It runs Renovate only: Renovate opens or refreshes PRs and auto-merges non-major app updates after their required `test` check. It does not add a custom merge/wait/notify wrapper.


    App repos extend `renovate-preset.json`; majors wait on the Dependency Dashboard. Infra Renovate PRs are never auto-merged. They are the manual rollout gate handled by the `renovate-pr-ops` skill.'
  deepDive: 'The runner gets `RENOVATE_TOKEN`, the repo list, Docker Hub host rules, and the git author from the `renovate-secrets` Secret. It mounts no repo or scripts and runs as the image''s non-root user.


    A suspended `renovate-infra` CronJob is the on-demand template. After an app PR merges and its image `publish` job completes, the `renovate-pr-ops` skill creates a Job from it, so the new Infra digest PR appears immediately instead of waiting for the next six-hourly run. The skill also handles app exceptions (blocked PRs, approved majors) and presents the Infra batch for approval. `infra-digest-pin` marks image pins that need a deploy; merging is inert until `scripts/deploy.sh <target>`. The manual on-demand runner remains `scripts/renovate.sh`.'
  reveal:
  - srv0/base/renovate/cronjob/renovate-daily
  - srv0/base/renovate/cronjob/renovate-infra
  - concept/renovate-pr-ops
