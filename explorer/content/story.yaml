- id: preboot
  stage: Access
  title: Preboot unlock
  body: '`scripts/preboot.sh public-exposure` installs a dracut module that brings up `pubexp-pre0` in the initramfs. The `vps0` hub DNATs `8887/tcp` to `10.99.0.4:22`, so dropbear is reachable before the root filesystem is unlocked.


    Remote SSH uses the same tunnel: `vps0`''s sshd connects to `10.99.0.2:22`.'
  deepDive: 'The preboot key is separate from the runtime keys. Re-run `preboot.sh public-exposure` on `srv0` after rotating it.


    When adding initramfs networking, verify with `lsinitrd` that the module, `wg`, `ip`, and the needed firmware are present. Drivers do not retry firmware loads after `pivot_root`.'
