- id: edge
  stage: Edge
  title: vps0 routing
  body: '`vps0` uses one Traefik instance to route by Host/SNI. Local services are discovered from Docker labels. `home.$BASE_SERVICES_DOMAIN` and `*.home.$BASE_SERVICES_DOMAIN` go through the file provider.


    `$BASE_SERVICES_DOMAIN` is the public zone and `$CLOUD_SERVICES_DOMAIN` is the SSO zone, but the label only chooses the hostname. The router''s middleware chain decides what protection a host gets.'
  deepDive: 'The file provider forwards home hostnames to `10.99.0.2:80` / `10.99.0.2:8443` with `tls.passthrough` and PROXY protocol v2. `vps0` never terminates `srv0`''s TLS or holds its private keys; cert-manager on `srv0` owns the Let''s Encrypt lifecycle.


    `plausible.$BASE_SERVICES_DOMAIN` is Cloudflare-proxied. Traefik trusts the Cloudflare edge ranges in `forwardedHeaders`, so logs and CrowdSec see real client IPs.'
  reveal:
  - vps0/service/traefik
  focus:
  - vps0
  - vps0/service/traefik
  edges:
  - from: vps0
    to: vps0/service/traefik
    type: routes-to
    label: '443'
  flow:
  - - vps0
  - - vps0/service/traefik
  zones:
