    label: srv0 · home cluster
    members:
    - srv0/service/public-exposure-client-wg
    - srv0/base/gateway
    - srv0/base/edge-certs
- id: app-route
  stage: App
  title: The app route
  body: 'The **HTTPRoute** matches `immich.$SERVICES_DOMAIN`, adds geoblock and CrowdSec, and sends the request to the Immich service.


    Immich is a chart-managed app. The template owns the route, the database secret, the PVCs, the NetworkPolicies, and the seed hook. The Immich chart owns the server, machine learning, Postgres, and Valkey.'
  deepDive: 'Immich has its own authentication and an Authelia OIDC client, but no forward-auth filter. That is deliberate: the native apps and its login flow work better without an extra redirect.


    The six apps with their own authentication are Home Assistant, Immich, Jellyfin, Linkwarden, Navidrome, and Opodsync. Their routes keep CrowdSec; Jellyfin also has `jellyfin-ratelimit`.

    '
