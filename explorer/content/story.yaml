- id: data
  stage: Data
  title: Where the photo lives
  body: 'The `nfs-server` pod in `base` exports host paths; `csi-driver-nfs` mounts them. The app-data export is `/exports/apps` → `{{ .Values.INFRA_ROOT }}/current_target/k3s_live_state/nfs-apps`, with `no_root_squash` (needed by CSI subdir creation and Postgres chowns).


    The dynamic StorageClass **`nfs-apps`** is the default. It provisions `subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}`, `mountPermissions: "0777"`, `reclaimPolicy: Retain`, `onDelete: retain`, `volumeBindingMode: Immediate`, and `allowVolumeExpansion: false` (sizes are advisory; NFS has no quota).

    '
  deepDive: 'Migrated PVCs use `ReadWriteMany` so backup/restore pods can run on any node. The CSI driver is the only NFS client (hostNetwork node plugin); all mounts use `nfsvers=4.2`.


    NFS is excellent for read-heavy/sequential workloads and media. SQLite/WAL and Postgres are latency-sensitive: the full-NFS migration accepted the measured cost (~3× SQLite p95 and ~2.6× Postgres latency under load). Immich Postgres requires `IGNORE_DATABASE_FSTYPE=true` to start on NFS.


    `hostpath-main` is a singleton: exactly one node owns the Main tree. A hostPath must not be the only reason a pod is pinned; back it with a statically bound `hostpath` PV/PVC and let the claim do the scheduling.



    Shared media and static host paths are separate. `host-volumes` defines statically bound `hostpath` PV/PVC pairs for the Main tree; the media, Jellyfin, Frigate, and code-sandbox shares are static NFS PVs, not dynamically provisioned.'
  reveal:
