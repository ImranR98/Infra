  body: 'The request path is **Internet → vps0 edge → tunnel → srv0 Gateway → HTTPRoute → workload → NFS data.**


    `vps0` owns the public address and TLS. `srv0` owns the apps, the data, and the cross-cutting layers: Authelia and CrowdSec, Renovate, State Backups, monitoring, and remote access. The tunnel joins them without exposing the LAN.'
