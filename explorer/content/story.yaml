- id: hardware-swap
  stage: Maintenance
  title: srv0 motherboard swap
  body: 'The hardware swap moves the Framework 13 AMD 7840U mainboard from `pc` into `srv0`, and the Intel i5-1240P board into `pc`. RAM is not interchangeable: DDR5 stays with the AMD board, DDR4 stays with Intel.


    After the swap, the device plugin should advertise `amd-igpu` and `vaapi` on srv0, and no `intel-gpu`. Set `GPU_PROFILE: "amd"` in `config/srv0/values.yaml`, then validate and deploy.

    '
  deepDive: 'Before disassembly, take a restic backup and an etcd snapshot, record `helm get values` for both releases, and verify the initramfs has the USB NIC/storage modules.


    Frigate''s ROCm detector needs `yolov9-t-320.onnx` in the config PVC before switching `FRIGATE_DETECTOR=rocm`. Fallbacks are `FRIGATE_GPU_RESOURCE=amd-dgpu`, `FRIGATE_DETECTOR=cpu`, `IMMICH_ML_BACKEND=cpu`, `JELLYFIN_HWACCEL=none`, `IMMICH_SERVER_HWACCEL=none`, and `GPU_PROFILE=none`.'
