- id: watching
  stage: Operations
  title: Watching the system
  body: 'Grafana provisions one webhook contact point (`ntfy`) plus file-backed alerting config: 27 rules in the **Falco** folder, the policy tree (`group_by: alertname`, 12h repeat), and the markdown body template group.


    Falco runs as a DaemonSet on srv0 and bigpc with the modern eBPF driver. It is the runtime counterpart to CrowdSec (L7) and opencanary (honeypot): syscall rules catch shells, credential access, crypto miners, and escape helpers that HTTP-layer tools cannot see.

    '
  deepDive: 'Falco events are JSON on stdout and Alloy''s pod-log collector ships them to Loki. Metrics drive Grafana alerts; response is manual. There is no Talon/auto-remediation and no k8saudit plugin yet.


    Alerting is designed to be quiet when bigpc is powered off. `falco-daemonset-not-ready` is critical only when Falco is not ready on a **Ready** node; `falco-warning-events` requires a warning to recur for 30 minutes. Known false alarms are excepted in `custom-rules.yaml`.

    '
