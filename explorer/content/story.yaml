  title: App authentication
  body: 'Routes with their own authentication do not use Authelia forward-auth: Home Assistant, Immich, Jellyfin, Linkwarden, Navidrome, and Opodsync. Immich still has an Authelia OIDC client. Jellyfin uses CrowdSec and `jellyfin-ratelimit`.


    Other `srv0` routes deliberately skip Authelia. `gpt` (Open WebUI), `fmd`, and `rss` (FreshRSS) are geoblock + CrowdSec only; `seerr` is geoblock only; `tv` (Jellyfin) is CrowdSec + rate limit and no geoblock. The route''s middleware chain is the source of truth.'
  deepDive: '`BOOTSTRAP_PRIVATE_APPS: "true"` temporarily removes the `websecure-proxy` parentRef from those six routes so they stay LAN/VPN-only until Authelia is Ready; set it back to `"false"` after bootstrap.


    The custom header-gate WASM plugin and its chain are gone. Do not add Authelia forward-auth to these six without changing their native-app login flow.'
