# RBAC — logtfy needs to read pod logs across namespaces via the Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logtfy-service-account
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-log-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-log-reader-binding
subjects:
  - kind: ServiceAccount
    name: logtfy-service-account
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io
---
# Logtfy configuration
apiVersion: v1
kind: Secret
metadata:
  name: logtfy-config
  namespace: monitoring
type: Opaque
stringData:
  logtfy.json: |
    {
        "ntfyConfig": {
            "configs": [
                {
                    "id": "ntfy_self",
                    "host": "https://ntfy.$SERVICES_DOMAIN",
                    "authHeader": "Bearer $NTFY_SERVICE_USER_TOKEN",
                    "topicPrefix": "${TARGET}_services_"
                },
                {
                    "id": "ntfy_official",
                    "host": "https://ntfy.sh",
                    "authHeader": null,
                    "topicPrefix": "${TARGET}_services_"
                }
            ],
            "defaultConfig": "ntfy_self",
            "fallbackConfig": "ntfy_official"
        },
        "modulesEnabledByDefault": false,
        "catchModuleCrashes": false,
        "allowModuleFailCount": 3,
        "moduleCustomization": [
            {
                "module": "ssh_logins",
                "ntfyTopic": "logtfy",
                "enabled": true
            },
            {
                "module": "authelia_logins_k8s",
                "loggerArg": "base",
                "ntfyTopic": "logtfy",
                "enabled": true
            },
            {
                "module": "traefik_geoblock_allowed_requests_k8s",
                "loggerArg": "kube-system",
                "ntfyTopic": "logtfy",
                "defaultPriority": "1",
                "enabled": true
            },
            {
                "module": "traefik_accesslogs_custom",
                "ntfyTopic": "logtfy",
                "pattern": "fmd.*requestAccess.*\" 200",
                "enabled": false
            }
        ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logtfy
  namespace: monitoring
  labels:
    app: logtfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logtfy
  template:
    metadata:
      labels:
        app: logtfy
    spec:
      hostname: ${TARGET}
      serviceAccountName: logtfy-service-account
      securityContext:
        fsGroup: $MY_UID
      containers:
        - name: logtfy
          image: imranrdev/logtfy:latest@sha256:3750795017ca552f22e3b8028b6c8e0d9f0ca85b5bb5ae3f8e324e8c767d4088
          volumeMounts:
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: config
              mountPath: /logtfy/config.json
              subPath: logtfy.json
          env:
            - name: KUBE_API_SERVER
              value: "https://kubernetes.default.svc"
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: logtfy-journal-pvc
        - name: config
          secret:
            secretName: logtfy-config
            items:
              - key: logtfy.json
                path: logtfy.json
