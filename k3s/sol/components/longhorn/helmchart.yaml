apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: longhorn-install
  namespace: kube-system
spec:
  chart: longhorn
  repo: https://charts.longhorn.io
  failurePolicy: abort
  targetNamespace: longhorn-system
  createNamespace: true
  version: 1.11.2
  valuesContent: |-
    # Single replica is intentional for single-node cluster.
    # Increase defaultClassReplicaCount + defaultReplicaCount when adding additional nodes.
    persistence:
      defaultClassReplicaCount: 1
      reclaimPolicy: "Retain"
    defaultSettings:
      defaultReplicaCount: "1"
      defaultDataPath: "/var/lib/rancher/longhorn"
      storageMinimalAvailablePercentage: 5
      storageOverProvisioningPercentage: 200
      replicaSoftAntiAffinity: true
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 128Mi
    longhorn:
      manager:
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 128Mi
      ui:
        resources:
          limits:
            memory: 256Mi
          requests:
            memory: 64Mi
    csi:
      attacher:
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: 32Mi
      provisioner:
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: 32Mi
      resizer:
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: 32Mi
      snapshotter:
        resources:
          limits:
            memory: 128Mi
          requests:
            memory: 32Mi
