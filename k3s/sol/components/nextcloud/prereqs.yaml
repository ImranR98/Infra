
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin-secret
  namespace: apps
type: Opaque
stringData:
  NEXTCLOUD_ADMIN_USER: "$NEXTCLOUD_ADMIN_USER"
  NEXTCLOUD_ADMIN_PASSWORD: "$NEXTCLOUD_ADMIN_PASSWORD"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data-pvc
  namespace: apps
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi

