x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

services:
    # https://github.com/wollomatic/socket-proxy for Traefik and other read-only needs
    dockerproxy:
        container_name: dockerproxy
        image: wollomatic/socket-proxy:1
        command:
            - "-loglevel=debug" # set to debug for far more logging
            - '-allowGET=(/v1\..{1,2})?/(version|containers/.*|events.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        restart: unless-stopped
        read_only: true
        mem_limit: 64M
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges
        user: 65534:964 # replace 964 with the output of "grep docker /etc/group | awk -F: '{print $3}'"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy:/socket/
        labels:
            - "com.centurylinklabs.watchtower.enable=false"
        healthcheck:
            test: ["CMD", "./healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 2
        logging: *logging

    # https://github.com/wollomatic/socket-proxy for Watchtower and other read-write needs
    dockerproxy_priv:
        container_name: dockerproxy_priv
        image: wollomatic/socket-proxy:1
        command:
            - "-loglevel=debug" # set to debug for far more logging
            - '-allowGET=/v1\..{2}/(containers/.*|images/.*)'
            - '-allowPOST=/v1\..{2}/(containers/.*|images/.*|networks/.*)'
            - '-allowDELETE=/v1\..{2}/(containers/.*|images/.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        restart: unless-stopped
        read_only: true
        mem_limit: 64M
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges
        user: 65534:964 # replace 964 with the output of "grep docker /etc/group | awk -F: '{print $3}'"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy_priv:/socket/
        labels:
            - "com.centurylinklabs.watchtower.enable=false"  
        healthcheck:
            test: ["CMD", "./healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 2
        logging: *logging

    # Watchtower - Container Updater
    watchtower:
        container_name: watchtower
        privileged: true
        restart: unless-stopped
        image: nickfedor/watchtower
        volumes:
            - dockerproxy_priv:/socket/:ro
        depends_on:
            - dockerproxy_priv
        environment:
            WATCHTOWER_CLEANUP: "true"
            WATCHTOWER_POLL_INTERVAL: 7200
            DOCKER_HOST: "unix:///socket/docker.sock"
        logging: *logging

    # Syncthing
    syncthing:
        image: syncthing/syncthing
        container_name: syncthing
        environment:
            - PUID=1000
            - PGID=1000
        volumes:
            - /home/$USER:/var/syncthing
        network_mode: host
        restart: on-failure
        logging: *logging

    # MDSCL-Camera
    media-date-standardize-copy-loop-camera:
        image: imranrdev/media-date-standardize-copy-loop
        container_name: media-date-standardize-copy-loop-camera
        environment:
            - NTFY_URL=https://ntfy.$SERVICES_DOMAIN/${MAIN_NODE_HOSTNAME_LOWERCASE}_services_mdscl_errors
            - NTFY_TOKEN=$NTFY_SERVICE_USER_TOKEN
        volumes:
            - "$MAIN_PARENT_DIR/deviceSync/DCIM/Camera:/source"
            - "$MAIN_PARENT_DIR/Main/Media/Camera:/destination"
        user: "1000:1000"
        restart: on-failure
        logging: *logging

    # MDSCL-Screenshots
    media-date-standardize-copy-loop-screenshots:
        image: imranrdev/media-date-standardize-copy-loop
        container_name: media-date-standardize-copy-loop-screenshots
        environment:
            - NTFY_URL=https://ntfy.$SERVICES_DOMAIN/${MAIN_NODE_HOSTNAME_LOWERCASE}_services_mdscl_errors
            - NTFY_TOKEN=$NTFY_SERVICE_USER_TOKEN
        volumes:
            - "$MAIN_PARENT_DIR/deviceSync/Screenshots:/source"
            - "$MAIN_PARENT_DIR/Main/Media/Screenshots:/destination"
        user: "1000:1000"
        restart: on-failure
        logging: *logging

    # MDSCL-ScreenRecordings
    media-date-standardize-copy-loop-screenrecs:
        image: imranrdev/media-date-standardize-copy-loop
        container_name: media-date-standardize-copy-loop-screenrecs
        environment:
            - NTFY_URL=https://ntfy.$SERVICES_DOMAIN/${MAIN_NODE_HOSTNAME_LOWERCASE}_services_mdscl_errors
            - NTFY_TOKEN=$NTFY_SERVICE_USER_TOKEN
        volumes:
            - "$MAIN_PARENT_DIR/deviceSync/Screen Recordings:/source"
            - "$MAIN_PARENT_DIR/Main/Media/Screenshots:/destination"
        user: "1000:1000"
        restart: on-failure
        logging: *logging

    # Logtfy - Simple monitoring/alerts
    logtfy:
        image: imranrdev/logtfy:latest
        container_name: logtfy
        hostname: $MAIN_NODE_HOSTNAME
        restart: unless-stopped
        volumes:
            - /var/log/journal:/var/log/journal:ro
            - $STATE_DIR/logtfy/config.json:/logtfy/config.json
            - logtfy_tmp:/tmp/logtfy
            - $STATE_DIR/traefik_logs:/traefik_logs
            - dockerproxy:/socket/:ro
        depends_on:
            - dockerproxy
        environment:
            DOCKER_HOST: "unix:///socket/docker.sock"
        logging: *logging

    # Authelia - 2FA Authentication
    authelia:
        image: authelia/authelia
        container_name: authelia
        user: "1000:1000"
        depends_on:
            - authelia-db
        volumes:
            - $STATE_DIR/authelia/config:/config
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.authelia.rule=Host(`auth.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.authelia.entryPoints=websecure"
            - "traefik.http.routers.authelia.tls.certresolver=le"
            - "traefik.http.routers.authelia.tls=true"
            - "traefik.http.routers.authelia.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/verify?rd=https%3A%2F%2Fauth.$SERVICES_DOMAIN%2F"
            - "traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true"
            - "traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
            - "traefik.http.middlewares.authelia-basic.forwardAuth.address=http://authelia:9091/api/verify?auth=basic"
            - "traefik.http.middlewares.authelia-basic.forwardAuth.trustForwardHeader=true"
            - "traefik.http.middlewares.authelia-basic.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
        expose:
            - 9091
        restart: unless-stopped
        logging: *logging
    authelia-db:
        image: redis:alpine
        container_name: authelia-db
        user: "1000:1000"
        volumes:
            - $STATE_DIR/authelia/db:/data
        networks:
            - traefik
        expose:
            - 6379
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping || exit 1"]
            start_period: 1m
        logging: *logging

    # Traefik - Reverse Proxy
    traefik:
        image: traefik:latest
        container_name: traefik
        depends_on:
            - authelia
            - dockerproxy
            - crowdsec
        command:
            - "--api=true"
            - "--api.dashboard=true"
            - "--api.insecure=false"
            - "--global.sendAnonymousUsage=false"
            - "--global.checkNewVersion=true"
            - "--log.level=DEBUG"
            - "--accesslog=true"
            - "--accesslog.filePath=/var/log/traefik/access.log"
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--providers.file.filename=/etc/traefik/dynamic-configuration.yaml"
            - "--entryPoints.web=true"
            - "--entryPoints.web.address=:80"
            - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
            - "--entryPoints.websecure=true"
            - "--entryPoints.websecure.address=:443"
            # - "--entryPoints.websecure.forwardedHeaders.trustedIPs=172.19.0.0/16"
            - "--entryPoints.websecure.proxyProtocol.trustedIPs=172.19.0.1/32"
            - "--entryPoints.websecure.http.middlewares=crowdsec@docker"
            - "--certificatesresolvers.le.acme.email=$DOMAIN_OWNER_EMAIL"
            - "--certificatesresolvers.le.acme.storage=./acme.json"
            - "--certificatesresolvers.le.acme.tlschallenge=true"
            - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
            - "--experimental.plugins.geoblock.version=v0.3.7"
            - "--experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
            - "--experimental.plugins.bouncer.version=v1.6.0"
            - "--providers.docker.endpoint=unix:///socket/docker.sock"
            - "--providers.docker.network=traefik"
        ports:
            - "127.0.0.1:80:80"
            - "127.0.0.1:443:443"
        volumes:
            - $STATE_DIR/traefik/acme.json:/acme.json
            - $STATE_DIR/traefik/dynamic-configuration.yaml:/etc/traefik/dynamic-configuration.yaml
            - $STATE_DIR/traefik/mtls:/etc/traefik/mtls/
            - $STATE_DIR/traefik_logs:/var/log/traefik/
            - dockerproxy:/socket/:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.api.rule=Host(`traefik.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.api.entryPoints=websecure"
            - "traefik.http.routers.api.service=api@internal"
            - "traefik.http.routers.api.tls.certresolver=le"
            - "traefik.http.routers.api.tls=true"
            - "traefik.http.routers.api.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.middlewares.crowdsec.plugin.bouncer.enabled=true"
            - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdseclapikey=$CROWDSEC_BOUNCER_KEY"
            - "traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecappsecenabled=true"
            - "traefik.http.middlewares.crowdsec.plugin.bouncer.forwardedheaderstrustedips=172.19.0.1"
        restart: unless-stopped
        networks:
            - traefik
        logging: *logging

    crowdsec:
        image: crowdsecurity/crowdsec:latest
        container_name: crowdsec
        environment:
            GID: "${GID-1000}"
            COLLECTIONS: "crowdsecurity/linux crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
            BOUNCER_KEY_TRAEFIK: "$CROWDSEC_BOUNCER_KEY"
        volumes:
            - $STATE_DIR/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
            - $STATE_DIR/crowdsec/db:/var/lib/crowdsec/data/
            - $STATE_DIR/crowdsec/config:/etc/crowdsec/
            - $STATE_DIR/traefik_logs:/var/log/traefik/:ro
            - $STATE_DIR/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
            - $STATE_DIR/crowdsec/notifications-http.yaml:/etc/crowdsec/notifications/http.yaml:ro
        networks:
            - traefik
        restart: unless-stopped
        logging: *logging
    crowdsec-dashboard:
        image: metabase/metabase
        container_name: crowdsec-dashboard
        depends_on:
            - crowdsec
            - traefik
        restart: unless-stopped
        environment:
            MB_DB_FILE: /data/metabase.db
            MGID: "${GID-1000}"
        networks:
            - traefik
        volumes:
            - $STATE_DIR/crowdsec/dashboard-db:/data # Bootstrap dashboard DB from https://crowdsec-statics-assets.s3-eu-west-1.amazonaws.com/metabase_sqlite.zip
            - $STATE_DIR/crowdsec/db:/metabase-data/
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.crowdsec-dashboard.rule=Host(`crowdsec.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.crowdsec-dashboard.entrypoints=websecure"
            - "traefik.http.routers.crowdsec-dashboard.tls.certresolver=le"
            - "traefik.http.routers.crowdsec-dashboard.tls=true"
            - "traefik.http.routers.crowdsec-dashboard.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.crowdsec-dashboard.loadbalancer.server.port=3000"
        logging: *logging

    # Beszel - Local resource monitoring
    beszel:
        image: henrygd/beszel:latest
        container_name: beszel
        restart: unless-stopped
        depends_on:
            traefik:
                condition: service_started
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - $STATE_DIR/beszel:/beszel_data
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.beszel.rule=Host(`beszel.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.beszel.entrypoints=websecure"
            - "traefik.http.routers.beszel.tls.certresolver=le"
            - "traefik.http.routers.beszel.tls=true"
            - "traefik.http.routers.beszel.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.beszel.loadbalancer.server.port=8090"
        logging: *logging
    beszel-agent:
        image: henrygd/beszel-agent:latest
        container_name: beszel-agent
        restart: unless-stopped
        network_mode: host
        depends_on:
            - dockerproxy
        environment:
            PORT: 45876
            DOCKER_HOST: "unix:///socket/docker.sock"
            LOG_LEVEL: "debug"
            # ${BESZEL_ENV_VARS} # DO NOT REMOVE, THIS IS REPLACED BY envsubst
        volumes:
            - dockerproxy:/socket/:ro
        logging: *logging

    # OpenCanary - Honeypot
    opencanary:
        container_name: opencanary
        image: thinkst/opencanary
        restart: unless-stopped
        volumes:
            - $STATE_DIR/opencanary/opencanary.json:/root/.opencanary.conf
            # - /var/log/samba-audit.log:/var/log/samba-audit.log
        networks:
            - traefik
        ports:
            - "21:21"
            - "3306:3306"
            - "5000:5000"
            - "8082:8082"
            - "9418:9418"
        logging: *logging

    # File Browser
    # filebrowser:
    #     container_name: filebrowser
    #     image: filebrowser/filebrowser
    #     restart: unless-stopped
    #     depends_on:
    #         - traefik
    #     user: "1000:1000"
    #     volumes:
    #         - $MAIN_PARENT_DIR:/srv
    #         - $STATE_DIR/filebrowser/database:/database
    #         - $STATE_DIR/filebrowser/config:/config
    #     labels:
    #         - "traefik.enable=true"
    #         - "traefik.http.routers.filebrowser.rule=Host(`files.$SERVICES_DOMAIN`)"
    #         - "traefik.http.routers.filebrowser.entrypoints=websecure"
    #         - "traefik.http.routers.filebrowser.tls.certresolver=le"
    #         - "traefik.http.routers.filebrowser.tls=true"
    #         - "traefik.http.routers.filebrowser.tls.options=mtls@file"
    #         - "traefik.http.routers.filebrowser.middlewares=authelia@docker,geoblock@file"
    #         - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
    #     networks:
    #         - traefik
    #     healthcheck:
    #         test: ["CMD", "sh", "-c", "wget -qO - http://localhost:80/health | grep -q OK"]
    #         interval: 30s
    #         timeout: 20s
    #         retries: 3
    #     logging: *logging

    # Jellyfin - TV Streaming
    jellyfin:
        container_name: jellyfin
        image: jellyfin/jellyfin
        depends_on:
            - traefik
        user: "1000:1000"
        volumes:
            - "$MAIN_PARENT_DIR/Main/Media/TV:/media/TV"
            - "$MAIN_PARENT_DIR/Main/Media/YouTube:/media/YouTube"
            - $STATE_DIR/jellyfin/config:/config
            - $STATE_DIR/jellyfin/cache:/cache
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.jellyfin.rule=Host(`tv.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.jellyfin.entrypoints=websecure"
            - "traefik.http.routers.jellyfin.tls.certresolver=le"
            - "traefik.http.routers.jellyfin.tls=true"
            - "traefik.http.routers.jellyfin.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.middlewares.jellyfin.ratelimit.average=50"
            - "traefik.http.middlewares.jellyfin.ratelimit.burst=25"
        ports:
            - 127.0.0.1:8096:8096
        networks:
            - traefik
        logging: *logging

    # Ntfy - Push Notifications
    ntfy:
        image: binwiederhier/ntfy
        container_name: ntfy
        user: "1000:1000"
        depends_on:
            - traefik
        command:
            - "serve"
            - "-d"
        volumes:
            - $STATE_DIR/ntfy/cache:/var/cache/ntfy
            - $STATE_DIR/ntfy/etc:/etc/ntfy
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.ntfy.rule=Host(`ntfy.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.ntfy.entrypoints=websecure"
            - "traefik.http.routers.ntfy.tls.certresolver=le"
            - "traefik.http.routers.ntfy.tls=true"
            - "traefik.http.routers.ntfy.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.ntfy.loadbalancer.server.port=80"
        networks:
            - traefik
        logging: *logging

    # D$CPLN - Monthly/Weekly Budget
    dscpln:
        container_name: dscpln
        image: imranrdev/dscpln
        depends_on:
            - traefik
            - ntfy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.dscpln.rule=Host(`dscpln.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.dscpln.entrypoints=websecure"
            - "traefik.http.routers.dscpln.tls.certresolver=le"
            - "traefik.http.routers.dscpln.tls=true"
            - "traefik.http.routers.dscpln.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.dscpln.loadbalancer.server.port=3300"
        volumes:
            - "$MAIN_PARENT_DIR/Main/Notes/Transactions:/Transactions"
        environment:
            - "TEXTFILE_DATA_PROVIDER_DATA_PATH=/Transactions/Acc 2026.md"
            - MONTHLY_LIMIT_NTFY_URL=https://ntfy.$SERVICES_DOMAIN/${MAIN_NODE_HOSTNAME_LOWERCASE}_services_dscpln
            - WEEKLY_LIMIT_NTFY_URL=https://ntfy.$SERVICES_DOMAIN/${MAIN_NODE_HOSTNAME_LOWERCASE}_services_dscpln
            - NTFY_TOKEN=$NTFY_SERVICE_USER_TOKEN
            - TEXTFILE_BUDGET_INIT_AMT=2400
            - TEXTFILE_FIRST_WEEK_BIAS_INIT_AMT=1400
        networks:
            - traefik
        restart: unless-stopped
        logging: *logging

    # Immich - Gallery
    immich-server:
        container_name: immich-server
        image: ghcr.io/immich-app/immich-server:release
        extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/hardware-transcoding
            file: $STATE_DIR/immich/hwaccel.transcoding.yml
            service: vaapi # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
        user: 1000:1000
        volumes:
            - $STATE_DIR/immich/upload:/usr/src/app/upload
            - /etc/localtime:/etc/localtime:ro
            - "$MAIN_PARENT_DIR/Main/Media/Camera:/mnt/media/ext-media/Camera:ro"
            - "$MAIN_PARENT_DIR/Main/Media/Creative:/mnt/media/ext-media/Creative:ro"
            - "$MAIN_PARENT_DIR/Main/Media/Drawings:/mnt/media/ext-media/Drawings:ro"
            - "$MAIN_PARENT_DIR/Main/Media/Game Media:/mnt/media/ext-media/Game Media:ro"
            - "$MAIN_PARENT_DIR/Main/Media/Recordings:/mnt/media/ext-media/Recordings:ro"
            - "$MAIN_PARENT_DIR/Main/Media/Screenshots:/mnt/media/ext-media/Screenshots:ro"            
        environment:
            - UPLOAD_LOCATION=$STATE_DIR/immich-upload
            - DB_HOSTNAME=immich-database
            - REDIS_HOSTNAME=immich-redis
            - DB_PASSWORD=$IMMICH_DB_PASSWORD
            - DB_USERNAME=postgres
            - DB_DATABASE_NAME=immich
        depends_on:
            - immich-redis
            - immich-database
        restart: always
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.immich.rule=Host(`immich.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.immich.entrypoints=websecure"
            - "traefik.http.routers.immich.tls.certresolver=le"
            - "traefik.http.routers.immich.tls=true"
            - "traefik.http.routers.immich.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.immich.loadbalancer.server.port=2283"
        logging: *logging
    immich-machine-learning:
        container_name: immich-machine-learning
        # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
        # Example tag: release-cuda
        image: ghcr.io/immich-app/immich-machine-learning:release # TODO: https://github.com/immich-app/immich/issues/27387
        # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
        #     file: $STATE_DIR/immich/hwaccel.ml.yml
        #     service: rocm # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
        volumes:
            - immich-model-cache:/cache
        environment:
            - UPLOAD_LOCATION=$STATE_DIR/immich-upload
            - DB_HOSTNAME=immich-database
            - REDIS_HOSTNAME=immich-redis
            - DB_PASSWORD=$IMMICH_DB_PASSWORD
            - DB_USERNAME=postgres
            - DB_DATABASE_NAME=immich
        restart: always
        networks:
            - traefik
        logging: *logging
    immich-redis:
        container_name: immich-redis
        image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
        healthcheck:
            test: redis-cli ping || exit 1
        restart: always
        networks:
            - traefik
        logging: *logging
    immich-database:
        container_name: immich-postgres
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        environment:
            POSTGRES_PASSWORD: $IMMICH_DB_PASSWORD
            POSTGRES_USER: postgres
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: '--data-checksums'
        volumes:
            - $STATE_DIR/immich/postgres:/var/lib/postgresql/data
        shm_size: 128mb
        restart: always
        networks:
            - traefik
        logging: *logging

    # Service Uptime
    uptime:
        container_name: uptime
        image: louislam/uptime-kuma:latest
        restart: unless-stopped
        depends_on:
            - traefik
        environment:
            - PUID=1000
            - PGID=1000
        volumes:
            - $STATE_DIR/uptime:/app/data/
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.uptime.rule=Host(`uptime.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.uptime.entrypoints=websecure"
            - "traefik.http.routers.uptime.tls.certresolver=le"
            - "traefik.http.routers.uptime.tls=true"
            - "traefik.http.routers.uptime.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.uptime.loadbalancer.server.port=3001"
        networks:
            - traefik
        logging: *logging

    # Navidrome - Music Streaming
    navidrome:
        container_name: navidrome
        image: deluan/navidrome:latest
        user: 1000:1000
        depends_on:
            - traefik
        restart: unless-stopped
        volumes:
            - "$STATE_DIR/navidrome/data:/data"
            - "$MAIN_PARENT_DIR/Main/Media/Music:/music:ro"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.navidrome.rule=Host(`music.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.navidrome.entrypoints=websecure"
            - "traefik.http.routers.navidrome.tls.certresolver=le"
            - "traefik.http.routers.navidrome.tls=true"
            - "traefik.http.routers.navidrome.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
        networks:
            - traefik
        logging: *logging

    # oPodSync - Podcast Sync
    opodsync:
        container_name: opodsync
        image: ganeshlab/opodsync:latest
        user: 1000:1000
        depends_on:
            - traefik
        restart: unless-stopped
        volumes:
            - "$STATE_DIR/opodsync:/var/www/server/data"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.opodsync.rule=Host(`opodsync.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.opodsync.entrypoints=websecure"
            - "traefik.http.routers.opodsync.tls.certresolver=le"
            - "traefik.http.routers.opodsync.tls=true"
            - "traefik.http.routers.opodsync.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.opodsync.loadbalancer.server.port=8080"
        networks:
            - traefik
        logging: *logging

    freshrss:
        image: freshrss/freshrss:latest
        container_name: freshrss
        restart: unless-stopped
        depends_on:
            - traefik
        volumes:
            - $STATE_DIR/freshrss/data:/var/www/FreshRSS/data
            - $STATE_DIR/freshrss/extensions:/var/www/FreshRSS/extensions
        environment:
            # A timezone http://php.net/timezones (default is UTC)
            TZ: US/Eastern
            # Cron job to refresh feeds at specified minutes
            CRON_MIN: "2,32"
            # Optional 'development' for additional logs; default is 'production'
            FRESHRSS_ENV: development
            # Optional parameter, remove for automatic settings, set to 0 to disable,
            # or (if you use a proxy) to a space-separated list of trusted IP ranges
            # compatible with https://httpd.apache.org/docs/current/mod/mod_remoteip.html#remoteipinternalproxy
            # This impacts which IP address is logged (X-Forwarded-For or REMOTE_ADDR).
            # This also impacts external authentication methods;
            # see https://freshrss.github.io/FreshRSS/en/admins/09_AccessControl.html
            TRUSTED_PROXY: 172.19.0.0/16
            # Optional auto-install parameters (the Web interface install is recommended instead):
            # ⚠️ Parameters below are only used at the very first run (so far).
            # So if changes are made (or in .env file), first delete the service and volumes.
            # ℹ️ All the --db-* parameters can be omitted if using built-in SQLite database.
            FRESHRSS_INSTALL: |-
                --api-enabled
                --base-url https://rss.$SERVICES_DOMAIN
                --default-user admin
                --language en
            FRESHRSS_USER: |-
                --api-password $FRESHRSS_ADMIN_API_PASSWORD
                --email $DOMAIN_OWNER_EMAIL
                --language en
                --password $FRESHRSS_ADMIN_PASSWORD
                --user admin
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.freshrss.rule=Host(`rss.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.freshrss.entrypoints=websecure"
            - "traefik.http.routers.freshrss.tls.certresolver=le"
            - "traefik.http.routers.freshrss.tls=true"
            - "traefik.http.routers.freshrss.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.freshrss.loadbalancer.server.port=80"
        networks:
            - traefik
        logging: *logging

    # Home Assistant + MQTT
    homeassistant:
        container_name: homeassistant
        image: ghcr.io/home-assistant/home-assistant:stable
        volumes:
            - $STATE_DIR/homeassistant:/config/
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
        restart: unless-stopped
        privileged: true
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.homeassistant.rule=Host(`ha.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.homeassistant.entrypoints=websecure"
            - "traefik.http.routers.homeassistant.tls.certresolver=le"
            - "traefik.http.routers.homeassistant.tls=true"
            - "traefik.http.routers.homeassistant.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
        logging: *logging
    mosquitto:
        image: eclipse-mosquitto:openssl
        container_name: mosquitto
        ports:
            - 8883:8883
            - 9001:9001
        volumes:
            - $STATE_DIR/mosquitto/config:/mosquitto/config
            - $STATE_DIR/mosquitto/data:/mosquitto/data
            - $STATE_DIR/mosquitto/log:/mosquitto/log
        command: mosquitto -c /mosquitto/config/mosquitto.conf
        restart: unless-stopped
        networks:
            - traefik
        logging: *logging

    # LLMs
    ollama:
        image: ollama/ollama:rocm
        container_name: ollama
        volumes:
            - ollama:/root/.ollama
        networks:
            - traefik
        tty: true
        restart: unless-stopped
        devices:
            - "/dev/kfd:/dev/kfd" # Required for AMD GPU support
            - "/dev/dri:/dev/dri" # Required for AMD GPU support
        logging: *logging
    ollama-webui:
        image: ghcr.io/open-webui/open-webui:main
        container_name: ollama-webui
        environment:
            - OLLAMA_BASE_URL=http://ollama:11434
            - WEBUI_URL=https://gpt.${SERVICES_DOMAIN}
            - ENABLE_OAUTH_SIGNUP=true
            - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
            - OAUTH_CLIENT_ID=open-webui
            - OAUTH_CLIENT_SECRET=${OPEN_WEBUI_OAUTH_CLIENT_SECRET}
            - OPENID_PROVIDER_URL=https://auth.${SERVICES_DOMAIN}/.well-known/openid-configuration
            - OAUTH_PROVIDER_NAME=Authelia
            - OAUTH_SCOPES=openid email profile groups
            - ENABLE_OAUTH_ROLE_MANAGEMENT=true
            - OAUTH_ALLOWED_ROLES=admins,dev,family
            - OAUTH_ADMIN_ROLES=admins
            - OAUTH_ROLES_CLAIM=groups
        volumes:
            - ollama-webui:/app/backend/data
        networks:
            - traefik
        depends_on:
            - ollama
            - traefik
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.ollama-webui.rule=Host(`gpt.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.ollama-webui.entrypoints=websecure"
            - "traefik.http.routers.ollama-webui.tls.certresolver=le"
            - "traefik.http.routers.ollama-webui.tls=true"
            - "traefik.http.routers.ollama-webui.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.services.ollama-webui.loadbalancer.server.port=8080"
        logging: *logging

    # CalDAV/CardDAV Server
    nextcloud:
        image: nextcloud
        container_name: nextcloud
        volumes:
            - $STATE_DIR/nextcloud/data:/var/www/html
        networks:
            - traefik
        depends_on:
            - traefik
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.nextcloud.entrypoints=websecure"
            - "traefik.http.routers.nextcloud.middlewares=authelia@docker"
            - "traefik.http.routers.nextcloud.tls.certresolver=le"
            - "traefik.http.routers.nextcloud.tls=true"
            - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
        deploy:
            resources:
                limits:
                    cpus: '0.1'
        logging: *logging

    # Link Sharing
    shlink:
        image: shlinkio/shlink:stable
        container_name: shlink
        environment:
            - SHORT_DOMAIN_HOST=ln.$SERVICES_DOMAIN
            - SHORT_DOMAIN_SCHEMA=https
            - DB_DRIVER=postgres
            - DB_HOST=shlink_db
            - DB_USER=postgres
            - DB_PASSWORD=$SHLINK_DB_PASSWORD
            - INITIAL_API_KEY=$SHLINK_API_KEY
            - GEOLITE_LICENSE_KEY=$GEOLITE_LICENSE_KEY
        networks:
            - traefik
        depends_on:
            - traefik
            - shlink_db
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.shlink.rule=Host(`ln.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.shlink.entrypoints=websecure"
            - "traefik.http.routers.shlink.middlewares=authelia@docker"
            - "traefik.http.routers.shlink.tls.certresolver=le"
            - "traefik.http.routers.shlink.tls=true"
            - "traefik.http.services.shlink.loadbalancer.server.port=8080"
        logging: *logging
    shlink_db:
        image: postgres:17-alpine
        container_name: shlink_db
        restart: unless-stopped
        volumes:
            - $STATE_DIR/shlink/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=$SHLINK_DB_PASSWORD
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            start_period: 1m
        networks:
            - traefik
        user: 1000:1000
        logging: *logging
    shlink-web-client:
        image: shlinkio/shlink-web-client:stable
        container_name: shlink-web-client
        environment: # Important: Only pre-configure a server if the app is behind Authelia
            - SHLINK_SERVER_URL=https://ln.$SERVICES_DOMAIN
            - SHLINK_SERVER_NAME=ln.$SERVICES_DOMAIN
            - SHLINK_SERVER_API_KEY=$SHLINK_API_KEY # Will be made available to client browser
        networks:
            - traefik
        depends_on:
            - traefik
            - shlink
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.shlink-web-client.rule=Host(`ui.ln.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.shlink-web-client.entrypoints=websecure"
            - "traefik.http.routers.shlink-web-client.middlewares=authelia@docker,geoblock@file"
            - "traefik.http.routers.shlink-web-client.tls.certresolver=le"
            - "traefik.http.routers.shlink-web-client.tls=true"
            - "traefik.http.services.shlink-web-client.loadbalancer.server.port=8080"
        logging: *logging

    # Find My Device Server
    fmd:
        image: registry.gitlab.com/fmd-foss/fmd-server:latest
        container_name: fmd
        volumes:
            - $STATE_DIR/fmd/db:/var/lib/fmd-server/db/
        networks:
            - traefik
        depends_on:
            - traefik
        restart: unless-stopped
        environment:
            - FMD_REGISTRATIONTOKEN=$FMD_REGISTRATIONTOKEN
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.fmd.rule=Host(`fmd.$SERVICES_DOMAIN`)"
            - "traefik.http.routers.fmd.entrypoints=websecure"
            - "traefik.http.routers.fmd.middlewares=authelia@docker"
            - "traefik.http.routers.fmd.tls.certresolver=le"
            - "traefik.http.routers.fmd.tls=true"
            - "traefik.http.services.fmd.loadbalancer.server.port=8080"
        logging: *logging

networks:
    traefik:
        ipam:
            config:
                - subnet: 172.19.0.0/16

volumes:
    logtfy_tmp: {}
    ollama: {}
    ollama-webui: {} # Decided not to bind mount this
    navidrome-cache: {}
    immich-model-cache: {}
    dockerproxy:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
    dockerproxy_priv:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
