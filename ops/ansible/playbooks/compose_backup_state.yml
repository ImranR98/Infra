---
# compose_backup_state.yml — tar the compose runtime state via an Alpine
# container (skips FIFOs/sockets), prune to BACKUP_RETENTION (default 1).
# Local:   ansible-playbook compose_backup_state.yml -l <target>
# Remote:  -e 'backup_remote=user@host:path' (streams the tar back over SSH into
#          compose_state_backups/<target>-backup-<ts>.tar)
- name: Backup compose state
  hosts: all
  gather_facts: false

  vars:
    infra_root: "{{ playbook_dir }}/../../.."
    backup_retention: "{{ lookup('env', 'BACKUP_RETENTION') | default(1, true) }}"

  tasks:
    - name: Local backup archive
      ansible.builtin.shell: |
        set -e
        root="{{ infra_root }}"
        d="$root/current_target/compose_live_state"
        [ -d "$d" ] || { echo "Error: state directory not found: $d" >&2; exit 1; }
        mkdir -p "$root/compose_state_backups"
        out="$root/compose_state_backups/{{ inventory_hostname }}-backup-$(date +%Y%m%d_%H%M%S).tar"
        umask 0077
        docker run --rm --log-driver none -v "$d":/backup/state:ro alpine \
          sh -c 'apk add --no-cache tar >/dev/null && find /backup/state \( -type f -o -type d -o -type l \) -print0 | tar cf - --null -T - --sparse --ignore-failed-read --warning=no-file-changed --warning=no-file-removed' > "$out"
        echo "Backup created: $out"
        ls -1t "$root/compose_state_backups"/{{ inventory_hostname }}-backup-*.tar 2>/dev/null \
          | tail -n +{{ backup_retention | int + 1 }} | xargs -r rm -f
      changed_when: true
      become: true  # docker socket is sudo-only on the nodes (see AGENTS.md)
      when: backup_remote | default('') == ''

    - name: Remote backup (SSH stream)
      ansible.builtin.shell: |
        set -e
        remote="{{ backup_remote }}"
        host="${remote%%:*}"; path="${remote#*:}"
        out="{{ infra_root }}/compose_state_backups/{{ inventory_hostname }}-backup-$(date +%Y%m%d_%H%M%S).tar"
        umask 0077
        ssh -T "$host" "cd '$path' && docker run --rm --log-driver none -v \$PWD/current_target/compose_live_state:/backup/state:ro alpine sh -c 'apk add --no-cache tar >/dev/null && find /backup/state \( -type f -o -type d -o -type l \) -print0 | tar cf - --null -T - --sparse --ignore-failed-read --warning=no-file-changed --warning=no-file-removed'" > "$out"
        echo "Backup created: $out"
      delegate_to: localhost
      changed_when: true
      when: backup_remote | default('') != ''
