---
# compose_install.yml — render templates + start the Compose stack for one target.
# Usage: ansible-playbook ops/ansible/playbooks/compose_install.yml -l <target>
- name: Install compose stack
  hosts: all
  gather_facts: true

  vars:
    infra_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Detect optional files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ infra_root }}/targets/{{ inventory_hostname }}/VARS.template.yml"
        - "{{ infra_root }}/targets/{{ inventory_hostname }}/compose/compose.private.yaml"
      register: _optional

    - name: Set availability facts
      ansible.builtin.set_fact:
        compose_has_vars_template: "{{ _optional.results[0].stat.exists }}"
        compose_private_exists: "{{ _optional.results[1].stat.exists }}"

    - name: Compose render + environment
      ansible.builtin.include_role:
        name: compose
      vars:
        compose_infra_root: "{{ infra_root }}"

    - name: Compose up
      ansible.builtin.command:
        cmd: docker compose -p {{ inventory_hostname }} {{ compose_files | join(' ') }} up -d --remove-orphans
      environment: "{{ compose_env }}"
      changed_when: true
      tags: [up]
      become: true  # docker socket is sudo-only on the nodes (see AGENTS.md)
