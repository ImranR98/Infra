---
# Join a node to the cluster. Run ON the control plane (this playbook's
# localhost must be the server): the token is read from the control plane and
# passed to the installer via environment only — never written to disk or logs.
# Usage: ansible-playbook ops/ansible/playbooks/k3s_join.yml \
#          -e node_ip=192.168.1.50 -e node_user=myuser \
#          [-e k3s_role=agent|server] [-e k3s_amdgpu_mode=auto|yes|no]
#          [-e k3s_scheduling_discouraged=true] [-e k3s_longhorn_replicas=true]

- name: Collect join information from the control plane
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  tasks:
    - name: Validate join arguments
      ansible.builtin.assert:
        that:
          - node_ip | default('') | regex_search('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - node_user | default('') | regex_search('^[a-zA-Z0-9_-]+$')
          - k3s_role | default('agent') in ['agent', 'server']
          - k3s_amdgpu_mode | default('auto') in ['auto', 'yes', 'no']
        fail_msg: "Usage: -e node_ip=<ipv4> -e node_user=<user> [-e k3s_role=agent|server] [-e k3s_amdgpu_mode=auto|yes|no]"

    - name: Read the K3s server token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      register: k3s_join_token_raw
      no_log: true

    - name: Expose join facts
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_join_token_raw.content | b64decode | trim }}"
        k3s_server_url: "https://{{ ansible_default_ipv4.address }}:6443"
      no_log: true

    - name: Register the joining node in the play inventory
      ansible.builtin.add_host:
        name: node
        ansible_host: "{{ node_ip }}"
        ansible_user: "{{ node_user }}"

- name: Provision the joining node
  hosts: node
  gather_facts: true
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    k3s_token: "{{ hostvars['localhost'].k3s_token }}"
    k3s_server_url: "{{ hostvars['localhost'].k3s_server_url }}"
  roles:
    - k3s_prepare
    - k3s_install

- name: Wait for the node to register and configure it
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    k3s_join_ip: "{{ node_ip }}"
    k3s_joined: true
  tasks:
    - name: Wait for the joining node to appear and become Ready
      ansible.builtin.shell: |
        set -o pipefail
        name=$(kubectl get nodes -o json | jq -r --arg ip "{{ k3s_join_ip }}" \
          '.items[] | select((.status.addresses // []) | any(.address == $ip)) | .metadata.name' | awk 'NR==1')
        [ -n "$name" ] || exit 1
        kubectl get node "$name" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep True >/dev/null
        echo "$name"
      register: k3s_join_node_wait
      until: k3s_join_node_wait.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Configure the joined node
      ansible.builtin.include_role:
        name: k3s_configure
      vars:
        k3s_node_name: "{{ k3s_join_node_wait.stdout_lines | last }}"
