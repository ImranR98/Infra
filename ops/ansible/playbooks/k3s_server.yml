---
# Bootstrap this machine as the K3s control plane (cluster-init).
# Usage: ansible-playbook ops/ansible/playbooks/k3s_server.yml  (run ON the node, no args)
- name: Bootstrap the K3s control-plane node
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars:
    k3s_role: server
    k3s_cluster_init: true
  roles:
    - k3s_prepare
    - k3s_install
    - k3s_configure
