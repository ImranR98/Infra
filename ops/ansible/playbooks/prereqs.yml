---
# Install system prerequisites: packages, the pinned Task binary, Docker
# (official bootstrap), and the Ansible collections.
# Usage: ansible-playbook ops/ansible/playbooks/prereqs.yml  (run on the machine
# to prepare; bootstraps ansible-core via the package manager first when missing).
- name: Install system prerequisites
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  roles:
    - prereqs
