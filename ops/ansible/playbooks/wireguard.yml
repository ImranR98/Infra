---
# Install wireguard-tools and deploy a wg0 config (split-/1 AllowedIPs,
# endpoint /32 dead-loop fixes, restart drop-in). Run via
# Usage: ansible-playbook ops/ansible/playbooks/wireguard.yml #          -e wireguard_conf_src=$(readlink -f /path/to/wg0.conf)
- name: Install WireGuard and deploy the wg0 configuration
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  roles:
    - wireguard
