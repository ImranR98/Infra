---
# Deploy a WireGuard client config from an existing wg0.conf (e.g. from a VPN
# provider) via the githubixx.ansible_role_wireguard community role. The
# provider conf is parsed into role variables; AllowedIPs are rewritten to
# split-/1 routes (less specific than LAN/K3s subnets, so local traffic stays
# direct) and an endpoint /32 route via the physical gateway avoids a dead
# loop (the endpoint lives inside the /1).
# Usage: ansible-playbook ops/ansible/playbooks/wireguard.yml \
#          -e wireguard_conf_src=$(readlink -f /path/to/wg0.conf)
- name: Deploy WireGuard from a provider wg0.conf
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  tasks:
    - name: Config source required
      ansible.builtin.assert:
        that: wireguard_conf_src | default('') | length > 0
        fail_msg: "wireguard_conf_src required — pass the wg0.conf path with -e"

    - name: Read the WireGuard config
      ansible.builtin.slurp:
        src: "{{ wireguard_conf_src }}"
      register: _wg_conf

    # Keys are parsed in-memory; values are never echoed.
    - name: Parse the WireGuard config
      ansible.builtin.set_fact:
        _wg_text: "{{ _wg_conf.content | b64decode }}"
        _wg_private_key: "{{ _wg_text | regex_findall('^PrivateKey\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_addresses: "{{ _wg_text | regex_findall('^Address\\s*=\\s*(.+)$', multiline=True) | map('trim') | list }}"
        _wg_dns: "{{ _wg_text | regex_findall('^DNS\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_mtu: "{{ _wg_text | regex_findall('^MTU\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_fwmark: "{{ _wg_text | regex_findall('^FwMark\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_keepalive: "{{ _wg_text | regex_findall('^PersistentKeepalive\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_peer_public_key: "{{ _wg_text | regex_findall('^PublicKey\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_peer_preshared_key: "{{ _wg_text | regex_findall('^PresharedKey\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_endpoint: "{{ _wg_text | regex_findall('^Endpoint\\s*=\\s*(.+)$', multiline=True) | first | default('') | trim }}"
        _wg_endpoint_ip: >-
          {{ (_wg_text | regex_findall('^Endpoint\\s*=\\s*([0-9]+(\\.[0-9]+){3})', multiline=True)
              | first | default([]))[0] | default('') }}

    - name: Read the physical default gateway
      ansible.builtin.shell: |
        set -o pipefail
        ip route show default 2>/dev/null | awk '{print $3; exit}'
      register: _gateway
      changed_when: false
      failed_when: false

    - name: Set the WireGuard role facts
      ansible.builtin.set_fact:
        wireguard_private_key: "{{ _wg_private_key }}"
        wireguard_addresses: "{{ _wg_addresses }}"
        wireguard_unmanaged_peers: >-
          {{ {'provider': {'public_key': _wg_peer_public_key,
                           'allowed_ips': '0.0.0.0/1, 128.0.0.0/1',
                           'endpoint': _wg_endpoint}
             | combine({'preshared_key': _wg_peer_preshared_key} if _wg_peer_preshared_key | length > 0 else {})
             | combine({'persistent_keepalive': _wg_keepalive} if _wg_keepalive | length > 0 else {})} }}

    - name: WireGuard DNS
      ansible.builtin.set_fact:
        wireguard_dns: "{{ _wg_dns }}"
      when: _wg_dns | length > 0

    - name: WireGuard MTU
      ansible.builtin.set_fact:
        wireguard_mtu: "{{ _wg_mtu }}"
      when: _wg_mtu | length > 0

    - name: WireGuard FwMark
      ansible.builtin.set_fact:
        wireguard_fwmark: "{{ _wg_fwmark }}"
      when: _wg_fwmark | length > 0

    - name: Endpoint dead-loop routes
      ansible.builtin.set_fact:
        wireguard_postup: ["ip route add {{ _wg_endpoint_ip }}/32 via {{ _gateway.stdout }}"]
        wireguard_predown: ["ip route delete {{ _wg_endpoint_ip }}/32 via {{ _gateway.stdout }} || true"]
      when: _wg_endpoint_ip | length > 0 and _gateway.stdout | length > 0

    - name: Deploy WireGuard via the community role
      ansible.builtin.include_role:
        name: githubixx.ansible_role_wireguard
