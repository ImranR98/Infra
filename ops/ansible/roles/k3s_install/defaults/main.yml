---
# Installer download and verification. The default mode preserves the exact
# dual-source cross-check the old bash used: SHA256 of the get.k3s.io download
# must match a fresh fetch of the upstream install.sh from GitHub main. Setting
# k3s_installer_sha256 pins an explicit expected hash instead (opt-in, avoids
# manual bumps by default — see AGENTS.md "accepted tradeoffs").
k3s_installer_url: https://get.k3s.io
k3s_installer_hash_source_url: https://github.com/k3s-io/k3s/raw/main/install.sh
k3s_installer_sha256: ""   # optional pin; empty = dual-source cross-check

# Re-running provision on an installed node is a no-op unless forced — this
# keeps provisioning from fighting system-upgrade-controller's version
# ownership (the old setup.sh re-ran the installer unconditionally).
k3s_force_reinstall: false

k3s_server_url: ""         # https://<server-ip>:6443, supplied by k3s_join.yml
k3s_token: ""              # supplied by k3s_join.yml; never written to disk

k3s_wait_timeout_secs: 150
