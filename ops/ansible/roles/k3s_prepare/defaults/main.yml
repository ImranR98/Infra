---
# Cluster policy defaults for K3s node preparation. These are deliberately
# identical to the values the previous bash provisioning (commands/k3s/setup.sh
# and join.sh) hardcoded. Nothing host-specific lives here — per-run values
# (role, IP, user, node options) come from `task srv0:k3s:provision` arguments.

k3s_role: agent

# Server-only
k3s_cluster_init: false
k3s_flannel_backend: wireguard-native
k3s_flannel_iface_regex: "^(eth|ens|enp|eno|enx|wlan|wlp|wlo|bond|ib)"
k3s_server_node_labels:
  - "hostpath-main=true"
  - "hostpath-extra-storage=true"
  - "external-exposed=true"

# Both roles
k3s_selinux: true
k3s_write_kubeconfig_mode: "0640"
k3s_node_ip: ""            # empty = auto-detect from the default route
k3s_admin_user: "{{ ansible_user }}"

# Agent-only node options (declarative replacement for the old join prompts)
k3s_amdgpu_mode: auto      # auto = detect via lspci, yes = force, no = disable
k3s_scheduling_discouraged: false
k3s_longhorn_replicas: false

k3s_sysctl_conf: /etc/sysctl.d/90-k3s.conf
k3s_sysctl_settings:
  fs.inotify.max_user_watches: 6000000
  fs.inotify.max_user_instances: 512
  user.max_user_namespaces: 28633

# firewalld (Fedora) — ports go to the default zone, pod/service
# CIDRs go to the trusted zone (same shape as the old configure_k3s_firewall).
k3s_firewalld_ports:
  - 6443/tcp
  - 2379/tcp
  - 2380/tcp
  - 8472/udp
  - 10250/tcp
  - 51820/udp
  - 51821/udp
k3s_firewalld_trusted_sources:
  - 10.42.0.0/16
  - 10.43.0.0/16

# ufw (Debian/Ubuntu)
k3s_ufw_rules:
  - {rule: allow, from_ip: 10.42.0.0/16, direction: in}
  - {rule: allow, from_ip: 10.43.0.0/16, direction: in}
  - {rule: allow, port: 8472, proto: udp}
  - {rule: allow, port: 51820, proto: udp}
  - {rule: allow, port: 6443, proto: tcp}
  - {rule: allow, port: 10250, proto: tcp}
  - {rule: allow, port: 2379, proto: tcp}
  - {rule: allow, port: 2380, proto: tcp}
  - {rule: allow, port: 443, proto: tcp}
