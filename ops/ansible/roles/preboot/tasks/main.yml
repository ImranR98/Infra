---
# Preboot LUKS unlock (dracut-remote-luks-unlock). Two variants:
#   frpc      (srv0): initramfs frpc tunnels SSH via FRPS :8887 (mTLS certs from
#                     the compose render — the srv0 playbook renders first)
#   crypt-ssh (bigpc): dropbear SSH directly on the LAN, patched to
#                     preboot_port (ethernet only)
- name: Check whether the root partition is LUKS-encrypted
  ansible.builtin.shell: |
    root_src=$(findmnt -n -o SOURCE /sysroot 2>/dev/null | sed 's/\[.*//')
    [ -n "$root_src" ] || root_src=$(findmnt -n -o SOURCE / 2>/dev/null | sed 's/\[.*//')
    [ -n "$root_src" ] && [ -b "$root_src" ] && lsblk -s -o TYPE "$root_src" | grep -q crypt
  register: _luks
  changed_when: false
  failed_when: false

- name: Root is not LUKS — skipping preboot setup
  ansible.builtin.debug:
    msg: "Root partition is not LUKS-encrypted. If you add LUKS later, re-run preboot."
  when: _luks.rc != 0

- name: Preboot install
  block:
    - name: Fresh work dir
      ansible.builtin.file:
        path: "{{ preboot_work_dir | default('/tmp/dracut-remote-luks-unlock') }}"
        state: absent

    - name: Clone dracut-remote-luks-unlock
      ansible.builtin.git:
        repo: https://github.com/ImranR98/dracut-remote-luks-unlock.git
        dest: "{{ preboot_work_dir | default('/tmp/dracut-remote-luks-unlock') }}"
        depth: 1

    - name: "crypt-ssh: listen on preboot_port (bigpc direct LAN)"
      ansible.builtin.replace:
        path: "{{ preboot_work_dir | default('/tmp/dracut-remote-luks-unlock') }}/modules/99crypt-ssh/crypt-ssh.conf"
        regexp: '^dropbear_port="22"'
        replace: 'dropbear_port="{{ preboot_port }}"'
      when: preboot_module == 'crypt-ssh'

    - name: Run the setup script (frpc variant)
      ansible.builtin.command: >-
        bash {{ preboot_work_dir | default('/tmp/dracut-remote-luks-unlock') }}/setup.sh
        --frpc-config "{{ preboot_infra_root }}/current_target/compose_live_state/frpc/frpc-preboot.toml"
        --frpc-cert   "{{ preboot_infra_root }}/current_target/compose_live_state/frpc/preboot-client.crt"
        --frpc-key    "{{ preboot_infra_root }}/current_target/compose_live_state/frpc/preboot-client.key"
        --frpc-ca     "{{ preboot_infra_root }}/current_target/compose_live_state/frpc/ca.crt"
        --user        "{{ preboot_user }}"
      become: true
      when: preboot_module == 'frpc'

    - name: Run the setup script (crypt-ssh variant)
      ansible.builtin.command: >-
        bash {{ preboot_work_dir | default('/tmp/dracut-remote-luks-unlock') }}/setup.sh
        --module crypt-ssh
        --user "{{ preboot_user }}"
      become: true
      when: preboot_module == 'crypt-ssh'

    - name: Remove the work dir
      ansible.builtin.file:
        path: "{{ preboot_work_dir | default('/tmp/dracut-remote-luks-unlock') }}"
        state: absent
  when: _luks.rc == 0
