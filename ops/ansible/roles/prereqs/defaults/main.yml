---
# Package lists per distribution. Installed via the `package` module, so the
# tasks stay declarative and idempotent (package presence is checked by the
# module, not by `command -v` loops).
prereqs_task_version: 3.53.1

prereqs_apt_packages:
  - yq
  - jq
  - curl
  - python3
  - golang-go
  - openssl
  - gettext-base
  - python3-dotenv
  - shellcheck
  - ansible-lint
  - yamllint

prereqs_dnf_packages:
  - yq
  - jq
  - curl
  - python3
  - golang
  - openssl
  - gettext
  - python3-dotenv
  - shellcheck
  - ansible-lint
  - yamllint
