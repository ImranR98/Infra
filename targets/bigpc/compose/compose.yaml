x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

services:
    dockerproxy_priv:
        image: wollomatic/socket-proxy:1
        restart: unless-stopped
        read_only: true
        mem_limit: 512M
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges
        user: "65534:$DOCKER_GID"
        healthcheck:
            test: ["CMD", "./healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 2
        logging: *logging
        container_name: dockerproxy_priv
        command:
            - "-loglevel=info"
            - '-allowGET=/v1\..{1,2}/(containers/.*|images/.*)'
            - '-allowPOST=/v1\..{1,2}/(containers/.*|images/.*|networks/.*)'
            - '-allowDELETE=/v1\..{1,2}/(containers/.*|images/.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy_priv:/socket/
        labels:
            - "com.centurylinklabs.watchtower.enable=false"

    watchtower:
        container_name: watchtower
        restart: unless-stopped
        mem_limit: 512M
        image: nickfedor/watchtower
        volumes:
            - dockerproxy_priv:/socket/:ro
        depends_on:
            - dockerproxy_priv
        environment:
            WATCHTOWER_CLEANUP: "true"
            WATCHTOWER_POLL_INTERVAL: 7200
            WATCHTOWER_ROLLBACK: "true"
            DOCKER_HOST: "unix:///socket/docker.sock"
        logging: *logging

    ollama:
        container_name: ollama
        restart: unless-stopped
        # ROCm build needed for the RX 9070. Floating `rocm` tag: watchtower
        # auto-updates ollama while the tag itself can never resolve to a CPU
        # build. No mem_limit — the ROCm runtime and loaded models size freely.
        # Security: OLLAMA_HOST=127.0.0.1 binds loopback INSIDE this netns, so
        # ollama is reachable from nowhere — not bigpc's localhost, not the LAN,
        # not the docker bridge — except the ollama-gate container, which shares
        # this netns. Port 11435 is published only so LAN clients can reach the
        # gate (nginx listens on it inside this same netns).
        image: ollama/ollama:rocm
        privileged: true
        ports:
            - "11435:11435"
        environment:
            - OLLAMA_HOST=127.0.0.1:11434
            # Store root must match the k8s-era layout (blobs/manifests directly
            # under /var/lib/ollama, not /var/lib/ollama/models) so the existing
            # models are picked up without re-downloading.
            - OLLAMA_MODELS=/root/.ollama
        volumes:
            - /var/lib/ollama:/root/.ollama
        logging: *logging

    ollama-gate:
        container_name: ollama-gate
        restart: unless-stopped
        image: nginx:1.27-alpine
        mem_limit: 512M
        # Shares ollama's network namespace: the bearer-token gate is the only
        # thing that can reach ollama (via 127.0.0.1:11434 in the shared netns),
        # and its :11435 listener is the only published entry point.
        network_mode: "container:ollama"
        volumes:
            - $COMPOSE_STATE_DIR/ollama-gate/nginx.conf:/etc/nginx/conf.d/gate.conf:ro
        depends_on:
            - ollama
        labels:
            - "com.centurylinklabs.watchtower.enable=false"
        logging: *logging

    syncthing:
        image: syncthing/syncthing
        container_name: syncthing
        restart: unless-stopped
        mem_limit: 2G
        environment:
            - PUID=$MY_UID
            - PGID=$MY_UID
        volumes:
            - /home/$USER:/var/syncthing
            - /mnt/ssd2:/mnt/ssd2
        network_mode: host
        logging: *logging

volumes:
    dockerproxy_priv:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
