name: bigpc

x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

services:
    syncthing:
        image: syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
        container_name: syncthing
        restart: unless-stopped
        mem_limit: 2G
        # spc_t so files moved into the synced tree with foreign labels stay
        # readable; :Z would bulk-relabel the whole home and still miss later moves.
        security_opt:
            - label=type:spc_t
        environment:
            - PUID=$MY_UID
            - PGID=$MY_UID
            # Loopback-only GUI (the image defaults to 0.0.0.0); use an SSH
            # tunnel to reach it.
            - STGUIADDRESS=127.0.0.1:8384
        volumes:
            - /home/$MY_USERNAME:/var/syncthing
            - /mnt/ssd2:/mnt/ssd2
        network_mode: host
        logging: *logging

    # llama.cpp router server on the RX 9070 (ROCm). The model tree at
    # ~/ai/llama is unchanged, so existing GGUFs and the Models UI cache keep
    # working. The built-in Discover UI downloads into LLAMA_CACHE; only cache
    # models are deletable through the UI. Launching without -m puts the server in router
    # mode. srv0's Traefik reaches this port over the LAN and keeps
    # models.<SERVICES_DOMAIN> behind Authelia; the port is LAN-wide on purpose.
    # Renovate digest-pins server-rocm.
    llama-cpp:
        image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:4bbbd2e33deb54330fd23edde3a2cdf12b05ce4415139c7e8639a9aebbacdcf2
        container_name: llama-cpp
        restart: unless-stopped
        # Model memory, not steady state: one resident model plus --fit headroom
        # for the largest context. Leaves ~18 GiB of the 32 GiB total for the
        # desktop.
        mem_limit: 14G
        memswap_limit: 14G
        user: "$MY_UID:$MY_UID"
        # The K3s Deployment ran with spc_t; /home files are user_home_t.
        security_opt:
            - label=type:spc_t
        devices:
            # KFD + render node; MIGraphX renders through renderD128.
            - /dev/kfd:/dev/kfd
            - /dev/dri:/dev/dri
        command:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            # Cache mode: models downloaded through the built-in UI/API live
            # under LLAMA_CACHE and are the only models the server can delete.
            - "--models-max"
            - "1"
            - "--models-memory-margin"
            - "1024"
            - "--n-gpu-layers"
            - "99"
            # MoE expert tensors dominate the 35B model's file size. Keep the
            # first 24 of 40 layers' experts in system RAM so --fit has room for
            # a large KV cache while attention/dense weights stay on GPU.
            - "--n-cpu-moe"
            - "24"
            - "--flash-attn"
            - "on"
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--no-mmproj-offload"
            - "--jinja"
            - "--parallel"
            - "1"
            # Let each model take the largest context that leaves ~1 GiB free
            # for the desktop; models with a smaller native window cap there.
            - "--fit"
            - "on"
            - "--fit-target"
            - "1792"
            # Never let --fit fall back to its 4k default; 32k is the practical
            # floor for tool-heavy agent sessions.
            - "--fit-ctx"
            - "32768"
            - "--cache-ram"
            - "2048"
            - "--sleep-idle-seconds"
            - "300"
            - "--batch-size"
            - "2048"
            - "--ubatch-size"
            - "512"
            # Enable the built-in Discover/download UI. It is off by default.
            - "--ui-config"
            - '{"enableDiscoverModels": true, "useHuggingFaceHub": true}'
            # The built-in UI is reached through srv0 Traefik at
            # models.<SERVICES_DOMAIN> behind Authelia; restrict browser CORS
            # to that origin.
            - "--cors-origins"
            - "https://models.${SERVICES_DOMAIN:?SERVICES_DOMAIN must be set in config/bigpc/compose.env}"
        environment:
            - HOME=/tmp
            - LLAMA_CACHE=/models
        volumes:
            - /home/$MY_USERNAME/ai/llama:/models
        ports:
            # LAN-wide. Every remote path still goes through srv0 Traefik and
            # Authelia at models.<SERVICES_DOMAIN>.
            - "8080:8080"
        logging: *logging

    # FL0W archive agent for Wine prefixes. FL0W on srv0 reaches it at
    # http://<bigpc-ip>:8788 over the LAN; enrollment is token-gated and
    # allowFrom is the LAN CIDR. The agent archives each Heroic prefix's
    # drive_c/users/steamuser tree for the Wine Game Saves task.
    fl0w-agent:
        image: ghcr.io/imranr98/fl0w-agent:latest@sha256:1ac43219cae0f019a52c9418434aea35d462a0b02fea6423b5f6d56507f6bee0
        container_name: fl0w-agent
        restart: unless-stopped
        network_mode: host
        user: "$MY_UID:$MY_UID"
        security_opt:
            - label=type:spc_t
            - no-new-privileges:true
        cap_drop:
            - ALL
        volumes:
            - ../../../config/bigpc/fl0w-agent/agent.json:/config/agent.json:ro
            - ${COMPOSE_STATE_DIR}/fl0w-agent:/state
            - /home/$MY_USERNAME/Games/Heroic/Prefixes:/data/prefixes:ro
        tmpfs:
            - /tmp
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/healthz"]
            interval: 30s
            timeout: 5s
            retries: 3
        logging: *logging
