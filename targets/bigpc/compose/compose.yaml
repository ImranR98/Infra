name: bigpc

x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

services:
    syncthing:
        image: syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
        container_name: syncthing
        restart: unless-stopped
        mem_limit: 2G
        # spc_t so files moved into the synced tree with foreign labels stay
        # readable; :Z would bulk-relabel the whole home and still miss later moves.
        security_opt:
            - label=type:spc_t
        environment:
            - PUID=$MY_UID
            - PGID=$MY_UID
            # Loopback-only GUI (the image defaults to 0.0.0.0); use an SSH
            # tunnel to reach it.
            - STGUIADDRESS=127.0.0.1:8384
        volumes:
            - /home/$MY_USERNAME:/var/syncthing
            - /mnt/ssd2:/mnt/ssd2
        network_mode: host
        logging: *logging
