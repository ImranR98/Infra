name: pc

x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

x-socket-proxy-priv: &socket-proxy-priv
    image: wollomatic/socket-proxy:1
    restart: unless-stopped
    read_only: true
    mem_limit: 512M
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges
    user: "65534:$DOCKER_GID"
    healthcheck:
        test: ["CMD", "./healthcheck"]
        interval: 10s
        timeout: 5s
        retries: 2
    logging: *logging

services:
    dockerproxy_priv:
        <<: *socket-proxy-priv
        container_name: dockerproxy_priv
        command:
            - "-loglevel=info"
            - '-allowGET=/v1\..{1,2}/(containers/.*|images/.*)'
            - '-allowPOST=/v1\..{1,2}/(containers/.*|images/.*|networks/.*)'
            - '-allowDELETE=/v1\..{1,2}/(containers/.*|images/.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy_priv:/socket/
        labels:
            - "com.centurylinklabs.watchtower.enable=false"

    watchtower:
        container_name: watchtower
        restart: unless-stopped
        mem_limit: 512M
        image: nickfedor/watchtower:latest@sha256:e96976bcbeaf0a9adeddc9016a539c27a2245ef6bb7d3ca97ed106783350d387
        volumes:
            - dockerproxy_priv:/socket/:ro
        depends_on:
            - dockerproxy_priv
        environment:
            WATCHTOWER_CLEANUP: "true"
            WATCHTOWER_POLL_INTERVAL: 7200
            DOCKER_HOST: "unix:///socket/docker.sock"
        logging: *logging

    syncthing:
        image: syncthing/syncthing
        container_name: syncthing
        restart: unless-stopped
        mem_limit: 2G
        # spc_t so files moved into the synced tree with foreign labels stay
        # readable; :Z would bulk-relabel the whole home and still miss later moves.
        security_opt:
            - label=type:spc_t
        environment:
            - PUID=$MY_UID
            - PGID=$MY_UID
            # Loopback-only GUI (the image defaults to 0.0.0.0); use an SSH
            # tunnel to reach it.
            - STGUIADDRESS=127.0.0.1:8384
        volumes:
            - /home/$MY_USERNAME:/var/syncthing
            # rslave so USB devices mounted by udisks after the container
            # starts show up inside too (the default rprivate would freeze
            # the mount tree as it was at container creation).
            - /run/media/$MY_USERNAME:/run/media/user:rslave
        network_mode: host
        logging: *logging

    # llama.cpp router server on the Intel iGPU (SYCL). Launching without -m
    # puts it in router mode: every model directory under ~/models is listed
    # by /v1/models and loaded on demand. Per-model options come from
    # llama-models.ini. Watchtower owns image updates.
    llama-sycl:
        image: ghcr.io/ggml-org/llama.cpp:server-intel
        container_name: llama-sycl
        restart: unless-stopped
        # One model is resident at a time (--models-max 1). 54G leaves ~8 GiB
        # of the 62 GiB total for GNOME and host services. At 128K the Qwen
        # models need ~34G; Gemma at 32K needs ~29G.
        mem_limit: 54G
        # card0 + renderD128; Level Zero uses the render node.
        devices:
            - /dev/dri:/dev/dri
        environment:
            # Use the Arc GPU rather than any CPU device SYCL exposes.
            - ONEAPI_DEVICE_SELECTOR=level_zero:0
        volumes:
            # Model root is scanned by the router; keep it read-only.
            - /home/$MY_USERNAME/models:/models:ro
            # Per-model context overrides; see llama-models.ini.
            - ./llama-models.ini:/etc/llama.cpp/models.ini:ro
        ports:
            # Loopback-only on the host. The container port stays 8080.
            - "127.0.0.1:18080:8080"
        command:
            # Router mode: scan the mounted model root. No -m, or it would
            # fall back to single-model mode.
            - "--models-dir"
            - "/models"
            # Per-model options (context size) live here. Router CLI args
            # override presets, so ctx-size is deliberately not set below.
            - "--models-preset"
            - "/etc/llama.cpp/models.ini"
            # Listen on all interfaces inside the container so Docker's
            # published port can reach it; host exposure is loopback-only.
            - "--host"
            - "0.0.0.0"
            # Offload all layers to the GPU.
            - "--n-gpu-layers"
            - "99"
            # Less KV memory and faster attention as context grows. Use
            # "auto" if a model does not support Flash Attention.
            - "--flash-attn"
            - "on"
            # Context is per slot and set in llama-models.ini: 32K by
            # default, 128K for the Qwen-based models.
            # Logical prompt batch and physical micro-batch. 1024 ubatch
            # usually improves prompt processing on the iGPU; drop to 512 if
            # memory gets tight.
            - "--batch-size"
            - "2048"
            - "--ubatch-size"
            - "1024"
            # One slot: a single request owns the full per-model context
            # instead of splitting it across idle parallel slots.
            - "--parallel"
            - "1"
        logging: *logging

volumes:
    dockerproxy_priv:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
