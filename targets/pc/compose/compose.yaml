name: pc

x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

services:
    syncthing:
        image: syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
        container_name: syncthing
        restart: unless-stopped
        mem_limit: 2G
        # spc_t so files moved into the synced tree with foreign labels stay
        # readable; :Z would bulk-relabel the whole home and still miss later moves.
        security_opt:
            - label=type:spc_t
        environment:
            - PUID=$MY_UID
            - PGID=$MY_UID
            # Loopback-only GUI (the image defaults to 0.0.0.0); use an SSH
            # tunnel to reach it.
            - STGUIADDRESS=127.0.0.1:8384
        volumes:
            - /home/$MY_USERNAME:/var/syncthing
            # rslave so USB devices mounted by udisks after the container
            # starts show up inside too (the default rprivate would freeze
            # the mount tree as it was at container creation).
            - /run/media/$MY_USERNAME:/run/media/user:rslave
        network_mode: host
        logging: *logging

    # ComfyUI on the Intel Arc iGPU (XPU). The image bundles ComfyUI,
    # ComfyUI-Manager and ComfyUI-GGUF; persistent state lives under the shared
    # AI root at ~/ai/comfyui. The image runs as root (Manager installs node
    # deps into /app/venv), but the process group is the host user's (MY_UID) and
    # umask 002 keeps new files group-writable, so the mounted tree is
    # editable on the host without sudo. Renovate digest-pins xpu-master.
    comfyui:
        image: ghcr.io/reliq-hq/comfyui:xpu-master@sha256:38ebb83f4c849e8d80a4431af645ca10e0e695d98fe3267a89900ae1ca1f9f1a
        container_name: comfyui
        restart: unless-stopped
        user: "0:$MY_UID"
        entrypoint: ["tini", "--"]
        command:
            - "/bin/sh"
            - "-c"
            - |
              set -eu
              dirs="/app/models /app/user /app/custom_nodes /app/output /app/input"
              for d in $$dirs; do mkdir -p "$$d"; done
              # Seed the bundled custom nodes on a fresh tree; start.sh only
              # seeds them as root, which would undo the group ownership.
              if [ -z "$$(ls -A /app/custom_nodes)" ]; then
                tar -xzf /app/custom_nodes_backup.tar.gz -C /app/custom_nodes
              fi
              if [ ! -e /app/user/.owner-host ]; then
                chown -R 0:"$MY_UID" $$dirs
                chmod -R g+rwX $$dirs
                touch /app/user/.owner-host
                chown 0:"$MY_UID" /app/user/.owner-host
              else
                chown -R 0:"$MY_UID" /app/custom_nodes /app/user
                chmod -R g+rwX /app/custom_nodes /app/user
              fi
              find $$dirs -type d -exec chmod g+s {} +
              umask 002
              # start.sh hardcodes `--listen`, so launch main.py directly to
              # pass ComfyUI's own flags. --disable-smart-memory unloads models
              # after every prompt, and --cache-none drops the execution cache,
              # so idle RAM returns to the host instead of being kept for the
              # next run. Both cost speed: every run reloads models and
              # re-executes every node.
              export PATH="/app/venv/bin:$$PATH"
              exec python3 /app/main.py --listen --disable-smart-memory --cache-none
        # 54G leaves ~8 GiB of the 62 GiB total for GNOME and host services.
        # Realistic ComfyUI peaks for current models are ~30G, so this is
        # headroom, not a target. Don't raise further: swap is zram-only.
        mem_limit: 54G
        # Prevent the container from touching the host's zram swap; it stays
        # reserved for the desktop. (memory + swap == memory means no swap.)
        memswap_limit: 54G
        devices:
            # card0 + renderD128; PyTorch XPU renders through renderD128.
            - /dev/dri:/dev/dri
        ports:
            # Loopback-only; browser on this machine or an SSH tunnel.
            - "127.0.0.1:8188:8188"
        volumes:
            - /home/$MY_USERNAME/ai/comfyui/models:/app/models
            - /home/$MY_USERNAME/ai/comfyui/user:/app/user
            - /home/$MY_USERNAME/ai/comfyui/custom_nodes:/app/custom_nodes
            - /home/$MY_USERNAME/ai/comfyui/output:/app/output
            - /home/$MY_USERNAME/ai/comfyui/input:/app/input
        logging: *logging

    # llama.cpp router server on the Intel iGPU (SYCL). Launching without -m
    # puts it in router mode: existing GGUFs are scanned from the shared AI root
    # at ~/ai/llama, and the built-in Discover UI can search Hugging Face and
    # download into a separate cache there. Context is auto-fit to the device
    # memory. The image runs as root, but the process group is the host user's
    # (MY_UID) and umask 002 keeps new files group-writable, so the mounted
    # tree stays editable on the host. Renovate digest-pins server-intel.
    llama-sycl:
        image: ghcr.io/ggml-org/llama.cpp:server-intel@sha256:951c27bffe992c5a71589a38d550d05f23540e90a453927d5748d1c70ffd10fa
        container_name: llama-sycl
        restart: unless-stopped
        # One model is resident at a time (--models-max 1). 54G leaves ~8 GiB
        # of the 62 GiB total for GNOME and host services. At 128K the Qwen
        # models need ~34G; Gemma at 32K needs ~29G.
        mem_limit: 54G
        memswap_limit: 54G
        # card0 + renderD128; Level Zero uses the render node.
        devices:
            - /dev/dri:/dev/dri
        user: "0:$MY_UID"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              set -eu
              if [ ! -e /models/.owner-host ]; then
                chown -R 0:"$MY_UID" /models
                chmod -R g+rwX /models
                touch /models/.owner-host
                chown 0:"$MY_UID" /models/.owner-host
              fi
              find /models -type d -exec chmod g+s {} +
              umask 002
              exec /app/llama-server "$$@"
            - "--"
            # Listen on all interfaces inside the container so Docker's
            # published port can reach it; host exposure is loopback-only.
            - "--host"
            - "0.0.0.0"
            # Offload all layers to the GPU.
            - "--n-gpu-layers"
            - "99"
            # One resident model, with headroom left for the desktop.
            - "--models-max"
            - "1"
            - "--models-memory-margin"
            - "1024"
            # Scan the existing model tree; UI downloads go to LLAMA_CACHE
            # below so the two structures do not mix.
            - "--models-dir"
            - "/models"
            # Auto-size each model's context to the device memory. Without a
            # preset, this also keeps downloaded cache models in one place
            # instead of listing preset entries whose files may be gone.
            - "--fit"
            - "on"
            - "--fit-target"
            - "2048"
            - "--fit-ctx"
            - "32768"
            # Less KV memory and faster attention as context grows. Q8
            # roughly halves the KV footprint versus f16.
            - "--flash-attn"
            - "on"
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            # Keep the multimodal projector on the CPU; the iGPU is the
            # bottleneck for larger models.
            - "--no-mmproj-offload"
            - "--jinja"
            # Logical prompt batch and physical micro-batch. 1024 ubatch
            # usually improves prompt processing on the iGPU; drop to 512 if
            # memory gets tight.
            - "--batch-size"
            - "2048"
            - "--ubatch-size"
            - "1024"
            # One slot: a single request owns the full per-model context
            # instead of splitting it across idle parallel slots.
            - "--parallel"
            - "1"
            # Reuse prompt prefixes from RAM, and unload an idle model after
            # five minutes on this desktop.
            - "--cache-ram"
            - "2048"
            - "--sleep-idle-seconds"
            - "300"
            # Enable the built-in Discover/download UI. It is off by default.
            - "--ui-config"
            - '{"enableDiscoverModels": true, "useHuggingFaceHub": true}'
        environment:
            # Use the Arc GPU rather than any CPU device SYCL exposes.
            - ONEAPI_DEVICE_SELECTOR=level_zero:0
            # UI downloads land in the cache; only cache models are deletable
            # through the UI. Existing --models-dir models stay protected.
            - LLAMA_CACHE=/models/.cache
        volumes:
            # Shared AI root; model files and the UI download cache live here.
            - /home/$MY_USERNAME/ai/llama:/models
        ports:
            # Loopback-only on the host. The container port stays 8080.
            - "127.0.0.1:18080:8080"
        logging: *logging
