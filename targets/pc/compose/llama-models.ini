# llama.cpp router presets. Section names must match the model IDs exposed by
# --models-dir, i.e. the directory names under ~/models.
#
# Precedence: router CLI args > model section > [*] section. Keep ctx-size out
# of the compose command so these per-model values take effect.
version = 1

[*]
# Default for any model without its own section. 32K keeps Gemma 4's large KV
# cache (~648 KiB/token) around 20 GiB; raise per model only if it fits.
ctx-size = 32768

[Qwen3.6-35B-A3B-GGUF]
# ~80 KiB of KV per token at f16, so 128K is about 10 GiB.
ctx-size = 131072

[Tiel-Coder-35B-A3B-GGUF]
# Same architecture as Qwen3.6: ~80 KiB of KV per token, ~10 GiB at 128K.
ctx-size = 131072

[Qwen3.8-27B-GGUF]
# Hybrid attention caches KV only on the 16 full-attention layers: ~64 KiB
# per token at f16, so 128K is about 8 GiB. Native limit is 256K, but 128K
# keeps prefill and memory reasonable on the iGPU.
ctx-size = 131072

[gemma-4-12B-it-QAT-GGUF]
# Explicit for clarity: ~648 KiB of KV per token, ~20 GiB at 32K.
ctx-size = 32768
