---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-crowdsec-internal
  namespace: base
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  ingress:
    - from:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
              type: agent
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
              type: appsec
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lapi-from-traefik
  namespace: base
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-appsec-from-traefik
  namespace: base
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: appsec
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 7422
  policyTypes:
    - Ingress
