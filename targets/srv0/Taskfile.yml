# Taskfile.yml for the srv0 target (K3s control-plane + frpc compose sidecar).
# Included by the root Taskfile as namespace "srv0" (task srv0:<task>).
version: '3'

tasks:
  validate:
    desc: Check configs for errors
    cmds:
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook {{.ROOT_DIR}}/ops/ansible/playbooks/validate.yml -i {{.ROOT_DIR}}/ops/ansible/inventory.yml -l srv0

  # ----- compose -----
  compose:install:
    desc: Render templates and start Compose stack
    cmds:
      - cmd: |
          [ ! -f {{.ROOT_DIR}}/targets/srv0/VARS.template.env ] || python3 {{.ROOT_DIR}}/lib/vars_validator.py srv0
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook {{.ROOT_DIR}}/ops/ansible/playbooks/compose_install.yml -i {{.ROOT_DIR}}/ops/ansible/inventory.yml -l srv0 {{.CLI_ARGS}}

  compose:restart:
    desc: Restart a specific Compose service (pass the service name after --)
    cmds:
      - cmd: |
          [ ! -f {{.ROOT_DIR}}/targets/srv0/VARS.template.env ] || python3 {{.ROOT_DIR}}/lib/vars_validator.py srv0
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook {{.ROOT_DIR}}/ops/ansible/playbooks/compose_restart.yml -i {{.ROOT_DIR}}/ops/ansible/inventory.yml -l srv0 -e "compose_service={{.CLI_ARGS}}"

  compose:backup-state:
    desc: Backup Compose runtime state (local; or remote via '-e backup_remote=user@host:path' after --)
    cmds:
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook {{.ROOT_DIR}}/ops/ansible/playbooks/compose_backup_state.yml -i {{.ROOT_DIR}}/ops/ansible/inventory.yml -l srv0 {{.CLI_ARGS}}

  compose:install-preboot:
    desc: Install preboot FRPC for remote LUKS unlock via SSH
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/targets/srv0/commands/compose/install-preboot.sh {{.CLI_ARGS}}

  # ----- k3s -----
  k3s:provision:
    desc: Bootstrap the K3s control plane (no args; run on the node) or join a node (pass <ip> <user> [agent|server] + flags after --; run on the control plane)
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/k3s/provision.sh {{.CLI_ARGS}}

  k3s:validate:
    desc: Lint and syntax-check the Ansible provisioning playbooks (no hosts touched)
    cmds:
      - cmd: |
          set -e
          cd {{.ROOT_DIR}}/ops/ansible
          for pb in playbooks/*.yml; do ansible-playbook --syntax-check -i localhost, "$pb"; done
          yamllint -c .yamllint .
          ansible-lint -c .ansible-lint --offline .

  k3s:deploy:
    desc: Deploy the umbrella chart for a scope (pass "base" or "apps" + extra helm args after --)
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/k3s/helm.sh srv0-{{splitList " " .CLI_ARGS | first}} {{.CLI_ARGS}}

  k3s:update-node-ip:
    desc: Update K3s node IP after a network change (pass [--ip X] [--force] after --; run on the node)
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/k3s/update-node-ip.sh {{.CLI_ARGS}}

  k3s:backup-pvc:
    desc: Back up PVCs — single by name, or mass via --all (auto-backup labeled)
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/k3s/backup-pvc.sh {{.CLI_ARGS}}

  k3s:restore-pvc:
    desc: Restore PVCs from backup archives — single by name, or mass via --all
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/k3s/restore-pvc.sh {{.CLI_ARGS}}

  k3s:group:base:apply:
    desc: Deploy the base K3s component group
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/k3s/helm.sh srv0-base base

  k3s:group:base:delete:
    desc: Delete the base K3s component group (helm uninstall; PVCs are retained by Helm default)
    cmds:
      - helm uninstall srv0-base -n base

  k3s:group:apps:apply:
    desc: Deploy the apps K3s component group
    cmds:
      - TARGET=srv0 INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/k3s/helm.sh srv0-apps apps

  k3s:group:apps:delete:
    desc: Delete the apps K3s component group (helm uninstall; PVCs are retained by Helm default)
    cmds:
      - helm uninstall srv0-apps -n apps

  # ----- universal aliases -----
  prereqs:
    desc: Install system prerequisites
    cmds:
      - cmd: |
          if ! command -v ansible-playbook >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ansible-core
            elif command -v dnf >/dev/null 2>&1; then sudo dnf install -y ansible-core
            else echo "Error: unsupported package manager. Install ansible-core manually." >&2; exit 1; fi
          fi
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook -i localhost, {{.ROOT_DIR}}/ops/ansible/playbooks/prereqs.yml {{.CLI_ARGS}}

  renovate:
    desc: Run Renovate against ImranR98/Infra (needs RENOVATE_GITHUB_TOKEN in secrets/VARS.env)
    cmds:
      - INFRA_ROOT={{.ROOT_DIR}} bash {{.ROOT_DIR}}/commands/renovate.sh {{.CLI_ARGS}}

  wireguard:
    desc: Install WireGuard and deploy a config file (pass the .conf path after --)
    cmds:
      - INFRA_ROOT={{.ROOT_DIR}} ANSIBLE_CONFIG={{.ROOT_DIR}}/ops/ansible/ansible.cfg ansible-playbook -i localhost, {{.ROOT_DIR}}/ops/ansible/playbooks/wireguard.yml -e "wireguard_conf_src=$(readlink -f {{.CLI_ARGS}})"
