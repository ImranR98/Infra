name: srv0

x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

services:
    # srv0 side of the public-exposure tunnel: creates pubexp-client0 in the
    # host netns and keeps it connected to the vps0 hub. The conf is generated
    # by scripts/public-exposure-keygen.sh. Host effects are lifecycle-bound:
    # stopping the container also removes the interface and its firewall rules.
    public-exposure-client-wg:
        image: lscr.io/linuxserver/wireguard:latest@sha256:437a490f7afc6969434251351ba47455a3829e71cef9c6172f3f533332d04063
        container_name: public-exposure-client-wg
        restart: always
        network_mode: host
        cap_add:
            - NET_ADMIN
        volumes:
          - ../../../config/srv0/public-exposure/pubexp-client0.conf:/etc/wireguard/pubexp-client0.conf:ro
          - ./files/public-exposure/client-entrypoint.sh:/usr/local/bin/client-entrypoint.sh:ro
        entrypoint: ["/bin/bash", "/usr/local/bin/client-entrypoint.sh"]
        healthcheck:
            test: ["CMD", "wg", "show", "pubexp-client0"]
            interval: 30s
            timeout: 10s
            start_period: 15s
            retries: 3
        logging: *logging
