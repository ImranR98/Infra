# ====== values.yaml template for srv0 ======
# Documented variables + generation commands. The actual values live in ONE
# gitignored file per target:
#   - config/srv0/values.yaml — plain YAML consumed ONLY by the k3s charts
#     (helm upgrade -f, both k3s-base and k3s-apps). Copy this template folder
#     (targets/srv0/config_template/) to config/srv0/, replace placeholders,
#     done — no encryption, config/ is gitignored (see AGENTS.md).
#   - The compose sidecar (frpc) has its own inputs in the same folder:
#     compose.env (dotenv: PROXY_HOST, TLS_SERVER_NAME) + the mTLS cert files
#     under config_template/frpc/ — see the FRP section below.
# Placeholders (change_me / changeme / abc / REPLACE_ME / <...>) are rejected
# on deploy. Multi-line values are literal block scalars (|); bare $ and #
# inside scalars are literal; there are NO ${NAME} references (values are
# final — no expansion step).
# NOTE: the *_HASHABLE keys are consumed pre-hashed: the *_HASHED key (same
# file) holds the output of `openssl passwd -6` (or `authelia crypto hash
# generate pbkdf2 ...`); the *_HASHABLE plaintext stays for reference.
# NOTE: keys below the first ====== line are machine/env paths (INFRA_ROOT,
# TARGET, PVC_BACKUP_DIR) — k3s-chart-only.

# ====== Domain ======
SERVICES_DOMAIN: "home.example.org"
DOMAIN_OWNER_EMAIL: "contact@example.org"
TZ: "America/Toronto"

# ====== Ntfy ======
NTFY_WRITE_ONLY_ACCOUNT_TOKEN: "change_me" # "tk_$(openssl rand -hex 16)"
NTFY_FALLBACK_TOPIC: "change_me" # openssl rand -hex 16
NTFY_ADMIN_PASSWORD_HASH: "change_me" # docker run --rm -it binwiederhier/ntfy user hash
NTFY_WRITE_ONLY_ACCOUNT_PASSWORD_HASH: "change_me" # docker run --rm -it binwiederhier/ntfy user hash

# ====== Geoblock (Traefik middleware) ======
# Indentation matters — must match spec.plugin.geoblock level in middlewares.yaml (6 spaces).
GEOBLOCK_CONFIG_SUBSET: |
  blackListMode: false
  countries:
    - CA
    - CN
    - CU

# ====== GeoIP (self-hosted MaxMind GeoLite2) ======
# Register at https://www.maxmind.com and generate a GeoLite2 license key
GEOIPUPDATE_ACCOUNT_ID: "change_me"
GEOIPUPDATE_LICENSE_KEY: "change_me"

# ====== Host Paths ======
# Ensure these exist before starting services
MAIN_PARENT_DIR: "/path/to/data"
MEDIA_DIR_PATH: "/path/to/data/Main/Media"
DSCPLN_TRANSACTIONS_PATH: "/path/to/data/Main/Notes/Transactions"
MDSCL_DEVICE_SYNC_PATH: "/path/to/data/deviceSync"
SECONDARY_STORAGE_PATH: "/mnt/k3s_extra_storage"

# ====== Authelia ======
# Use `docker run -it authelia/authelia:latest authelia crypto hash generate argon2` to generate the password hash
# Indentation matters: needs 2 spaces more than the 4-space block scalar base (6/8/10 spaces)
# For one-time 2FA registration: kubectl -n base exec -it "$(kubectl -n base get pod | grep -E '^authelia' | grep -Ev '(postgres|redis)' | awk '{print $1}')" -- cat /notifications/notification.txt
AUTHELIA_USERS_DATABASE: |
  users:
        admin:
          disabled: false
          displayname: "Admin"
          password: "$argon2id$v=19$m=65536,t=3,p=abc"
          email: contact@example.org
          groups:
            - admins
AUTHELIA_DB_ENCRYPTION_KEY: "change_me" # openssl rand -hex 128
AUTHELIA_OIDC_HMAC_SECRET: "change_me" # openssl rand -hex 128
AUTHELIA_REDIS_PASSWORD: "change_me" # openssl rand -base64 32
AUTHELIA_DB_PASSWORD: "change_me" # openssl rand -base64 32
# openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null | base64 | tr -d '\n'
# Indentation matters
AUTHELIA_JWKS_KEY: |
  -----BEGIN PRIVATE KEY-----
                    change_me
                    -----END PRIVATE KEY-----
AUTHELIA_IMMICH_CLIENT_SECRET_HASHABLE: "change_me" # docker run authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
AUTHELIA_OPENWEBUI_CLIENT_SECRET_HASHABLE: "change_me" # docker run authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
AUTHELIA_HEADLAMP_CLIENT_SECRET_HASHABLE: "change_me" # docker run authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
AUTHELIA_LINKWARDEN_CLIENT_SECRET_HASHABLE: "change_me" # docker run authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
# The precomputed hashes of the *_HASHABLE values above (k3s-chart-only; the
# chart mounts these into Authelia's OIDC client definitions).
AUTHELIA_IMMICH_CLIENT_SECRET_HASHED: "change_me"
AUTHELIA_OPENWEBUI_CLIENT_SECRET_HASHED: "change_me"
AUTHELIA_HEADLAMP_CLIENT_SECRET_HASHED: "change_me"
AUTHELIA_LINKWARDEN_CLIENT_SECRET_HASHED: "change_me"

# ====== Authelia header gate ======
# Set to "true" to force the gate on (blocking all requests without a valid
# Authelia session). Auto-enabled on first deploy; leave "false" otherwise.
AUTHELIA_HEADER_GATE_ENABLED: "false"

# ====== Crowdsec ======
CROWDSEC_BOUNCER_KEY: "change_me" # openssl rand -hex 32
CROWDSEC_LAPI_SECRET: "change_me" # openssl rand -hex 32

# ====== Localhost Basic Auth ======
LOCALHOST_AUTH_USER: "admin"
LOCALHOST_AUTH_PASSWORD_HASH: "change_me" # openssl passwd -6 'password'

# ====== Immich ======
IMMICH_DB_PASSWORD: "change_me" # openssl rand -hex 16

# ====== Mosquitto ======
# Format: mosquitto password file lines ("user:hash"), ONE LINE PER ENTRY, each line
# indented with 4 spaces (rendered into a YAML block scalar, like AUTHELIA_USERS_DATABASE).
# IMPORTANT: generate hashes with the SAME mosquitto_passwd version as the runtime
# image (eclipse-mosquitto:2.0.22-openssl). Newer mosquitto_passwd (2.1+) emits
# $7$1000$ hashes that 2.0.x cannot decode ("Unable to decode password salt").
#   tmpfile=$(mktemp) && docker run --rm -v "$tmpfile":/pw eclipse-mosquitto:2.0.22-openssl mosquitto_passwd -b /pw frigate '<FRIGATE_MQTT_PASSWORD>' \
#   && docker run --rm -v "$tmpfile":/pw eclipse-mosquitto:2.0.22-openssl mosquitto_passwd -b /pw homeassistant '<HA_MQTT_PASSWORD>' && cat "$tmpfile"
MOSQUITTO_CREDENTIALS: "change_me" # tmpfile=$(mktemp) && mosquitto_passwd -b "$tmpfile" admin 'your-password' && cat "$tmpfile" && rm "$tmpfile"

# ====== Frigate (NVR) ======
# Password of the rpi go2rtc stream: `docker logs go2rtc` on the Pi, or
# current_target/compose_live_state/go2rtc/password. Update if the Pi password regenerates.
FRIGATE_RTSP_PASSWORD: "change_me"
FRIGATE_MQTT_PASSWORD: "change_me" # openssl rand -hex 16 (also add `frigate` user to MOSQUITTO_CREDENTIALS)
HA_MQTT_PASSWORD: "change_me" # openssl rand -hex 16 (also add `homeassistant` user to MOSQUITTO_CREDENTIALS)
# The rpi go2rtc host's LAN IP is written literally into FRIGATE_ADDITIONAL_CONFIG below.
# Deployment-specific Frigate config (go2rtc streams, cameras) appended to the
# hardcoded section in frigate/helmchart.yaml.
# Multi-line YAML block scalar. {FRIGATE_*}
# tokens are substituted by Frigate at runtime. GUI config-editor changes
# don't survive restarts - scrape them back into here.
FRIGATE_ADDITIONAL_CONFIG: |
  go2rtc:
      streams:
        rpi: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.8.XX:8554/rpi#timeout=5
    cameras:
      # Default camera: rpi go2rtc webcam stream (targets/rpi)
      rpi:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/rpi
              roles:
                - detect
            - path: rtsp://127.0.0.1:8554/rpi
              roles:
                - record
        detect:
          width: 640
          height: 480
          # Frigate 0.17 defaults detect.enabled to FALSE - pin it ON in the
          # config, otherwise every Frigate restart silently disables
          # detection (and HA mirrors the off state onto switch.rpi_detect).
          enabled: true
          # Detection-only fps (motion + object detection). Does NOT affect
          # the record-role input or the go2rtc livestream - those are
          # separate pipelines.
          fps: 5
        motion:
          # Low-light webcam noise fix: improve_contrast stretches the
          # near-black sensor noise at night into full-range "changes",
          # producing continuous false motion (hour-long recordings).
          # Disabling it keeps noise below the motion threshold.
          improve_contrast: false
          # 1.0 disables the lightning recalibration: without it, a person
          # filling the webcam frame (>80% change) is treated as "lightning"
          # and motion detection recalibrates, swallowing the event
          # (Frigate docs: doorbell camera scenario).
          lightning_threshold: 1.0
        record:
          enabled: true
          motion:
            # Keep segments that contain motion even when no object is
            # tracked (otherwise motion-only activity has no recording).
            days: 14
          alerts:
            retain:
              days: 14
              # Keep segments with actively tracked objects, not only
              # motion (person standing still is still recorded).
              mode: active_objects
          detections:
            retain:
              days: 14
              mode: active_objects
        snapshots:
          enabled: true
      # -------- HOW TO ADD MORE CAMERAS (copy + uncomment a block) --------
      # Example 1: LAN IP camera over RTSP (most common)
      #   doorbell:
      #     ffmpeg:
      #       inputs:
      #         - path: rtsp://user:password@192.168.8.XX:554/stream1
      #           roles:
      #             - detect
      #             - record
      #     detect:
      #       width: 1280
      #       height: 720
      #       fps: 5
      #     record:
      #       enabled: true
      #       detections:
      #         retain:
      #           days: 7
      # Example 2: USB camera plugged into the frigate node itself.
      #   Path is the V4L2 device inside the container (the pod is privileged,
      #   so all /dev/video* nodes of the node are visible).
      #   local_usb:
      #     ffmpeg:
      #       inputs:
      #         - path: /dev/video0
      #           roles:
      #             - detect
      #     detect:
      #       width: 1280
      #       height: 720
      #       fps: 5
      # Example 3: HTTP/MJPEG source (old webcams, some NVRs)
      #   old_cam:
      #     ffmpeg:
      #       inputs:
      #         - path: http://192.168.8.XX/cgi-bin/video.cgi?type=mjpeg
      #           roles:
      #             - detect
      # Example 4: camera behind an exotic source via Frigate's go2rtc
      #   restream - add the source to go2rtc.streams above (e.g.
      #   backyard: rtsp://...), then consume it locally:
      #   backyard:
      #     ffmpeg:
      #       inputs:
      #         - path: rtsp://127.0.0.1:8554/backyard
      #           roles:
      #             - detect
      #             - record
      #     detect:
      #       width: 1280
      #       height: 720
      #       fps: 5

# ====== FreshRSS ======
FRESHRSS_PASSWORD: "change_me" # openssl rand -base64 32

# ====== Linkwarden ======
# AUTHELIA_LINKWARDEN_CLIENT_SECRET_HASHABLE (above) must be the same random
# password Linkwarden receives as its OIDC client secret.
LINKWARDEN_NEXTAUTH_SECRET: "change_me" # openssl rand -base64 32
# The postgres PVC stores this at first initdb; changing it here afterwards
# requires updating the DB too (local socket is trust):
#   kubectl -n apps exec -i linkwarden-postgresql-<pod> -c postgresql -- \
#     psql -U postgres   # then: ALTER USER postgres PASSWORD '<new>'; \q
# and restarting linkwarden, or it fails with Prisma P1000.
LINKWARDEN_DB_PASSWORD: "change_me" # openssl rand -hex 16
LINKWARDEN_MEILI_MASTER_KEY: "change_me" # openssl rand -base64 32
# Links archived in parallel per batch (each spawns Chromium + monolith, ~1-2Gi
# each on big pages). Low = lower peak memory at the cost of bulk-import speed.
LINKWARDEN_ARCHIVE_TAKE_COUNT: "1"

# ====== Plik ======
PLIK_ADMIN_PASSWORD: "change_me" # openssl rand -hex 16

# ====== D$CPLN ======
DSCPLN_DATA_FILE: "Acc 2026.md" # format: Acc $(date +%Y).md
DSCPLN_BUDGET_INIT_AMT: "2400"
DSCPLN_FIRST_WEEK_BIAS_INIT_AMT: "1400"

# ====== FMD ======
FMD_REGISTRATIONTOKEN: "change_me" # openssl rand -base64 32

# ====== OpenCanary ======
OPENCANARY_NTFY_SECRET_TOPIC: "change_me" # openssl rand -base64 32

# ====== Radarr / Sonarr ======
RADARR_API_KEY: "change_me" # openssl rand -hex 16
SONARR_API_KEY: "change_me" # openssl rand -hex 16

# ====== Prowlarr ======
PROWLARR_API_KEY: "change_me" # openssl rand -hex 16

# ====== Nextcloud ======
NEXTCLOUD_ADMIN_USER: "admin"
NEXTCLOUD_ADMIN_PASSWORD: "change_me" # openssl rand -hex 16
NEXTCLOUD_DB_PASSWORD: "change_me" # openssl rand -hex 16

# ====== FRP ======
# The FRP vars are NOT in this file — they are compose-only (the k3s chart
# never uses them). They live in this same template folder:
#   - config_template/compose.env (dotenv, passed with `docker compose --env-file`):
#       PROXY_HOST=<frps server hostname>
#       TLS_SERVER_NAME=<frps TLS server name (matches its cert CN)>
#   - config_template/frpc/ — the per-pair mTLS CA + client certs as real 0600
#     files (mounted read-only by the compose stack and read by scripts/preboot.sh):
#     ca.crt, ca.key (rotation material, not mounted), client.crt, client.key,
#     preboot-client.crt, preboot-client.key
# Generate with openssl (once per pair, on either machine; save the output
# directly into config/srv0/frpc/):
#   # CA
#   openssl req -x509 -newkey rsa:4096 -keyout ca.key -out ca.crt -days 3650 -nodes -subj "/CN=infra-mtls-ca"
#   # client (srv0)
#   openssl genrsa -out client.key 2048
#   openssl req -new -key client.key -out client.csr -subj "/CN=srv0"
#   openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 1825
#   # preboot client (srv0, separate cert for the initramfs frpc)
#   openssl genrsa -out preboot-client.key 2048
#   openssl req -new -key preboot-client.key -out preboot-client.csr -subj "/CN=srv0-preboot"
#   openssl x509 -req -in preboot-client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out preboot-client.crt -days 1825

# ====== Observability ======
RUSTFS_ACCESS_KEY: "change_me" # openssl rand -hex 16
RUSTFS_SECRET_KEY: "change_me" # openssl rand -hex 32
GRAFANA_ADMIN_PASSWORD: "change_me" # openssl rand -base64 32
# Same convention as the other Authelia OIDC clients: the plaintext secret
# Grafana presents as its OIDC client secret (the _HASHED form is mounted
# into Authelia via authelia/prereqs.yaml).
AUTHELIA_GRAFANA_CLIENT_SECRET_HASHABLE: "change_me" # docker run authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
AUTHELIA_GRAFANA_CLIENT_SECRET_HASHED: "change_me"

# ====== Infra paths (k3s-chart-only, machine/env layout) ======
# Repo + state paths used by the in-cluster pvc-backup CronJob and the
# renovate CronJob (hostPath mounts of the synced repo).
INFRA_ROOT: "/home/imranr/Main/Infra"
TARGET: "srv0"
PVC_BACKUP_DIR: "/home/imranr/Main/Infra/k3s_state_backups"
