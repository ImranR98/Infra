---
# Apply (or delete) an srv0 umbrella chart release: srv0-base / srv0-apps.
# Usage (run on srv0 or with srv0's kubeconfig reachable):
#   ansible-playbook targets/srv0/helm_apply.yaml -e helm_scope=base
#     [-e helm_args="--dry-run"] [-e helm_state=absent]
- name: Apply the srv0 umbrella chart release
  hosts: srv0
  gather_facts: false

  vars:
    infra_root: "{{ playbook_dir }}/../.."
    chart_dir: "{{ infra_root }}/targets/srv0/k3s"
    secret_values: "{{ infra_root }}/secrets/VARS.srv0.yaml"

  tasks:
    - name: Scope must be base or apps
      ansible.builtin.assert:
        that: helm_scope | default('') in ['base', 'apps']
        fail_msg: "helm_scope must be 'base' or 'apps' (got '{{ helm_scope | default('') }}')"

    - name: Derived release vars
      ansible.builtin.set_fact:
        helm_release: "srv0-{{ helm_scope }}"
        helm_namespace: "{{ helm_scope }}"
        helm_other: "{{ 'apps' if helm_scope == 'base' else 'base' }}"
        helm_state_eff: "{{ helm_state | default('present') }}"
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('/etc/rancher/k3s/k3s.yaml', true) }}"

    - name: Kubeconfig file
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
      register: kubeconfig_stat

    - name: Kubeconfig must exist
      ansible.builtin.assert:
        that: kubeconfig_stat.stat.exists
        fail_msg: "No kubeconfig at {{ kubeconfig }} — is this the control plane or is KUBECONFIG set?"

    - name: Stat secret values
      ansible.builtin.stat:
        path: "{{ secret_values }}"
      register: secret_values_stat

    - name: Secret values present (apply only)
      ansible.builtin.assert:
        that: secret_values_stat.stat.exists
        fail_msg: "{{ secret_values }} not found. Create it from targets/srv0/VARS.template.yaml"
      when: helm_state_eff != 'absent'

    - name: Reject placeholder values (apply only)
      ansible.builtin.shell: |
        if grep -qE 'change_me|changeme|REPLACE_ME|^[^#]*"[^"]*<[^>]*>[^"]*"' "{{ secret_values }}"; then
          echo "ERROR: {{ secret_values }} contains placeholder values" >&2
          exit 1
        fi
      changed_when: false
      when: helm_state_eff != 'absent'

    - name: No missing values in the render (apply only)
      ansible.builtin.shell: |
        out=$(helm template "{{ inventory_hostname }}-preflight" "{{ chart_dir }}" -n base \
          -f "{{ chart_dir }}/values.yaml" -f "{{ secret_values }}" 2>&1)
        if echo "$out" | grep -q '<no value>'; then
          echo "ERROR: missing values (<no value>) in the rendered chart — check {{ secret_values }}" >&2
          exit 1
        fi
      changed_when: false
      when: helm_state_eff != 'absent'

    - name: Helm upgrade --install
      ansible.builtin.command:
        argv: >-
          {{ ['helm', 'upgrade', '--install', helm_release, chart_dir,
              '-n', helm_namespace, '--create-namespace',
              '-f', chart_dir ~ '/values.yaml', '-f', secret_values,
              '--set', helm_other ~ '.enabled=false']
             + (helm_args | default('') | split) }}
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      when: helm_state_eff != 'absent'

    - name: Helm uninstall
      ansible.builtin.command:
        argv: ['helm', 'uninstall', helm_release, '-n', helm_namespace]
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      when: helm_state_eff == 'absent'
