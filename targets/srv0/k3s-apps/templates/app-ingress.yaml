---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: da5h-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - da5h.{{ .Values.SERVICES_DOMAIN }}
  rules:
    # Deliberately no geoblock: Lockdown is the out-of-house break-glass page,
    # and the operator travels outside the normal country allowlist.
    - matches:
        - path:
            type: PathPrefix
            value: /lockdown
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: da5h
          namespace: apps
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: da5h
          namespace: apps
          port: 8080
