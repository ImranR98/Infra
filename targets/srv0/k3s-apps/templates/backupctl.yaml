# backupctl (D$CPLN Task Runner) — the config-driven workflow runner. It runs
# the scheduled state-backup task as root (the PVC data is owned by fixed
# Postgres/Redis UIDs) and serves the same UI behind Authelia. The private
# dscpln-config checkout supplies config.mjs, apps/ and tools/; it is mounted
# read-write so the UI can persist task-meta.json and Contacts Discover can
# update tools/contacts/config.json. `host:` fields pin tasks to a machine
# (BACKUPCTL_HOST).
---
# Deliberately NOT labeled auto-backup: this holds tool venvs (captured scrape
# output). Backing it up would copy financial/2FA-adjacent data onto every
# synced device. Task Runner state lives in the gitignored config-repo folder.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backupctl-home-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 1Gi
---
# Restic cache and backup-runner scratch. Deliberately NOT auto-backup: the
# cache is derived data and the runner state can contain paths/metadata.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-runner-backup-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 10Gi
---
# Chrome profiles for the login-browser sidecar: logins survive pod restarts
# (the scraper tools point their --user-data-dir under /home/seluser/.config).
# Deliberately NOT labeled auto-backup: these profiles carry live third-party
# sessions (bank/Instacart); a plain-tar archive in the Syncthing-replicated
# k3s_state_backups tree would be a session-hijack kit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backupctl-browser-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 1Gi
---
# The backup task lists the auto-backup PVCs; it does not modify them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-runner-backup
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: task-runner-backup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: task-runner-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: task-runner-backup
subjects:
  - kind: ServiceAccount
    name: task-runner-backup
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-runner
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-runner
  template:
    metadata:
      labels:
        app: task-runner
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      serviceAccountName: task-runner-backup
      automountServiceAccountToken: true
      securityContext:
        # Root is required to read the Postgres/Redis-owned PVC data; spc_t
        # lets the pod read the user-home config checkout without relabeling.
        # User-data tasks drop to MY_UID via their run_as field.
        runAsUser: 0
        runAsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          type: spc_t
          level: s0
      initContainers:
        # The bigpc key is a root-only Secret. Copy it into an emptyDir owned
        # by the host UID so the Wine task can run as UID 1000 without root.
        - name: bigpc-key
          image: busybox:1.38.0-uclibc@sha256:b699b0c739b2d039afd8e2488a3ccfc0b9a86301d87633448d4a93c57bee8c76
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cp /src/id_ed25519 /run/id_ed25519 && chown {{ .Values.MY_UID }}:{{ .Values.MY_UID }} /run/id_ed25519 && chmod 0400 /run/id_ed25519
          securityContext:
            runAsUser: 0
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
          volumeMounts:
            - name: bigpc-ssh
              mountPath: /src
              readOnly: true
            - name: bigpc-ssh-run
              mountPath: /run
      containers:
        - name: task-runner
          image: imranrdev/dscpln-task-runner:latest@sha256:405cd7f58bd9297a7996cae8b6177e656c4d67e52333e735863e00a72a237636
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # The backup repository and host paths are owned by MY_UID.
                - DAC_OVERRIDE
                - FOWNER
                - CHOWN
                # Drop user-data tasks to the host UID/GID; the server stays
                # root so backup tasks can still read every app PVC.
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: APP
              value: task-runner
            - name: HOME
              value: /home/imranr
            - name: TZ
              value: America/Toronto
            # Tasks pinned to another machine show as unavailable on this one.
            - name: BACKUPCTL_HOST
              value: srv0
            - name: BACKUPCTL_CONFIG_FILE
              value: /config-src/config.mjs
            # The monorepo root baked into the image (the repo_dir token).
            - name: BACKUPCTL_REPO_DIR
              value: /app
            # Gitignored state folder in the config repo; owned by the host
            # user so Syncthing can carry run/schedule state.
            - name: BACKUPCTL_STATE_DIR
              value: /config-src/.task-runner
            - name: BACKUPCTL_STATE_UID
              value: "{{ .Values.MY_UID }}"
            - name: BACKUPCTL_STATE_GID
              value: "{{ .Values.MY_UID }}"
            - name: BACKUPCTL_TMP_DIR
              value: /home/imranr/tmp
            # Scheduled workflows (State Backups) run on this instance.
            - name: BACKUPCTL_SCHEDULES
              value: "1"
            # Git identity for task commits (lib.sh git-commit).
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: GIT_COMMITTER_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_COMMITTER_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: BASE_PATH
              value: /tasks
            # Requests must carry Authelia's Remote-User (stamped by Traefik
            # forward-auth); the raw /browser WS upgrade is checked too.
            - name: AUTH_MODE
              value: proxy-header
            - name: AUTH_EXEMPT_PATHS
              value: /api/metrics
            # Login-browser sidecar: noVNC viewer proxied at /tasks/browser/,
            # WebDriver for the scraper tools (local Chrome when unset).
            - name: BROWSER_REMOTE
              value: http://localhost:7900
            - name: SELENIUM_REMOTE_URL
              value: http://localhost:4444
            # Notification relay and deep links.
            - name: DSCPLN_PORTAL_URL
              value: http://portal:8080
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            # State backups: mounted vps0 key, restic staging/cache and the
            # target GID for the setgid restic repository.
            - name: SSH_KEY_FILE
              value: /ssh/id_ed25519
            - name: RESTIC_STAGING_DIR
              value: /staging
            - name: RESTIC_CACHE_DIR
              value: /backup-data/restic-cache
            - name: RESTIC_GID
              value: "{{ .Values.MY_UID }}"
          resources:
            # Restic can hold a large index/check working set; the browser
            # sidecar has its own limit.
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
              cpu: 50m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/tasks/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: staging
              mountPath: /staging
            - name: home
              mountPath: /home/imranr
            # Narrow per-tree mounts (the tasks only ever touch these three
            # top-level dirs); no whole-Main mount.
            - name: main-backups
              mountPath: /home/imranr/Main/Backups
            - name: main-media
              mountPath: /home/imranr/Main/Media
            - name: main-documents
              mountPath: /home/imranr/Main/Documents
            # The backup task reads the live K3s app data and Compose state.
            - name: infra-current
              mountPath: /home/imranr/Main/Infra/current_target
              readOnly: true
            - name: state-backups
              mountPath: /home/imranr/Main/Infra/state_backups
            - name: backup-data
              mountPath: /backup-data
            - name: vps0-ssh
              mountPath: /ssh
              readOnly: true
            - name: bigpc-ssh-run
              mountPath: /ssh-bigpc
              readOnly: true
            # The Syncthing-synced private config checkout; a directory mount
            # (not a file) so atomic config replacements are seen. Writable:
            # the UI commits task-meta.json and Contacts Discover edits its
            # collection list here.
            - name: config-src
              mountPath: /config-src
        # The Selenium sidecar a scraper task drives; its viewer is embedded
        # in the task cards for manual logins (2FA). One session at a time.
        - name: browser
          image: selenium/standalone-chromium:4.51.0@sha256:c7c17cd79c62819a8329df00e610dbc4073c279da034a6f37135d454eb0d8870
          securityContext:
            # The image runs Chrome as seluser (1200); the pod fsGroup (MY_UID)
            # owns the profile volume, so join that group for write access.
            runAsUser: 1200
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            # Manual logins/2FA can idle for a long time.
            - name: SE_SESSION_TIMEOUT
              value: "7200"
            - name: SE_NODE_MAX_SESSIONS
              value: "1"
            - name: SE_VNC_NO_PASSWORD
              value: "1"
            - name: SE_SCREEN_WIDTH
              value: "1920"
            - name: SE_SCREEN_HEIGHT
              value: "1080"
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
            requests:
              memory: 256Mi
              cpu: 100m
          volumeMounts:
            - name: browser-profile
              mountPath: /home/seluser/.config
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: staging
          emptyDir:
            sizeLimit: 8Gi
        - name: home
          persistentVolumeClaim:
            claimName: backupctl-home-pvc
        - name: main-backups
          persistentVolumeClaim:
            claimName: hostpath-main-node-backups-pvc
        - name: main-media
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-pvc
        - name: main-documents
          persistentVolumeClaim:
            claimName: hostpath-main-node-documents-pvc
        - name: infra-current
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/Main/Infra/current_target
            type: Directory
        - name: state-backups
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/Main/Infra/state_backups
            type: DirectoryOrCreate
        - name: backup-data
          persistentVolumeClaim:
            claimName: task-runner-backup-pvc
        - name: vps0-ssh
          secret:
            secretName: state-backup-vps0-ssh
            defaultMode: 0400
        - name: bigpc-ssh
          secret:
            secretName: state-backup-bigpc-ssh
            defaultMode: 0400
        - name: bigpc-ssh-run
          emptyDir: {}
        # The private config checkout (config.mjs + apps/ + tools/).
        - name: config-src
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/Main/Code/Automation/dscpln-config
            type: Directory
        - name: browser-profile
          persistentVolumeClaim:
            claimName: backupctl-browser-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
{{ include "dscpln.service" (dict "name" "task-runner" "targetPort" "http" "port" 8085) }}
---
# Scrape the Task Runner's per-task run gauges (the dead-man switch).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: task-runner
  namespace: apps
spec:
  selector:
    matchLabels:
      app: task-runner
  podMetricsEndpoints:
    - port: http
      path: /tasks/api/metrics
      interval: 60s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-task-runner-metrics-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: task-runner
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - protocol: TCP
          port: 8085
  policyTypes:
    - Ingress
