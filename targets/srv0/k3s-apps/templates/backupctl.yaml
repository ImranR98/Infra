# backupctl (D$CPLN Task Runner) — the config-driven backup runner, also
# deployed as a bridge instance on srv0 so upload/ingest tasks are usable from
# any browser behind Authelia. The same synced monorepo config.mjs is mounted
# read-only (edits need a pod restart, no image rebuild), the shared Main tree
# is mounted at the same path, and `host:` fields in config.mjs pin tasks to a
# machine (BACKUPCTL_HOST). The image carries the monorepo (tools/ included) and
# BACKUPCTL_REPO_DIR=/app makes the repo_dir token point at it.
---
# Deliberately NOT labeled auto-backup: this holds tool venvs plus
# ~/.backupctl run state (captured scrape output). Archives land in the
# Syncthing-replicated Main/Infra/k3s_state_backups tree, so backing it up
# would copy financial/2FA-adjacent data onto every synced device.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backupctl-home-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Chrome profiles for the login-browser sidecar: logins survive pod restarts
# (the scraper tools point their --user-data-dir under /home/seluser/.config).
# Deliberately NOT labeled auto-backup: these profiles carry live third-party
# sessions (bank/Instacart); a plain-tar archive in the Syncthing-replicated
# k3s_state_backups tree would be a session-hijack kit.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backupctl-browser-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-runner
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-runner
  template:
    metadata:
      labels:
        app: task-runner
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      securityContext:
        # s0: writes into the shared Main tree stay readable by host processes
        # and other containers (same as dscpln/file-pipelines).
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: task-runner
          image: imranrdev/dscpln-task-runner:latest@sha256:6a6a4b3d3106336bfcced78c7cdaf9dd7569e625f3017f24991e484652dabcb7
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: HOME
              value: /home/imranr
            # Tasks pinned to another machine show as unavailable on this one.
            - name: BACKUPCTL_HOST
              value: srv0
            - name: BACKUPCTL_CONFIG_FILE
              value: /config-src/config.mjs
            # The monorepo root baked into the image (the repo_dir token).
            - name: BACKUPCTL_REPO_DIR
              value: /app
            - name: BACKUPCTL_STATE_DIR
              value: /home/imranr/.backupctl
            - name: BACKUPCTL_TMP_DIR
              value: /home/imranr/tmp
            # Git identity for task commits (lib.sh git-commit).
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: GIT_COMMITTER_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_COMMITTER_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: BASE_PATH
              value: /tasks
            # Requests must carry Authelia's Remote-User (stamped by Traefik
            # forward-auth); the raw /browser WS upgrade is checked too.
            - name: AUTH_MODE
              value: proxy-header
            # Login-browser sidecar: noVNC viewer proxied at /tasks/browser/,
            # WebDriver for the scraper tools (local Chrome when unset).
            - name: BROWSER_REMOTE
              value: http://localhost:7900
            - name: SELENIUM_REMOTE_URL
              value: http://localhost:4444
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 50m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/tasks/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/imranr
            # Narrow per-tree mounts (the tasks only ever touch these three
            # top-level dirs); no whole-Main mount.
            - name: main-backups
              mountPath: /home/imranr/Main/Backups
            - name: main-media
              mountPath: /home/imranr/Main/Media
            - name: main-documents
              mountPath: /home/imranr/Main/Documents
            - name: config-src
              mountPath: /config-src
              readOnly: true
        # The Selenium sidecar a scraper task drives; its viewer is embedded
        # in the task cards for manual logins (2FA). One session at a time.
        - name: browser
          image: selenium/standalone-chromium:4.51.0@sha256:c7c17cd79c62819a8329df00e610dbc4073c279da034a6f37135d454eb0d8870
          securityContext:
            # The image runs Chrome as seluser (1200); the pod fsGroup (MY_UID)
            # owns the profile volume, so join that group for write access.
            runAsUser: 1200
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            # Manual logins/2FA can idle for a long time.
            - name: SE_SESSION_TIMEOUT
              value: "7200"
            - name: SE_NODE_MAX_SESSIONS
              value: "1"
            - name: SE_VNC_NO_PASSWORD
              value: "1"
            - name: SE_SCREEN_WIDTH
              value: "1920"
            - name: SE_SCREEN_HEIGHT
              value: "1080"
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
            requests:
              memory: 256Mi
              cpu: 100m
          volumeMounts:
            - name: browser-profile
              mountPath: /home/seluser/.config
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: home
          persistentVolumeClaim:
            claimName: backupctl-home-pvc
        - name: main-backups
          persistentVolumeClaim:
            claimName: hostpath-main-node-backups-pvc
        - name: main-media
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-pvc
        - name: main-documents
          persistentVolumeClaim:
            claimName: hostpath-main-node-documents-pvc
        # The Syncthing-synced private workflows checkout (config.mjs + tools/);
        # a directory mount (not a file) so atomic config replacements are seen.
        - name: config-src
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/Main/Code/Automation/dscpln-workflows
            type: Directory
        - name: browser-profile
          persistentVolumeClaim:
            claimName: backupctl-browser-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
{{ include "dscpln.service" (dict "name" "task-runner" "targetPort" "http" "port" 8085) }}
