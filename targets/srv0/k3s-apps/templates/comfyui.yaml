{{- $comfyuiEnabled := ne (include "gpu.profile" .) "none" -}}
{{- if $comfyuiEnabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: comfyui-model-paths
  namespace: apps
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
data:
  # ComfyUI's own model tree lives in the image; point it at the persistent
  # tree and make Manager install user nodes under /data/custom_nodes so they
  # survive image upgrades.
  extra_model_paths.yaml: |
    comfyui:
      is_default: true
      base_path: /data/models
      checkpoints: checkpoints
      clip: clip
      clip_vision: clip_vision
      configs: configs
      controlnet: controlnet
      diffusers: diffusers
      diffusion_models: diffusion_models
      embeddings: embeddings
      gligen: gligen
      hypernetworks: hypernetworks
      loras: loras
      model_patches: model_patches
      photomaker: photomaker
      style_models: style_models
      text_encoders: text_encoders
      unet: unet
      upscale_models: upscale_models
      vae: vae
      vae_approx: vae_approx
    comfyui_user_nodes:
      is_default: true
      custom_nodes: /data/custom_nodes
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: comfyui-data-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ include "path.home" . }}/ai/comfyui
  # Same singleton AI-data label as the llama model volume; the pod itself has
  # no node affinity and is placed by the amd-dgpu extended resource.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/amd-dgpu
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 500Gi
  volumeName: comfyui-data-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: apps
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: comfyui
      app.kubernetes.io/instance: comfyui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comfyui
        app.kubernetes.io/instance: comfyui
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seType" "spc_t" "seLevel" "s0") | nindent 8 }}
      initContainers:
        - name: prepare-data
          image: fedora:44
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data/input /data/output /data/user /data/models /data/models/checkpoints /data/custom_nodes /data/cache /data/home
              if [ ! -e /data/.owner-{{ .Values.MY_UID }} ]; then
                chown -R {{ .Values.MY_UID }}:{{ .Values.MY_UID }} /data
                chcon -R -t container_file_t /data
                touch /data/.owner-{{ .Values.MY_UID }}
                chown {{ .Values.MY_UID }}:{{ .Values.MY_UID }} /data/.owner-{{ .Values.MY_UID }}
              fi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: comfyui
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID) | nindent 12 }}
          image: docker.io/zuzupebbles/comfyui-rocm-agamemnon:v0.11.0@sha256:7f1f0dd41a6550a55c7eeba1d572f19ac775f8b128639b71fc7bbe3b18c8bb30
          imagePullPolicy: IfNotPresent
          command:
            - python
            - main.py
          args:
            - "--listen"
            - "0.0.0.0"
            - "--port"
            - "8188"
            - "--disable-auto-launch"
            - "--use-pytorch-cross-attention"
            - "--disable-smart-memory"
            - "--reserve-vram"
            - "1"
            - "--user-directory"
            - "/data/user"
            - "--input-directory"
            - "/data/input"
            - "--output-directory"
            - "/data/output"
            - "--temp-directory"
            - "/tmp/comfy"
            - "--extra-model-paths-config"
            - "/conf/extra_model_paths.yaml"
          env:
            - name: TZ
              value: "{{ .Values.TZ }}"
            - name: HOME
              value: /data/home
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            # The image docs recommend expandable_segments on RDNA4; if a
            # gfx1201 crash is observed, drop that option and keep the GC
            # threshold only.
            - name: PYTORCH_HIP_ALLOC_CONF
              value: "expandable_segments:True,garbage_collection_threshold:0.8"
            - name: PYTORCH_TUNABLEOP_ENABLED
              value: "1"
            - name: PYTORCH_TUNABLEOP_TUNING
              value: "0"
            - name: PYTORCH_TUNABLEOP_FILENAME
              value: "/data/cache/tunableop/results.csv"
            - name: MIOPEN_USER_DB_PATH
              value: "/data/cache/miopen"
            - name: MIOPEN_CUSTOM_CACHE_DIR
              value: "/data/cache/miopen"
            - name: TRITON_CACHE_DIR
              value: "/data/cache/triton"
            - name: HIP_CACHE_DIR
              value: "/data/cache/hip"
            - name: ROCM_CACHE_DIR
              value: "/data/cache/rocm"
            - name: PYTORCH_KERNEL_CACHE_PATH
              value: "/data/cache/pytorch"
            - name: YOLO_CONFIG_DIR
              value: "/data/cache/ultralytics"
          ports:
            - name: http
              containerPort: 8188
              protocol: TCP
          resources:
            limits:
              memory: 20Gi
              infra.local/amd-dgpu: "1"
            requests:
              memory: 4Gi
              cpu: 100m
              infra.local/amd-dgpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: comfyui-data-pvc
        - name: conf
          configMap:
            name: comfyui-model-paths
        - name: tmp
          emptyDir:
            sizeLimit: 16Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      tolerations:
        - effect: PreferNoSchedule
          key: scheduling-discouraged
          operator: Equal
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui
  namespace: apps
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8188
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: comfyui-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - vis.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: comfyui
          namespace: apps
          port: 8188
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-comfyui-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: comfyui
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8188
  policyTypes:
    - Ingress
{{- end }}
