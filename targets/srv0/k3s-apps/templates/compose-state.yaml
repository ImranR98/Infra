# Infra Compose State (D$CPLN) — scheduled backups of the compose runtime
# state on srv0 (locally) and vps0 (over SSH). Generates its own ed25519 key
# on first boot; the public key is shown in the UI to authorize on vps0.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compose-state-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compose-state
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: compose-state
  template:
    metadata:
      labels:
        app: compose-state
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      securityContext:
        # s0: archives are written into the shared Main tree.
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: compose-state
          image: imranrdev/dscpln-compose:latest@sha256:efe9ce35aecf2f92cffb0421b12a8bd246d0644ab4f1f3d61544692acae3081f
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/imranr
            - name: DSCPLN_DATA_DIR
              value: /data
            - name: TZ
              value: America/Toronto
            - name: BASE_PATH
              value: /compose
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 64Mi
              cpu: 10m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/compose/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /data
            - name: main
              mountPath: /home/imranr/Main
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          persistentVolumeClaim:
            claimName: compose-state-pvc
        - name: main
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
---
{{ include "dscpln.service" (dict "name" "compose-state" "targetPort" "http" "port" 8080) }}
