# Contacts + Calendar (D$CPLN) — scheduled Nextcloud CardDAV/CalDAV exports
# into ~/Main/Backups/Manual, git-committed. Config (credentials, collections,
# schedule) and state live on a Longhorn volume edited from the UI; the Main
# tree is mounted so the destination is the real backup folder.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: contacts-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts-calendar
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: contacts-calendar
  template:
    metadata:
      labels:
        app: contacts-calendar
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
        # s0: git commits and exports land in the shared Main tree.
        seLinuxOptions:
          level: s0
      containers:
        - name: contacts-calendar
          image: imranrdev/dscpln-contacts:latest@sha256:65328fd5093caee751254275eb920337f5637f9b3497f713d6f6b00ad70e1a5c
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/imranr
            - name: DSCPLN_DATA_DIR
              value: /data
            - name: TZ
              value: America/Toronto
            - name: BASE_PATH
              value: /contacts
            # Git identity for the export commits (same values as the bridge).
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: GIT_COMMITTER_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_COMMITTER_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 64Mi
              cpu: 10m
          readinessProbe:
            httpGet:
              path: /contacts/api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /data
            - name: main
              mountPath: /home/imranr/Main
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: contacts-config-pvc
        - name: main
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: contacts-calendar
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: contacts-calendar
  ports:
    - name: http
      port: 8080
      targetPort: http
