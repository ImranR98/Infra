# Contacts + Calendar (D$CPLN) — scheduled Nextcloud CardDAV/CalDAV exports
# into ~/Main/Backups/Manual, git-committed. Config (credentials, collections,
# schedule) and state live on a Longhorn volume edited from the UI; the Main
# tree is mounted so the destination is the real backup folder.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: contacts-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts-calendar
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: contacts-calendar
  template:
    metadata:
      labels:
        app: contacts-calendar
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      securityContext:
        # s0: git commits and exports land in the shared Main tree.
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: contacts-calendar
          image: imranrdev/dscpln-contacts:latest@sha256:edcce62959e7c6b03b79895c5fc651edbb0c24f0742091882389117b0a0aaada
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/imranr
            - name: DSCPLN_DATA_DIR
              value: /data
            - name: TZ
              value: America/Toronto
            - name: BASE_PATH
              value: /contacts
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            # Git identity for the export commits (same values as the bridge).
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: GIT_COMMITTER_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_COMMITTER_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 64Mi
              cpu: 10m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/contacts/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /data
            - name: main
              mountPath: /home/imranr/Main
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          persistentVolumeClaim:
            claimName: contacts-config-pvc
        - name: main
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
---
{{ include "dscpln.service" (dict "name" "contacts-calendar" "targetPort" "http" "port" 8080) }}
