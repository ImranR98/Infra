{{- $secret := lookup "v1" "Secret" .Release.Namespace "d4ta-port-blocker-token" -}}
{{- $token := "" -}}
{{- if and $secret $secret.data (index $secret.data "token") -}}
{{- $token = index $secret.data "token" | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end }}
# Deployment secrets for the D4TA chart.
#
# VAPID keys are the existing TAG5 web-push identity; keeping them stable lets
# installed clients keep their push subscriptions after the hostname change.
# The ntfy token is the write-only service account token the notification relay
# uses; modules never see it.
---
apiVersion: v1
kind: Secret
metadata:
  name: d4ta-port-blocker-token
  namespace: apps
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tag5-vapid
  namespace: apps
type: Opaque
stringData:
  VAPID_PUBLIC_KEY: "{{ .Values.TAG5_VAPID_PUBLIC_KEY }}"
  VAPID_PRIVATE_KEY: "{{ .Values.TAG5_VAPID_PRIVATE_KEY }}"
  VAPID_SUBJECT: "{{ .Values.TAG5_VAPID_SUBJECT }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: d4ta-ntfy-token
  namespace: apps
type: Opaque
stringData:
  token: "{{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}"
