# D4TA private storage.
#
# The suite shares one config checkout (all module config under apps/<module>,
# plus FL0W's writable .state). The Excel ledger keep its own small hostpath
# claim so the git repository is independent of the config tree. Both are
# pinned to the hostpath-main node by the PV affinity, not a pod nodeSelector.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: d4ta-config-pv
spec:
  capacity:
    storage: 4Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ include "path.d4taConfig" . }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d4ta-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 4Gi
  volumeName: d4ta-config-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: d4ta-ledger-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ include "path.d4taLedger" . }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d4ta-ledger-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 100Mi
  volumeName: d4ta-ledger-pv
---
# TAG5 media index and generated assets. SQLite needs a real local filesystem;
# the chart mounts this claim at /data. The backup task copies the claim, with
# the rebuildable caches excluded by the annotation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: d4ta-tags-pvc
  namespace: apps
  labels:
    auto-backup: "true"
  annotations:
    backup.infra/exclude: "thumbs,previews,face-thumbs,models"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-apps
  resources:
    requests:
      storage: 50Gi
