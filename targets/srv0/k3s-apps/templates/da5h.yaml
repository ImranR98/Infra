# DA5H: infrastructure dashboard with Lockdown as its first module.
#
# The dashboard and Lockdown API are a normal app behind Authelia. The blocker
# is a separate host-network pod pinned to srv0; it listens only on the flannel
# bridge address and requires the token below. The dashboard server is the only
# client; the browser never receives the token.
---
{{- $secret := lookup "v1" "Secret" .Release.Namespace "da5h-port-blocker-token" -}}
{{- $token := "" -}}
{{- if and $secret $secret.data (index $secret.data "token") -}}
{{- $token = index $secret.data "token" | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: da5h-port-blocker-token
  namespace: apps
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: da5h
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: da5h
  template:
    metadata:
      labels:
        app: da5h
      annotations:
        checksum/token: {{ $token | sha256sum }}
    spec:
      nodeSelector:
        infra.local/external-exposed: "true"
      securityContext:
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID) | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: da5h
          image: ghcr.io/imranr98/da5h:latest@sha256:3904f641fd3f92b8648c3eb7eed3715b79b426f7bb588a6bd53fb498f1cd37a1
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BASE_PATH
              value: ""
            - name: AUTH_MODE
              value: proxy-header
            - name: AUTH_EXEMPT_PATHS
              value: /api/notify
            - name: PORT_BLOCKER_URL
              value: http://10.42.0.1:8794
            - name: PORT_BLOCKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: da5h-port-blocker-token
                  key: token
            - name: DA5H_CONFIG
              value: /config/config.json
            - name: LOCKDOWN_CONFIG
              value: /config/lockdown.json
            - name: APP_ORIGIN
              value: "https://dash.{{ .Values.SERVICES_DOMAIN }}"
            - name: UV_USE_IO_URING
              value: "0"
          {{- include "infra.resources" (dict "tier" "small") | nindent 10 }}
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: config
          persistentVolumeClaim:
            claimName: da5h-app-config-pvc
---
{{ include "dscpln.service" (dict "name" "da5h" "targetPort" "http" "port" 8080) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: da5h-blocker
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: da5h-blocker
  template:
    metadata:
      labels:
        app: da5h-blocker
      annotations:
        checksum/token: {{ $token | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        infra.local/external-exposed: "true"
      automountServiceAccountToken: false
      securityContext:
        seLinuxOptions:
          type: spc_t
          level: s0
      containers:
        - name: da5h-blocker
          image: ghcr.io/imranr98/da5h:latest@sha256:3904f641fd3f92b8648c3eb7eed3715b79b426f7bb588a6bd53fb498f1cd37a1
          command: ["node", "src/lockdown/blocker.mjs"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8794
          env:
            - name: PORT
              value: "8794"
            - name: PORT_BLOCKER_HOST
              value: 10.42.0.1
            - name: PORT_BLOCKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: da5h-port-blocker-token
                  key: token
            - name: LOCKDOWN_CONFIG
              value: /config/lockdown.json
          {{- include "infra.resources" (dict "tier" "tiny") | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8794
              host: 10.42.0.1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: config
          persistentVolumeClaim:
            claimName: da5h-app-config-pvc
---
# Other apps relay notifications through DA5H's /api/notify.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-da5h-notify-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: da5h
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dscpln
        - podSelector:
            matchLabels:
              app: fl0w
        - podSelector:
            matchLabels:
              app: watxt
      ports:
        - port: 8080
  policyTypes:
    - Ingress
