# Generic D$CPLN archive agent on bigpc. The agent program and image are
# generic; the job paths and token state live in the host-local private config
# and state directories.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dscpln-agent-bigpc
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dscpln-agent-bigpc
  template:
    metadata:
      labels:
        app: dscpln-agent-bigpc
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: bigpc
      tolerations:
        - key: scheduling-discouraged
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        fsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          type: spc_t
          level: s0
      containers:
        - name: agent
          image: ghcr.io/imranr98/dscpln-agent@sha256:22ab91c71038808c2a3315b64d3f16f05edaf8bc0ea72414081bc3321211cdc8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8788
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 64Mi
              cpu: 10m
          volumeMounts:
            - name: agent-config
              mountPath: /config
              readOnly: true
            - name: agent-state
              mountPath: /state
            - name: installs
              mountPath: /data/installs
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: agent-config
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/dscpln-agent
            type: Directory
        - name: agent-state
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/dscpln-agent/state
            type: Directory
        - name: installs
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/Games/Installs
            type: Directory
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dscpln-agent-bigpc
  namespace: apps
spec:
  selector:
    app: dscpln-agent-bigpc
  ports:
    - name: http
      port: 8788
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-task-runner-agent-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: dscpln-agent-bigpc
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: task-runner
      ports:
        - protocol: TCP
          port: 8788
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-task-runner-vps0-agent-egress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: task-runner
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.99.0.1/32
      ports:
        - protocol: TCP
          port: 8788
