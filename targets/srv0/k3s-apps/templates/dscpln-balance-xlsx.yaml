apiVersion: apps/v1
kind: Deployment
metadata:
  name: dscpln-balance-xlsx
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dscpln-balance-xlsx
  template:
    metadata:
      labels:
        app: dscpln-balance-xlsx
    spec:
      securityContext:
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seType" "spc_t" "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: dscpln-balance-xlsx
          image: ghcr.io/imranr98/dscpln-balance:latest@sha256:69ff13500038e6d7b98208646b0843fb360c6ad20e860ffbf9d689d9c3110aa4
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - containerPort: 3300
          resources:
            # ExcelJS loads the whole workbook (including the hidden sheets),
            # so the app needs well over the usual Node baseline.
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/balance/api/health" "port" "3300") | nindent 12 }}
          env:
            - name: APP
              value: balance
            # Silence Node/libuv io_uring SELinux denials on Fedora nodes.
            - name: UV_USE_IO_URING
              value: "0"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: BASE_PATH
              value: /balance
            - name: DSCPLN_CONFIG
              value: /config/config.json
            - name: AUTH_MODE
              value: proxy-header
            # The whole /balance/api prefix bypasses Authelia (scripts call it
            # without a browser session; the app token protects the sensitive
            # endpoints), so those requests never carry Remote-User either.
            - name: AUTH_EXEMPT_PATHS
              value: /api
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            # Notifications relay through the portal (ntfy URL/token live there).
            - name: DSCPLN_PORTAL_URL
              value: http://dscpln-portal:8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              subPath: apps/balance-xlsx
              readOnly: true
            # The git-tracked ledger repo lives on its own local PV, so the
            # claim (not a nodeSelector) pins the app to srv0.
            - name: dscpln-ledger
              mountPath: {{ include "path.dscplnLedger" . }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          persistentVolumeClaim:
            claimName: dscpln-config-pvc
        - name: dscpln-ledger
          persistentVolumeClaim:
            claimName: dscpln-ledger-pvc
---
{{ include "dscpln.service" (dict "name" "dscpln-balance-xlsx" "port" 3300) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dscpln-ledger-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ include "path.dscplnLedger" . }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dscpln-ledger-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 100Mi
  volumeName: dscpln-ledger-pv
---
# The task-runner's Wealthsimple import calls the external API directly;
# deny-all-ingress otherwise blocks pod-to-pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dscpln-task-runner-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: dscpln-balance-xlsx
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dscpln-task-runner
      ports:
        - port: 3300
  policyTypes:
    - Ingress
