# D$CPLN portal — the root landing page listing every function subpath, and
# the owner of the notification settings every app relays through.
# Reachable at the host root behind Authelia.
---
# Apps post notifications to the portal; deny-all-ingress otherwise blocks
# pod-to-pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dscpln-portal-notify-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: dscpln-portal
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - dscpln-balance-xlsx
                  - dscpln-file-pipelines
                  - dscpln-task-runner
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dscpln-portal
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dscpln-portal
  template:
    metadata:
      labels:
        app: dscpln-portal
    spec:
      securityContext:
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seType" "spc_t" "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: dscpln-portal
          image: ghcr.io/imranr98/dscpln-portal:latest@sha256:b94c7cdb2a0778f4e18b4b6ff1dad9c39f75415ead7760389357b7898f0689cb
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP
              value: portal
            # Requests must carry Authelia's Remote-User (stamped by Traefik
            # forward-auth); a request that bypasses the proxy is refused. The
            # notification relay stays exempt so in-cluster apps can post
            # without a browser session; external /api/notify still passes
            # through Authelia at the ingress.
            - name: AUTH_MODE
              value: proxy-header
            - name: AUTH_EXEMPT_PATHS
              value: /api/notify
            # Notification settings (ntfy URL + token) live in the portal's
            # apps/portal directory on the shared D$CPLN config PV.
            - name: DSCPLN_CONFIG_FILE
              value: /config/config.json
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
              cpu: 10m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config-src
              mountPath: /config
              subPath: apps/portal
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: config-src
          persistentVolumeClaim:
            claimName: dscpln-config-pvc
---
{{ include "dscpln.service" (dict "name" "dscpln-portal" "targetPort" "http" "port" 8080) }}
