# Shared private D$CPLN config checkout. A local PV carrying
# infra.local/hostpath-main nodeAffinity pins every consumer to srv0, so the
# workloads do not need their own nodeSelector. The tree is git-tracked and
# Syncthing-replicated; task-runner mounts the whole checkout read-write, the
# other apps mount only their apps/<name> subdirectory.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dscpln-config-pv
spec:
  capacity:
    storage: 4096Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ .Values.MAIN_PARENT_DIR }}/Main/Code/Automation/dscpln-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dscpln-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 4096Gi
  volumeName: dscpln-config-pv
