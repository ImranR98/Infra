{{- define "dscpln.config" -}}
{
  "port": 3300,
  "dataProvider": "textFileDataProvider",
  "providers": {
    "textFileDataProvider": {
      "dataFile": "/data/{{ .Values.DSCPLN_DATA_FILE }}",
      "budgetFile": "/data/budget.txt",
      "monthlyBudgetInit": {{ .Values.DSCPLN_BUDGET_INIT_AMT | quote }},
      "firstDayBiasInit": {{ .Values.DSCPLN_FIRST_DAY_BIAS_INIT_AMT | quote }}
    }
  },
  "notifications": {
    "monthlyLimitUrl": "http://ntfy.base.svc.cluster.local:3000/{{ .Values.TARGET }}_services_dscpln",
    "weeklyLimitUrl": "http://ntfy.base.svc.cluster.local:3000/{{ .Values.TARGET }}_services_dscpln",
    "ntfyToken": {{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN | quote }},
    "checkIntervalMinutes": 30,
    "onlyWarnOnce": false
  }
}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dscpln
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dscpln
  template:
    metadata:
      labels:
        app: dscpln
      annotations:
        # Mounted Secret contents only refresh on restart.
        checksum/dscpln-config: {{ include "dscpln.config" . | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          level: s0
      containers:
        - name: dscpln
          image: imranrdev/dscpln:latest@sha256:2f6fc97616b6958e4bd83e6f17e844b0089f3fa5c9905ed3e9ae34d49f000eba
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3300
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 3300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            # Silence Node/libuv io_uring SELinux denials on Fedora nodes.
            - name: UV_USE_IO_URING
              value: "0"
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: dscpln-data
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: dscpln-config
        - name: dscpln-data
          persistentVolumeClaim:
            claimName: dscpln-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dscpln
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: dscpln
  ports:
    - port: 3300
      targetPort: 3300
---
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dscpln-prod-tls
  namespace: apps
spec:
  secretName: dscpln-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - dscpln.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dscpln-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - dscpln.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: dscpln
          namespace: apps
          port: 3300
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dscpln-data-pv
spec:
  capacity:
    storage: 5Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ .Values.DSCPLN_TRANSACTIONS_PATH }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dscpln-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 5Mi
  volumeName: dscpln-data-pv
---
apiVersion: v1
kind: Secret
metadata:
  name: dscpln-config
  namespace: apps
type: Opaque
stringData:
  config.json: {{ include "dscpln.config" . | quote }}
