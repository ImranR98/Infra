# D$CPLN: the balance dashboard backed by the workbook ledger.
# Public host root; the token-protected external API bypasses Authelia at /api.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dscpln
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dscpln
  template:
    metadata:
      labels:
        app: dscpln
    spec:
      securityContext:
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seType" "spc_t" "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: dscpln
          image: ghcr.io/imranr98/dscpln:latest@sha256:1c2f9b7fad64840f44faaacab04ec54410cba49afbae02b494539fe2bbe6909a
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - containerPort: 3300
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/api/health" "port" "3300") | nindent 12 }}
          env:
            - name: BASE_PATH
              value: ""
            - name: UV_USE_IO_URING
              value: "0"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: DSCPLN_CONFIG
              value: /config/config.json
            - name: AUTH_MODE
              value: proxy-header
            - name: AUTH_EXEMPT_PATHS
              value: /api
            - name: APP_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            - name: NOTIFY_RELAY_URL
              value: http://da5h:8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true
            # The git-tracked ledger repo lives on its own local PV, so the
            # claim (not a nodeSelector) pins the app to srv0.
            - name: dscpln-ledger
              mountPath: {{ include "path.dscplnLedger" . }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          persistentVolumeClaim:
            claimName: dscpln-app-config-pvc
        - name: dscpln-ledger
          persistentVolumeClaim:
            claimName: dscpln-ledger-pvc
---
{{ include "dscpln.service" (dict "name" "dscpln" "port" 3300) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dscpln-ledger-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ include "path.dscplnLedger" . }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dscpln-ledger-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 100Mi
  volumeName: dscpln-ledger-pv
---
# FL0W's Wealthsimple import calls the external API directly; deny-all-ingress
# otherwise blocks pod-to-pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fl0w-dscpln-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: dscpln
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fl0w
        - podSelector:
            matchLabels:
              app: da5h
      ports:
        - port: 3300
  policyTypes:
    - Ingress
