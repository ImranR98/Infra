{{- define "dscpln.config" -}}
{
  "port": 3300,
  "dataProvider": "excelDataProvider",
  "providers": {
    "excelDataProvider": {
      "workbookFile": "{{ .Values.DSCPLN_LEDGER_PATH }}/{{ .Values.DSCPLN_WORKBOOK_FILE }}",
      "transactionsSheet": "Transactions",
      "constantsSheet": "Constants"
    }
  },
  "notifications": {
    "checkIntervalMinutes": 30,
    "onlyWarnOnce": false
  },
  "api": {
    "stateFile": "{{ .Values.DSCPLN_LEDGER_PATH }}/.dscpln-api-state.json"
  }
}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: balance-xlsx
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: balance-xlsx
  template:
    metadata:
      labels:
        app: balance-xlsx
      annotations:
        # Mounted Secret contents only refresh on restart.
        checksum/dscpln-config: {{ include "dscpln.config" . | sha256sum }}
    spec:
      securityContext:
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: balance-xlsx
          image: imranrdev/dscpln-balance:latest@sha256:757772b66acb307a421415fec5117de787c417c65fe320c9fb136a28912c3ce9
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - containerPort: 3300
          resources:
            # ExcelJS loads the whole workbook (including the hidden sheets),
            # so the app needs well over the usual Node baseline.
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/balance/api/health" "port" "3300") | nindent 12 }}
          env:
            # Silence Node/libuv io_uring SELinux denials on Fedora nodes.
            - name: UV_USE_IO_URING
              value: "0"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: BASE_PATH
              value: /balance
            - name: AUTH_MODE
              value: proxy-header
            # The whole /balance/api prefix bypasses Authelia (scripts call it
            # without a browser session; the app token protects the sensitive
            # endpoints), so those requests never carry Remote-User either.
            - name: AUTH_EXEMPT_PATHS
              value: /api
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            # Notifications relay through the portal (ntfy URL/token live there).
            - name: DSCPLN_PORTAL_URL
              value: http://portal:8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            # The git-tracked ledger repo is mounted at its host path so the
            # app can read Balance.xlsx and commit changes to it.
            - name: dscpln-ledger
              mountPath: {{ .Values.DSCPLN_LEDGER_PATH }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          secret:
            secretName: dscpln-config
        - name: dscpln-ledger
          persistentVolumeClaim:
            claimName: dscpln-ledger-pvc
---
{{ include "dscpln.service" (dict "name" "balance-xlsx" "port" 3300) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dscpln-ledger-pv
spec:
  capacity:
    storage: 100Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ .Values.DSCPLN_LEDGER_PATH }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dscpln-ledger-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 100Mi
  volumeName: dscpln-ledger-pv
---
apiVersion: v1
kind: Secret
metadata:
  name: dscpln-config
  namespace: apps
type: Opaque
stringData:
  config.json: {{ include "dscpln.config" . | quote }}
