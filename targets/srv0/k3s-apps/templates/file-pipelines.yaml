# File Pipelines (D$CPLN) — media ingestion daemon.
# Watches the phone-synced deviceSync tree, standardizes / concatenates /
# copies into the Main/Media tree, serves a web UI, and cleans up processed
# originals into trash only after verifying the destination copy.
#
# Config lives on a Longhorn volume (auto-backed-up) and is edited from the UI;
# trash + logs live on a host path outside any synced tree.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-pipelines-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Scoped access for remote pipeline runs: create/watch/delete Jobs, read their
# pod logs (streamed into the app log) and check node readiness.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-pipelines
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: file-pipelines
  namespace: apps
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: file-pipelines
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: file-pipelines
    namespace: apps
roleRef:
  kind: Role
  name: file-pipelines
  apiGroup: rbac.authorization.k8s.io
---
# Shared scratch space for remote pipeline jobs (RWX so pods on bigpc can
# write the output the app then moves into the destination).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-pipelines-staging-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-pipelines
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: file-pipelines
  template:
    metadata:
      labels:
        app: file-pipelines
    spec:
      securityContext:
        # s0: the pod reads Syncthing-written trees and writes files that host
        # processes and other containers must be able to read back.
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seLevel" "s0") | nindent 8 }}
      serviceAccountName: file-pipelines
      automountServiceAccountToken: true
      containers:
        - name: file-pipelines
          # Pin by digest after the first push so Renovate can bump deliberately.
          image: imranrdev/dscpln-file-pipelines:latest@sha256:a09fe4c94cbff966d17bf00af2b62c4334d6f8c1c71c5eab42e383e0043dc239
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8791
          env:
            - name: BASE_PATH
              value: /pipelines
            - name: AUTH_MODE
              value: proxy-header
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            # Remote pipeline runs: shared staging volume + the image jobs run.
            - name: PIPELINES_STAGING_DIR
              value: /staging
            - name: PIPELINES_STAGING_CLAIM
              value: file-pipelines-staging-pvc
            - name: PIPELINES_IMAGE
              value: imranrdev/dscpln-file-pipelines:latest
            # bigpc's game dirs carry user_home_t, which container_t cannot
            # read; spc_t reads them without relabeling (s0 keeps written
            # files category-free for the host), same as syncthing/filebrowser.
            - name: PIPELINES_SELINUX_TYPE
              value: spc_t
            - name: PIPELINES_SELINUX_LEVEL
              value: s0
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
              cpu: 100m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/pipelines/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: source
              mountPath: /source
            # Narrow per-tree mounts (configured destinations live under
            # Media/Backups/WhatsApp); no whole-Main mount.
            - name: destination-media
              mountPath: /destination/Media
            - name: destination-backups
              mountPath: /destination/Backups
            - name: destination-whatsapp
              mountPath: /destination/WhatsApp
            - name: config
              mountPath: /config
            - name: appdata
              mountPath: /appdata
            - name: pipeline-staging
              mountPath: /staging
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: source
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-pvc
        - name: destination-media
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-pvc
        - name: destination-backups
          persistentVolumeClaim:
            claimName: hostpath-main-node-backups-pvc
        - name: destination-whatsapp
          persistentVolumeClaim:
            claimName: hostpath-main-node-whatsapp-pvc
        - name: config
          persistentVolumeClaim:
            claimName: file-pipelines-config-pvc
        - name: appdata
          persistentVolumeClaim:
            claimName: hostpath-main-node-file-pipelines-pvc
        - name: pipeline-staging
          persistentVolumeClaim:
            claimName: file-pipelines-staging-pvc
---
{{ include "dscpln.service" (dict "name" "file-pipelines" "targetPort" "http" "port" 8791) }}
