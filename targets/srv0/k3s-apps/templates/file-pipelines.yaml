# File Pipelines (D$CPLN) — media ingestion daemon.
# Watches the phone-synced deviceSync tree, standardizes / concatenates /
# copies into the Main/Media tree, serves a web UI, and cleans up processed
# originals into trash only after verifying the destination copy.
#
# Config is the private dscpln-config checkout (edited from the UI); trash and
# logs live on a host path outside any synced tree.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-pipelines
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: file-pipelines
  template:
    metadata:
      labels:
        app: file-pipelines
    spec:
      securityContext:
        # s0: the pod reads Syncthing-written trees and writes files that host
        # processes and other containers must be able to read back.
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seType" "spc_t" "seLevel" "s0") | nindent 8 }}
      containers:
        - name: file-pipelines
          # Pin by digest after the first push so Renovate can bump deliberately.
          image: imranrdev/dscpln-file-pipelines:latest@sha256:0b56a8b7eb80439b5c8cc7ddcb65e0e0c4d33f98cab5687ceba460a3fa5e14aa
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8791
          env:
            - name: APP
              value: file-pipelines
            - name: BASE_PATH
              value: /pipelines
            - name: AUTH_MODE
              value: proxy-header
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            # Notifications relay through the portal (ntfy URL/token live there).
            - name: DSCPLN_PORTAL_URL
              value: http://portal:8080
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
              cpu: 100m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/pipelines/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: source
              mountPath: /source
            # Narrow per-tree mounts (configured destinations live under
            # Media/Backups/WhatsApp); no whole-Main mount.
            - name: destination-media
              mountPath: /destination/Media
            - name: destination-backups
              mountPath: /destination/Backups
            - name: destination-whatsapp
              mountPath: /destination/WhatsApp
            - name: config
              mountPath: /config
            - name: appdata
              mountPath: /appdata
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: source
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-pvc
        - name: destination-media
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-pvc
        - name: destination-backups
          persistentVolumeClaim:
            claimName: hostpath-main-node-backups-pvc
        - name: destination-whatsapp
          persistentVolumeClaim:
            claimName: hostpath-main-node-whatsapp-pvc
        - name: config
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/Main/Code/Automation/dscpln-config/apps/file-pipelines
            type: Directory
        - name: appdata
          persistentVolumeClaim:
            claimName: hostpath-main-node-file-pipelines-pvc
---
{{ include "dscpln.service" (dict "name" "file-pipelines" "targetPort" "http" "port" 8791) }}
