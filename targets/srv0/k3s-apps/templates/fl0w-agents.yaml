# Generic FL0W agents. One Deployment/Service per FL0W_AGENTS entry; each
# entry gets a ConfigMap for agent.json, a local PV/PVC for the state tree, a
# local PV/PVC per data mount, and one artifact-fetch initContainer per
# artifact. The PV nodeAffinity pins the pod to the node that owns the paths,
# so no pod nodeSelector is needed. Job definitions are deployment config.
{{ $root := . }}
{{ range $name, $agent := .Values.FL0W_AGENTS }}
{{- $node := required (printf "FL0W_AGENTS.%s.node" $name) $agent.node -}}
{{- $stateSubdir := required (printf "FL0W_AGENTS.%s.stateSubdir" $name) $agent.stateSubdir -}}
{{- $statePath := printf "%s/%s" $root.Values.MAIN_PARENT_DIR $stateSubdir -}}
{{- $configJSON := required (printf "FL0W_AGENTS.%s.config" $name) $agent.config -}}
{{- $gtk := eq (default "slim" $agent.runtime) "gtk" -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fl0w-agent-{{ $name }}-config
  namespace: apps
  labels:
    app.kubernetes.io/name: fl0w-agent
    fl0w-agent: {{ $name }}
data:
  agent.json: |
{{ $configJSON | indent 4 }}
---
# The claim names are retained from the old config layout. The PVC root is
# the agent's /state tree (token + work) and is mounted directly at /state.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fl0w-agent-{{ $name }}-config-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ $statePath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ $node | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fl0w-agent-{{ $name }}-config-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 1Gi
  volumeName: fl0w-agent-{{ $name }}-config-pv
{{ range $mount := $agent.dataMounts }}
{{- $mountName := required (printf "FL0W_AGENTS.%s.dataMounts[].name" $name) $mount.name -}}
{{- $mountSubdir := required (printf "FL0W_AGENTS.%s.dataMounts[%s].subdir" $name $mountName) $mount.subdir -}}
{{- $dataPath := printf "%s/%s" $root.Values.MAIN_PARENT_DIR $mountSubdir -}}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fl0w-agent-{{ $name }}-{{ $mountName }}-pv
spec:
  capacity:
    storage: {{ $mount.capacity | default "4096Gi" }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ $dataPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ $node | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fl0w-agent-{{ $name }}-{{ $mountName }}-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: {{ $mount.capacity | default "4096Gi" }}
  volumeName: fl0w-agent-{{ $name }}-{{ $mountName }}-pv
{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl0w-agent-{{ $name }}
  namespace: apps
  labels:
    app.kubernetes.io/name: fl0w-agent
    fl0w-agent: {{ $name }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fl0w-agent-{{ $name }}
  template:
    metadata:
      labels:
        app: fl0w-agent-{{ $name }}
        app.kubernetes.io/name: fl0w-agent
        fl0w-agent: {{ $name }}
      annotations:
        checksum/config: {{ $configJSON | sha256sum }}
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: infra.local/noschedule
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: {{ $root.Values.MY_UID }}
        runAsGroup: {{ $root.Values.MY_UID }}
        fsGroup: {{ $root.Values.MY_UID }}
        fsGroupChangePolicy: OnRootMismatch
        seLinuxOptions:
          type: spc_t
          level: s0
      {{- if $agent.artifacts }}
      initContainers:
      {{- range $artifact := $agent.artifacts }}
      {{- $artifactName := required (printf "FL0W_AGENTS.%s.artifacts[].name" $name) $artifact.name }}
      {{- $artifactRepo := required (printf "FL0W_AGENTS.%s.artifacts[%s].repo" $name $artifactName) $artifact.repo }}
      {{- $artifactAsset := required (printf "FL0W_AGENTS.%s.artifacts[%s].asset" $name $artifactName) $artifact.asset }}
      {{- $artifactMember := required (printf "FL0W_AGENTS.%s.artifacts[%s].member" $name $artifactName) $artifact.member }}
      {{- $artifactDest := required (printf "FL0W_AGENTS.%s.artifacts[%s].dest" $name $artifactName) $artifact.dest }}
      {{- $artifactVersion := default $root.Values.LUDUSAVI_VERSION $artifact.version }}
      {{- $artifactAsset = replace "{version}" $artifactVersion $artifactAsset }}
      {{- $artifactURL := printf "https://github.com/%s/releases/download/v%s/%s" $artifactRepo $artifactVersion $artifactAsset }}
        - name: fetch-{{ $artifactName }}
          {{- if $gtk }}
          image: ghcr.io/imranr98/fl0w-agent-gtk:latest@sha256:7c775a678814bc2fa9d1e5801788595edd7eb35386194d354e2b0053caa8da1a
          {{- else }}
          image: ghcr.io/imranr98/fl0w-agent:latest@sha256:1ac43219cae0f019a52c9418434aea35d462a0b02fea6423b5f6d56507f6bee0
          {{- end }}
          imagePullPolicy: IfNotPresent
          command:
            - /app/fetch-artifact.sh
          env:
            - name: ARTIFACT_URL
              value: {{ $artifactURL | quote }}
            - name: ARTIFACT_VERSION
              value: {{ $artifactVersion | quote }}
            - name: ARTIFACT_MEMBER
              value: {{ $artifactMember | quote }}
            - name: ARTIFACT_DEST
              value: {{ $artifactDest | quote }}
            - name: ARTIFACT_CHECK_ARGS
              value: {{ $artifact.checkArgs | default "" | quote }}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
          {{- include "infra.resources" (dict "tier" "tiny") | nindent 10 }}
      {{- end }}
      {{- end }}
      containers:
        - name: agent
          {{- if $gtk }}
          image: ghcr.io/imranr98/fl0w-agent-gtk:latest@sha256:7c775a678814bc2fa9d1e5801788595edd7eb35386194d354e2b0053caa8da1a
          {{- else }}
          image: ghcr.io/imranr98/fl0w-agent:latest@sha256:1ac43219cae0f019a52c9418434aea35d462a0b02fea6423b5f6d56507f6bee0
          {{- end }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8788
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
          {{- include "infra.resources" (dict "tier" "small") | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            # Writable parent for HOME; the host data mounts sit below it.
            - name: home
              mountPath: /home/imranr
            {{ range $mount := $agent.dataMounts }}
            - name: data-{{ $mount.name }}
              mountPath: {{ required (printf "FL0W_AGENTS.%s.dataMounts[%s].mountPath" $name $mount.name) $mount.mountPath }}
              readOnly: {{ if hasKey $mount "readOnly" }}{{ $mount.readOnly }}{{ else }}true{{ end }}
            {{ end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: fl0w-agent-{{ $name }}-config
        - name: state
          persistentVolumeClaim:
            claimName: fl0w-agent-{{ $name }}-config-pvc
        - name: home
          emptyDir: {}
        {{ range $mount := $agent.dataMounts }}
        - name: data-{{ $mount.name }}
          persistentVolumeClaim:
            claimName: fl0w-agent-{{ $name }}-{{ $mount.name }}-pvc
        {{ end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fl0w-agent-{{ $name }}
  namespace: apps
spec:
  selector:
    app: fl0w-agent-{{ $name }}
  ports:
    - name: http
      port: 8788
      targetPort: http
{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fl0w-agent-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fl0w-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fl0w
      ports:
        - protocol: TCP
          port: 8788
