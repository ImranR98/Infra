{{- $homeDir := include "path.home" . -}}
# FL0W: unified tasks + file pipelines.
#
# One process runs the task scheduler, the file-pipeline watcher/queue and the
# optional Selenium login browser. It runs as root so backup tasks can read
# every app PVC; user-data tasks drop to MY_UID via their run_as fields.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backupctl-home-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-runner-backup-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backupctl-browser-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fl0w-backup
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fl0w-backup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fl0w-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fl0w-backup
subjects:
  - kind: ServiceAccount
    name: fl0w-backup
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fl0w
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fl0w
  template:
    metadata:
      labels:
        app: fl0w
    spec:
      serviceAccountName: fl0w-backup
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0
        runAsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          type: spc_t
          level: s0
      initContainers:
        - name: prepare-runtime
          image: busybox:1.38.0-uclibc@sha256:b2e35951f72501f6a99f1bf45bcfe6d4795be08c518c2f97d0ed2fe776958a3b
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              uid={{ .Values.MY_UID }}
              gid={{ .Values.MY_UID }}

              mkdir -p {{ $homeDir }}/.cache {{ $homeDir }}/.venvs {{ $homeDir }}/.android {{ $homeDir }}/tmp
              chown "$uid:$gid" {{ $homeDir }}
              chmod 0755 {{ $homeDir }}
              for d in {{ $homeDir }}/.cache {{ $homeDir }}/.venvs {{ $homeDir }}/.android {{ $homeDir }}/tmp; do
                chown "$uid:$gid" "$d"
                chmod 0700 "$d"
              done

              for d in {{ $homeDir }}/Main/Backups {{ $homeDir }}/Main/Media {{ $homeDir }}/Main/Documents; do
                [ -d "$d" ] || continue
                chown "$uid:$gid" "$d"
                chmod 2775 "$d"
              done

              chown "$uid:$gid" /config
              chmod 2755 /config
              mkdir -p /config/.state
              chown -R "$uid:$gid" /config/.state
              find /config/.state -type d -exec chmod 0700 {} \;
              if [ -e /config/task-meta.json ]; then
                chown "$uid:$gid" /config/task-meta.json
                chmod 0664 /config/task-meta.json
              fi
              if [ -e /config/tools/contacts/config.json ]; then
                chown "$uid:$gid" /config/tools/contacts/config.json
                chmod 0644 /config/tools/contacts/config.json
              fi
          securityContext:
            runAsUser: 0
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
          volumeMounts:
            - name: home
              mountPath: {{ $homeDir }}
            - name: main-backups
              mountPath: {{ $homeDir }}/Main/Backups
            - name: main-media
              mountPath: {{ $homeDir }}/Main/Media
            - name: main-documents
              mountPath: {{ $homeDir }}/Main/Documents
            - name: config
              mountPath: /config
      containers:
        - name: fl0w
          image: ghcr.io/imranr98/fl0w:latest@sha256:4ab08583b90b52c52f5ba56db549e9a7e79376d43dae197b189709ea691bfbfb
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
                - FOWNER
                - CHOWN
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: HOME
              value: {{ $homeDir }}
            - name: TZ
              value: America/Toronto
            - name: FL0W_CONFIG
              value: /config/config.mjs
            - name: FL0W_PIPELINES_CONFIG
              value: /config/apps/file-pipelines/config.json
            - name: FL0W_STATE_DIR
              value: /config/.state
            - name: FL0W_TMP_DIR
              value: {{ $homeDir }}/tmp
            - name: BACKUPCTL_REPO_DIR
              value: /app
            - name: BACKUPCTL_HOST
              value: srv0
            - name: BACKUPCTL_SCHEDULES
              value: "1"
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: GIT_COMMITTER_NAME
              value: {{ .Values.BACKUPCTL_GIT_NAME | quote }}
            - name: GIT_COMMITTER_EMAIL
              value: {{ .Values.BACKUPCTL_GIT_EMAIL | quote }}
            - name: BASE_PATH
              value: ""
            - name: AUTH_MODE
              value: proxy-header
            - name: AUTH_EXEMPT_PATHS
              value: /api/metrics
            - name: BROWSER_REMOTE
              value: http://localhost:7900
            - name: SELENIUM_REMOTE_URL
              value: http://localhost:4444
            - name: NOTIFY_RELAY_URL
              value: http://da5h:8080
            - name: APP_ORIGIN
              value: "https://flow.{{ .Values.SERVICES_DOMAIN }}"
            - name: RESTIC_CACHE_DIR
              value: /backup-data/restic-cache
            - name: RESTIC_GID
              value: "{{ .Values.MY_UID }}"
          {{- include "infra.resources" (dict "tier" "xlarge") | nindent 10 }}
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: staging
              mountPath: /staging
            - name: source
              mountPath: /source
            - name: destination-media
              mountPath: /destination/Media
            - name: destination-backups
              mountPath: /destination/Backups
            - name: destination-whatsapp
              mountPath: /destination/WhatsApp
            - name: appdata
              mountPath: /appdata
            - name: home
              mountPath: {{ $homeDir }}
            - name: main-backups
              mountPath: {{ $homeDir }}/Main/Backups
            - name: main-media
              mountPath: {{ $homeDir }}/Main/Media
            - name: main-documents
              mountPath: {{ $homeDir }}/Main/Documents
            - name: infra-state
              mountPath: {{ include "path.infraState" . }}
              readOnly: true
            - name: state-backups
              mountPath: {{ $homeDir }}/Main/Infra/state_backups
            - name: backup-data
              mountPath: /backup-data
            - name: config
              mountPath: /config
        - name: browser
          image: selenium/standalone-chromium:4.52.0@sha256:b211549a4c35f11826bc1a7559b9f23ff055198517f8cb7d49ef74df01c5e38d
          securityContext:
            runAsUser: 1200
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: SE_SESSION_TIMEOUT
              value: "7200"
            - name: SE_NODE_MAX_SESSIONS
              value: "1"
            - name: SE_VNC_NO_PASSWORD
              value: "1"
            - name: SE_SCREEN_WIDTH
              value: "1920"
            - name: SE_SCREEN_HEIGHT
              value: "1080"
          {{- include "infra.resources" (dict "tier" "xlarge") | nindent 10 }}
          volumeMounts:
            - name: browser-profile
              mountPath: /home/seluser/.config
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: staging
          emptyDir:
            sizeLimit: 8Gi
        - name: source
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-pvc
        - name: destination-media
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-pvc
        - name: destination-backups
          persistentVolumeClaim:
            claimName: hostpath-main-node-backups-pvc
        - name: destination-whatsapp
          persistentVolumeClaim:
            claimName: hostpath-main-node-whatsapp-pvc
        - name: appdata
          persistentVolumeClaim:
            claimName: hostpath-main-node-file-pipelines-pvc
        - name: home
          persistentVolumeClaim:
            claimName: backupctl-home-pvc
        - name: main-backups
          persistentVolumeClaim:
            claimName: hostpath-main-node-backups-pvc
        - name: main-media
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-pvc
        - name: main-documents
          persistentVolumeClaim:
            claimName: hostpath-main-node-documents-pvc
        - name: infra-state
          hostPath:
            path: {{ include "path.infraState" . }}
            type: DirectoryOrCreate
        - name: state-backups
          hostPath:
            path: {{ include "path.infraRoot" . }}/state_backups
            type: DirectoryOrCreate
        - name: backup-data
          persistentVolumeClaim:
            claimName: task-runner-backup-pvc
        - name: config
          persistentVolumeClaim:
            claimName: fl0w-app-config-pvc
        - name: browser-profile
          persistentVolumeClaim:
            claimName: backupctl-browser-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
{{ include "dscpln.service" (dict "name" "fl0w" "targetPort" "http" "port" 8085) }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fl0w
  namespace: apps
spec:
  selector:
    matchLabels:
      app: fl0w
  podMetricsEndpoints:
    - port: http
      path: /api/metrics
      interval: 60s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fl0w-metrics-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: fl0w
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - protocol: TCP
          port: 8085
  policyTypes:
    - Ingress
---
# Agents live outside the pod network: the vps0 archive agent via the
# public-exposure tunnel and the bigpc agent over the LAN. Everything else in
# the app is cluster or public-internet traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fl0w-agent-egress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: fl0w
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.99.0.1/32
        - ipBlock:
            cidr: {{ .Values.BIGPC_HOST }}/32
      ports:
        - protocol: TCP
          port: 8788
---
# Quest wireless ADB is a LAN device; everything else in the app is cluster or
# public-internet traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fl0w-adb-egress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: fl0w
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.LAN_CIDR }}
      ports:
        - protocol: TCP
          port: 5555
        - protocol: TCP
          port: 5037
---
# DA5H's dashboard proxy reads the live FL0W job summary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-da5h-fl0w-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: fl0w
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: da5h
      ports:
        - protocol: TCP
          port: 8085
  policyTypes:
    - Ingress
