---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8191
          resources:
            limits:
              memory: 1.5Gi
            requests:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8191
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: TZ
              value: "{{ .Values.TZ }}"
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: flaresolverr
  ports:
    - port: 8191
      targetPort: 8191
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flaresolverr-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: flaresolverr
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prowlarr
      ports:
        - port: 8191
  policyTypes:
    - Ingress
