---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmd-stats
  namespace: apps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fmd-stats
  template:
    metadata:
      labels:
        app: fmd-stats
      annotations:
        checksum/fmd-stats-secret: {{ .Values.FMD_STATS_ADMIN_TOKEN | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          level: s0
      containers:
        - name: fmd-stats
          image: ghcr.io/imranr98/fmd-stats:latest@sha256:b009a3c882d6bbc76ecf208690e3e3a7e752eaabf7d283c8855cd4ae422bebe4
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3000
          {{- include "infra.resources" (dict "tier" "medium") | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "3000"
            - name: FMD_BASE_URL
              value: https://fmd.{{ .Values.SERVICES_DOMAIN }}
            - name: SYNC_INTERVAL_MINUTES
              value: "15"
            - name: VAPID_SUBJECT
              value: https://fmdstats.{{ .Values.SERVICES_DOMAIN }}
            - name: LOG_LEVEL
              value: info
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fmd-stats-secret
                  key: ADMIN_TOKEN
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fmd-stats-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fmd-stats
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: fmd-stats
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fmdstats-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - fmdstats.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: fmd-stats
          namespace: apps
          port: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fmd-stats-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-apps
---
apiVersion: v1
kind: Secret
metadata:
  name: fmd-stats-secret
  namespace: apps
type: Opaque
stringData:
  ADMIN_TOKEN: "{{ .Values.FMD_STATS_ADMIN_TOKEN }}"
