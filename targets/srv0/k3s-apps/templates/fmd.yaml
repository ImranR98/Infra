---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fmd
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fmd
  template:
    metadata:
      labels:
        app: fmd
      annotations:
        checksum/fmd-secret: {{ .Values.FMD_REGISTRATIONTOKEN | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
      containers:
        - name: fmd
          image: registry.gitlab.com/fmd-foss/fmd-server:0.17.1@sha256:1e4290d6a846e92822609fb10d9508ea9badfc329f2a04ba785a253bb95a7f74
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          {{- include "infra.resources" (dict "tier" "tiny") | nindent 10 }}
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: FMD_REGISTRATIONTOKEN
              valueFrom:
                secretKeyRef:
                  name: fmd-secret
                  key: FMD_REGISTRATIONTOKEN
          volumeMounts:
            - name: fmd-data
              mountPath: /var/lib/fmd-server/db/
      volumes:
        - name: fmd-data
          persistentVolumeClaim:
            claimName: fmd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fmd
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: fmd
  ports:
    - port: 8080
      targetPort: 8080
---
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fmd-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - fmd.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: fmd
          namespace: apps
          port: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fmd-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: Secret
metadata:
  name: fmd-secret
  namespace: apps
type: Opaque
stringData:
  FMD_REGISTRATIONTOKEN: "{{ .Values.FMD_REGISTRATIONTOKEN }}"
