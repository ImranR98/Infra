{{- $frigateDetector := include "gpu.frigateDetector" . | trim -}}
{{- $frigateResource := include "gpu.frigateResource" . | trim -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate
  namespace: apps
  labels:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/version: "0.18.2"
data:
  config.yml: |-
    mqtt:
      host: mosquitto
      port: 1883
      user: frigate
      password: '{FRIGATE_MQTT_PASSWORD}'
    ffmpeg:
      # VAAPI decode uses the selected GPU resource (intel-gpu/amd-igpu/
      # amd-dgpu), whose device plugin mapping exposes renderD128. Explicit
      # device because the auto-selector probes devices in arbitrary order.
      # -hwaccel_output_format nv12: decode on the GPU but deliver CPU frames,
      # so the detect/record filter chains (fps, scale) work.
{{- if ne $frigateDetector "cpu" }}
      hwaccel_args: -hwaccel_flags allow_profile_mismatch -hwaccel vaapi -hwaccel_device /dev/dri/renderD128 -hwaccel_output_format nv12
{{- end }}
      retry_interval: 5
{{- if eq $frigateDetector "openvino" }}
    detectors:
      openvino:
        type: openvino
        device: GPU
    # Bundled OpenVINO default model (SSDLite MobileNet v2, FP16 IR).
    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt
{{- else if eq $frigateDetector "rocm" }}
    detectors:
      onnx:
        type: onnx
    # ROCm/ONNX detector model. The exported YOLOv9 ONNX is NCHW float32;
    # yolo-generic selects Frigate's YOLO output parser. The model itself is
    # fetched into the config PVC by the ensure-model initContainer below.
    model:
      width: 320
      height: 320
      input_tensor: nchw
      input_dtype: float
      input_pixel_format: rgb
      path: /config/model_cache/yolov9-t-320.onnx
      labelmap_path: /labelmap/coco-80.txt
      model_type: yolo-generic
{{- else }}
    detectors:
      cpu:
        type: cpu
{{- end }}
    # Deployment-specific config (go2rtc streams, cameras) comes from
    # FRIGATE_ADDITIONAL_CONFIG in targets/srv0/config_template/values.yaml
{{ .Values.FRIGATE_ADDITIONAL_CONFIG | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: apps
  labels:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/version: "0.18.2"
spec:
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 5000
      protocol: TCP
      targetPort: http
    - name: http-auth
      port: 8971
      protocol: TCP
      targetPort: http-auth
    - name: rtmp
      port: 1935
      protocol: TCP
      targetPort: rtmp
    - name: rtsp
      port: 8554
      protocol: TCP
      targetPort: rtsp
    - name: webrtc-tcp
      port: 8555
      protocol: TCP
      targetPort: webrtc-tcp
    - name: webrtc-udp
      port: 8555
      protocol: UDP
      targetPort: webrtc-udp
  selector:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/instance: frigate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: apps
  labels:
    app.kubernetes.io/name: frigate
    app.kubernetes.io/instance: frigate
    app.kubernetes.io/version: "0.18.2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: frigate
      app.kubernetes.io/instance: frigate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frigate
        app.kubernetes.io/instance: frigate
        app.kubernetes.io/version: "0.18.2"
      annotations:
        checksum/config: {{ printf "%s-%s-%s" (.Values.FRIGATE_ADDITIONAL_CONFIG | sha256sum) $frigateDetector $frigateResource | sha256sum }}
    spec:
      # Keep the NVR on the main media node when possible. The accelerator
      # resource is the hard requirement; FRIGATE_GPU_RESOURCE=amd-dgpu can
      # still move it to bigpc when that fallback is selected.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: infra.local/hostpath-main
                    operator: In
                    values:
                      - "true"
      initContainers:
        - name: copyconfig
{{- if eq $frigateDetector "rocm" }}
          image: ghcr.io/blakeblackshear/frigate:0.18.2-rocm
{{- else }}
          image: ghcr.io/blakeblackshear/frigate:0.18.2
{{- end }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /config.yml
              subPath: config.yml
              name: configmap
            - mountPath: /config
              name: config
          command: ["cp"]
          args: ["-v", "/config.yml", "/config/config.yml"]
{{- if eq $frigateDetector "rocm" }}
        # Seed the ROCm detector model into the config PVC. The artifact is
        # committed at targets/srv0/assets/ and pinned by SHA-256; rebuilding
        # it is documented in docs/runbooks/hardware-swap.md. A missing or
        # corrupt file is re-fetched on the next pod start.
        - name: ensure-model
          image: curlimages/curl:8.23.0
          imagePullPolicy: IfNotPresent
          securityContext:
            # The curl image defaults to a non-root user; the NFS PVC root is
            # root-owned, so write as root like the app container does.
            runAsUser: 0
            runAsGroup: 0
            seLinuxOptions:
              level: s0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              target=/config/model_cache/yolov9-t-320.onnx
              want={{ required "FRIGATE_MODEL_SHA256 is required for the ROCm detector" .Values.FRIGATE_MODEL_SHA256 | quote }}
              url={{ required "FRIGATE_MODEL_URL is required for the ROCm detector" .Values.FRIGATE_MODEL_URL | quote }}
              if [ -s "$target" ] && [ "$(sha256sum "$target" | cut -d' ' -f1)" = "$want" ]; then
                echo "frigate model already present"
                exit 0
              fi
              mkdir -p /config/model_cache
              tmp="$target.part"
              curl -fsSL --retry 5 --retry-delay 2 -o "$tmp" "$url"
              got="$(sha256sum "$tmp" | cut -d' ' -f1)"
              if [ "$got" != "$want" ]; then
                echo "frigate model sha256 mismatch: got $got" >&2
                rm -f "$tmp"
                exit 1
              fi
              mv "$tmp" "$target"
              echo "frigate model staged"
          volumeMounts:
            - mountPath: /config
              name: config
{{- end }}
        # Frigate writes a preview restart cache on shutdown, then on the next
        # start tries to move it into the tmpfs preview dir and logs a
        # non-fatal error. Clear it before the app starts; previews simply
        # restart instead of restoring stale frames.
        - name: clear-preview-cache
          image: busybox:1.38
          command: ["sh", "-c", "rm -rf /media/frigate/clips/preview_restart_cache"]
          volumeMounts:
            - name: frigate-media
              mountPath: /media/frigate
      containers:
        - name: frigate
{{- if eq $frigateDetector "rocm" }}
          image: ghcr.io/blakeblackshear/frigate:0.18.2-rocm
{{- else }}
          image: ghcr.io/blakeblackshear/frigate:0.18.2
{{- end }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - PERFMON
            seLinuxOptions:
              level: s0
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: http-auth
              containerPort: 8971
              protocol: TCP
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: rtsp
              containerPort: 8554
              protocol: TCP
            - name: webrtc-udp
              containerPort: 8555
              protocol: UDP
            - name: webrtc-tcp
              containerPort: 8555
              protocol: TCP
            - name: go2rtc-admin
              containerPort: 1984
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          env:
            - name: FRIGATE_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-values
                  key: FRIGATE_MQTT_PASSWORD
            - name: FRIGATE_RTSP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frigate-values
                  key: FRIGATE_RTSP_PASSWORD
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /data
              name: data
            - mountPath: /media
              name: media
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - mountPath: /media/frigate
              name: frigate-media
          resources:
            limits:
{{- with $frigateResource }}
              infra.local/{{ . }}: "1"
{{- end }}
              memory: 3Gi
            requests:
              cpu: 50m
{{- with $frigateResource }}
              infra.local/{{ . }}: "1"
{{- end }}
              memory: 1.5Gi
      volumes:
        - name: configmap
          configMap:
            name: frigate
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config-pvc
        - name: data
          emptyDir: {}
        - name: media
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: frigate-media
          persistentVolumeClaim:
            claimName: frigate-media-pvc
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - frigate.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        # Frigate 0.17 serves 8971 (http-auth) over HTTPS with its own cert, which
        # Traefik's plain-HTTP backend forwarding can't handle. Use the plain 5000
        # listener instead - external access is still gated by Authelia here.
        - name: frigate
          namespace: apps
          port: 5000
---
# In-cluster consumers: Home Assistant's Frigate integration polls the API on
# 5000 and may proxy camera streams itself via go2rtc on 8554 (the browser's
# default live view goes through Traefik instead, covered by the baseline).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frigate-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frigate
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: homeassistant
      ports:
        - port: 5000
        - port: 8554
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-media-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: frigate-media
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /frigate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs
  volumeName: frigate-media-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: Secret
metadata:
  name: frigate-values
  namespace: apps
type: Opaque
stringData:
  FRIGATE_RTSP_PASSWORD: "{{ .Values.FRIGATE_RTSP_PASSWORD }}"
  FRIGATE_MQTT_PASSWORD: "{{ .Values.FRIGATE_MQTT_PASSWORD }}"
