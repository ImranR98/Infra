---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: headlamp
  namespace: apps
spec:
  chart: headlamp
  repo: https://kubernetes-sigs.github.io/headlamp
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 0.45.0
  valuesContent: |-
    config:
      inCluster: true
      # Per-user OIDC identity is NOT enabled: the kube-apiserver has no OIDC
      # provider configured, so Authelia-issued tokens are rejected with 401
      # when Headlamp proxies them to the API. Headlamp therefore acts as its
      # own Service Account (read-only via the headlamp-readonly
      # ClusterRole in clusterRoleBinding below); the Authelia forward-auth
      # middleware on the IngressRoute is the sole identity gate.
      # To enable per-user identity instead (flip this to false):
      #   1. /etc/rancher/k3s/config.yaml.d/20-oidc.yaml:
      #      kube-apiserver-arg:
      #        - "oidc-issuer-url=https://auth.{{ .Values.SERVICES_DOMAIN }}"
      #        - "oidc-client-id=headlamp"
      #        - "oidc-username-claim=preferred_username"
      #        - "oidc-groups-claim=groups"
      #        - "oidc-username-prefix=authelia:"
      #        - "oidc-groups-prefix=authelia:"
      #   2. systemctl restart k3s
      #   3. The authelia-admins-cluster-admin ClusterRoleBinding (oidc-rbac.yaml)
      #      already grants the authelia:admins group cluster-admin.
      unsafeUseServiceAccountToken: true
      oidc:
        secret:
          create: false
          name: headlamp-oidc
        externalSecret:
          enabled: true
          name: headlamp-oidc
      extraArgs:
        - "-log-level=debug"
    clusterRoleBinding:
      clusterRoleName: headlamp-readonly
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 64Mi
---
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-prod-tls
  namespace: apps
spec:
  secretName: headlamp-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - k8s.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`k8s.{{ .Values.SERVICES_DOMAIN }}`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        - name: headlamp
          port: 80
  tls:
    secretName: headlamp-prod-tls
---
---
# OIDC credentials for the Headlamp backend. Keys are env-style because the
# chart's config.oidc.externalSecret mode uses envFrom (see helmchart.yaml) —
# the client secret therefore never lands in the HelmChart CR.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-oidc
  namespace: apps
type: Opaque
stringData:
  OIDC_CLIENT_ID: "headlamp"
  OIDC_CLIENT_SECRET: "{{ .Values.AUTHELIA_HEADLAMP_CLIENT_SECRET_HASHABLE }}"
  OIDC_ISSUER_URL: "https://auth.{{ .Values.SERVICES_DOMAIN }}"
  OIDC_SCOPES: "openid profile email groups"
  OIDC_CALLBACK_URL: "https://k8s.{{ .Values.SERVICES_DOMAIN }}/oidc-callback"
  OIDC_USE_PKCE: "true"
---
---
# Read-only ClusterRole for Headlamp's ServiceAccount.
# Aggregates the built-in 'view' role (read-only on most resources, NO Secrets)
# plus any roles labeled rbac.authorization.k8s.io/aggregate-to-view (e.g.
# cert-manager-view). NOTE: when aggregationRule is set, the cluster's RBAC
# controller REPLACES this role's rules with the aggregated result, so
# additional permissions must live in separate labeled roles (see
# headlamp-readonly-nodes below). Any write verb is implicitly denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-readonly
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
---
# Cluster-scoped resources the built-in view role does not cover (nodes).
# The aggregate-to-view label merges these rules into headlamp-readonly
# (and into the built-in 'view' role; nothing binds 'view' in this cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-readonly-nodes
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
