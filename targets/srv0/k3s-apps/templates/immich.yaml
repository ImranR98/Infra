---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: immich
  namespace: apps
spec:
  chart: oci://ghcr.io/immich-app/immich-charts/immich
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 0.13.4
  valuesContent: |-
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            env:
              DB_HOSTNAME: "immich-postgresql"
              DB_USERNAME: "postgres"
              DB_DATABASE_NAME: "immich"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: password

    defaultPodOptions:
      # The DB credentials Secret feeds env secretKeyRefs in both Immich pods.
      annotations:
        checksum/immich-db-credentials: {{ .Values.IMMICH_DB_PASSWORD | sha256sum }}
      # The server's /external mount is the hostpath media PV, whose
      # nodeAffinity pins the pod to srv0; the ML pod is pinned by the
      # intel-gpu resource. Neither needs a pod nodeSelector.
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        fsGroup: {{ .Values.MY_UID }}
        # The library PVC holds >120k files; the default recursive chown on
        # every pod start is expensive and triggers VolumePermissionChange
        # warnings. Root ownership already matches, so only check the root.
        fsGroupChangePolicy: OnRootMismatch
        # container_t + s0 (verified): SELinux allows container_t the
        # /dev/dri device grant, the media-PV library read, and the
        # library PVC; s0 keeps files category-free so server/ML and the
        # pvc-backup pods can share them.
        seLinuxOptions:
          level: s0

    server:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.3.5
              securityContext:
                allowPrivilegeEscalation: false
              # Resources are per-component (the top-level controllers.main is
              # shared across all Immich components, so anything set there
              # leaks into valkey/ML). The intel-gpu grant is for VAAPI
              # transcoding.
              resources:
                limits:
                  memory: 4Gi
                  infra.local/intel-gpu: "1"
                requests:
                  memory: 1.5Gi
                  cpu: 20m
                  infra.local/intel-gpu: "1"
              env:
                HWACCEL_VAAPI_ENABLED: "true"
      persistence:
        external:
          # Reuse the existing Main/Media local PV; the claim pins the server
          # to the node that owns the tree without an NFS import or a
          # nodeSelector.
          type: persistentVolumeClaim
          existingClaim: hostpath-main-node-media-pvc
          globalMounts:
            - path: /external
              readOnly: true

    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.5-openvino
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                limits:
                  memory: 6Gi
                  infra.local/intel-gpu: "1"
                requests:
                  memory: 384Mi
                  cpu: 20m
                  infra.local/intel-gpu: "1"
      defaultPodOptions:
        securityContext:
          seLinuxOptions:
            level: s0
        # No nodeSelector: the intel-gpu resource pins ML to the Iris Xe node.
        # bigpc's scheduling-discouraged taint still discourages drift.

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc

    valkey:
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: "9.2"
              # The chart's top-level controllers.main is shared across all
              # components, so the server's DRI grant + 8Gi limit would leak
              # into valkey; override with the small tier (no device).
              resources:
                limits:
                  memory: 256Mi
                requests:
                  memory: 64Mi
      enabled: true
---
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    {{- if ne .Values.BOOTSTRAP_PRIVATE_APPS "true" }}
    - name: srv0
      sectionName: websecure-proxy
    {{- end }}
  hostnames:
    - immich.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: immich-server
          namespace: apps
          port: 2283
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immich-db-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: immich-postgresql
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: immich
      ports:
        - port: 5432
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immich-valkey-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: immich
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: immich
      ports:
        - port: 6379
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immich-ml-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: machine-learning
      app.kubernetes.io/instance: immich
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: immich
      ports:
        - port: 3003
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-credentials
  namespace: apps
type: Opaque
stringData:
  password: "{{ .Values.IMMICH_DB_PASSWORD }}"
---
# PostgreSQL with VectorChord extension for Immich smart search
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgresql
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-postgresql
      annotations:
        checksum/immich-db-credentials: {{ .Values.IMMICH_DB_PASSWORD | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
        # The DB PVC is NFS-backed and its pgdata tree is owned by the
        # postgres image user; avoid a recursive chown on every pod start.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgresql
          image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 15
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: password
            - name: POSTGRES_DB
              value: immich
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # The Immich Postgres image refuses NFS-backed PGDATA unless this
            # is set. The app-data share is intentionally NFS (no Longhorn).
            - name: IGNORE_DATABASE_FSTYPE
              value: "true"
          ports:
            - containerPort: 5432
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-db-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgresql
  namespace: apps
spec:
  selector:
    app: immich-postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
