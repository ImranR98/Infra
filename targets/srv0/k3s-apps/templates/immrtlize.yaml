# Media Sync (D$CPLN) — former IMMRTL↑ZE media ingestion daemon (replaces the mdscl deployments).
# Watches the phone-synced deviceSync tree, standardizes / concatenates /
# copies into the Main/Media tree, serves a web UI, and cleans up processed
# originals into trash only after verifying the destination copy.
#
# Config lives on a Longhorn volume (auto-backed-up) and is edited from the UI;
# trash + logs live on a host path outside any synced tree.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immrtlize-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-sync
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media-sync
  template:
    metadata:
      labels:
        app: media-sync
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
        # s0: the pod reads Syncthing-written trees and writes files that host
        # processes and other containers must be able to read back.
        seLinuxOptions:
          level: s0
      automountServiceAccountToken: false
      containers:
        - name: media-sync
          # Pin by digest after the first push so Renovate can bump deliberately.
          image: imranrdev/dscpln-media-sync:latest@sha256:f85da897cb57d90fe4cf2d6b6b4a938cf20e99f07c518383bb35ae29231002c3
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8791
          env:
            - name: BASE_PATH
              value: /media
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /media/api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: source
              mountPath: /source
            - name: destination
              mountPath: /destination
            - name: config
              mountPath: /config
            - name: appdata
              mountPath: /appdata
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: source
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-pvc
        - name: destination
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
        - name: config
          persistentVolumeClaim:
            claimName: immrtlize-config-pvc
        - name: appdata
          persistentVolumeClaim:
            claimName: hostpath-main-node-immrtlize-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: media-sync
  namespace: apps
spec:
  selector:
    app: media-sync
  ports:
    - name: http
      port: 8791
      targetPort: http
