# Media Sync (D$CPLN) — former IMMRTL↑ZE media ingestion daemon (replaces the mdscl deployments).
# Watches the phone-synced deviceSync tree, standardizes / concatenates /
# copies into the Main/Media tree, serves a web UI, and cleans up processed
# originals into trash only after verifying the destination copy.
#
# Config lives on a Longhorn volume (auto-backed-up) and is edited from the UI;
# trash + logs live on a host path outside any synced tree.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immrtlize-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-sync
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media-sync
  template:
    metadata:
      labels:
        app: media-sync
    spec:
      securityContext:
        # s0: the pod reads Syncthing-written trees and writes files that host
        # processes and other containers must be able to read back.
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: media-sync
          # Pin by digest after the first push so Renovate can bump deliberately.
          image: imranrdev/dscpln-media-sync:latest@sha256:2482659055231878157d2d5cc9ea6b8211cf1e1cb92b57380dad03aeea38f457
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8791
          env:
            - name: BASE_PATH
              value: /media
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 256Mi
              cpu: 100m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/media/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: source
              mountPath: /source
            - name: destination
              mountPath: /destination
            - name: config
              mountPath: /config
            - name: appdata
              mountPath: /appdata
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: source
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-pvc
        - name: destination
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
        - name: config
          persistentVolumeClaim:
            claimName: immrtlize-config-pvc
        - name: appdata
          persistentVolumeClaim:
            claimName: hostpath-main-node-immrtlize-pvc
---
{{ include "dscpln.service" (dict "name" "media-sync" "targetPort" "http" "port" 8791) }}
