{{- $lanCidr := required "LAN_CIDR must be set in config/srv0/values.yaml" .Values.LAN_CIDR -}}
{{- $jellyfinVaapi := eq (include "gpu.jellyfinHwaccel" .) "vaapi" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jellyfin
  namespace: apps
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "12.2"
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: apps
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "12.2"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8096
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: apps
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/version: "12.2"
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/version: "12.2"
    spec:
      serviceAccountName: jellyfin
      # Jellyfin's libraries are NFS, but the main media node is still the
      # preferred home. The accelerator resource remains the hard capability
      # requirement; this is only a placement preference (bigpc stays a
      # fallback if srv0 has no vaapi capacity).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: infra.local/hostpath-main
                    operator: In
                    values:
                      - "true"
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          level: s0
      initContainers:
        # Jellyfin applies X-Forwarded-For only when KnownProxies is non-empty.
        # Traefik's pod IP is dynamic, so trust the k3s pod CIDR. Idempotent:
        # patches an existing network.xml, seeds a minimal one on a fresh volume.
        - name: known-proxies
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              set -eu
              file=/config/config/network.xml
              proxy=10.42.0.0/16
              if [ ! -f "$file" ]; then
                mkdir -p /config/config
                printf '%s\n' \
                  '<?xml version="1.0" encoding="utf-8"?>' \
                  '<NetworkConfiguration>' \
                  "  <KnownProxies><string>$proxy</string></KnownProxies>" \
                  '</NetworkConfiguration>' > "$file"
                exit 0
              fi
              if grep -q "<string>$proxy</string>" "$file"; then
                exit 0
              fi
              if grep -q '<KnownProxies />' "$file"; then
                sed -i "s#<KnownProxies />#<KnownProxies><string>$proxy</string></KnownProxies>#" "$file"
              else
                sed -i "s#<KnownProxies>#<KnownProxies><string>$proxy</string>#" "$file"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          securityContext:
            allowPrivilegeEscalation: false
          image: docker.io/jellyfin/jellyfin:12.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 1.5Gi
{{- if $jellyfinVaapi }}
              infra.local/vaapi: "1"
{{- end }}
            requests:
              memory: 512Mi
              cpu: 20m
{{- if $jellyfinVaapi }}
              infra.local/vaapi: "1"
{{- end }}
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /media
              name: media
            - mountPath: /cache
              name: cache
            - mountPath: /media/TV
              name: tv
              readOnly: true
            - mountPath: /media/YouTube
              name: youtube
              readOnly: true
            - mountPath: /media/Arrstack
              name: arrstack-media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: media
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tv
          persistentVolumeClaim:
            claimName: jellyfin-tv-pvc
        - name: youtube
          persistentVolumeClaim:
            claimName: jellyfin-youtube-pvc
        - name: arrstack-media
          persistentVolumeClaim:
            claimName: arrstack-media-pvc
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-ratelimit
  namespace: base
spec:
  rateLimit:
    average: 25
    burst: 50
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    {{- if ne .Values.BOOTSTRAP_PRIVATE_APPS "true" }}
    - name: srv0
      sectionName: websecure-proxy
    {{- end }}
  hostnames:
    - tv.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: jellyfin-ratelimit
      backendRefs:
        - name: jellyfin
          namespace: apps
          port: 8096
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jellyfin-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: jellyfin
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: seerr
        - podSelector:
            matchLabels:
              app: radarr
        - podSelector:
            matchLabels:
              app: sonarr
        # kubelet readiness probes originate from the node's LAN address.
        - ipBlock:
            cidr: {{ $lanCidr }}
      ports:
        - port: 8096
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-tv-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-tv
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /jellyfin-tv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-tv-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: jellyfin-tv-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-youtube-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-youtube
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /jellyfin-youtube
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-youtube-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: jellyfin-youtube-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arrstack-media-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: arrstack-media
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /arrstack-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrstack-media-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: arrstack-media-pv
