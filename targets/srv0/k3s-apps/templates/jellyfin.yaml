---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: jellyfin
  namespace: apps
spec:
  chart: jellyfin
  repo: https://jellyfin.github.io/jellyfin-helm
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 3.2.0
  valuesContent: |-
    # Recreate: the config PVC is RWO Longhorn - RollingUpdate deadlocks (new pod
    # can't attach while the old one holds the volume, e.g. after node moves).
    deploymentStrategy:
      type: Recreate
    # 12.2 carries the SyncPlay fixes 10.11.x lacks (stale-position correction,
    # lost-WebSocket zombie groups, bounded group wait).
    image:
      tag: "12.2"
    persistence:
      config:
        existingClaim: jellyfin-config-pvc
      media:
        enabled: false

    # /health opens the SQLite DB (DbContextFactoryHealthCheck), which lives on
    # NFS and can block for >10s during a library scan. The chart's 1s readiness
    # probe drops the only Traefik endpoint when that happens, so gate startup
    # on /health and use a TCP readiness probe: once the app is initialized, a
    # slow DB must not take it out of service.
    startupProbe:
      # The chart default is tcpSocket; null removes it before Helm merges
      # this map, otherwise both handlers are rendered and the API rejects it.
      tcpSocket: null
      httpGet:
        path: /health
        port: 8096
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 120   # up to 20 min for the 12.2 DB migration
    readinessProbe:
      # The chart default is httpGet; remove it so only the TCP handler remains.
      httpGet: null
      tcpSocket:
        port: 8096
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /health
        port: 8096
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 30
      failureThreshold: 20    # ~10 min; tolerate a long first 12.2 scan

    # Jellyfin applies X-Forwarded-For only when KnownProxies is non-empty —
    # otherwise it reports the reverse proxy's pod IP. Traefik's pod IP is
    # dynamic, so trust the k3s pod CIDR. Idempotent: patches an existing
    # network.xml, seeds a minimal one on a fresh config volume.
    extraInitContainers:
      - name: known-proxies
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            set -eu
            file=/config/config/network.xml
            proxy=10.42.0.0/16
            if [ ! -f "$file" ]; then
              mkdir -p /config/config
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<NetworkConfiguration>' \
                "  <KnownProxies><string>$proxy</string></KnownProxies>" \
                '</NetworkConfiguration>' > "$file"
              exit 0
            fi
            if grep -q "<string>$proxy</string>" "$file"; then
              exit 0
            fi
            if grep -q '<KnownProxies />' "$file"; then
              sed -i "s#<KnownProxies />#<KnownProxies><string>$proxy</string></KnownProxies>#" "$file"
            else
              sed -i "s#<KnownProxies>#<KnownProxies><string>$proxy</string>#" "$file"
            fi
        volumeMounts:
          - name: config
            mountPath: /config

    volumes:
      - name: tv
        persistentVolumeClaim:
          claimName: jellyfin-tv-pvc
      - name: youtube
        persistentVolumeClaim:
          claimName: jellyfin-youtube-pvc
      - name: arrstack-media
        persistentVolumeClaim:
          claimName: arrstack-media-pvc

    volumeMounts:
      - name: tv
        mountPath: /media/TV
        readOnly: true
      - name: youtube
        mountPath: /media/YouTube
        readOnly: true
      - name: arrstack-media
        mountPath: /media/Arrstack

    resources:
      limits:
        memory: 1.5Gi
        infra.local/dri: "1"
      requests:
        memory: 512Mi
        cpu: 20m
        infra.local/dri: "1"
    podSecurityContext:
      runAsUser: {{ .Values.MY_UID }}
      runAsGroup: {{ .Values.MY_UID }}
      # level s0: keeps PVC files category-free so the pvc-backup temp pods
      # (also s0) can read the config volume (see syncthing for precedent).
      seLinuxOptions:
        level: s0
    securityContext:
      # /dev/dri/renderD128 is granted via the generic-device-plugin —
      # container_t + uid 1000 works, no privileged needed (verified).
      allowPrivilegeEscalation: false
    # No node affinity: bigpc's scheduling-discouraged taint (PreferNoSchedule)
    # keeps non-tolerating pods on srv0; the descheduler evicts any drift.
    # VAAPI transcode runs on srv0's Iris Xe iGPU (renderD128 via the device plugin).
---
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-ratelimit
  namespace: base
spec:
  rateLimit:
    average: 25
    burst: 50
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    {{- if ne .Values.BOOTSTRAP_PRIVATE_APPS "true" }}
    - name: srv0
      sectionName: websecure-proxy
    {{- end }}
  hostnames:
    - tv.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: jellyfin-ratelimit
      backendRefs:
        - name: jellyfin
          namespace: apps
          port: 8096
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jellyfin-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: jellyfin
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: seerr
        - podSelector:
            matchLabels:
              app: radarr
        - podSelector:
            matchLabels:
              app: sonarr
        # kubelet readiness probes originate from the node's LAN address.
        - ipBlock:
            cidr: 192.168.8.0/24
      ports:
        - port: 8096
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-tv-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-tv
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /jellyfin-tv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-tv-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: jellyfin-tv-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-youtube-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-youtube
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /jellyfin-youtube
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-youtube-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: jellyfin-youtube-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arrstack-media-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: arrstack-media
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /arrstack-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrstack-media-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: arrstack-media-pv
