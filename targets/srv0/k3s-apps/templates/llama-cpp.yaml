{{- /*
llama.cpp runs in Compose on bigpc now, not in this cluster. This file keeps
the in-cluster address and the Models route stable:

  - A selectorless Service plus a hand-managed EndpointSlice points at the
    host's LAN IP, so open-webui/opencode keep using
    http://llama-cpp.apps.svc.cluster.local:8080 and srv0 Traefik can route
    models.<SERVICES_DOMAIN> to the same backend (public and LAN/VPN).
  - The EndpointSlice is the only cluster object that names bigpc's address.
    Keep BIGPC_HOST an IP: it is both an endpoint address and an
    egress-policy ipBlock. Update it if the host's DHCP lease changes.
*/ -}}
{{- $llamaHost := required "BIGPC_HOST must be set in config/srv0/values.yaml" .Values.BIGPC_HOST -}}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpp
  namespace: apps
  labels:
    app.kubernetes.io/name: llama-cpp
    app.kubernetes.io/instance: llama-cpp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llama-cpp-external
  namespace: apps
  labels:
    kubernetes.io/service-name: llama-cpp
addressType: IPv4
endpoints:
  - addresses:
      - {{ $llamaHost | quote }}
    conditions:
      ready: true
ports:
  - name: http
    port: 8080
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-cpp-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - models.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: llama-cpp
          namespace: apps
          port: 8080
---
# The endpoint is outside the pod network, so the baseline cluster egress
# allows do not cover it. open-webui and opencode are the only in-cluster
# consumers (same ones the old pod-based ingress policy admitted).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-open-webui-to-llama-cpp
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: open-webui
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ $llamaHost }}/32
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opencode-to-llama-cpp
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: opencode
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ $llamaHost }}/32
      ports:
        - protocol: TCP
          port: 8080
