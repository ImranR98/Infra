{{- define "logtfy.config" -}}
{
    "ntfyConfig": {
        "configs": [
            {
                "id": "ntfy_self",
                "host": "https://ntfy.{{ .Values.SERVICES_DOMAIN }}",
                "authHeader": "Bearer {{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}",
                "topicPrefix": "{{ .Values.TARGET }}_services_"
            },
            {
                "id": "ntfy_official",
                "host": "https://ntfy.sh",
                "authHeader": null,
                "topicPrefix": "{{ .Values.NTFY_FALLBACK_TOPIC }}"
            }
        ],
        "defaultConfig": "ntfy_self",
        "fallbackConfig": "ntfy_official"
    },
    "modulesEnabledByDefault": false,
    "moduleCustomization": [
        {
            "module": "ssh_logins",
            "ntfyTopic": "logtfy",
            "enabled": true
        },
        {
            "module": "authelia_logins_k8s",
            "loggerArg": "base",
            "ntfyTopic": "logtfy",
            "enabled": true
        },
        {
            "module": "traefik_geoblock_allowed_requests_k8s",
            "loggerArg": "kube-system",
            "ntfyTopic": "traefik",
            "defaultPriority": "1",
            "enabled": true
        },
        {
            "module": "traefik_accesslogs_custom_k8s",
            "loggerArg": "kube-system",
            "ntfyTopic": "logtfy",
            "parserArg": "DownstreamStatus\":200,.*fmd.*requestAccess",
            "enabled": true
        }
    ]
}
{{- end -}}
# RBAC for pod log reading — namespaced Roles instead of a ClusterRole:
# logtfy only tailes pods in apps (its own targets), base (authelia logins),
# and kube-system (traefik geoblock/access logs). See logtfy.json
# loggerArg values for the authoritative list.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logtfy-service-account
  namespace: apps
{{- range $ns := list "apps" "base" "kube-system" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-log-reader-binding
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: logtfy-service-account
    namespace: apps
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# Logtfy configuration
apiVersion: v1
kind: Secret
metadata:
  name: logtfy-config
  namespace: apps
type: Opaque
stringData:
  logtfy.json: |
{{ include "logtfy.config" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logtfy
  namespace: apps
  labels:
    app: logtfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logtfy
  template:
    metadata:
      labels:
        app: logtfy
      annotations:
        checksum/logtfy-config: {{ include "logtfy.config" . | sha256sum }}
    spec:
      hostname: {{ .Values.TARGET }}
      serviceAccountName: logtfy-service-account
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
      containers:
        - name: logtfy
          image: ghcr.io/imranr98/logtfy:latest@sha256:fae4624af419940c0e24d86b91e7d31b6701a9b4adf96622c251c5f47661a8d7
          volumeMounts:
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: config
              mountPath: /logtfy/config.json
              subPath: logtfy.json
          env:
            - name: KUBE_API_SERVER
              value: "https://kubernetes.default.svc"
            - name: PYTHON_IO_URING
              value: "0"
          securityContext:
            # runs as root: imranrdev image breaks with non-root uid
            allowPrivilegeEscalation: false
          resources:
            limits:
              # The per-line parser used to be effectively unbounded during
              # public-traffic spikes. The stream prefilter removes most of
              # that work; this caps the remainder.
              cpu: 250m
              memory: 2Gi
            requests:
              memory: 128Mi
              cpu: 50m
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: external-exposed-node-syslog-pvc
        - name: config
          secret:
            secretName: logtfy-config
            items:
              - key: logtfy.json
                path: logtfy.json
