{{- range $svc := list
    (dict "name" "camera")
    (dict "name" "screenshots" "component" true)
    (dict "name" "screenrecs" "component" true) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdscl-{{ $svc.name }}
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mdscl-{{ $svc.name }}
  template:
    metadata:
      labels:
        app: mdscl-{{ $svc.name }}
        {{- if $svc.component }}
        app.kubernetes.io/component: mdscl
        {{- end }}
      annotations:
        checksum/mdscl-ntfy-token: {{ $.Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ $.Values.MY_UID }}
        seLinuxOptions:
          level: s0
      containers:
        - name: mdscl-{{ $svc.name }}
          image: imranrdev/media-date-standardize-copy-loop:latest@sha256:d6e7368ab0846e01049fd62cc645e146bfc9c5a9804430dd4f43fc503ef373b3
          securityContext:
            runAsUser: {{ $.Values.MY_UID }}
            runAsGroup: {{ $.Values.MY_UID }}
            allowPrivilegeEscalation: false
          env:
            - name: NTFY_URL
              value: "http://ntfy.base.svc.cluster.local:3000/{{ $.Values.TARGET }}_services_mdscl_errors"
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mdscl-ntfy-token
                  key: token
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
          volumeMounts:
            - name: mdscl-{{ $svc.name }}-src
              mountPath: /source
            - name: mdscl-{{ $svc.name }}-dst
              mountPath: /destination
      volumes:
        - name: mdscl-{{ $svc.name }}-src
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-{{ $svc.name }}-pvc
        - name: mdscl-{{ $svc.name }}-dst
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-{{ $svc.name }}-pvc
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mdscl-ntfy-token
  namespace: apps
type: Opaque
stringData:
  token: "{{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}"
