---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22-openssl
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1883
            runAsGroup: 1883
          ports:
            - containerPort: 1883
            - containerPort: 8883
              hostPort: 8883 # LAN MQTT TLS access — hostPort needed so external clients can reach Mosquitto directly
            - containerPort: 9001
              hostPort: 9001 # LAN MQTT WebSocket access — same rationale as 8883
          readinessProbe:
            tcpSocket:
              port: 1883
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 10
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
          volumeMounts:
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: mosquitto-password
              mountPath: /mosquitto/config/password_file
              subPath: password_file
            - name: mosquitto-tls
              mountPath: /mosquitto/certs
              readOnly: true
      volumes:
        - name: mosquitto-data
          persistentVolumeClaim:
            claimName: mosquitto-data-pvc
        - name: mosquitto-config
          configMap:
            name: mosquitto-config
        - name: mosquitto-password
          secret:
            secretName: mosquitto-password
            defaultMode: 0644
        - name: mosquitto-tls
          secret:
            secretName: mosquitto-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: mqtt-tls
      port: 8883
      targetPort: 8883
    - name: mqtt-ws
      port: 9001
      targetPort: 9001
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homeassistant-services-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: homeassistant
      ports:
        - port: 1883
        - port: 8883
        - port: 9001
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: frigate
      ports:
        - port: 1883
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: apps
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    allow_anonymous false
    password_file /mosquitto/config/password_file
    listener 1883
    listener 8883
      cafile /mosquitto/certs/ca.crt
      certfile /mosquitto/certs/tls.crt
      keyfile /mosquitto/certs/tls.key
      require_certificate false
    listener 9001
      protocol websockets
    log_type error warning notice
---
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-password
  namespace: apps
type: Opaque
stringData:
  # Block scalar: multi-line MOSQUITTO_CREDENTIALS value (one "user:hash" line per
  # entry, all lines indented 4 spaces in VARS) renders as a column-0 password file.
  password_file: |-
{{ .Values.MOSQUITTO_CREDENTIALS | indent 4 }}
---
# Single TLS cert for cluster + LAN.  External clients see hostname mismatch
# (connect via IP).  require_certificate: false disables verification; TLS still works.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
  namespace: apps
spec:
  secretName: mosquitto-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - mosquitto.apps.svc.cluster.local
