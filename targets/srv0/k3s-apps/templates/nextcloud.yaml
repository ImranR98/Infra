---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - nextcloud.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /heartbeat
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: nextcloud-hsts
      backendRefs:
        - name: nextcloud
          namespace: apps
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: nextcloud-hsts
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        # No forwardauth-authelia: Nextcloud is fully bypassed in Authelia's
        # access control, and apps like Floccus send Authorization headers
        # that Authelia's regulation counts as failed 1FA attempts.
      backendRefs:
        - name: nextcloud
          namespace: apps
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-hsts
  namespace: base
spec:
  headers:
    stsSeconds: 15552000
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nextcloud-db-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: nextcloud-postgresql
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - port: 5432
  policyTypes:
    - Ingress
---
# FL0W's Contacts job discovers and exports address books/calendars over DAV,
# so it is allowed to reach Nextcloud (the namespace default is Traefik only).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-contacts-calendar-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: nextcloud
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: fl0w
      ports:
        - protocol: TCP
          port: 80
  policyTypes:
    - Ingress
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
      annotations:
        # Admin + DB passwords arrive as env secretKeyRefs.
        checksum/nextcloud-secrets: {{ printf "%s|%s|%s" .Values.NEXTCLOUD_ADMIN_USER .Values.NEXTCLOUD_ADMIN_PASSWORD .Values.NEXTCLOUD_DB_PASSWORD | sha256sum }}
    spec:
      securityContext:
        fsGroup: 33
      containers:
        - name: nextcloud
          image: nextcloud:35.0.2@sha256:786c102155d2717ba0f53a62b3fdd7a1354edc48e800b94dbe32294d9a5752a2
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 15
          env:
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-admin-secret
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-admin-secret
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: POSTGRES_HOST
              value: nextcloud-postgresql
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-secret
                  key: password
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              # Space-separated; the bare service name is used by in-cluster
              # DAV clients (Contacts + Calendar). Only applied on first install.
              value: "nextcloud.{{ .Values.SERVICES_DOMAIN }} nextcloud"
            - name: APACHE_DISABLE_REWRITE_IP
              value: "1"
            - name: TRUSTED_PROXIES
              value: "127.0.0.1 10.42.0.0/16 10.43.0.0/16 192.168.0.0/16"
            - name: OVERWRITEPROTOCOL
              value: "https"
            - name: OVERWRITECLIURL
              value: "http://localhost"
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html
          {{- include "infra.resources" (dict "tier" "large") | nindent 10 }}
      volumes:
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: nextcloud
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin-secret
  namespace: apps
type: Opaque
stringData:
  NEXTCLOUD_ADMIN_USER: "{{ .Values.NEXTCLOUD_ADMIN_USER }}"
  NEXTCLOUD_ADMIN_PASSWORD: "{{ .Values.NEXTCLOUD_ADMIN_PASSWORD }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-db-secret
  namespace: apps
type: Opaque
stringData:
  password: "{{ .Values.NEXTCLOUD_DB_PASSWORD }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-db-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-postgresql
  namespace: apps
  labels:
    app: nextcloud-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud-postgresql
  template:
    metadata:
      labels:
        app: nextcloud-postgresql
      annotations:
        checksum/nextcloud-db-password: {{ .Values.NEXTCLOUD_DB_PASSWORD | sha256sum }}
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: volume-permissions
          image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
          command:
            - sh
            - -c
            - |
              rm -rf /var/lib/postgresql/data/lost+found
              chown -R 999:999 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0  # root required: chown on NFS-backed PVC for postgresql (uid 999)
          {{- include "infra.resources" (dict "tier" "small") | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgresql
          image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - nextcloud
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 15
          env:
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          {{- include "infra.resources" (dict "tier" "tiny") | nindent 10 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-postgresql
  namespace: apps
spec:
  selector:
    app: nextcloud-postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
