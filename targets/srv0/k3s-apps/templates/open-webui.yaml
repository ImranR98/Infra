---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - gpt.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: open-webui
          namespace: apps
          port: 80
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openwebui-redis-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: open-webui-redis
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
      ports:
        - port: 6379
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openwebui-pipelines-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pipelines
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: open-webui
      ports:
        - port: 9099
  policyTypes:
    - Ingress
---
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: open-webui
  namespace: apps
spec:
  chart: open-webui
  repo: https://helm.openwebui.com/
  targetNamespace: apps
  createNamespace: false
  failurePolicy: abort
  version: 17.4.0
  valuesContent: |-
    # Explicit image so Renovate tracks Open WebUI independently of the chart
    # appVersion (the chart's stable release still pins 0.12.0).
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: "v0.12.4"
    # OIDC client secret is an env secretKeyRef inside the chart values.
    podAnnotations:
      checksum/openwebui-oidc: {{ .Values.AUTHELIA_OPENWEBUI_CLIENT_SECRET_HASHABLE | sha256sum }}
    ollama:
      enabled: false
    ollamaUrls:
      - http://ollama.apps.svc.cluster.local:11434
    websocket:
      redis:
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 128Mi
    persistence:
      enabled: true
      existingClaim: open-webui-data-pvc
    pipelines:
      persistence:
        existingClaim: open-webui-pipelines-pvc
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 128Mi
    extraEnvVars:
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        value: "true"
      - name: OAUTH_PROVIDER_NAME
        value: "Authelia"
      - name: OPENID_PROVIDER_URL
        value: "https://auth.{{ .Values.SERVICES_DOMAIN }}/.well-known/openid-configuration"
      - name: OAUTH_CLIENT_ID
        value: "open-webui"
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: openwebui-oidc
            key: client-secret
      - name: OAUTH_SCOPES
        value: "openid email profile groups"
      - name: ENABLE_OAUTH_ROLE_MANAGEMENT
        value: "true"
      - name: OAUTH_ALLOWED_ROLES
        value: '{{ .Values.OPENWEBUI_ALLOWED_ROLES | default "admins" }}'
      - name: OAUTH_ADMIN_ROLES
        value: '{{ .Values.OPENWEBUI_ADMIN_ROLES | default "admins" }}'
      - name: OAUTH_ROLES_CLAIM
        value: "groups"
      - name: WEBUI_URL
        value: "https://gpt.{{ .Values.SERVICES_DOMAIN }}"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: OAUTH_CODE_CHALLENGE_METHOD
        value: "S256"
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 768Mi
        cpu: 20m
    # NOTE: open-webui, redis, and pipelines run as root — copy-app-data
    # init container copies files as root, sub-charts uncontrolled by parent.
    podSecurityContext:
      fsGroup: {{ .Values.MY_UID }}
    containerSecurityContext:
      allowPrivilegeEscalation: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pipelines-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-oidc
  namespace: apps
type: Opaque
stringData:
  client-secret: "{{ .Values.AUTHELIA_OPENWEBUI_CLIENT_SECRET_HASHABLE }}"
