---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - gpt.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: open-webui
          namespace: apps
          port: 80
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openwebui-redis-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: open-webui-redis
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
      ports:
        - port: 6379
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openwebui-pipelines-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pipelines
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: open-webui
      ports:
        - port: 9099
  policyTypes:
    - Ingress
---
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: open-webui
  namespace: apps
spec:
  chart: open-webui
  repo: https://helm.openwebui.com/
  targetNamespace: apps
  createNamespace: false
  failurePolicy: abort
  version: 17.5.0
  valuesContent: |-
    # Explicit image so Renovate tracks Open WebUI independently of the chart
    # appVersion (the chart's stable release still pins 0.12.0).
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: "v0.12.5"
    # OIDC client secret is an env secretKeyRef inside the chart values.
    podAnnotations:
      checksum/openwebui-oidc: {{ .Values.AUTHELIA_OPENWEBUI_CLIENT_SECRET_HASHABLE | sha256sum }}
    ollama:
      enabled: false
    # The OpenAI connection is the in-cluster llama.cpp router. Pipelines are
    # enabled, so the chart prepends its endpoint and expects one extra key:
    # the first belongs to Pipelines, the second to llama.cpp (no auth).
    # These values seed a fresh install; the existing database keeps its own
    # config, so the migration updates it once (see the deployment notes).
    openaiBaseApiUrls:
      - http://llama-cpp.apps.svc.cluster.local:8080/v1
    openaiApiKeys:
      - ""
      - "none"
    websocket:
      redis:
        {{- include "infra.resources" (dict "tier" "tiny") | nindent 8 }}
    persistence:
      enabled: true
      existingClaim: open-webui-data-pvc
    pipelines:
      persistence:
        existingClaim: open-webui-pipelines-pvc
      {{- include "infra.resources" (dict "tier" "small") | nindent 6 }}
    extraEnvVars:
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        value: "true"
      - name: OAUTH_PROVIDER_NAME
        value: "Authelia"
      - name: OPENID_PROVIDER_URL
        value: "https://auth.{{ .Values.SERVICES_DOMAIN }}/.well-known/openid-configuration"
      - name: OAUTH_CLIENT_ID
        value: "open-webui"
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: openwebui-oidc
            key: client-secret
      - name: OAUTH_SCOPES
        value: "openid email profile groups"
      - name: ENABLE_OAUTH_ROLE_MANAGEMENT
        value: "true"
      - name: OAUTH_ALLOWED_ROLES
        value: '{{ .Values.OPENWEBUI_ALLOWED_ROLES | default "admins" }}'
      - name: OAUTH_ADMIN_ROLES
        value: '{{ .Values.OPENWEBUI_ADMIN_ROLES | default "admins" }}'
      - name: OAUTH_ROLES_CLAIM
        value: "groups"
      - name: WEBUI_URL
        value: "https://gpt.{{ .Values.SERVICES_DOMAIN }}"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: OAUTH_CODE_CHALLENGE_METHOD
        value: "S256"
      # The data PVC is on nfs-apps. SQLite on a network filesystem is not
      # supported: WAL's mmap-backed -shm file can raise SIGBUS (exit 135) on
      # an NFS hiccup, which is what restarted open-webui on 2026-11-11.
      # Disable mmap and widen the busy timeout as a stop-gap; migrating the
      # database to PostgreSQL is the durable fix.
      - name: DATABASE_SQLITE_PRAGMA_MMAP_SIZE
        value: "0"
      - name: DATABASE_SQLITE_PRAGMA_BUSY_TIMEOUT
        value: "30000"
    {{- include "infra.resources" (dict "tier" "2xlarge") | nindent 4 }}
    # NOTE: open-webui, redis, and pipelines run as root — copy-app-data
    # init container copies files as root, sub-charts uncontrolled by parent.
    podSecurityContext:
      fsGroup: {{ .Values.MY_UID }}
    containerSecurityContext:
      allowPrivilegeEscalation: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pipelines-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
---
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-oidc
  namespace: apps
type: Opaque
stringData:
  client-secret: "{{ .Values.AUTHELIA_OPENWEBUI_CLIENT_SECRET_HASHABLE }}"
