---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - opencode.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        # Access is governed by the wildcard `*=admins, two_factor` rule in
        # authelia.yaml; no per-host Authelia rule is needed.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
        # Injects the pinned opencode server credentials so browsers never hit
        # the native Basic prompt; Authelia above stays the human gate.
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: opencode-basic-auth
      backendRefs:
        - name: opencode
          namespace: apps
          port: 4096
---
# Machine-wide (system) configuration for the agent. /etc/opencode has the
# highest precedence, so this pins the in-cluster Ollama endpoint without
# touching the user-owned config on opencode-home-pvc. The Ollama plugin
# discovers models from /api/tags + /api/show; limits are left at their
# discovered defaults (context 262144, output 32000) to match
# OLLAMA_CONTEXT_LENGTH in ollama.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: apps
data:
  opencode.jsonc: |
    {
      "$schema": "https://opencode.ai/config.json",
      "providers": {
        "ollama": {
          "settings": {
            "baseURL": "http://ollama.apps.svc.cluster.local:11434/v1"
          },
          "models": {
            "medgemma1.5:latest": { "disabled": true }
          }
        }
      }
    }
---
# The agent's only host access is its home PVC, the unbacked tools PVC
# (Homebrew + nvm/Node), and the sandbox NFS share; the server process runs
# unsecured because only the Traefik edge can reach the pod (namespace baseline
# + Authelia forward auth), same as a pod-backed app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        # s0: files written on the NFS share stay category-free for the host
        # (same reasoning as jellyfin).
        seLinuxOptions:
          level: s0
      initContainers:
        # One-shot root container: NFS CSI volumes are created root-owned, so
        # the app user cannot write to them until this chown runs. The marker
        # makes the recursive walk a first-start cost instead of a per-restart
        # cost (Homebrew/nvm trees get large quickly).
        - name: fix-perms
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              set -eu
              uid="{{ .Values.MY_UID }}"
              home_marker="/home/opencode/.owner-${uid}"
              if [ ! -e "$home_marker" ] || [ "$(stat -c %u /home/opencode)" != "$uid" ]; then
                chown -R "${uid}:${uid}" /home/opencode
                touch "$home_marker"
                chown "${uid}:${uid}" "$home_marker"
              fi
              tools_marker="/home/linuxbrew/.owner-${uid}"
              if [ ! -e "$tools_marker" ] || [ "$(stat -c %u /home/linuxbrew)" != "$uid" ]; then
                chown -R "${uid}:${uid}" /home/linuxbrew
                touch "$tools_marker"
                chown "${uid}:${uid}" "$tools_marker"
              fi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: home
              mountPath: /home/opencode
            - name: tools
              mountPath: /home/linuxbrew
      containers:
        - name: opencode
          image: ghcr.io/imranr98/opencode:latest@sha256:65d0432ba49634858e8ebd0bb97d8366c7e48d4d684a17e7311a617e4f1592df
          args:
            - serve
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"
          workingDir: /sandbox
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            # All agent state (config, MCPs, auth, sessions) lives under this
            # home on the PVC.
            - name: HOME
              value: /home/opencode
            - name: TZ
              value: "{{ .Values.TZ }}"
            # v2 generates a random server password on every boot unless this
            # is set; pinning it keeps browser/API sessions working across
            # restarts (the web UI also sits behind Authelia forward-auth).
            - name: OPENCODE_PASSWORD
              value: "{{ .Values.OPENCODE_SERVER_PASSWORD }}"
          ports:
            - containerPort: 4096
          startupProbe:
            # The first start seeds Homebrew and nvm into the tools PVC before
            # serving; allow up to five minutes for that one-time copy.
            exec:
              command:
                - sh
                - -c
                - curl -sf -u "opencode:$OPENCODE_PASSWORD" http://127.0.0.1:4096/api/info > /dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            # v2 serves the SPA (200 text/html) on any non-/api path, so the
            # v1 /global/health probe no longer means anything; hit the real
            # authenticated info endpoint instead.
            exec:
              command:
                - sh
                - -c
                - curl -sf -u "opencode:$OPENCODE_PASSWORD" http://127.0.0.1:4096/api/info > /dev/null
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 10
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 256Mi
              cpu: 50m
          volumeMounts:
            - name: home
              mountPath: /home/opencode
            - name: tools
              mountPath: /home/linuxbrew
            - name: sandbox
              mountPath: /sandbox
            - name: tmp
              mountPath: /tmp
            - name: etc-config
              mountPath: /etc/opencode
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: opencode-home-pvc
        - name: tools
          persistentVolumeClaim:
            claimName: opencode-tools-pvc
        - name: sandbox
          persistentVolumeClaim:
            claimName: opencode-sandbox-pvc
        - name: tmp
          emptyDir: {}
        - name: etc-config
          configMap:
            name: opencode-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: opencode
  ports:
    - name: http
      port: 4096
      targetPort: 4096
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-home-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 20Gi
---
# Homebrew + nvm/Node versions. Both are reproducible and reseeded from the
# image on first start, so this PVC is deliberately NOT labelled auto-backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-tools-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: opencode-sandbox-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: opencode-sandbox
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /code-sandbox
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-sandbox-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 4096Gi
  volumeName: opencode-sandbox-pv
