---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opodsync-prod-tls
  namespace: apps
spec:
  secretName: opodsync-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - opodsync.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opodsync-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - opodsync.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia-with-optional-header-gate
      backendRefs:
        - name: opodsync
          namespace: apps
          port: 8080
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opodsync
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opodsync
  template:
    metadata:
      labels:
        app: opodsync
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: opodsync
          image: ganeshlab/opodsync:0.6.0-amd64
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: opodsync-data
              mountPath: /var/www/server/data
      volumes:
        - name: opodsync-data
          persistentVolumeClaim:
            claimName: opodsync-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: opodsync
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: opodsync
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opodsync-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
