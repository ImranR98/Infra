# D$CPLN portal — the root landing page listing every function subpath.
# Stateless: no PVC. Reachable at the host root behind Authelia.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
      automountServiceAccountToken: false
      containers:
        - name: portal
          image: imranrdev/dscpln-portal:latest@sha256:09aafa0948cdf52facb591b25407c605e8f0fcd324b19f15bed2b7deb7672819
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
              cpu: 10m
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: portal
  ports:
    - name: http
      port: 8080
      targetPort: http
