# D$CPLN portal — the root landing page listing every function subpath.
# Stateless: no PVC. Reachable at the host root behind Authelia.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      securityContext:
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID) | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: portal
          image: imranrdev/dscpln-portal:latest@sha256:41eed479fce3edf41aeb299c6201fd2745b6619626da9a1b0141324082bad904
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
              cpu: 10m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
{{ include "dscpln.service" (dict "name" "portal" "targetPort" "http" "port" 8080) }}
