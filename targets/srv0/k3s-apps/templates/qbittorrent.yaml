---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qbittorrent-prod-tls
  namespace: apps
spec:
  secretName: qbittorrent-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - qbittorrent.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - qbittorrent.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: qbittorrent
          namespace: apps
          port: 8080
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qbittorrent-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: qbittorrent
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: radarr
        - podSelector:
            matchLabels:
              app: sonarr
        - podSelector:
            matchLabels:
              app: prowlarr
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
---
# Declarative first-boot qBittorrent config: the initContainer copies it into
# the PVC only when no config exists yet, so later UI changes keep persisting. The WebUI password is adminadmin by design
# (the UI sits behind forwardauth-authelia + geoblock + crowdsec).
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-conf
  namespace: apps
data:
  qBittorrent.conf: |
    [LegalNotice]
    Accepted=true

    [Preferences]
    Connection\PortRangeMin=56881
    Connection\UPnP=false
    Session\DefaultSavePath=/data/downloads
    Session\TempPath=/data/downloads/incomplete
    Session\TempPathEnabled=true
    WebUI\Address=*
    WebUI\Password_PBKDF2=@ByteArray(/Yc2TaVYE08zl9k2r7nOPw==:S3kE16CIAGffWqTn9BbKolyzIXfEEFibUFE8I00/VQjW86WkU4W6bSbcrKya+OpG5/TB6xlFYTZucuonUEpS4A==)
---
# public-exposure tunnel conf for the qbittorrent-wg init container. The keys
# are generated by scripts/public-exposure-keygen.sh into config/srv0/values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-wg
  namespace: apps
type: Opaque
stringData:
  pubexp-qbt0.conf: |
    # qbittorrent-wg (pod tunnel). Generated by scripts/public-exposure-keygen.sh.
    [Interface]
    PrivateKey = {{ .Values.QBITTORRENT_WG_PRIVATE_KEY }}
    Address = 10.99.0.3/32
    MTU = 1280
    Table = off
    PostUp = GW=$(ip route show default | awk '{print $3; exit}'); ip route replace 10.42.0.0/16 via $GW dev eth0; ip route replace 10.43.0.0/16 via $GW dev eth0; ip route replace {{ .Values.QBITTORRENT_WG_ENDPOINT_IP }}/32 via $GW dev eth0; ip route replace default dev pubexp-qbt0
    PreDown = GW=$(ip route show default | awk '{print $3; exit}'); ip route replace default via $GW dev eth0
    [Peer]
    PublicKey = {{ .Values.QBITTORRENT_WG_PEER_PUBLIC_KEY }}
    AllowedIPs = 0.0.0.0/0
    Endpoint = {{ .Values.QBITTORRENT_WG_ENDPOINT }}
    PersistentKeepalive = 25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        - name: seed-conf
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
                mkdir -p /config/qBittorrent
                cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
        # Brings up the public-exposure tunnel in the pod netns before the app
        # starts, so announcements and peer connections never leak via the home
        # WAN. The interface/routes persist for the pod's lifetime; the kernel
        # handles re-handshaking.
        - name: qbittorrent-wg
          image: lscr.io/linuxserver/wireguard:latest@sha256:437a490f7afc6969434251351ba47455a3829e71cef9c6172f3f533332d04063
          command:
            - /bin/bash
            - -c
            - |
              wg-quick down /etc/wireguard/pubexp-qbt0.conf 2>/dev/null || true
              ip link del pubexp-qbt0 2>/dev/null || true
              wg-quick up /etc/wireguard/pubexp-qbt0.conf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          resources:
            limits:
              memory: 64Mi
            requests:
              memory: 16Mi
          volumeMounts:
            - name: qbt-wg
              mountPath: /etc/wireguard
              readOnly: true
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "mkdir -p /data/downloads/incomplete /data/Movies /data/TV && chown -R {{ .Values.MY_UID }}:{{ .Values.MY_UID }} /data/downloads /data/Movies /data/TV"]
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
            - containerPort: 56881
              protocol: TCP
            - containerPort: 56881
              protocol: UDP
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: PUID
              value: "{{ .Values.MY_UID }}"
            - name: PGID
              value: "{{ .Values.MY_UID }}"
            - name: TZ
              value: "{{ .Values.TZ }}"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: arrstack-media-pvc
        - name: seed
          configMap:
            name: qbittorrent-conf
        - name: qbt-wg
          secret:
            secretName: qbittorrent-wg
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
