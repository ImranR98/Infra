---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qbittorrent-prod-tls
  namespace: apps
spec:
  secretName: qbittorrent-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - qbittorrent.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`qbittorrent.{{ .Values.SERVICES_DOMAIN }}`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        - name: qbittorrent
          port: 8080
  tls:
    secretName: qbittorrent-prod-tls
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qbittorrent-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: qbittorrent
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: radarr
        - podSelector:
            matchLabels:
              app: sonarr
        - podSelector:
            matchLabels:
              app: prowlarr
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
---
# Declarative first-boot qBittorrent config: the initContainer copies it into
# the PVC only when no config exists yet, so later UI changes keep persisting. The WebUI password is adminadmin by design
# (the UI sits behind forwardauth-authelia + geoblock + crowdsec).
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-conf
  namespace: apps
data:
  qBittorrent.conf: |
    [LegalNotice]
    Accepted=true

    [Preferences]
    Connection\PortRangeMin=56881
    Connection\UPnP=false
    Session\DefaultSavePath=/data/downloads
    Session\TempPath=/data/downloads/incomplete
    Session\TempPathEnabled=true
    WebUI\Address=*
    WebUI\Password_PBKDF2=@ByteArray(/Yc2TaVYE08zl9k2r7nOPw==:S3kE16CIAGffWqTn9BbKolyzIXfEEFibUFE8I00/VQjW86WkU4W6bSbcrKya+OpG5/TB6xlFYTZucuonUEpS4A==)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        - name: seed-conf
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
                mkdir -p /config/qBittorrent
                cp /seed/qBittorrent.conf /config/qBittorrent/qBittorrent.conf
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest@sha256:8d48fa8c619caadfb103f04efea8747e2a2762d6c7551690919cffb987e61cee
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "mkdir -p /data/downloads/incomplete /data/Movies /data/TV && chown -R 1000:1000 /data/downloads /data/Movies /data/TV"]
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
            - containerPort: 56881
              protocol: TCP
            - containerPort: 56881
              protocol: UDP
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: PUID
              value: "{{ .Values.MY_UID }}"
            - name: PGID
              value: "{{ .Values.MY_UID }}"
            - name: TZ
              value: "{{ .Values.TZ }}"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: arrstack-media-pvc
        - name: seed
          configMap:
            name: qbittorrent-conf
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-peer
  namespace: apps
spec:
  type: NodePort
  selector:
    app: qbittorrent
  ports:
    - name: peer-tcp
      port: 56881
      targetPort: 56881
      nodePort: 31581
      protocol: TCP
    - name: peer-udp
      port: 56881
      targetPort: 56881
      nodePort: 31581
      protocol: UDP
