---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radarr-prod-tls
  namespace: apps
spec:
  secretName: radarr-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - radarr.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - radarr.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: radarr
          namespace: apps
          port: 7878
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-radarr-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: radarr
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prowlarr
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: seerr
      ports:
        - port: 7878
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Secret
metadata:
  name: radarr-secret
  namespace: apps
type: Opaque
stringData:
  RADARR__AUTH__APIKEY: "{{ .Values.RADARR_API_KEY }}"
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
      annotations:
        checksum/radarr-secret: {{ .Values.RADARR_API_KEY | sha256sum }}
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 7878
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 256Mi
              cpu: 20m
          readinessProbe:
            tcpSocket:
              port: 7878
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: PUID
              value: "{{ .Values.MY_UID }}"
            - name: PGID
              value: "{{ .Values.MY_UID }}"
            - name: TZ
              value: "{{ .Values.TZ }}"
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: radarr-secret
                  key: RADARR__AUTH__APIKEY
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: arrstack-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: radarr
  ports:
    - port: 7878
      targetPort: 7878
