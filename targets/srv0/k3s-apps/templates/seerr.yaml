---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: seerr
  namespace: apps
spec:
  chart: oci://ghcr.io/seerr-team/seerr/seerr-chart
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 3.10.1
  valuesContent: |-
    image:
      registry: ghcr.io
      repository: seerr-team/seerr
      tag: v3.5.0
    fullnameOverride: seerr
    config:
      persistence:
        # existingClaim is used instead of inline PVC because the seerr Helm
        # chart does not support PVC labels — we need auto-backup: "true" on
        # the PVC, so we create it ourselves below.
        existingClaim: seerr-config
    extraEnv:
      - name: TZ
        value: {{ .Values.TZ }}
    resources:
      requests:
        memory: 256Mi
        cpu: 20m
      limits:
        memory: 1Gi
    podSecurityContext:
      runAsUser: {{ .Values.MY_UID }}
      runAsGroup: {{ .Values.MY_UID }}
---
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - seerr.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
      backendRefs:
        - name: seerr
          namespace: apps
          port: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs-apps
