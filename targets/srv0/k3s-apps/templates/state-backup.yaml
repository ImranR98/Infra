# State Backups (D$CPLN) — scheduled restic backups of the K3s app PVCs and
# the srv0/vps0 Compose runtime state. The app is backup-only; use
# scripts/restic-restore.sh for restores.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: state-backup-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: state-backup
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: state-backup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: state-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: state-backup
subjects:
  - kind: ServiceAccount
    name: state-backup
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-backup
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: state-backup
  template:
    metadata:
      labels:
        app: state-backup
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      serviceAccountName: state-backup
      automountServiceAccountToken: true
      securityContext:
        # Root is required to read the Postgres/Redis-owned PVC data and the
        # host paths. The primary group is the Syncthing GID: the repo root is
        # explicitly chowned to it by backup.mjs and kept setgid, so every
        # restic-created directory/file is group-readable by Syncthing. No
        # fsGroup: that would recursively chgrp the whole Infra tree.
        runAsUser: 0
        runAsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          type: spc_t
          level: s0
      containers:
        - name: state-backup
          image: imranrdev/dscpln-state-backup:latest@sha256:911d3a9c1ed3ad6cd6ec65dd3a7160a440dce2caee1d9abd180c13b83906f7eb
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # The hostPath app-data / state-backups directories are owned
                # by MY_UID; root needs DAC_OVERRIDE to write the backup repo.
                - DAC_OVERRIDE
                - FOWNER
                - CHOWN
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              level: s0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/imranr
            - name: DSCPLN_DATA_DIR
              value: /data
            - name: TZ
              value: America/Toronto
            - name: BASE_PATH
              value: /state-backup
            - name: AUTH_MODE
              value: proxy-header
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            - name: DSCPLN_PORTAL_URL
              value: http://portal:8080
            - name: SSH_KEY_FILE
              value: /ssh/id_ed25519
            - name: SSH_PUBLIC_KEY_FILE
              value: /ssh/id_ed25519.pub
            - name: RESTIC_CACHE_DIR
              value: /data/restic-cache
            - name: RESTIC_STAGING_DIR
              value: /staging
            - name: RESTIC_GID
              value: "{{ .Values.MY_UID }}"
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 25m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/state-backup/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: staging
              mountPath: /staging
            - name: data
              mountPath: /data
            # Only the two host paths the app needs; everything else in the
            # Infra tree is not mounted.
            - name: infra
              mountPath: /home/imranr/Main/Infra/current_target
              readOnly: true
            - name: state-backups
              mountPath: /home/imranr/Main/Infra/state_backups
            - name: vps0-ssh
              mountPath: /ssh
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: staging
          emptyDir:
            sizeLimit: 8Gi
        - name: data
          persistentVolumeClaim:
            claimName: state-backup-pvc
        - name: infra
          hostPath:
            path: /home/imranr/Main/Infra/current_target
            type: Directory
        - name: state-backups
          hostPath:
            path: /home/imranr/Main/Infra/state_backups
            type: DirectoryOrCreate
        - name: vps0-ssh
          secret:
            secretName: state-backup-vps0-ssh
            defaultMode: 0400
---
{{ include "dscpln.service" (dict "name" "state-backup" "targetPort" "http" "port" 8080) }}
