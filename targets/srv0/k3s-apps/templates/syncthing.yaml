apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
  annotations:
    backup.infra/exclude: "index-*.db index-v2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      hostNetwork: true
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          level: s0
      initContainers:
        - name: fix-perms
          image: busybox:1.38
          command: ["sh", "-c", "chown -R {{ .Values.MY_UID }}:{{ .Values.MY_UID }} /var/syncthing/config"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: syncthing-config
              mountPath: /var/syncthing/config
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.1.5
          args:
            - "--home"
            - "/var/syncthing/config"
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: STGUIADDRESS
              value: "127.0.0.1:8384"
          resources:
            limits:
              memory: 8Gi
            requests:
              memory: 128Mi
          readinessProbe:
            # A TCP probe against the TLS listener made kubelet open and drop
            # a connection every 30s, which Syncthing logged as "Failed TLS
            # handshake: EOF". Use the unauthenticated API health endpoint;
            # the GUI binds loopback (STGUIADDRESS), so probe 127.0.0.1.
            httpGet:
              path: /rest/noauth/health
              port: 8384
              host: 127.0.0.1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: host-maindir
              mountPath: /var/syncthing/hostmainparent/Main
            - name: host-devicesync
              mountPath: /var/syncthing/hostmainparent/deviceSync
            - name: syncthing-config
              mountPath: /var/syncthing/config
      volumes:
        - name: host-maindir
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
        - name: host-devicesync
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-pvc
        - name: syncthing-config
          persistentVolumeClaim:
            claimName: syncthing-config-pvc
