apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
  annotations:
    backup.infra/exclude: "index-*.db index-v2"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 50Gi
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      hostNetwork: true
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        # spc_t: the synced trees can contain files with foreign labels (e.g.
        # moved in from /tmp keep user_tmp_t); s0 keeps written files
        # category-free so the host and container_t readers can still open them.
        seLinuxOptions:
          type: spc_t
          level: s0
      initContainers:
        - name: fix-perms
          image: busybox:1.38
          command: ["sh", "-c", "chown -R {{ .Values.MY_UID }}:{{ .Values.MY_UID }} /var/syncthing/config; chown {{ .Values.MY_UID }}:{{ .Values.MY_UID }} /var/syncthing/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: syncthing-config
              mountPath: /var/syncthing/config
            - name: syncthing-data
              mountPath: /var/syncthing/data
      containers:
        - name: syncthing
          image: syncthing/syncthing:2.1.7
          # The image entrypoint injects --home; bypass it so the explicit
          # config/data split below is accepted. The init container performs
          # the only setup the entrypoint did for us (permissions).
          command: ["/bin/syncthing"]
          # Config/certs/keys stay on the backed-up NFS PVC. The database
          # (index-v2) and logs live on local disk: it is the only random-I/O
          # part of the config tree and is excluded from PVC backups anyway.
          args:
            - "--config"
            - "/var/syncthing/config"
            - "--data"
            - "/var/syncthing/data"
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: STGUIADDRESS
              value: "127.0.0.1:8384"
            # The image sets STHOMEDIR, which Syncthing treats like --home.
            # Clear it when using the explicit --config/--data split.
            - name: STHOMEDIR
              value: ""
          resources:
            limits:
              memory: 4Gi
            requests:
              memory: 2Gi
              cpu: 100m
          readinessProbe:
            # A TCP probe against the TLS listener made kubelet open and drop
            # a connection every 30s, which Syncthing logged as "Failed TLS
            # handshake: EOF". Use the unauthenticated API health endpoint;
            # the GUI binds loopback (STGUIADDRESS), so probe 127.0.0.1.
            httpGet:
              path: /rest/noauth/health
              port: 8384
              host: 127.0.0.1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: host-maindir
              mountPath: /var/syncthing/hostmainparent/Main
            - name: host-devicesync
              mountPath: /var/syncthing/hostmainparent/deviceSync
            - name: syncthing-config
              mountPath: /var/syncthing/config
            - name: syncthing-data
              mountPath: /var/syncthing/data
      volumes:
        - name: host-maindir
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
        - name: host-devicesync
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-pvc
        - name: syncthing-config
          persistentVolumeClaim:
            claimName: syncthing-config-pvc
        # The pod is already pinned to srv0 by the two local PVs above, so
        # this disposable index can live on srv0's local disk without reducing
        # scheduling flexibility.
        - name: syncthing-data
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/.local/share/syncthing-data
            type: DirectoryOrCreate
