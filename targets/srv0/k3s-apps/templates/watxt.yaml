# W@TXT: browse, import and merge WhatsApp chat exports.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watxt
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: watxt
  template:
    metadata:
      labels:
        app: watxt
    spec:
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          type: spc_t
          level: s0
      automountServiceAccountToken: false
      containers:
        - name: watxt
          image: ghcr.io/imranr98/watxt:latest@sha256:3494120e66851ae3a49ea1053c94219a4ffcff6cf7e5417ef3104f5560531062
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - containerPort: 8787
          env:
            - name: WATXT_CONFIG
              value: /config/config.json
            - name: BASE_PATH
              value: ""
            - name: AUTH_MODE
              value: proxy-header
            - name: APP_ORIGIN
              value: "https://watxt.{{ .Values.SERVICES_DOMAIN }}"
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/api/health" "port" "8787" "initialDelaySeconds" 10) | nindent 12 }}
          {{- include "infra.resources" (dict "tier" "large") | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          persistentVolumeClaim:
            claimName: watxt-app-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: hostpath-main-node-wa-txt-pvc
---
{{ include "dscpln.service" (dict "name" "watxt" "port" 8787) }}
---
# DA5H's dashboard proxy reads the live W@TXT summary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-da5h-watxt-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: watxt
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: da5h
      ports:
        - port: 8787
  policyTypes:
    - Ingress
