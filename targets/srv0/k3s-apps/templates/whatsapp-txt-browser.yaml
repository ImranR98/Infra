apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-txt
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp-txt
  template:
    metadata:
      labels:
        app: whatsapp-txt
    spec:
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        # spc_t: the Main tree is shared with the host and can carry foreign
        # labels; s0 keeps written files category-free for the host.
        seLinuxOptions:
          type: spc_t
          level: s0
      automountServiceAccountToken: false
      containers:
        - name: whatsapp-txt
          image: imranrdev/dscpln-watxt:latest@sha256:ff711e3b320e7001122f698504c4d634251e33a1966b9b0a710ff12818ba54a6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8787
          env:
            - name: BASE_PATH
              value: /watxt
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/watxt/api/state" "port" "8787" "initialDelaySeconds" 10) | nindent 12 }}
          resources:
            # The whole conversation index is held in memory, and imports merge
            # in-process, so give it room beyond the usual Node baseline.
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 10m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: data
          persistentVolumeClaim:
            claimName: hostpath-main-node-wa-txt-pvc
---
{{ include "dscpln.service" (dict "name" "whatsapp-txt" "port" 8787) }}
