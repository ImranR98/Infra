apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-txt
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp-txt
  template:
    metadata:
      labels:
        app: whatsapp-txt
    spec:
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        # spc_t: the Main tree is shared with the host and can carry foreign
        # labels; s0 keeps written files category-free for the host.
        seLinuxOptions:
          type: spc_t
          level: s0
      containers:
        - name: whatsapp-txt
          image: imranrdev/dscpln-watxt:latest@sha256:ae2f48da96eb5e0a85f6d27e8c2326617c9ba677c732f7a7324da79c6780bd80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8787
          env:
            - name: BASE_PATH
              value: /watxt
          readinessProbe:
            httpGet:
              path: /watxt/api/state
              port: 8787
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 10
          resources:
            # The whole conversation index is held in memory, and imports merge
            # in-process, so give it room beyond the usual Node baseline.
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 10m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hostpath-main-node-wa-txt-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-txt
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: whatsapp-txt
  ports:
    - port: 8787
      targetPort: 8787
