---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: watxt-prod-tls
  namespace: apps
spec:
  secretName: watxt-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - watxt.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: watxt-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - watxt.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: whatsapp-txt
          namespace: apps
          port: 8787
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-txt
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp-txt
  template:
    metadata:
      labels:
        app: whatsapp-txt
    spec:
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        # spc_t: the Main tree is shared with the host and can carry foreign
        # labels; s0 keeps written files category-free for the host.
        seLinuxOptions:
          type: spc_t
          level: s0
      containers:
        - name: whatsapp-txt
          image: imranrdev/dscpln-watxt:latest@sha256:e7b5a1ef8b36f6c8c5d2f0be944dc395bc47906ef6b0d25b66f641e70e93f861
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8787
          readinessProbe:
            tcpSocket:
              port: 8787
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 10
          resources:
            # The whole conversation index is held in memory, and imports merge
            # in-process, so give it room beyond the usual Node baseline.
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 10m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hostpath-main-node-wa-txt-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-txt
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: whatsapp-txt
  ports:
    - port: 8787
      targetPort: 8787
