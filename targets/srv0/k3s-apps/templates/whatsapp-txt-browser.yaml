apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-txt
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whatsapp-txt
  template:
    metadata:
      labels:
        app: whatsapp-txt
    spec:
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        # spc_t: the Main tree is shared with the host and can carry foreign
        # labels; s0 keeps written files category-free for the host.
        seLinuxOptions:
          type: spc_t
          level: s0
      automountServiceAccountToken: false
      containers:
        - name: whatsapp-txt
          image: imranrdev/dscpln-watxt:latest@sha256:7a278694cb187e10abe6a060428f659f36bf23d5cbd71102e0b03a8b5dd7b46f
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8787
          env:
            - name: BASE_PATH
              value: /watxt
          readinessProbe:
            httpGet:
              path: /watxt/api/state
              port: 8787
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 10
          resources:
            # The whole conversation index is held in memory, and imports merge
            # in-process, so give it room beyond the usual Node baseline.
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 10m
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: data
          persistentVolumeClaim:
            claimName: hostpath-main-node-wa-txt-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-txt
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: whatsapp-txt
  ports:
    - port: 8787
      targetPort: 8787
