# YTMusic Downloads (D$CPLN) — scheduled YouTube Music library downloads via
# the absorbed YTMusicDL downloader. Auth is a pasted ytmusicapi browser.json
# stored on the app's PVC; downloads land in ~/Main/Media/Music.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ytmusic-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-apps
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytmusic
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ytmusic
  template:
    metadata:
      labels:
        app: ytmusic
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      securityContext:
        # s0: downloads are written into the shared Main tree.
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seType" "spc_t" "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: ytmusic
          image: imranrdev/dscpln-ytmusic:latest@sha256:c0ff84bf8a8f1482be7fd758b7830c1820022aaeee485d6aa50795c202d64dc0
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/imranr
            - name: DSCPLN_DATA_DIR
              value: /data
            - name: DSCPLN_CONFIG_FILE
              value: /config/config.json
            - name: DSCPLN_STATE_FILE
              value: /data/state.json
            - name: XDG_CACHE_HOME
              value: /data/cache
            - name: TZ
              value: America/Toronto
            - name: BASE_PATH
              value: /ytmusic
            - name: AUTH_MODE
              value: proxy-header
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
            # Notifications relay through the portal (ntfy URL/token live there).
            - name: DSCPLN_PORTAL_URL
              value: http://portal:8080
          resources:
            # ffmpeg + yt-dlp over a large library.
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 50m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/ytmusic/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /data
            - name: config-src
              mountPath: /config
            - name: main
              mountPath: /home/imranr/Main/Media/Music
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          persistentVolumeClaim:
            claimName: ytmusic-pvc
        - name: config-src
          hostPath:
            path: {{ .Values.MAIN_PARENT_DIR }}/Main/Code/Automation/dscpln-config/apps/ytmusic
            type: Directory
        - name: main
          persistentVolumeClaim:
            claimName: hostpath-main-node-music-pvc
---
{{ include "dscpln.service" (dict "name" "ytmusic" "targetPort" "http" "port" 8080) }}
