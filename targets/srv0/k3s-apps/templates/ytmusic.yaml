# YTMusic Downloads (D$CPLN) — scheduled YouTube Music library downloads via
# the absorbed YTMusicDL downloader. Auth is a pasted ytmusicapi browser.json
# stored on the app's PVC; downloads land in ~/Main/Media/Music.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ytmusic-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytmusic
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ytmusic
  template:
    metadata:
      labels:
        app: ytmusic
    spec:
      nodeSelector:
        infra.local/hostpath-main: "true"
      securityContext:
        # s0: downloads are written into the shared Main tree.
        {{- include "dscpln.podSecurityContext" (dict "uid" .Values.MY_UID "seLevel" "s0") | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: ytmusic
          image: imranrdev/dscpln-ytmusic:latest@sha256:3f7d66ccdc189740df27966b7ecbb34a3b072ab1284679712db21d8c0aa3d91c
          securityContext:
            {{- include "dscpln.containerSecurityContext" (dict "uid" .Values.MY_UID "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /home/imranr
            - name: DSCPLN_DATA_DIR
              value: /data
            - name: XDG_CACHE_HOME
              value: /data/cache
            - name: TZ
              value: America/Toronto
            - name: BASE_PATH
              value: /ytmusic
            - name: DSCPLN_ORIGIN
              value: "https://dscpln.{{ .Values.SERVICES_DOMAIN }}"
          resources:
            # ffmpeg + yt-dlp over a large library.
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
              cpu: 50m
          readinessProbe:
            {{- include "dscpln.readinessProbe" (dict "path" "/ytmusic/api/health" "port" "http") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /data
            - name: main
              mountPath: /home/imranr/Main
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: config
          persistentVolumeClaim:
            claimName: ytmusic-pvc
        - name: main
          persistentVolumeClaim:
            claimName: hostpath-main-node-main-pvc
---
{{ include "dscpln.service" (dict "name" "ytmusic" "targetPort" "http" "port" 8080) }}
