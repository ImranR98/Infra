# values.yaml — committed defaults: machine-independent built-ins. All secrets
# and target-specific config live in the gitignored config/srv0/values.yaml
# (passed as a later -f, so it wins on conflicts).
# Must match the UID/GID baked into the opencode-sandbox image (default 1000);
# rebuild the image with --build-arg UID/GID if this changes.
MY_UID: 1000

# First-boot switch: "true" keeps the user-facing apps (Home Assistant,
# Immich, Jellyfin, Linkwarden, Navidrome, Opodsync) on the LAN/VPN listener
# only until Authelia is Ready. Normally false.
BOOTSTRAP_PRIVATE_APPS: "false"

# ====== Deployment paths / LAN ======
# Required in config/srv0/values.yaml.
HOME_DIR: ""
# Runtime state root. Empty derives <HOME_DIR>/infra_state.
INFRA_STATE_DIR: ""
LAN_CIDR: ""

# ====== Group names used by app-level auth ======
OPENWEBUI_ALLOWED_ROLES: "admins"
OPENWEBUI_ADMIN_ROLES: "admins"
FILEBROWSER_ADMIN_GROUP: "admins"

# ====== Frigate ROCm detector model ======
# The ONNX artifact lives outside the chart (targets/srv0/assets/) so it does
# not bloat the Helm release Secret. The ensure-model initContainer fetches it
# into the frigate-config PVC and verifies the digest before Frigate starts.
# Update the URL and SHA-256 together when rebuilding the model; see
# targets/srv0/assets/README.md for the build recipe.
FRIGATE_MODEL_URL: "https://raw.githubusercontent.com/ImranR98/Infra/master/targets/srv0/assets/yolov9-t-320.onnx"
FRIGATE_MODEL_SHA256: "1faaa8baafd9b9075f700e589701ca004f2d9fb98b2138fb2d778607a7783fbb"

# ====== bigpc (Compose host) ======
# Bigpc's LAN address. llama.cpp and the FL0W agent run in Compose there, so
# the apps chart keeps a selectorless llama-cpp Service + EndpointSlice at this
# address (the Models route points at that Service) and its FL0W egress policy
# is a /32. Keep it an IP. Required in config/srv0/values.yaml.
BIGPC_HOST: ""
