apiVersion: 1
# Rules removed from groups[] (the old Longhorn, pvc-backup and geoip alerts).
# Grafana's file provisioning only prunes rules listed here; the source file
# no longer defines them.
deleteRules:
  - orgId: 1
    uid: cronjob-stale-pvc-backup
  - orgId: 1
    uid: longhorn-volume-space
  - orgId: 1
    uid: longhorn-volume-fault
  - orgId: 1
    uid: longhorn-volume-degraded
  - orgId: 1
    uid: longhorn-node-storage
  - orgId: 1
    uid: longhorn-disk-storage
  - orgId: 1
    uid: longhorn-node-down
  - orgId: 1
    uid: geoip-unavailable
groups:
  - orgId: 1
    name: infra
    folder: Falco
    interval: 1m
    rules:
      - uid: io-pressure-srv0
        title: srv0 I/O pressure (PSI)
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: rate(node_pressure_io_waiting_seconds_total{node="srv0"}[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.2], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: srv0 is waiting on I/O more than 20% of the time
        labels:
          severity: warning

      - uid: disk-saturation-srv0
        title: srv0 root disk saturated
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: rate(node_disk_io_time_seconds_total{node="srv0",device="dm-0"}[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.8], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: srv0 root disk (dm-0) is over 80% utilized
        labels:
          severity: warning

      # Disk stalls on srv0 spike etcd/API latency; lease renewals fail next and
      # every leader-elected controller (including k3s) restarts. These two page
      # on that leading indicator instead of waiting for the restart spike below.
      - uid: etcd-latency-srv0
        title: etcd request latency high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.99, sum by (le) (rate(etcd_request_duration_seconds_bucket[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [5], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: etcd request p99 is over 5s — lease renewals fail next, taking controllers down with them
        labels:
          severity: warning

      - uid: apiserver-latency-srv0
        title: API server request latency high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.99, sum by (le) (rate(apiserver_request_sli_duration_seconds_bucket[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [5], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: API server p99 is over 5s — the cluster is in an I/O stall and controllers may restart
        labels:
          severity: warning

      - uid: disk-space-low
        title: Filesystem space low
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: (node_filesystem_avail_bytes{node="srv0",mountpoint=~"/|/mnt/k3s_extra_storage"} / node_filesystem_size_bytes{node="srv0",mountpoint=~"/|/mnt/k3s_extra_storage"}) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [15], type: lt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: srv0 filesystem is under 15% free
        labels:
          severity: warning

      - uid: node-not-ready
        title: Node not Ready
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: kube_node_status_condition{condition="Ready",status="true"} < 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: A Kubernetes node has been NotReady for 5 minutes
        labels:
          severity: critical

      - uid: container-restarts
        title: Container restart spike
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1200, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: A container restarted more than 3 times in 15 minutes
        labels:
          severity: warning

      - uid: container-oomkilled
        title: Container OOMKilled
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: kube_pod_container_status_terminated_reason{reason="OOMKilled"} > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: A container was OOM-killed
        labels:
          severity: warning

      - uid: pvc-lost
        title: PVC Lost
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: kube_persistentvolumeclaim_status_phase{phase="Lost"} == 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: A PersistentVolumeClaim is in the Lost phase
        labels:
          severity: critical

      - uid: cronjob-stale-renovate
        title: Renovate daily job has not succeeded in 26h
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: time() - kube_cronjob_status_last_successful_time{cronjob="renovate-daily"} > 93600
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: The Renovate daily job (apps, Infra, and digest pins) has not completed successfully in 26 hours
        labels:
          severity: warning

      - uid: renovate-daily-job-failed
        title: Renovate daily job failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >
                kube_job_status_failed{namespace="base",job_name=~"renovate-daily-.*"} > 0
                and on(namespace, job_name) kube_job_status_active{namespace="base",job_name=~"renovate-daily-.*"} == 0
                unless on(namespace, job_name) kube_job_status_completion_time{namespace="base",job_name=~"renovate-daily-.*"} > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: The scheduled Renovate daily job failed; check the job logs and the ntfy failure digest.
        labels:
          severity: warning

      - uid: task-runner-metrics-missing
        title: Task Runner scheduled-task metrics are missing
        condition: C
