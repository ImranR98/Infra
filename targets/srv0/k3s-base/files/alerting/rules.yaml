      # The only Falco alert enabled during the rule-tuning window: readiness
      # is independent of which rules match. bigpc being powered off makes this
      # fire (desired stays 2, ready drops to 1); the node-not-ready alert
      # explains why at the same time.
      - uid: falco-daemonset-not-ready
        title: Falco not ready
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: kube_daemonset_status_number_ready{namespace="base",daemonset="falco"} < bool on() group_left() count(kube_node_status_condition{condition="Ready",status="true"} == 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
