              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: Falco is not ready on a Ready node.
        labels:
          severity: critical

      # A rule's Prometheus counter series is created at its first match, so
      # increase() is 0 for that event. present_over_time's first-5m window
      # catches the new series; recurring matches use increase.
      - uid: falco-critical-events
        title: Falco critical event
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: >
                sum by (rule_name) (increase(falcosecurity_falco_rules_matches_total{priority=~"0|1|2|3"}[5m]) > 0)
                or sum by (rule_name) (
                  present_over_time(falcosecurity_falco_rules_matches_total{priority=~"0|1|2|3"}[5m])
                  unless present_over_time(falcosecurity_falco_rules_matches_total{priority=~"0|1|2|3"}[5m] offset 5m)
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: Falco detected a critical/error runtime event on srv0.
        labels:
          severity: critical

      # A first warning series is only visible to present_over_time for 5m,
      # so the 30m for requires recurring warnings (increase). One-off app
      # warnings stay log-only and do not page.
      - uid: falco-warning-events
