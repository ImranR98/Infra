              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Task Runner has no available replica, so no scheduled backup or export will run.
        labels:
          severity: critical

      - uid: task-runner-state-backups-stale
