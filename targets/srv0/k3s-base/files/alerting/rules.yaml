      - uid: task-runner-scheduled-run-failed
        title: A scheduled Task Runner task failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 1 - task_runner_task_last_run_ok{task=~"State Backups|Contacts.*|YTMusic.*|Wine Game Saves"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
