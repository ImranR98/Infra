# Initial tuning from the first deployment. These are known-noise suppressions,
# not alert changes; event-rate alerts stay gated on the observation window.

# logtfy watches pod logs through the Kubernetes API by design, so every poll
# would otherwise be a NOTICE event. The output override also drops
# `command=%proc.cmdline` for every other container: command lines can carry
# bearer tokens or passwords (logtfy's curl invocation exposed a service
# account token), and Loki retains them for 90 days.
- rule: Contact K8S API Server From Container
  output: >
    Unexpected connection to K8s API Server from container |
    connection=%fd.name lport=%fd.lport rport=%fd.rport fd_type=%fd.type
    fd_proto=%fd.l4proto evt_type=%evt.type user=%user.name user_uid=%user.uid
    user_loginuid=%user.loginuid process=%proc.name proc_exepath=%proc.exepath
    parent=%proc.pname terminal=%proc.tty
  exceptions:
    - name: logtfy_kubernetes_api
      fields: [k8s.ns.name, k8s.pod.name]
      comps: ["=", startswith]
      values:
        - [apps, logtfy-]
  override:
    output: replace
    exceptions: append

# Immich's postgres readiness probe runs pg_isready, whose Perl wrapper opens
# /etc/shadow on every check. The read is a known, non-actionable baseline.
- rule: Read sensitive file untrusted
  exceptions:
    - name: immich_postgres_readiness
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [apps, immich-postgresql-, pg_isready]
  override:
    exceptions: append

# --- False-alarm exceptions from the first observation window (2026-10-26) ---

# RocketLeague under Proton/Wine uses ptrace for its anti-cheat on bigpc. This
# is host-only and process-scoped; a container, or another host process, still
# fires the rule.
- rule: PTRACE attached to process
  exceptions:
    - name: rocket_league_eac_host
      fields: [container.name, proc.name]
      comps: ["=", "="]
      values:
        - [host, RocketLeague_EA]
  override:
    exceptions: append

# Same game process also produces the anti-debug NOTICE.
- rule: PTRACE anti-debug attempt
  exceptions:
    - name: rocket_league_eac_antidebug_host
      fields: [container.name, proc.name]
      comps: ["=", "="]
      values:
        - [host, RocketLeague_EA]
  override:
    exceptions: append

# FlareSolverr launches its bundled chromedriver from the writable layer on
# first solve. Scope to that pod and process only; any other binary still
# triggers the Critical rule.
- rule: Drop and execute new binary in container
  exceptions:
    - name: flaresolverr_chromedriver
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [apps, flaresolverr-, chromedriver]
  override:
    exceptions: append

# Known controllers and jobs that legitimately use the API server. The rule
# remains active for every other pod/process.
- rule: Contact K8S API Server From Container
  exceptions:
    - name: headlamp_api
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [apps, headlamp-, headlamp-server]
    - name: immich_seed_api
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [apps, immich-seed-, kubectl]
    - name: crowdsec_cert_roll_api
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [base, crowdsec-cert-roll-, kubectl]
    - name: helm_install_api
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [base, helm-install-, helm]
    - name: helm_install_mapkubeapis_api
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [base, helm-install-, mapkubeapis]
    - name: alloy_operator_api
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [base, k8s-monitoring-alloy-operator-, helm-operator]
  override:
    exceptions: append

# FreshRSS's own cron wrapper.
- rule: Run shell untrusted
  exceptions:
    - name: freshrss_cron_shell
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [apps, freshrss-, sh]
  override:
    exceptions: append

# Home Assistant opens AF_PACKET sockets for local device discovery.
- rule: Packet socket created in container
  exceptions:
    - name: homeassistant_packet_socket
      fields: [k8s.ns.name, k8s.pod.name, proc.name]
      comps: ["=", startswith, "="]
      values:
        - [apps, homeassistant-, python3]
  override:
    exceptions: append

# Renovate's containerbase Node tool runs npm/node from its writable tool
# cache. Scope to the Renovate job family and the containerbase Node path so a
# different binary in the same pod still fires the Critical rule.
- rule: Drop and execute new binary in container
  exceptions:
    - name: renovate_containerbase_node
      fields: [k8s.ns.name, k8s.pod.name, proc.name, proc.exe]
      comps: ["=", startswith, "=", startswith]
      values:
        - [base, renovate-, node, /opt/containerbase/tools/node/]
  override:
    exceptions: append

# dnf5 makecache rotates/clears its own log on the host.
- rule: Clear Log Activities
  exceptions:
    - name: host_dnf5_log_rotation
      fields: [container.name, proc.name, fd.name]
      comps: ["=", "=", startswith]
      values:
        - [host, dnf5, /var/log/dnf5.log]
  override:
    exceptions: append
