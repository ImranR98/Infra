---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: base
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 1.21.2
  valuesContent: |-
    installCRDs: true
    image:
      repository: quay.io/jetstack/cert-manager-controller
      tag: v1.21.2
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 64Mi
    cainjector:
      image:
        repository: quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.2
      resources:
        limits:
          memory: 256Mi
        requests:
          memory: 64Mi
    webhook:
      image:
        repository: quay.io/jetstack/cert-manager-webhook
        tag: v1.21.2
      resources:
        limits:
          memory: 128Mi
        requests:
          memory: 32Mi
    startupapicheck:
      image:
        repository: quay.io/jetstack/cert-manager-startupapicheck
        tag: v1.21.2
    acmesolver:
      image:
        repository: quay.io/jetstack/cert-manager-acmesolver
        tag: v1.21.2
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.DOMAIN_OWNER_EMAIL }}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.tls: "false"
                  traefik.ingress.kubernetes.io/router.priority: "42" # Must be >0 to avoid conflict with default HTTP>HTTPS redirect. See https://www.reddit.com/r/Traefik/comments/giqiih/cant_figure_out_http_https_redirection_for/
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.DOMAIN_OWNER_EMAIL }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.tls: "false"
                  traefik.ingress.kubernetes.io/router.priority: "42"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: self-signed-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-local-ca
  namespace: base
spec:
  isCA: true
  commonName: k3s-local-ca
  secretName: k3s-local-ca-secret
  issuerRef:
    name: self-signed-issuer
    kind: ClusterIssuer
  duration: 175200h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: k3s-local-ca-secret
