---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crowdsec-web-ui-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - crowdsec.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: crowdsec-web-ui
          port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-web-ui
  namespace: base
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crowdsec-web-ui
  template:
    metadata:
      labels:
        app: crowdsec-web-ui
      annotations:
        # LAPI password is an env secretKeyRef; env values only refresh on restart.
        checksum/crowdsec-secrets: {{ printf "%s|%s|%s" .Values.CROWDSEC_BOUNCER_KEY .Values.CROWDSEC_LAPI_SECRET .Values.CROWDSEC_WEBUI_LAPI_PASSWORD | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          level: s0
      containers:
        - name: crowdsec-web-ui
          image: ghcr.io/theduffman85/crowdsec-web-ui:2026.11.12@sha256:5bc8a0bdb6350101bce07f1db55df9784b27f6f2ff49cc1316bd67988628558e
          securityContext:
            runAsUser: {{ .Values.MY_UID }}
            runAsGroup: {{ .Values.MY_UID }}
            allowPrivilegeEscalation: false
          env:
            # LAPI is TLS-only (chart-generated CA); the machine password is
            # registered once with `cscli machines add` (see config_template).
            - name: CONFIG_INSTANCE_LAPI_URL
              value: https://crowdsec-service.base.svc.cluster.local:8080
            - name: CONFIG_INSTANCE_LAPI_AUTH_USERNAME
              value: crowdsec-web-ui
            - name: CONFIG_INSTANCE_LAPI_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: webui-lapi-password
            - name: CONFIG_INSTANCE_LAPI_TLS_CA_FILE
              value: /etc/crowdsec-web-ui/ca.crt
            # The chart runs LAPI, agent and AppSec as separate pods, each with
            # its own metrics endpoint: LAPI has cs_lapi_*/cs_alerts, the agent
            # owns parser/bucket counters, AppSec owns cs_appsec_*. One URL only
            # would leave the parser, scenario and AppSec panels at zero.
            - name: CONFIG_INSTANCES_0_METRICS_0_ID
              value: lapi
            - name: CONFIG_INSTANCES_0_METRICS_0_NAME
              value: LAPI
            - name: CONFIG_INSTANCES_0_METRICS_0_URL
              value: http://crowdsec-service.base.svc.cluster.local:6060/metrics
            - name: CONFIG_INSTANCES_0_METRICS_1_ID
              value: agent
            - name: CONFIG_INSTANCES_0_METRICS_1_NAME
              value: Agent
            - name: CONFIG_INSTANCES_0_METRICS_1_URL
              value: http://crowdsec-agent-service.base.svc.cluster.local:6060/metrics
            - name: CONFIG_INSTANCES_0_METRICS_2_ID
              value: appsec
            - name: CONFIG_INSTANCES_0_METRICS_2_NAME
              value: AppSec
            - name: CONFIG_INSTANCES_0_METRICS_2_URL
              value: http://crowdsec-appsec-service.base.svc.cluster.local:6060/metrics
          ports:
            - containerPort: 3000
          {{- include "infra.resources" (dict "tier" "xlarge") | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: crowdsec-web-ui-data
              mountPath: /app/data
            - name: crowdsec-web-ui-ca
              mountPath: /etc/crowdsec-web-ui
              readOnly: true
      volumes:
        - name: crowdsec-web-ui-data
          persistentVolumeClaim:
            claimName: crowdsec-web-ui-pvc
        - name: crowdsec-web-ui-ca
          secret:
            secretName: crowdsec-root-secret
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-web-ui
  namespace: base
spec:
  selector:
    app: crowdsec-web-ui
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-web-ui-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-apps
