---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: crowdsec
  namespace: base
spec:
  chart: crowdsec
  repo: https://crowdsecurity.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  version: 0.24.2
  valuesContent: |-
    container_runtime: containerd

    tls:
      enabled: true
      # Annotations prevent null secretTemplate rendering (CrowdSec chart v0.24.0 bug).
      certManager:
        secretTemplate:
          annotations:
            crowdsec.io/component: "true"

    appsec:
      enabled: true
      resources:
        limits:
          memory: 256Mi
          cpu: 500m
        requests:
          memory: 64Mi
          cpu: 50m
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          appsec_config: crowdsecurity/virtual-patching
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
      service:
        type: ClusterIP
    config:
      profiles.yaml: |
        name: default_ip_remediation
        debug: false
        filters:
            - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
            - type: ban
              duration: 672h
        notifications:
            - http_default
        on_success: break

    agent:
      resources:
        limits:
          memory: 1Gi
          cpu: 500m
        requests:
          memory: 192Mi
          cpu: 50m
      podSecurityContext:
        fsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          type: spc_t        # NOTE: crowdsec must run as root — /staging/ tini-init and SELinux
      containerSecurityContext:
        allowPrivilegeEscalation: false
      acquisition:
        - namespace: kube-system
          podName: traefik-*
          program: traefik
          poll_without_inotify: true
      extraVolumes:
        - name: crowdsec-lapi-configs
          secret:
            secretName: crowdsec-lapi-configs
            defaultMode: 0600
      extraVolumeMounts:
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/navidrome.yaml
          subPath: navidrome.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/immich.yaml
          subPath: immich.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/homeassistant.yaml
          subPath: homeassistant.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/seerr.yaml
          subPath: seerr.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/plik.yaml
          subPath: plik.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/linkwarden.yaml
          subPath: linkwarden.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/fmd.yaml
          subPath: fmd.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/crowdsec-webui.yaml
          subPath: crowdsec-webui.whitelist.yaml
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/linux crowdsecurity/traefik"

    lapi:
      replicas: 1
      resources:
        limits:
          memory: 512Mi
          cpu: 500m
        requests:
          memory: 128Mi
          cpu: 50m
      podSecurityContext:
        fsGroup: {{ .Values.MY_UID }}
      containerSecurityContext:
        allowPrivilegeEscalation: false
      dashboard:
        enabled: false
      env:
        # TLS + AGENTS_ALLOWED_OU prevents appsec entering "unknown" after reboot.
        - name: AGENTS_ALLOWED_OU
          value: agent-ou,appsec-ou
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: bouncer-key
      extraVolumes:
        - name: crowdsec-lapi-configs
          secret:
            secretName: crowdsec-lapi-configs
            defaultMode: 0600
      extraVolumeMounts:
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/notifications/http.yaml
          subPath: http.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/navidrome.yaml
          subPath: navidrome.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/immich.yaml
          subPath: immich.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/homeassistant.yaml
          subPath: homeassistant.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/seerr.yaml
          subPath: seerr.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/plik.yaml
          subPath: plik.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/linkwarden.yaml
          subPath: linkwarden.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/fmd.yaml
          subPath: fmd.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/crowdsec-webui.yaml
          subPath: crowdsec-webui.whitelist.yaml
      persistentVolume:
        config:
          enabled: false
        data:
          enabled: true
          existingClaim: crowdsec-pvc
      secrets:
        externalSecret:
          name: crowdsec-secrets
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-crowdsec-internal
  namespace: base
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  ingress:
    - from:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
              type: agent
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              k8s-app: crowdsec
              type: appsec
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: crowdsec-web-ui
      ports:
        - port: 8080
        - port: 6060
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lapi-from-traefik
  namespace: base
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: lapi
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-appsec-from-traefik
  namespace: base
spec:
  podSelector:
    matchLabels:
      k8s-app: crowdsec
      type: appsec
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 7422
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-lapi-configs
  namespace: base
type: Opaque
stringData:
  http.yaml: |
    type: http
    name: http_default
    log_level: debug
    format: |
      {{.|toJson}}
    url: http://ntfy.base.svc.cluster.local:3000/{{ .Values.TARGET }}_services_crowdsec
    method: POST
    headers:
      Authorization: Bearer {{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}
      Title: CrowdSec on {{ .Values.TARGET }}
      Priority: min
  navidrome.whitelist.yaml: |
    name: imranr/navidrome
    description: "Whitelist for Navidrome"
    whitelist:
      reason: "Downloading from Navidrome using client apps can cause false positives"
      expression:
        - evt.Meta.target_fqdn == 'music.{{ .Values.SERVICES_DOMAIN }}'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
  immich.whitelist.yaml: |
    name: imranr/immich
    description: "Whitelist for Immich"
    whitelist:
      reason: "Browsing Immich can cause false positives (missing thumbnails 404, token-expiry 401 bursts)"
      expression:
        - evt.Meta.target_fqdn == 'immich.{{ .Values.SERVICES_DOMAIN }}'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'LePresidente/http-generic-401-bf', 'LePresidente/http-generic-403-bf']
        - evt.Meta.http_path matches '/api/.*'
        - evt.Meta.http_status in ['404', '401', '403']
  homeassistant.whitelist.yaml: |
    name: imranr/homeassistant
    description: "Whitelist for HomeAssistant"
    whitelist:
      reason: "HomeAssistant webhooks can cause false positives"
      expression:
        - evt.Meta.target_fqdn == 'ha.{{ .Values.SERVICES_DOMAIN }}'
        - evt.Overflow.Alert.GetScenario() in ['LePresidente/http-generic-403-bf']
        - evt.Meta.http_verb == 'POST'
        - evt.Meta.http_path matches '^/api/webhook/.+'
  seerr.whitelist.yaml: |
    name: imranr/seerr
    description: "Whitelist for Seerr"
    whitelist:
      reason: "Browsing Seerr without login causes 403 on API endpoints"
      expression:
        - evt.Meta.target_fqdn == 'seerr.{{ .Values.SERVICES_DOMAIN }}'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'LePresidente/http-generic-403-bf']
        - evt.Meta.http_status == '403'
        - evt.Meta.http_path matches '^/api/.*'
  plik.whitelist.yaml: |
    name: imranr/plik
    description: "Whitelist for Plik"
    whitelist:
      reason: "Uploading/downloading files from Plik can cause false positives"
      expression:
        - evt.Meta.target_fqdn == 'send.{{ .Values.SERVICES_DOMAIN }}' && evt.Overflow.Alert.GetScenario() in ['LePresidente/http-generic-403-bf', 'crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
  linkwarden.whitelist.yaml: |
    name: imranr/linkwarden
    description: "Whitelist for Linkwarden"
    whitelist:
      reason: "Linkwarden is a SPA: the UI fetches /api/v1 archive previews in bursts, tripping crawl scenarios"
      expression:
        - evt.Meta.target_fqdn == 'links.{{ .Values.SERVICES_DOMAIN }}'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
        - evt.Meta.http_verb == 'GET'
        - evt.Meta.http_path matches '^/api/v1/.+'
  fmd.whitelist.yaml: |
    name: imranr/fmd
    description: "Whitelist for FindMyDevice"
    whitelist:
      reason: "Phone clients with a stale device key get 401 from fmd, tripping brute-force scenarios and self-banning the IP"
      expression:
        - evt.Meta.target_fqdn == 'fmd.{{ .Values.SERVICES_DOMAIN }}'
        - evt.Overflow.Alert.GetScenario() in ['LePresidente/http-generic-401-bf', 'LePresidente/http-generic-403-bf']
        - evt.Meta.http_verb == 'POST'
        - evt.Meta.http_path matches '^/api/v1/location'
  crowdsec-webui.whitelist.yaml: |
    name: imranr/crowdsec-webui
    description: "Whitelist for CrowdSec Web UI"
    whitelist:
      reason: "The web UI is a SPA: the dashboard fetches the API in bursts, tripping crawl scenarios"
      expression:
        - evt.Meta.target_fqdn == 'crowdsec.{{ .Values.SERVICES_DOMAIN }}'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
        - evt.Meta.http_verb == 'GET'
        - evt.Meta.http_path matches '^/api/.+'
---
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-secrets
  namespace: base
type: Opaque
stringData:
  bouncer-key: "{{ .Values.CROWDSEC_BOUNCER_KEY }}"
  csLapiSecret: "{{ .Values.CROWDSEC_LAPI_SECRET }}"
  webui-lapi-password: "{{ .Values.CROWDSEC_WEBUI_LAPI_PASSWORD }}"
