---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  chart: csi-driver-nfs
  repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  failurePolicy: abort
  targetNamespace: kube-system
  version: 4.13.5
  valuesContent: |-
    image:
      nfs:
        repository: registry.k8s.io/sig-storage/nfsplugin
        tag: v4.13.5
    node:
      dnsPolicy: ClusterFirstWithHostNet
    # Ships the snapshot.storage.k8s.io CRDs + snapshot-controller. The
    # csi-snapshotter sidecars of both csi-driver-nfs and Longhorn watch those
    # CRDs; without them they retry-list forever and log errors continuously.
    externalSnapshotter:
      enabled: true
---
---
# Default storage class for application PVCs. The NFS server exports the
# app-data tree from current_target/k3s_live_state/nfs-apps; the CSI driver
# creates a subdirectory per PVC. Sizes are advisory (NFS has no quota).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-apps
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: nfs.csi.k8s.io
parameters:
  server: nfs-server.base.svc.cluster.local
  share: /apps
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  onDelete: retain
  mountPermissions: "0777"
mountOptions:
  - nfsvers=4.2
  - hard
  - noatime
  - nconnect=4
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
---
# RWX NFS-backed storage class for the shared PVC backup destination.
# No provisioner: the pvc-backup-dest PVC binds to the static PV
# pvc-backup-dest-pv, which mounts the ROOT of the NFS backups share
# (nfs-server pod, pinned to the infra.local/hostpath-main node, exporting
# /exports/backups = hostPath {{ .Values.PVC_BACKUP_DIR }} on srv0). Nothing is
# dynamically provisioned, so no pvc-* subdirs ever appear in the
# backup directory.
# NOTE: the fsid=0 export is /exports, so the pseudofs root IS /exports and
# sub-exports are addressed by their relative name (/backups, not /exports/backups).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-backup
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.2
