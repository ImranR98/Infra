---
# Kept deployed for future multi-node needs. With srv0 as the only node this is
# a no-op today; the profile is the taint safety net for nodes added later
# (evict pods that do not tolerate a node's taints, when they fit elsewhere).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart: descheduler
  repo: https://kubernetes-sigs.github.io/descheduler
  failurePolicy: abort
  targetNamespace: kube-system
  createNamespace: false
  version: 0.37.0
  valuesContent: |-
    image:
      repository: registry.k8s.io/descheduler/descheduler
      tag: v0.37.0
    kind: CronJob
    # Every 2 minutes created 720 job pods/day for a descheduler that usually
    # evicts nothing. Ten minutes still rebalances promptly after node drift,
    # while cutting k3s/containerd/etcd churn by 5x. minPodAge is 15m, so
    # effective eviction checks are roughly every 20 minutes.
    schedule: "*/10 * * * *"
    # A failed run (e.g. apiserver down during a k3s restart) retries up to
    # backoffLimit times, leaving a trail of Error pods. The next run
    # supersedes any failure — keep only the most recent failed job (its
    # pods' logs) for debugging.
    failedJobsHistoryLimit: 1
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 2
      maxNoOfPodsToEvictPerNamespace: 3
      maxNoOfPodsToEvictTotal: 5
      profiles:
        - name: "taint-cleanup"
          pluginConfig:
            - name: "DefaultEvictor"
              args:
                nodeFit: true
                minPodAge: 15m
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
            # No includedTaints: every taint is considered, so a future tainted
            # node gets the same cleanup the old opt-in node did.
            - name: "RemovePodsViolatingNodeTaints"
          plugins:
            deschedule:
              enabled:
                - "RemovePodsViolatingNodeTaints"
    {{- include "infra.resources" (dict "tier" "tiny" "cpuLimit" "500m") | nindent 4 }}
