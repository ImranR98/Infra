---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart: descheduler
  repo: https://kubernetes-sigs.github.io/descheduler
  failurePolicy: abort
  targetNamespace: kube-system
  createNamespace: false
  version: 0.36.0
  valuesContent: |-
    kind: CronJob
    schedule: "*/2 * * * *"
    # A failed run (e.g. apiserver down during a k3s restart) retries up to
    # backoffLimit times, leaving a trail of Error pods. The schedule is only
    # 2 minutes, so the next run supersedes any failure — keep only the most
    # recent failed job (its pods' logs) for debugging.
    failedJobsHistoryLimit: 1
    # Rebalances pods that drifted due to soft affinities / PreferNoSchedule
    # taints being evaluated only at scheduling time:
    #   - RemovePodsViolatingNodeTaints: evicts pods on bigpc that do NOT
    #     tolerate its scheduling-discouraged taint (only if they fit
    #     elsewhere, i.e. srv0). Ollama tolerates it -> never touched.
    #   - RemovePodsViolatingNodeAffinity: evicts pods whose PREFERRED node
    #     (has-amdgpu=true) can now fit them; while bigpc is unavailable
    #     there is no better node -> no eviction, so no thrash loop.
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 2
      maxNoOfPodsToEvictPerNamespace: 3
      maxNoOfPodsToEvictTotal: 5
      profiles:
        - name: "k3s-rebalance"
          pluginConfig:
            - name: "DefaultEvictor"
              args:
                nodeFit: true
                minPodAge: 15m
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
            - name: "RemovePodsViolatingNodeTaints"
              args:
                includePreferNoSchedule: true
                includedTaints:
                  - scheduling-discouraged
                # Longhorn instance-managers are node-local volume pods that
                # legitimately run on tainted nodes; excluding them prevents
                # futile eviction attempts every cycle.
                namespaces:
                  exclude:
                    - longhorn-system
            - name: "RemovePodsViolatingNodeAffinity"
              args:
                nodeAffinityType:
                  - preferredDuringSchedulingIgnoredDuringExecution
          plugins:
            deschedule:
              enabled:
                - "RemovePodsViolatingNodeTaints"
                - "RemovePodsViolatingNodeAffinity"
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 128Mi
