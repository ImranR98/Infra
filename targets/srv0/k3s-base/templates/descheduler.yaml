---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart: descheduler
  repo: https://kubernetes-sigs.github.io/descheduler
  failurePolicy: abort
  targetNamespace: kube-system
  createNamespace: false
  version: 0.37.0
  valuesContent: |-
    image:
      repository: registry.k8s.io/descheduler/descheduler
      tag: v0.37.0
    kind: CronJob
    # Every 2 minutes created 720 job pods/day for a descheduler that usually
    # evicts nothing. Ten minutes still rebalances promptly after node drift,
    # while cutting k3s/containerd/etcd churn by 5x. minPodAge is 15m, so
    # effective eviction checks are roughly every 20 minutes.
    schedule: "*/10 * * * *"
    # A failed run (e.g. apiserver down during a k3s restart) retries up to
    # backoffLimit times, leaving a trail of Error pods. The next run
    # supersedes any failure — keep only the most recent failed job (its
    # pods' logs) for debugging.
    failedJobsHistoryLimit: 1
    # Rebalances pods that drifted due to the PreferNoSchedule taint being
    # evaluated only at scheduling time:
    #   - RemovePodsViolatingNodeTaints: evicts pods on bigpc that do NOT
    #     tolerate its scheduling-discouraged taint (only if they fit
    #     elsewhere, i.e. srv0). Ollama tolerates it -> never touched.
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 2
      maxNoOfPodsToEvictPerNamespace: 3
      maxNoOfPodsToEvictTotal: 5
      profiles:
        - name: "k3s-rebalance"
          pluginConfig:
            - name: "DefaultEvictor"
              args:
                nodeFit: true
                minPodAge: 15m
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
            - name: "RemovePodsViolatingNodeTaints"
              args:
                includePreferNoSchedule: true
                includedTaints:
                  - scheduling-discouraged
          plugins:
            deschedule:
              enabled:
                - "RemovePodsViolatingNodeTaints"
    resources:
      limits:
        memory: 128Mi
        cpu: 500m
      requests:
        memory: 32Mi
        cpu: 10m
