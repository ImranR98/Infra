{{- $publicHosts := required "PUBLIC_HOSTS must be set in config/srv0/values.yaml" .Values.PUBLIC_HOSTS -}}
{{- $privateHosts := required "PRIVATE_HOSTS must be set in config/srv0/values.yaml" .Values.PRIVATE_HOSTS -}}
# Two shared exact-name edge certificates replace the per-app certificates.
# edge-public-tls is attached to both secure listeners; edge-private-tls is
# attached only to websecure, so files/traefik never reach the public-exposure
# listener. Add/remove a public app in PUBLIC_HOSTS and re-issue; the names are
# exact (not a wildcard), but all public names share one key.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-public-tls
  namespace: base
spec:
  secretName: edge-public-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
{{- range $publicHosts }}
    - {{ . }}.{{ $.Values.SERVICES_DOMAIN }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-private-tls
  namespace: base
spec:
  secretName: edge-private-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
{{- range $privateHosts }}
    - {{ . }}.{{ $.Values.SERVICES_DOMAIN }}
{{- end }}
