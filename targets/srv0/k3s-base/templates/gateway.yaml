# Gateway API edge for srv0. One shared Gateway; all HTTPRoutes live in `base`
# because Traefik resolves Middleware ExtensionRefs only in the route's
# namespace (and the shared Middlewares live there).
#
# The certificateRefs list is the platform's edge TLS inventory: one entry per
# component Certificate. scripts/validate.sh checks every ref against the
# rendered Certificates.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-local-tls
  namespace: base
spec:
  secretName: home-local-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - "*.home.local"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: srv0
  namespace: base
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - {name: dscpln-prod-tls, namespace: apps}
          - {name: fmd-prod-tls, namespace: apps}
          - {name: freshrss-prod-tls, namespace: apps}
          - {name: frigate-prod-tls, namespace: apps}
          - {name: headlamp-prod-tls, namespace: apps}
          - {name: homeassistant-prod-tls, namespace: apps}
          - {name: immich-prod-tls, namespace: apps}
          - {name: jellyfin-prod-tls, namespace: apps}
          - {name: linkwarden-prod-tls, namespace: apps}
          - {name: navidrome-prod-tls, namespace: apps}
          - {name: nextcloud-prod-tls, namespace: apps}
          - {name: openwebui-prod-tls, namespace: apps}
          - {name: opodsync-prod-tls, namespace: apps}
          - {name: plik-prod-tls, namespace: apps}
          - {name: prowlarr-prod-tls, namespace: apps}
          - {name: qbittorrent-prod-tls, namespace: apps}
          - {name: radarr-prod-tls, namespace: apps}
          - {name: seerr-prod-tls, namespace: apps}
          - {name: sonarr-prod-tls, namespace: apps}
          - {name: authelia-prod-tls}
          - {name: crowdsec-web-ui-prod-tls}
          - {name: grafana-prod-tls}
          - {name: ntfy-prod-tls}
          - {name: traefik-prod-tls, namespace: kube-system}
          - {name: home-local-tls}
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure-proxy
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - {name: dscpln-prod-tls, namespace: apps}
          - {name: fmd-prod-tls, namespace: apps}
          - {name: freshrss-prod-tls, namespace: apps}
          - {name: frigate-prod-tls, namespace: apps}
          - {name: headlamp-prod-tls, namespace: apps}
          - {name: homeassistant-prod-tls, namespace: apps}
          - {name: immich-prod-tls, namespace: apps}
          - {name: jellyfin-prod-tls, namespace: apps}
          - {name: linkwarden-prod-tls, namespace: apps}
          - {name: navidrome-prod-tls, namespace: apps}
          - {name: nextcloud-prod-tls, namespace: apps}
          - {name: openwebui-prod-tls, namespace: apps}
          - {name: opodsync-prod-tls, namespace: apps}
          - {name: plik-prod-tls, namespace: apps}
          - {name: prowlarr-prod-tls, namespace: apps}
          - {name: qbittorrent-prod-tls, namespace: apps}
          - {name: radarr-prod-tls, namespace: apps}
          - {name: seerr-prod-tls, namespace: apps}
          - {name: sonarr-prod-tls, namespace: apps}
          - {name: authelia-prod-tls}
          - {name: crowdsec-web-ui-prod-tls}
          - {name: grafana-prod-tls}
          - {name: ntfy-prod-tls}
          - {name: traefik-prod-tls, namespace: kube-system}
      allowedRoutes:
        namespaces:
          from: Same
---
# Lets the base-namespace Gateway read app TLS secrets and base-namespace
# HTTPRoutes reach app Services.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-edge-from-base
  namespace: apps
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: base
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: base
  to:
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
---
# Lets the base-namespace Gateway read the Traefik dashboard cert (certificate
# stays in kube-system next to the Traefik install).
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-edge-from-base
  namespace: kube-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: base
  to:
    - group: ""
      kind: Secret
      name: traefik-prod-tls
