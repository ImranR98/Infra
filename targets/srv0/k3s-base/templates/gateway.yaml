# Gateway API edge for srv0. One shared Gateway; all HTTPRoutes live in `base`
# because Traefik resolves Middleware ExtensionRefs only in the route's
# namespace (and the shared Middlewares live there).
#
# TLS is two shared exact-name certificates in this namespace (see
# edge-certs.yaml): edge-public-tls is attached to both secure listeners and
# edge-private-tls only to websecure, so files/traefik never reach the
# public-exposure listener. scripts/validate.sh checks every ref against the
# rendered Certificates.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: srv0
  namespace: base
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - {name: edge-public-tls}
          - {name: edge-private-tls}
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure-proxy
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - {name: edge-public-tls}
      allowedRoutes:
        namespaces:
          from: Same
---
# Lets base-namespace HTTPRoutes reach app Services. The edge certificates live
# in base, so the Gateway no longer reads Secrets from apps.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-edge-from-base
  namespace: apps
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: base
  to:
    - group: ""
      kind: Service
