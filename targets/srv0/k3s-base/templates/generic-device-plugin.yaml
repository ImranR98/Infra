---
# Generic device plugin (squat/generic-device-plugin): registers host devices
# with kubelet so pods can request them as extended resources. The init
# container generates the config from sysfs and /dev on every node:
#
#   infra.local/vaapi     -> one render node, preferring a discrete GPU
#   infra.local/intel-gpu -> i915/xe render node (OpenVINO)
#   infra.local/amd-igpu  -> AMD integrated GPU (kfd + DRM nodes, ROCm)
#   infra.local/amd-dgpu  -> AMD discrete GPU (kfd + DRM nodes, ROCm)
#   infra.local/conbee    -> ConBee II, discovered by /dev/serial/by-id
#
# The generator normalizes host device names to card0/renderD128/ttyACM0, so
# app manifests never depend on enumeration order. Hardware is therefore a
# capability, not a node-label proxy. The plugin runs unprivileged: spc_t
# covers SELinux for the host /dev (read-only) and the kubelet device-plugin
# socket dir, and no capabilities are needed. A config change rolls the
# DaemonSet via the checksum annotation below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: generic-device-plugin
  namespace: base
data:
  init.sh: |
    {{- .Files.Get "files/generic-device-plugin-init.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: base
spec:
  selector:
    matchLabels:
      app: generic-device-plugin
  template:
    metadata:
      labels:
        app: generic-device-plugin
      annotations:
        # Roll the DaemonSet when the generator changes (the plugin reads the
        # generated config only at startup).
        checksum/config: {{ .Files.Get "files/generic-device-plugin-init.sh" | sha256sum }}
    spec:
      # Run on every node so each node registers its own hardware resources.
      tolerations:
        - operator: Exists
      securityContext:
        seLinuxOptions:
          type: spc_t
      initContainers:
        # Generate the per-node config from /sys and /dev.
        - name: config
          image: busybox:1.38.0-uclibc@sha256:b2e35951f72501f6a99f1bf45bcfe6d4795be08c518c2f97d0ed2fe776958a3b
          command:
            - /bin/sh
            - /etc/generic-device-plugin-src/init.sh
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # /dev is the host device tree (read-only); the default
          # /dev/termination-log cannot be created. Use the writable config
          # emptyDir instead.
          terminationMessagePath: /etc/generic-device-plugin/termination-log
          {{- include "infra.resources" (dict "tier" "tiny") | nindent 10 }}
          volumeMounts:
            - name: config-src
              mountPath: /etc/generic-device-plugin-src
              readOnly: true
            - name: config
              mountPath: /etc/generic-device-plugin
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
              readOnly: true
      containers:
        - name: plugin
          image: squat/generic-device-plugin:0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          args:
            - --domain=infra.local
            - --config=/etc/generic-device-plugin/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- include "infra.resources" (dict "tier" "tiny") | nindent 10 }}
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          # /dev is mounted read-only, so the default /dev/termination-log
          # cannot be created after a node reboot. Keep the root filesystem
          # read-only but put the termination message in a writable tmpfs.
          terminationMessagePath: /tmp/termination-log
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            # Host /dev view (read-only): the plugin globs/stats device nodes
            # to discover them; kubelet/containerd does the actual mounting.
            - name: dev
              mountPath: /dev
              readOnly: true
            - name: config
              mountPath: /etc/generic-device-plugin
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: config
          emptyDir: {}
        - name: config-src
          configMap:
            name: generic-device-plugin
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: tmp
          emptyDir: {}
