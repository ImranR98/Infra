---
# Weekly GeoLite2 refresh. The DB lives on the pod's emptyDir (no Longhorn),
# and only the pod's own init container can write it, so freshness comes from
# a surge rollout: the replacement downloads the DB before the old pod is
# removed, keeping geoblock's backend continuously available.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoip-refresh
  namespace: base
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: geoip-refresh
          restartPolicy: Never
          containers:
            - name: rollout
              image: bitnami/kubectl:latest@sha256:999d5eb28f404b45f15117f2a110ff23c6164f76edac261d75d783b6e88252b7
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                limits:
                  memory: 64Mi
                requests:
                  memory: 32Mi
                  cpu: 10m
              command:
                - kubectl
                - -n
                - base
                - rollout
                - restart
                - deployment/geoip
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geoip-refresh
  namespace: base
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geoip-refresh
  namespace: base
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["geoip"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geoip-refresh
  namespace: base
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: geoip-refresh
subjects:
  - kind: ServiceAccount
    name: geoip-refresh
    namespace: base
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoip
  namespace: base
  labels:
    app: geoip-service
spec:
  replicas: 1
  # Surge rollout: the replacement downloads the DB into its own emptyDir
  # before the old pod is removed, so the Service always keeps a ready
  # endpoint (geoblock fails closed when it has none).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: geoip-service
  template:
    metadata:
      labels:
        app: geoip-service
      annotations:
        # MaxMind credentials feed the init container via env; rotate-on-restart.
        checksum/maxmind-secret: {{ printf "%s|%s" (.Values.GEOIPUPDATE_ACCOUNT_ID | toString) .Values.GEOIPUPDATE_LICENSE_KEY | sha256sum }}
    spec:
      securityContext:
        runAsUser: {{ .Values.MY_UID }}
        runAsGroup: {{ .Values.MY_UID }}
        runAsNonRoot: true
      # Seed/refresh the GeoLite2 DB on every start; the weekly geoip-refresh
      # CronJob rolls the deployment so a new DB is picked up without downtime.
      initContainers:
        - name: geoipupdate
          image: maxmindinc/geoipupdate:latest@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
          env:
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: geoipupdate-secret
                  key: account-id
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: geoipupdate-secret
                  key: license-key
            - name: GEOIPUPDATE_EDITION_IDS
              value: "GeoLite2-Country"
            - name: GEOIPUPDATE_DB_DIR
              value: "/data"
          volumeMounts:
            - name: geoip-data
              mountPath: /data
      containers:
        - name: geoip
          image: imranrdev/geoip-service:latest@sha256:f2bf625934698e504a42056b309915c9beda12561d5c76cd2450193c8ef41a51
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              memory: "16Mi"
            limits:
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: geoip-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: geoip-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: geoip-service
  namespace: base
spec:
  selector:
    app: geoip-service
  ports:
    - port: 8080
      targetPort: 8080
---
# The MaxMind credential Secret (account-id is quoted in the template so
# Kubernetes keeps the numeric value as a string).
# geoipupdate credentials (MaxMind GeoLite2).
apiVersion: v1
kind: Secret
metadata:
  name: geoipupdate-secret
  namespace: base
type: Opaque
stringData:
  account-id: "{{ .Values.GEOIPUPDATE_ACCOUNT_ID }}"
  license-key: "{{ .Values.GEOIPUPDATE_LICENSE_KEY }}"
