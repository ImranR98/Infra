# Host-level PersistentVolumes — shared resources tied to specific cluster nodes.
# Each PV is paired with a PVC in the apps namespace. All are RWX so multiple
# pods can share the same host directory if needed.
{{- $volumes := list
    (dict "name" "main" "path" (include "path.main" .) "size" "4096Gi" "affinity" "hostpath-main")
    (dict "name" "devicesync" "path" (include "path.devicesync" .) "size" "4096Gi" "affinity" "hostpath-main")
    (dict "name" "syslog" "path" (include "path.journal" .) "size" "5Gi" "affinity" "external-exposed")
    (dict "name" "d4ta-watxt" "path" (include "path.d4taWatxtData" .) "size" "4096Gi" "affinity" "hostpath-main")
    (dict "name" "file-pipelines" "path" (include "path.filePipelines" .) "size" "4096Gi" "affinity" "hostpath-main")
    (dict "name" "backups" "path" (include "path.backups" .) "size" "4096Gi" "affinity" "hostpath-main")
    (dict "name" "media" "path" (include "path.media" .) "size" "4096Gi" "affinity" "hostpath-main")
    (dict "name" "documents" "path" (include "path.documents" .) "size" "4096Gi" "affinity" "hostpath-main")
    (dict "name" "whatsapp" "path" (include "path.whatsapp" .) "size" "4096Gi" "affinity" "hostpath-main")
-}}
{{- $prefixes := dict "hostpath-main" "hostpath-main-node" "external-exposed" "external-exposed-node" }}
{{- range $volumes }}
{{- $prefix := index $prefixes .affinity }}
{{- $pv := printf "%s-%s-pv" $prefix .name }}
{{- $pvc := printf "%s-%s-pvc" $prefix .name }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $pv }}
spec:
  capacity:
    storage: {{ .size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ .path }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: infra.local/{{ .affinity }}
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvc }}
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: {{ .size }}
  volumeName: {{ $pv }}
{{- end }}
