---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: longhorn
  namespace: kube-system
spec:
  chart: longhorn
  repo: https://charts.longhorn.io
  failurePolicy: abort
  targetNamespace: longhorn-system
  createNamespace: true
  version: 1.12.1
  valuesContent: |-
    defaultSettings:
      defaultReplicaCount: 1
      defaultDataLocality: best-effort
      storageOverProvisioningPercentage: 2000
      storageMinimalAvailablePercentage: 5
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: true
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      # Default 12% reserves 1.92 cores/node; observed instance-manager peak is
      # ~1.4 cores (see Grafana), so 8% is the realistic guarantee.
      guaranteedInstanceManagerCPU: 8
    longhornManager:
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 192Mi
          cpu: 50m
    createDefaultDiskLabeledNodes: true
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
---
# Weekly filesystem trim for every volume in the `default` recurring-job group.
# Without this nothing ever discards freed blocks, so Longhorn's actual size
# only grows (snapshots/CoW keep old blocks). Snapshot removal stays off
# (remove-snapshots-during-filesystem-trim=false), so this is reclaim-only.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim-filesystem
  namespace: longhorn-system
spec:
  name: trim-filesystem
  cron: "0 4 * * 0"
  task: filesystem-trim
  groups:
    - default
  concurrency: 1
  labels:
    infra: recurring
---
# Additive NetworkPolicy: Longhorn's own longhorn-manager policy only admits
# Longhorn components, so the monitoring collector needs an explicit allowance
# to scrape :9500 (both selectors must match — namespace + pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-longhorn-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - protocol: TCP
          port: 9500
