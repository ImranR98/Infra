---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: longhorn
  namespace: kube-system
spec:
  chart: longhorn
  repo: https://charts.longhorn.io
  failurePolicy: abort
  targetNamespace: longhorn-system
  createNamespace: true
  version: 1.13.0
  valuesContent: |-
    defaultSettings:
      defaultReplicaCount: 1
      defaultDataLocality: best-effort
      storageOverProvisioningPercentage: 2000
      storageMinimalAvailablePercentage: 5
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      orphanAutoDeletion: true
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      # The 8s default faults every engine when the shared root disk stalls (a
      # 16s stall auto-salvaged all volumes); 30s is Longhorn's maximum.
      engineReplicaTimeout: 30
      # Default 12% reserves 1.92 cores/node; observed instance-manager peak is
      # ~1.4 cores (see Grafana), so 8% is the realistic guarantee.
      guaranteedInstanceManagerCPU: 8
    longhornManager:
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 192Mi
          cpu: 50m
    createDefaultDiskLabeledNodes: true
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
---
# Daily filesystem trim for every volume in the `default` recurring-job group.
# Without this nothing ever discards freed blocks, so Longhorn's actual size
# only grows (snapshots/CoW keep old blocks). Snapshot removal stays off
# (remove-snapshots-during-filesystem-trim=false), so this is reclaim-only.
# Runs after the Home Assistant automatic backups (04:45 local) so blocks freed
# by their rotation are reclaimed; cron is evaluated in the server's local TZ.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim-filesystem
  namespace: longhorn-system
spec:
  name: trim-filesystem
  cron: "0 7 * * *"
  task: filesystem-trim
  groups:
    - default
  concurrency: 1
  labels:
    infra: recurring
---
# Additive NetworkPolicy: Longhorn's own longhorn-manager policy only admits
# Longhorn components, so the monitoring collector needs an explicit allowance
# to scrape :9500 (both selectors must match — namespace + pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-longhorn-manager
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - protocol: TCP
          port: 9500
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-prod-tls
  namespace: base
spec:
  secretName: longhorn-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - longhorn.{{ .Values.SERVICES_DOMAIN }}
---
# Lets the base-namespace HTTPRoute reach the Longhorn UI Service.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-edge-from-base
  namespace: longhorn-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: base
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ingress
  namespace: base
spec:
  parentRefs:
    # LAN/VPN-only: not attached to websecure-proxy (the public FRP listener).
    - name: srv0
      sectionName: websecure
  hostnames:
    - longhorn.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: longhorn-frontend
          namespace: longhorn-system
          port: 80
---
# The UI pod has no policy of its own (Longhorn's chart only covers the
# manager/engine pods), so restrict it to the edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-ui-from-traefik
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
