---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: k8s-monitoring
  namespace: base
spec:
  chart: k8s-monitoring
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 4.5.2
  valuesContent: |-
    # Grafana's first-party Kubernetes observability chart: generates all Alloy
    # collector configs for cluster metrics (kubelet/cadvisor/ksm/api-server/
    # coredns), host metrics (node-exporter) and pod logs (streamed via the
    # Kubernetes API - no host mounts), shipping to the in-cluster Mimir/Loki.
    cluster:
      name: k3s
    destinations:
      prometheus:
        type: prometheus
        url: http://mimir.base.svc.cluster.local:8080/api/v1/push
      loki:
        type: loki
        url: http://loki.base.svc.cluster.local:3100/loki/api/v1/push
    collectors:
      alloy-metrics:
        enabled: true
        presets: [clustered]
        alloy:
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
      alloy-logs:
        enabled: true
        presets: [clustered]
        alloy:
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 512Mi
    alloy-operator:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 512Mi
    clusterMetrics:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
      # K3s control plane components (etcd/scheduler/controller-manager) are
      # embedded without scrapeable endpoints; the API server and CoreDNS run
      # as real workloads and are scraped.
      apiServer:
        enabled: true
      kubeDNS:
        enabled: true
      # Default allowlists off: they are tuned to Grafana's own dashboards and
      # would drop series the dotdc dashboards query.
      kubelet:
        metricsTuning:
          useDefaultAllowList: false
      kubeletResource:
        metricsTuning:
          useDefaultAllowList: false
      cadvisor:
        metricsTuning:
          useDefaultAllowList: false
      kube-state-metrics:
        metricsTuning:
          useDefaultAllowList: false
    hostMetrics:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
      linuxHosts:
        enabled: true
        metricsTuning:
          useDefaultAllowList: false
    podLogsViaKubernetesApi:
      enabled: true
      destinations: [loki]
      collector: alloy-logs
      labels:
        # The pod's app.kubernetes.io/name label is exposed as the plain `app`
        # stream label (dashboards/Explore filters).
        app: app.kubernetes.io/name
      extraDiscoveryRules: |
        // Fallbacks for pods without app.kubernetes.io/name: plain `app`
        // wins over k8s-app, which wins over the job-name of Job pods; the
        // temp copy is dropped afterwards.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_job_name"]
          regex         = ".+"
          target_label  = "__tmp_log_app"
          replacement   = "$0"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
          regex         = ".+"
          target_label  = "__tmp_log_app"
          replacement   = "$0"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = ".+"
          target_label  = "__tmp_log_app"
          replacement   = "$0"
        }
        rule {
          source_labels = ["__tmp_log_app"]
          regex         = ".+"
          target_label  = "app"
          replacement   = "$0"
        }
        rule {
          regex  = "__tmp_log_app"
          action = "labeldrop"
        }
    selfReporting:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
    # Scrape Prometheus-Operator objects (the Longhorn chart's ServiceMonitor);
    # the CRDs are already installed in the cluster.
    prometheusOperatorObjects:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
    telemetryServices:
      kube-state-metrics:
        deploy: true
      node-exporter:
        deploy: true
        # The filesystem collector reads /host/proc/1/mountinfo; SELinux
        # denies container_t that ptrace across mount namespaces (root +
        # SYS_PTRACE alone do not pass the LSM hook), so the chart's 65534
        # default drops all node_filesystem_* metrics. spc_t + root + SYS_PTRACE
        # matches the repo's other host-access pods (pvc-backup/restore, HA);
        # the container keeps read-onlyRootFilesystem + read-only host mounts.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
          seLinuxOptions:
            type: spc_t
        containerSecurityContext:
          readOnlyRootFilesystem: true
          capabilities:
            add: ["SYS_PTRACE"]
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: grafana
  namespace: base
spec:
  chart: grafana
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 10.5.15
  valuesContent: |-
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password
    envFromSecret: grafana-oidc-secret
    # Grafana creates grafana.db 0660 while its sqlstore expects 0640, warning
    # on every start. The chart's init-chown-data only chowns, so chmod here
    # (runs after it, as the file owner 472). A fresh PVC still warns once
    # because Grafana creates the file after this runs.
    extraInitContainers:
      - name: fix-grafana-db-perms
        image: busybox:1.38
        command: ["sh", "-c", "[ -f /var/lib/grafana/grafana.db ] && chmod 640 /var/lib/grafana/grafana.db || true"]
        securityContext:
          runAsUser: 472
          runAsGroup: 472
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: storage
            mountPath: /var/lib/grafana
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: longhorn
    resources:
      requests:
        memory: 320Mi
      limits:
        memory: 1Gi
    grafana.ini:
      server:
        root_url: https://grafana.{{ .Values.SERVICES_DOMAIN }}
      auth:
        # OIDC-only UI: no local username/password form. Recovery if
        # Authelia ever breaks: kubectl -n base exec deploy/... grafana-cli
        # admin reset-admin-password.
        disable_login_form: true
      auth.generic_oauth:
        enabled: true
        name: Authelia
        client_id: grafana
        scopes: openid profile email groups
        auth_url: https://auth.{{ .Values.SERVICES_DOMAIN }}/api/oidc/authorization
        token_url: https://auth.{{ .Values.SERVICES_DOMAIN }}/api/oidc/token
        api_url: https://auth.{{ .Values.SERVICES_DOMAIN }}/api/oidc/userinfo
        use_pkce: true
        allow_sign_up: true
        role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || email == '{{ .Values.DOMAIN_OWNER_EMAIL }}' && 'Admin' || 'Viewer'"
        # Authelia's ID token carries no email/groups claims and Grafana never
        # merges the userinfo claims into role mapping, so mapping-based roles
        # always land on Viewer. Roles are therefore assigned once (the
        # operator is promoted via the Grafana API; signups default to Viewer)
        # and login never overwrites them.
        skip_org_role_sync: true
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://mimir.base.svc.cluster.local:8080/prometheus
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.base.svc.cluster.local:3100
            access: proxy
            isDefault: false
    extraSecretMounts:
      # ntfy contact point (holds the write-only token).
      - name: alerting-contact
        secretName: grafana-alerting-contact
        mountPath: /etc/grafana/provisioning/alerting/contactpoints.yaml
        subPath: contactpoints.yaml
        readOnly: true
    extraConfigmapMounts:
      - name: alerting-rules
        configMap: grafana-alerting-rules
        mountPath: /etc/grafana/provisioning/alerting/rules.yaml
        subPath: rules.yaml
        readOnly: true
      - name: alerting-policies
        configMap: grafana-alerting-rules
        mountPath: /etc/grafana/provisioning/alerting/policies.yaml
        subPath: policies.yaml
        readOnly: true
      - name: alerting-templates
        configMap: grafana-alerting-rules
        mountPath: /etc/grafana/provisioning/alerting/templates.yaml
        subPath: templates.yaml
        readOnly: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: dotdc
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/dotdc
          - name: kubernetes-logs
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes-logs
          - name: longhorn
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/longhorn
    dashboards:
      dotdc:
        k8s-views-global:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-global.json
        k8s-views-namespaces:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-namespaces.json
        k8s-views-nodes:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-nodes.json
        k8s-views-pods:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-views-pods.json
        k8s-system-api-server:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-system-api-server.json
        k8s-system-coredns:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.6/dashboards/k8s-system-coredns.json
    dashboardsConfigMaps:
      kubernetes-logs: k8s-monitoring-kubernetes-logs-dashboard
      longhorn: longhorn-dashboard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-monitoring-kubernetes-logs-dashboard
  namespace: base
data:
  kubernetes-logs.json: |-
{{ .Files.Get "files/dashboards/kubernetes-logs.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-dashboard
  namespace: base
data:
  longhorn.json: |-
{{ .Files.Get "files/dashboards/longhorn.json" | indent 4 }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-prod-tls
  namespace: base
spec:
  secretName: grafana-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - grafana.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress
  namespace: base
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`grafana.{{ .Values.SERVICES_DOMAIN }}`)
      kind: Rule
      middlewares:
        - name: geoblock
        - name: crowdsec-bouncer
        - name: forwardauth-authelia
      services:
        - name: grafana
          port: 80
  tls:
    secretName: grafana-prod-tls
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
  namespace: base
spec:
  chart: loki
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 7.3.0
  valuesContent: |-
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 1Gi
      podSecurityContext:
        # Shared with the migration/backup pods: pod-level s0 (container-level
        # is ignored) keeps the filesystem-storage files readable across pods.
        seLinuxOptions:
          level: s0
      persistence:
        # Never auto-delete the chunks PVC on scale-down/uninstall.
        whenScaled: Retain
        whenDeleted: Retain
    # Chart validation: scalable targets must stay at 0 replicas while
    # singleBinary.replicas > 0 (the defaults are non-zero).
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # No canary/gateway: the k8s-monitoring log collector and Grafana talk to
    # the loki Service directly.
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    loki:
      auth_enabled: false
      ingester:
        lifecycler:
          ring:
            # SingleBinary single replica: one ingester is the whole write path.
            replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem
      limits_config:
        # 90 days of logs; compactor enforces this against the object store.
        retention_period: 2160h
        # NOTE: keep reject_old_samples at its default (true). Disabling it
        # once shipped months of historical docker logs through Loki ->
        # RustFS -> Longhorn and saturated the node's storage path.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # Chart-bundled mixin dashboards/SM/PrometheusRules are disabled: the
    # minimal stack keeps no ServiceMonitor/PrometheusRule CRs anywhere, logs
    # are browsed in Grafana Explore and the kubernetes-logs dashboard.
    monitoring:
      dashboards:
        enabled: false
      serviceMonitor:
        enabled: false
      rules:
        enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    # Grew to 200Gi during an aborted filesystem-storage migration; Longhorn
    # cannot shrink, so the manifest matches the live volume.
    requests:
      storage: 200Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: base
  labels:
    app: mimir
spec:
  replicas: 1
  # Single replica + RWO PVC: Recreate avoids two pods fighting for the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        fsGroup: 10001
        # Shared with the migration pod: pod-level s0 (container-level is
        # ignored) so filesystem-storage files stay readable across pods.
        seLinuxOptions:
          level: s0
      containers:
        - name: mimir
          image: grafana/mimir:3.2.1
          args:
            # Flags instead of a config file: any config change is a
            # Deployment change, so the pod rolls automatically on apply.
            - -server.http-listen-port=8080
            - -auth.multitenancy-enabled=false
            # Filesystem object store: blocks/ruler/alertmanager live on the
            # mimir-data PVC.
            - -common.storage.backend=filesystem
            - -blocks-storage.filesystem.dir=/data/blocks
            - -ruler-storage.filesystem.dir=/data/ruler
            - -alertmanager-storage.filesystem.dir=/data/alertmanager
            - -blocks-storage.tsdb.dir=/data/tsdb
            - -blocks-storage.bucket-store.sync-dir=/data/tsdb-sync
            - -compactor.data-dir=/data/compactor
            # Single ingester: the whole write path is one replica.
            - -ingester.ring.replication-factor=1
            # 180 days of blocks.
            - -compactor.blocks-retention-period=4320h
            # Single trusted tenant: generous limits so backlog flushes after
            # downtime are never rejected, and the series the cluster scrapes
            # fit under the per-user cap.
            - -distributor.ingestion-rate-limit=1000000
            - -distributor.ingestion-burst-size=1000000
            - -ingester.max-global-series-per-user=1000000
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: base
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mimir-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app: mimir
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ksm-metrics-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 3100
  policyTypes:
    - Ingress
---
# Alloy clustering (ckit transport on 12345): without this the collectors can
# never join the memberlist (deny-all-ingress blocks it), so every instance
# scrapes all cluster-wide targets and Mimir rejects the duplicate samples as
# out-of-order.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-cluster
  namespace: base
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["alloy-metrics", "alloy-logs"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["alloy-metrics", "alloy-logs"]
      ports:
        - port: 12345
          protocol: TCP
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oidc-secret
  namespace: base
type: Opaque
stringData:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .Values.AUTHELIA_GRAFANA_CLIENT_SECRET_HASHABLE }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: base
type: Opaque
stringData:
  admin-user: admin
  admin-password: "{{ .Values.GRAFANA_ADMIN_PASSWORD }}"

---
# Grafana alerting provisioning: ntfy contact point (token → Secret) and the
# alert rules / notification policy tree (ConfigMap, file-backed so the YAML
# stays readable).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-alerting-contact
  namespace: base
type: Opaque
stringData:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: ntfy
        receivers:
          - uid: ntfy
            type: webhook
            settings:
              # The URL is templated, so dynamic ntfy presentation rides as query
              # params (Extra Headers are static): title = alertname, priority by
              # state/severity, markdown body from the "ntfy.body" template.
              # Title encoding order matters: % first, then spaces (otherwise the
              # % of %20 gets re-escaped).
              url: '{{ `http://ntfy.base.svc.cluster.local:3000/` }}{{ .Values.TARGET }}{{ `_services_grafana?markdown=yes&title={{ reReplaceAll " " "%20" (reReplaceAll "%" "%25" .CommonLabels.alertname) }}&priority={{ if eq .Status "resolved" }}low{{ else if eq .CommonLabels.severity "critical" }}urgent{{ else if eq .CommonLabels.severity "warning" }}high{{ else }}default{{ end }}` }}'
              httpMethod: POST
              authorization_scheme: Bearer
              authorization_credentials: "{{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}"
              payload:
                template: '{{ `{{ template "ntfy.body" . }}` }}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules
  namespace: base
data:
  rules.yaml: |-
{{ .Files.Get "files/alerting/rules.yaml" | indent 4 }}
  policies.yaml: |-
{{ .Files.Get "files/alerting/policies.yaml" | indent 4 }}
  templates.yaml: |-
{{ .Files.Get "files/alerting/templates.yaml" | indent 4 }}
