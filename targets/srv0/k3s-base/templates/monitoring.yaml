{{- define "prometheus.config" -}}
global:
  scrape_interval: 60s
scrape_configs: []
{{- end -}}
{{- define "grafana.alerting.contactpoints" -}}
apiVersion: 1
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        settings:
          # The URL is templated, so dynamic ntfy presentation rides as query
          # params (Extra Headers are static): title = alertname, priority by
          # state/severity, markdown body from the "ntfy.body" template.
          # Title encoding order matters: % first, then spaces (otherwise the
          # % of %20 gets re-escaped).
          url: '{{ `http://ntfy.base.svc.cluster.local:3000/` }}{{ .Values.TARGET }}{{ `_services_grafana?markdown=yes&title={{ reReplaceAll " " "%20" (reReplaceAll "%" "%25" .CommonLabels.alertname) }}&priority={{ if eq .Status "resolved" }}low{{ else if eq .CommonLabels.severity "critical" }}urgent{{ else if eq .CommonLabels.severity "warning" }}high{{ else }}default{{ end }}` }}'
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: "{{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}"
          payload:
            template: '{{ `{{ template "ntfy.body" . }}` }}'
{{- end -}}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: k8s-monitoring
  namespace: base
spec:
  chart: k8s-monitoring
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 4.5.3
  valuesContent: |-
    # Grafana's first-party Kubernetes observability chart: generates all Alloy
    # collector configs for cluster metrics (kubelet/cadvisor/ksm/api-server/
    # coredns), host metrics (node-exporter) and pod logs (tail from the node's
    # /var/log via a read-only host mount), shipping to the in-cluster
    # Prometheus/Loki.
    cluster:
      name: k3s
    destinations:
      prometheus:
        type: prometheus
        url: http://prometheus.base.svc.cluster.local:9090/api/v1/write
      loki:
        type: loki
        url: http://loki.base.svc.cluster.local:3100/loki/api/v1/push
    collectors:
      alloy-metrics:
        enabled: true
        presets: [clustered]
        alloy:
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
      alloy-logs:
        enabled: true
        presets: [clustered]
        alloy:
          # Tail from the node's /var/log; SELinux denies container_t (even as
          # root) reads of host container_log_t files, so the collector runs
          # under spc_t, matching node-exporter/node-facts.
          mounts:
            varlog: true
          securityContext:
            seLinuxOptions:
              type: spc_t
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 512Mi
    alloy-operator:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 512Mi
    clusterMetrics:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
      # K3s control plane components (etcd/scheduler/controller-manager) are
      # embedded without scrapeable endpoints; the API server and CoreDNS run
      # as real workloads and are scraped.
      apiServer:
        enabled: true
      kubeDNS:
        enabled: true
      # Default allowlists off: they are tuned to Grafana's own dashboards and
      # would drop series the dotdc dashboards query.
      kubelet:
        metricsTuning:
          useDefaultAllowList: false
      kubeletResource:
        metricsTuning:
          useDefaultAllowList: false
      cadvisor:
        metricsTuning:
          useDefaultAllowList: false
      kube-state-metrics:
        metricsTuning:
          useDefaultAllowList: false
    hostMetrics:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
      linuxHosts:
        enabled: true
        metricsTuning:
          useDefaultAllowList: false
        # The chart sets instance to the node name but no node label, so
        # node-exporter metrics are the odd ones out against KSM/cadvisor/
        # kubelet. Add it (the disk alert selects node="srv0").
        extraDiscoveryRules: |
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
        # node_uname_info.nodename is the pod hostname on the pod network, but
        # the dotdc dashboards resolve their instance variable by matching
        # nodename against the selected node, so rewrite it to the node name.
        extraMetricProcessingRules: |
          rule {
            source_labels = ["__name__", "node"]
            separator     = "@"
            regex         = "node_uname_info@(.+)"
            target_label  = "nodename"
            replacement   = "$1"
          }
    # Filesystem tailing, not API streaming: each collector reads its node's
    # /var/log directly, dropping the per-container pods/log API streams.
    podLogsViaLoki:
      enabled: true
      destinations: [loki]
      collector: alloy-logs
      labels:
        # The pod's app.kubernetes.io/name label is exposed as the plain `app`
        # stream label (dashboards/Explore filters).
        app: app.kubernetes.io/name
      extraDiscoveryRules: |
        // Fallbacks for pods without app.kubernetes.io/name: plain `app`
        // wins over k8s-app, which wins over the job-name of Job pods; the
        // temp copy is dropped afterwards.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_job_name"]
          regex         = ".+"
          target_label  = "__tmp_log_app"
          replacement   = "$0"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
          regex         = ".+"
          target_label  = "__tmp_log_app"
          replacement   = "$0"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = ".+"
          target_label  = "__tmp_log_app"
          replacement   = "$0"
        }
        rule {
          source_labels = ["__tmp_log_app"]
          regex         = ".+"
          target_label  = "app"
          replacement   = "$0"
        }
        rule {
          regex  = "__tmp_log_app"
          action = "labeldrop"
        }
    selfReporting:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
    # Scrape Prometheus-Operator objects (the Longhorn chart's ServiceMonitor);
    # the CRDs are already installed in the cluster.
    prometheusOperatorObjects:
      enabled: true
      destinations: [prometheus]
      collector: alloy-metrics
    telemetryServices:
      kube-state-metrics:
        deploy: true
        # /livez checks the API server, so transient API blips restart KSM.
        # Use the KSM process readiness endpoint for liveness instead.
        livenessProbe:
          httpGet:
            path: /readyz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      node-exporter:
        deploy: true
        # Pod-network (not hostNetwork): clustered Alloy may assign a node's
        # node-exporter target to the other node's collector, and hostNetwork
        # targets are the node's LAN IP, where k3s-node-prep's 9100 drop applies
        # to the SNAT'd cross-node scrape. Host mounts are unaffected.
        hostNetwork: false
        # The filesystem collector reads /host/proc/1/mountinfo; SELinux
        # denies container_t that ptrace across mount namespaces (root +
        # SYS_PTRACE alone do not pass the LSM hook), so the chart's 65534
        # default drops all node_filesystem_* metrics. spc_t + root + SYS_PTRACE
        # matches the repo's other host-access pods (pvc-backup/restore, HA);
        # the container keeps read-onlyRootFilesystem + read-only host mounts.
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
          seLinuxOptions:
            type: spc_t
        containerSecurityContext:
          readOnlyRootFilesystem: true
          capabilities:
            add: ["SYS_PTRACE"]
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: grafana
  namespace: base
spec:
  chart: grafana
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 10.5.15
  valuesContent: |-
    image:
      registry: docker.io
      repository: grafana/grafana
      tag: 13.2.4
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password
    envFromSecret: grafana-oidc-secret
    # Restart Grafana when a provisioning input changes: alerting file
    # provisioning is loaded at startup (upstream requires a restart or the
    # admin reload API), and env-referenced Secrets never reach a running pod.
    podAnnotations:
      checksum/alerting-rules: {{ printf "%s%s%s" (.Files.Get "files/alerting/rules.yaml") (.Files.Get "files/alerting/policies.yaml") (.Files.Get "files/alerting/templates.yaml") | sha256sum }}
      checksum/alerting-contact: {{ include "grafana.alerting.contactpoints" . | sha256sum }}
      checksum/grafana-admin-secret: {{ printf "admin|%s" .Values.GRAFANA_ADMIN_PASSWORD | sha256sum }}
      checksum/grafana-oidc-secret: {{ .Values.AUTHELIA_GRAFANA_CLIENT_SECRET_HASHABLE | sha256sum }}
    # Grafana creates grafana.db 0660 while its sqlstore expects 0640, warning
    # on every start. The chart's init-chown-data only chowns, so chmod here
    # (runs after it, as the file owner 472). A fresh PVC still warns once
    # because Grafana creates the file after this runs.
    extraInitContainers:
      - name: fix-grafana-db-perms
        image: busybox:1.38
        command: ["sh", "-c", "[ -f /var/lib/grafana/grafana.db ] && chmod 640 /var/lib/grafana/grafana.db || true"]
        securityContext:
          runAsUser: 472
          runAsGroup: 472
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: storage
            mountPath: /var/lib/grafana
    persistence:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-apps
    resources:
      requests:
        memory: 320Mi
      limits:
        memory: 1Gi
    grafana.ini:
      server:
        http_addr: 0.0.0.0
        root_url: https://grafana.{{ .Values.SERVICES_DOMAIN }}
      auth:
        # OIDC-only UI: no local username/password form. Recovery if
        # Authelia ever breaks: kubectl -n base exec deploy/... grafana-cli
        # admin reset-admin-password.
        disable_login_form: true
      auth.generic_oauth:
        enabled: true
        name: Authelia
        client_id: grafana
        scopes: openid profile email groups
        auth_url: https://auth.{{ .Values.SERVICES_DOMAIN }}/api/oidc/authorization
        token_url: https://auth.{{ .Values.SERVICES_DOMAIN }}/api/oidc/token
        api_url: https://auth.{{ .Values.SERVICES_DOMAIN }}/api/oidc/userinfo
        use_pkce: true
        allow_sign_up: true
        # Authelia's ID token carries no email/groups claims and Grafana never
        # merges the userinfo claims into role mapping, so mapping-based roles
        # always land on Viewer. Roles are therefore assigned once (the
        # operator is promoted via the Grafana API; signups default to Viewer)
        # and login never overwrites them.
        skip_org_role_sync: true
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus.base.svc.cluster.local:9090
            access: proxy
            isDefault: true
            jsonData:
              # Alloy scrapes every 60s; without this Grafana assumes 15s and
              # $__rate_interval (1m) is below two samples for rate()/increase().
              timeInterval: 1m
          - name: Loki
            type: loki
            url: http://loki.base.svc.cluster.local:3100
            access: proxy
            isDefault: false
    extraSecretMounts:
      # ntfy contact point (holds the write-only token).
      - name: alerting-contact
        secretName: grafana-alerting-contact
        mountPath: /etc/grafana/provisioning/alerting/contactpoints.yaml
        subPath: contactpoints.yaml
        readOnly: true
    extraConfigmapMounts:
      - name: alerting-rules
        configMap: grafana-alerting-rules
        mountPath: /etc/grafana/provisioning/alerting/rules.yaml
        subPath: rules.yaml
        readOnly: true
      - name: alerting-policies
        configMap: grafana-alerting-rules
        mountPath: /etc/grafana/provisioning/alerting/policies.yaml
        subPath: policies.yaml
        readOnly: true
      - name: alerting-templates
        configMap: grafana-alerting-rules
        mountPath: /etc/grafana/provisioning/alerting/templates.yaml
        subPath: templates.yaml
        readOnly: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: dotdc
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/dotdc
          - name: kubernetes-logs
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes-logs

    dashboards:
      dotdc:
        k8s-views-global:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-global.json
        k8s-views-namespaces:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-namespaces.json
        k8s-views-nodes:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-nodes.json
        k8s-views-pods:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-pods.json
        k8s-system-api-server:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-system-api-server.json
        k8s-system-coredns:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-system-coredns.json
    dashboardsConfigMaps:
      kubernetes-logs: k8s-monitoring-kubernetes-logs-dashboard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-monitoring-kubernetes-logs-dashboard
  namespace: base
data:
  kubernetes-logs.json: |-
{{ .Files.Get "files/dashboards/kubernetes-logs.json" | indent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-ingress
  namespace: base
spec:
  parentRefs:
    - name: srv0
      sectionName: websecure
    - name: srv0
      sectionName: websecure-proxy
  hostnames:
    - grafana.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: geoblock
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: grafana
          port: 80
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
  namespace: base
spec:
  chart: loki
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 7.3.0
  valuesContent: |-
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 1Gi
      podSecurityContext:
        # Shared with the migration/backup pods: pod-level s0 (container-level
        # is ignored) keeps the filesystem-storage files readable across pods.
        seLinuxOptions:
          level: s0
      persistence:
        # Never auto-delete the chunks PVC on scale-down/uninstall.
        whenScaled: Retain
        whenDeleted: Retain
        storageClass: nfs-apps
        accessModes:
          - ReadWriteMany
    # Chart validation: scalable targets must stay at 0 replicas while
    # singleBinary.replicas > 0 (the defaults are non-zero).
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # No canary/gateway: the k8s-monitoring log collector and Grafana talk to
    # the loki Service directly.
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    loki:
      image:
        registry: docker.io
        repository: grafana/loki
        tag: 3.6.18
      auth_enabled: false
      ingester:
        lifecycler:
          ring:
            # SingleBinary single replica: one ingester is the whole write path.
            replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem
      limits_config:
        # 90 days of logs; compactor enforces this against the object store.
        retention_period: 2160h
        # Keep reject_old_samples at its default (true): disabling it lets
        # old docker logs flood the log store and saturate node storage.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # Chart-bundled mixin dashboards/SM/PrometheusRules are disabled: the
    # minimal stack keeps no ServiceMonitor/PrometheusRule CRs anywhere, logs
    # are browsed in Grafana Explore and the kubernetes-logs dashboard.
    monitoring:
      dashboards:
        enabled: false
      serviceMonitor:
        enabled: false
      rules:
        enabled: false
---
# Prometheus is the metrics store: Alloy remote-writes the scraped samples
# (the empty scrape config is intentional). The PVC uses the same NFS storage
# class as the rest of the app data; metric history starts fresh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: base
data:
  prometheus.yml: |
{{ include "prometheus.config" . | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: nfs-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: base
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        checksum/config: {{ include "prometheus.config" . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 65534
        # NFS volumes are shared across pods; pod-level s0 keeps the files
        # readable without MCS relabeling.
        seLinuxOptions:
          level: s0
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time=180d
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: base
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app: prometheus
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 9090
  policyTypes:
    - Ingress
---
# Node Exporter runs on the pod network (not hostNetwork), so the metrics
# collector needs an explicit allowance to reach :9100 on every node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-exporter-metrics-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - port: 9100
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ksm-metrics-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 8080
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loki-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 3100
  policyTypes:
    - Ingress
---
# Alloy clustering (ckit transport on 12345): without this the collectors can
# never join the memberlist (deny-all-ingress blocks it), so every instance
# scrapes all cluster-wide targets and Prometheus rejects the duplicate samples
# as out-of-order.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-cluster
  namespace: base
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["alloy-metrics", "alloy-logs"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["alloy-metrics", "alloy-logs"]
      ports:
        - port: 12345
          protocol: TCP
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oidc-secret
  namespace: base
type: Opaque
stringData:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .Values.AUTHELIA_GRAFANA_CLIENT_SECRET_HASHABLE }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: base
type: Opaque
stringData:
  admin-user: admin
  admin-password: "{{ .Values.GRAFANA_ADMIN_PASSWORD }}"

---
# Grafana alerting provisioning: ntfy contact point (token → Secret) and the
# alert rules / notification policy tree (ConfigMap, file-backed so the YAML
# stays readable).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-alerting-contact
  namespace: base
type: Opaque
stringData:
  contactpoints.yaml: |
{{ include "grafana.alerting.contactpoints" . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules
  namespace: base
data:
  rules.yaml: |-
{{ .Files.Get "files/alerting/rules.yaml" | indent 4 }}
  policies.yaml: |-
{{ .Files.Get "files/alerting/policies.yaml" | indent 4 }}
  templates.yaml: |-
{{ .Files.Get "files/alerting/templates.yaml" | indent 4 }}
