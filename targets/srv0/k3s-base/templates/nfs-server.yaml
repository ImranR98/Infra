{{- $lanCidr := required "LAN_CIDR must be set in config/srv0/values.yaml" .Values.LAN_CIDR -}}
{{- define "nfs.etab" -}}
/exports *(rw,fsid=0,crossmnt,no_subtree_check,insecure,root_squash)
/exports/music *(ro,fsid=1,no_subtree_check,insecure,root_squash)
/exports/jellyfin-tv *(ro,fsid=2,no_subtree_check,insecure,root_squash)
/exports/jellyfin-youtube *(ro,fsid=3,no_subtree_check,insecure,root_squash)
/exports/apps *(rw,fsid=8,crossmnt,no_subtree_check,insecure,no_root_squash)
/exports/code-sandbox *(rw,fsid=7,no_subtree_check,insecure,root_squash)
{{- end -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: base
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
      annotations:
        # /var/lib/nfs/etab is mounted from a ConfigMap and read at startup.
        checksum/exports: {{ include "nfs.etab" . | sha256sum }}
    spec:
      initContainers:
        - name: nfs-modules
          image: busybox:1.38.0-uclibc@sha256:b2e35951f72501f6a99f1bf45bcfe6d4795be08c518c2f97d0ed2fe776958a3b
          command:
            - modprobe
            - nfs
            - nfsd
          securityContext:
            privileged: true
          {{- include "infra.resources" (dict "tier" "tiny") | nindent 10 }}
          volumeMounts:
            - mountPath: /lib/modules
              name: modules
              readOnly: true
      containers:
        - name: nfs-server
          image: ghcr.io/imranr98/nfs-server:latest@sha256:4b607378d410fd3b0a37676b66e428d05b473e99200c3feac9990f54801258d7
          ports:
            - name: nfsv4
              containerPort: 2049
              protocol: TCP
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    # rpc.nfsd defaults to 8 kernel threads, which is far too
                    # few for the shared app/media/PVC workload: a burst of slow
                    # ops exhausts the pool and every client (Jellyfin included)
                    # stalls for seconds. The entrypoint starts nfsd itself, so
                    # wait for its first thread, then raise the pool.
                    for i in $(seq 1 30); do
                      if grep -q '^th [1-9]' /proc/net/rpc/nfsd 2>/dev/null; then
                        echo 64 > /proc/fs/nfsd/threads && exit 0
                      fi
                      sleep 1
                    done
                    exit 0
          readinessProbe:
            tcpSocket:
              port: 2049
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 2049
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          # The 32Mi request stays tiny, but the ceiling has to clear the
          # ~125Mi startup spike that once sat at 98% of the old 128Mi cap.
          {{- include "infra.resources" (dict "tier" "small") | nindent 10 }}
          volumeMounts:
            - mountPath: /exports
              name: exports-root
            - mountPath: /exports/music
              name: music-storage
            - mountPath: /exports/jellyfin-tv
              name: tv-storage
            - mountPath: /exports/jellyfin-youtube
              name: youtube-storage
            - mountPath: /exports/apps
              name: apps-storage
            - mountPath: /exports/code-sandbox
              name: code-sandbox-storage

            - mountPath: /var/lib/nfs/etab
              name: nfs-exports
              subPath: etab
              readOnly: true
      nodeSelector:
        infra.local/hostpath-main: "true"
      volumes:
        - name: modules
          hostPath:
            path: /lib/modules
        - name: exports-root
          emptyDir: {}
        - name: nfs-exports
          configMap:
            name: nfs-etab
        - name: music-storage
          hostPath:
            path: {{ include "path.media" . }}/Music
            type: DirectoryOrCreate
        - name: tv-storage
          hostPath:
            path: {{ include "path.media" . }}/TV
            type: DirectoryOrCreate
        - name: youtube-storage
          hostPath:
            path: {{ include "path.media" . }}/YouTube
            type: DirectoryOrCreate
        - name: apps-storage
          hostPath:
            path: {{ include "path.infraState" . }}/k3s_live_state/app-data
            type: DirectoryOrCreate
        - name: code-sandbox-storage
          hostPath:
            path: {{ include "path.sandbox" . }}
            type: DirectoryOrCreate
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-etab
  namespace: base
data:
  etab: |
{{ include "nfs.etab" . | indent 4 }}
---
---
# NFS clients are exclusively the csi-nfs-node plugin (hostNetwork: true —
# mounts originate from node IPs) and its kernel mounts. All shares use
# nfsvers=4.2 (the csi-driver-nfs StorageClass and static PVs set it in
# mountOptions), so only TCP 2049
# is ever needed (no rpcbind/mountd). Pods cannot mount NFS directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nfs-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app: nfs-server
  ingress:
    - from:
        # hostNetwork CSI node plugin — traffic arrives from node IPs.
        - ipBlock:
            cidr: {{ $lanCidr }}
      ports:
        - protocol: TCP
          port: 2049
  policyTypes:
    - Ingress
---
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: base
spec:
  type: ClusterIP
  ports:
    - port: 2049
      targetPort: 2049
  selector:
    app: nfs-server
