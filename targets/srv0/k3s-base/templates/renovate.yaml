---
# Scheduled Renovate runner. One Renovate pass over the Infra and app repos;
# it does not merge or wait. Renovate auto-merges non-major app updates after
# their test check, and all Infra PRs are handled manually by the
# renovate-pr-ops skill. The runner mounts only two small chart files (a run
# wrapper and the PR notifier), not the Infra checkout; it needs the token,
# repo list, Docker Hub host rules, git author, and the ntfy write token.
apiVersion: v1
kind: Secret
metadata:
  name: renovate-secrets
  namespace: base
type: Opaque
stringData:
  token: {{ $.Values.RENOVATE_GITHUB_TOKEN | quote }}
  repositories: {{ printf "%s,%s" $.Values.INFRA_REPO $.Values.APP_REPOS | quote }}
  infraRepository: {{ $.Values.INFRA_REPO | quote }}
  gitAuthor: {{ $.Values.RENOVATE_GIT_AUTHOR | quote }}
  hostRules: {{ if and $.Values.DOCKERHUB_USER $.Values.DOCKERHUB_TOKEN }}{{ list (dict "matchHost" "docker.io" "hostType" "docker" "username" $.Values.DOCKERHUB_USER "password" $.Values.DOCKERHUB_TOKEN) | toJson | quote }}{{ else }}[]{{ end }}
---
# Run wrapper + post-run PR notifier. The wrapper runs Renovate, then posts an
# ntfy message for the open deps PRs this run created or refreshed. The
# notification is best-effort and never changes the Job's exit status; failed
# runs keep reaching the Grafana job-failed/stale alerts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-scripts
  namespace: base
data:
  run.sh: |-
{{ .Files.Get "files/renovate-run.sh" | indent 4 }}
  renovate-notify.js: |-
{{ .Files.Get "files/renovate-notify.js" | indent 4 }}
---
# Write-only ntfy token for the PR notifier (same value the Grafana contact
# point uses).
apiVersion: v1
kind: Secret
metadata:
  name: renovate-ntfy-token
  namespace: base
type: Opaque
stringData:
  token: {{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-daily
  namespace: base
spec:
  schedule: "0 */6 * * *"
  timeZone: America/Toronto
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A hung run must not block the next schedule (concurrencyPolicy: Forbid).
      activeDeadlineSeconds: 7200
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: renovate
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: renovate
              image: renovate/renovate:44.198.3@sha256:bf344aa39d5b592ec728e1db5c3e1d940a5093a89a4598073efcb18d592d121c
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: token
                - name: RENOVATE_REPOSITORIES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: repositories
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: hostRules
                - name: RENOVATE_GIT_AUTHOR
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: gitAuthor
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: required
                - name: RENOVATE_CACHE_TTL_OVERRIDE
                  value: '{"datasource-docker-hub-cache":10080}'
                - name: LOG_LEVEL
                  value: info
                - name: NTFY_URL
                  value: "http://ntfy.base.svc.cluster.local:3000"
                - name: NTFY_TOPIC
                  value: "{{ $.Values.TARGET }}_services_renovate"
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-ntfy-token
                      key: token
              command: ["bash", "/opt/renovate/run.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /opt/renovate
                  readOnly: true
              {{- include "infra.resources" (dict "tier" "2xlarge") | nindent 14 }}
          volumes:
            - name: scripts
              configMap:
                name: renovate-scripts
