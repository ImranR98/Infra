---
# Daily Renovate routine. One job owns the whole sequence:
#   1. Renovate Infra, nfs-server source only (derived image deps)
#   2. Renovate the app/ops repos
#   3. Merge the derived-image PR once its checks pass
#   4. Wait for the app/derived GitHub Actions publishes to settle
#   5. Renovate Infra (full) so the new digests are pinned the same day
#   6. Notifications (per-PR + one CI failure digest)
# The repo lists live in scripts/repos.sh; the runner script is mounted
# read-only alongside config/VARS.env and .git/config.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-daily
  namespace: base
spec:
  schedule: "0 16 * * *"
  timeZone: America/Toronto
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A hung run must not block the next day's run (concurrencyPolicy: Forbid).
      activeDeadlineSeconds: 14400
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Admitted by ntfy's allow-notification-ingress NetworkPolicy.
            app: renovate
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: {{ $.Values.MY_UID }}
            # Containerbase's /opt/containerbase tree is root:root 775, so the
            # dynamic tool installs (install-tool node/npm: lockfile updates)
            # need group 0; the uid stays unprivileged for the repo mounts.
            runAsGroup: 0
            # Pods sharing the Main tree need pod-level s0 (container-level is ignored).
            seLinuxOptions:
              level: s0
          containers:
            - name: renovate
              image: renovate/renovate:44.190.0@sha256:dd348d05edcfba67e30826fb471d5bdee4868c68798abf3719a53915629503f1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: NTFY_URL
                  value: "http://ntfy.base.svc.cluster.local:3000"
                - name: NTFY_TOPIC
                  value: "{{ $.Values.TARGET }}_services_renovate"
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-ntfy-token
                      key: token
              resources:
                limits:
                  memory: 2Gi
                requests:
                  memory: 768Mi
                  cpu: 100m
              command:
                - bash
                - /repo/scripts/renovate-daily.sh
              volumeMounts:
                # The Infra PVC is a local PV pinned by
                # infra.local/hostpath-main, so the CronJob is scheduled on the
                # node that owns the repo without a pod nodeSelector.
                - name: infra
                  mountPath: /repo/config/VARS.env
                  subPath: config/VARS.env
                  readOnly: true
                - name: infra
                  mountPath: /repo/.git/config
                  subPath: .git/config
                  readOnly: true
                - name: infra
                  mountPath: /repo/scripts
                  subPath: scripts
                  readOnly: true
          volumes:
            - name: infra
              persistentVolumeClaim:
                claimName: hostpath-main-node-infra-pvc
---
# Write-only ntfy token for the PR/CI notifier (same value the Grafana contact
# point uses).
apiVersion: v1
kind: Secret
metadata:
  name: renovate-ntfy-token
  namespace: base
type: Opaque
stringData:
  token: "{{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}"
