---
# Renovate self-hosted runners. Apps/ops run an hour before Infra so app
# publishes finish before the Infra digest refresh. The runner script lives in
# scripts/ (mounted read-only); only config/VARS.env, .git/config, and the
# scripts are mounted. Automerge policy lives in each repo's renovate.json.
{{- $appsRepos := "ImranR98/dscpln-config,ImranR98/DSCPLN,ImranR98/PixelNtfy,ImranR98/ISBN-Lookup,ImranR98/apps.obtainium.imranr.dev,ImranR98/our-times,ImranR98/order-manager,ImranR98/Logtfy" -}}
{{- $ciRepos := $appsRepos -}}
{{- $jobs := list
    (dict "name" "renovate-apps" "schedule" "0 16 * * *" "repos" $appsRepos "label" "apps" "ci" "false")
    (dict "name" "renovate-infra" "schedule" "0 17 * * *" "repos" "ImranR98/Infra" "label" "infra" "ci" "true")
    (dict "name" "renovate-pr-watch" "schedule" "0 18 * * *" "repos" $appsRepos "label" "watch" "ci" "false") -}}
{{- range $job := $jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $job.name }}
  namespace: base
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: America/Toronto
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A hung run must not block the next day's run (concurrencyPolicy: Forbid).
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Admitted by ntfy's allow-notification-ingress NetworkPolicy.
            app: renovate
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: {{ $.Values.MY_UID }}
            # Containerbase's /opt/containerbase tree is root:root 775, so the
            # dynamic tool installs (install-tool node/npm: lockfile updates)
            # need group 0; the uid stays unprivileged for the hostPath mounts.
            runAsGroup: 0
            # Pods sharing a hostPath tree need pod-level s0 (container-level is ignored).
            seLinuxOptions:
              level: s0
          containers:
            - name: renovate
              image: renovate/renovate:44.186.2@sha256:07cc53137718c142dcba8393d346d0e49dd3a2279d07c4f91bf82e51fb43e995
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: NTFY_URL
                  value: "http://ntfy.base.svc.cluster.local:3000"
                - name: NTFY_TOPIC
                  value: "{{ $.Values.TARGET }}_services_renovate"
                - name: NTFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-ntfy-token
                      key: token
                - name: RENOVATE_REPOSITORIES
                  value: {{ $job.repos | quote }}
                - name: RUN_LABEL
                  value: {{ $job.label | quote }}
                - name: RUN_CI_NOTIFY
                  value: {{ $job.ci | quote }}
                - name: CI_REPOS
                  value: {{ $ciRepos | quote }}
                - name: APP_REPOS
                  value: {{ $appsRepos | quote }}
              resources:
                limits:
                  memory: 2Gi
                requests:
                  memory: 768Mi
                  cpu: 100m
              command:
                - bash
                - {{ if eq $job.label "watch" }}/repo/scripts/app-renovate-watch.sh{{ else }}/repo/scripts/renovate-in-cluster.sh{{ end }}
              volumeMounts:
                - name: vars-file
                  mountPath: /repo/config/VARS.env
                  readOnly: true
                - name: git-config
                  mountPath: /repo/.git/config
                  readOnly: true
                - name: scripts-dir
                  mountPath: /repo/scripts
                  readOnly: true
          volumes:
            - name: vars-file
              hostPath:
                path: "{{ $.Values.INFRA_ROOT }}/config/VARS.env"
                type: File
            - name: git-config
              hostPath:
                path: "{{ $.Values.INFRA_ROOT }}/.git/config"
                type: File
            - name: scripts-dir
              hostPath:
                path: "{{ $.Values.INFRA_ROOT }}/scripts"
                type: Directory
{{- end }}
---
# Write-only ntfy token for the PR/CI notifier (same value the Grafana contact
# point uses).
apiVersion: v1
kind: Secret
metadata:
  name: renovate-ntfy-token
  namespace: base
type: Opaque
stringData:
  token: "{{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}"
