---
# Scheduled Renovate runner. One pure Renovate pass over the Infra and app
# repos; no custom merge/wait/notification wrapper. Renovate auto-merges
# non-major app updates after their test check, and all Infra PRs are handled
# manually by the renovate-pr-ops skill. The runner needs only the token, repo
# list, Docker Hub host rules, and git author; it does not mount the Infra
# checkout or any scripts.
apiVersion: v1
kind: Secret
metadata:
  name: renovate-secrets
  namespace: base
type: Opaque
stringData:
  token: {{ $.Values.RENOVATE_GITHUB_TOKEN | quote }}
  repositories: {{ printf "%s,%s" $.Values.INFRA_REPO $.Values.APP_REPOS | quote }}
  infraRepository: {{ $.Values.INFRA_REPO | quote }}
  gitAuthor: {{ $.Values.RENOVATE_GIT_AUTHOR | quote }}
  hostRules: {{ if and $.Values.DOCKERHUB_USER $.Values.DOCKERHUB_TOKEN }}{{ list (dict "matchHost" "docker.io" "hostType" "docker" "username" $.Values.DOCKERHUB_USER "password" $.Values.DOCKERHUB_TOKEN) | toJson | quote }}{{ else }}[]{{ end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-daily
  namespace: base
spec:
  schedule: "0 */6 * * *"
  timeZone: America/Toronto
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A hung run must not block the next schedule (concurrencyPolicy: Forbid).
      activeDeadlineSeconds: 7200
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: renovate
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: renovate
              image: renovate/renovate:44.198.3@sha256:bf344aa39d5b592ec728e1db5c3e1d940a5093a89a4598073efcb18d592d121c
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: token
                - name: RENOVATE_REPOSITORIES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: repositories
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: hostRules
                - name: RENOVATE_GIT_AUTHOR
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: gitAuthor
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: required
                - name: RENOVATE_CACHE_TTL_OVERRIDE
                  value: '{"datasource-docker-hub-cache":10080}'
                - name: LOG_LEVEL
                  value: info
              resources:
                limits:
                  memory: 2Gi
                requests:
                  memory: 768Mi
                  cpu: 100m
---
# Suspended template for on-demand Infra-only runs. The renovate-pr-ops skill
# creates a Job from this CronJob after app images publish so the new digest PR
# appears immediately instead of waiting for the next six-hourly run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-infra
  namespace: base
spec:
  schedule: "0 0 1 1 *"
  timeZone: America/Toronto
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: renovate
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: renovate
              image: renovate/renovate:44.198.3@sha256:bf344aa39d5b592ec728e1db5c3e1d940a5093a89a4598073efcb18d592d121c
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: token
                - name: RENOVATE_REPOSITORIES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: infraRepository
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: hostRules
                - name: RENOVATE_GIT_AUTHOR
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: gitAuthor
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: required
                - name: RENOVATE_CACHE_TTL_OVERRIDE
                  value: '{"datasource-docker-hub-cache":10080}'
                - name: LOG_LEVEL
                  value: info
              resources:
                limits:
                  memory: 2Gi
                requests:
                  memory: 768Mi
                  cpu: 100m
