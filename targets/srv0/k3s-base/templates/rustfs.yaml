---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: rustfs
  namespace: base
spec:
  chart: rustfs
  repo: https://charts.rustfs.com
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 1.0.0-rc.5
  valuesContent: |-
    fullnameOverride: rustfs
    replicaCount: 1
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs-secrets
    config:
      rustfs:
        console_enable: "true"
        # INFO is per-operation span tracing (~350k lines/hr of noise);
        # warn keeps real signal: errors, disk failures, healing events.
        log_level: "warn"
    # No web exposure: console (9001) and S3 API (9000) stay cluster-internal.
    ingress:
      enabled: false
    storageclass:
      name: longhorn
      dataStorageSize: 200Gi
      logStorageSize: 1Gi
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-s3-ingress
  namespace: base
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - port: 9000
  policyTypes:
    - Ingress
---
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-secrets
  namespace: base
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: "{{ .Values.RUSTFS_ACCESS_KEY }}"
  RUSTFS_SECRET_KEY: "{{ .Values.RUSTFS_SECRET_KEY }}"
