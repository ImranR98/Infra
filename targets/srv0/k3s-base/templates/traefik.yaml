# Geoblock — allowlist-mode plugin that restricts access by country of origin.
# Uses a self-hosted MaxMind GeoLite2 service instead of a third-party API.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: geoblock
  namespace: base
spec:
  plugin:
    geoblock:
      silentStartUp: false
      allowLocalRequests: true
      logLocalRequests: false
      logAllowedRequests: true
      logApiRequests: true
      api: "https://get.geojs.io/v1/ip/country/{ip}"
      apiTimeoutMs: 2000
      cacheSize: 1000
      forceMonthlyUpdate: true
      allowUnknownCountries: false
      unknownCountryApiResponse: "nil"
{{ .Values.GEOBLOCK_CONFIG_SUBSET | indent 6 }}
---
# CrowdSec bouncer — checks IPs against CrowdSec's ban list in streaming mode.
# Requires CrowdSec LAPI to be running (crowdsec.yaml).
# Bouncer key inline — Traefik Middleware CRDs don't support secretKeyRef.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: base
spec:
  plugin:
    crowdsec-bouncer-traefik-plugin:
      enabled: true
      logLevel: INFO
      crowdsecMode: stream
      crowdsecLapiScheme: https
      crowdsecLapiHost: crowdsec-service.base.svc.cluster.local:8080
      # Deliberate: the LAPI serves a chart-generated self-signed cert and the
      # connection is in-cluster. Do not "fix" without a CA rollout plan.
      crowdsecLapiTLSInsecureVerify: "true"
      crowdsecLapiKey: {{ .Values.CROWDSEC_BOUNCER_KEY }}
      crowdsecappsecenabled: true
      crowdsecAppsecScheme: http
      crowdsecAppsecHost: crowdsec-appsec-service.base.svc.cluster.local:7422
      crowdsecAppsecPath: "/"
      forwardedheaderstrustedips: "127.0.0.1/32"
---
# Forward auth middleware for Authelia — used by all public HTTPRoutes.
# Sends unauthenticated requests to Authelia's /api/authz/forward-auth endpoint.
# The response headers (Remote-User, Remote-Groups, etc.) are forwarded to backend services.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-authelia
  namespace: base
spec:
  forwardAuth:
    trustForwardHeader: true
    address: 'http://authelia.base.svc.cluster.local/api/authz/forward-auth'
    authResponseHeaders:
      - 'Remote-User'
      - 'Remote-Groups'
      - 'Remote-Email'
      - 'Remote-Name'
---
# Static custom-card assets under /local/community: mark responses
# uncacheable. HA's service worker caches /local files via its catch-all
# StaleWhileRevalidate route (any 200 response, e.g. login-page HTML from
# the pre-exemption era), which can poison card loading on some clients.
# no-store keeps browser/WebView caches from re-caching bad responses.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-no-store
  namespace: base
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "no-store"
---
# The opencode v2 server requires Basic auth on its API. Browsers can't attach
# it to every request type (the UI's fetches do, but streams/subresources fall
# back to the native browser prompt), so inject the pinned credentials at the
# proxy. Authelia stays the human gate — this filter runs last on the route.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opencode-basic-auth
  namespace: base
spec:
  headers:
    customRequestHeaders:
      Authorization: "Basic {{ printf "opencode:%s" .Values.OPENCODE_SERVER_PASSWORD | b64enc }}"
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
        # No Service follows (see service.enabled below).
        statusAddress:
          service:
            enabled: false
      kubernetesIngress:
        publishedService:
          enabled: false
    # The chart's default Gateway is a placeholder listener on :8000; the real
    # edge is the srv0 Gateway in templates/gateway.yaml.
    gateway:
      enabled: false
    # Pod-network DaemonSet with hostPorts and NO Service: no ServiceLB, no
    # NodePorts, no kube-proxy LB VIPs. The CNI hostPort DNAT is the only way
    # in, and it preserves real client sources (only pod/loopback hairpin
    # traffic is masqueraded), so ipAllowList middlewares are meaningful.
    # DaemonSet covers new nodes automatically; maxSurge 0 makes each pod
    # release its hostPorts before its replacement schedules.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    service:
      enabled: false
    additionalArguments:
      - "--api.dashboard=true"
      - "--global.sendAnonymousUsage=false"
      - "--global.checkNewVersion=true"
      - "--log.level=INFO"
      - "--accesslog.format=json"
      - "--entryPoints.websecure-proxy.proxyProtocol.trustedIPs=10.99.0.1/32"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
      - "--entryPoints.web.http.redirections.entryPoint.priority=10"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entryPoints.websecure-proxy.transport.respondingTimeouts.readTimeout=0"

      - "--experimental.abortonpluginfailure=true"
      - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
      - "--experimental.plugins.geoblock.version=v0.3.8"
      - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.version=v1.8.1"
    additionalVolumeMounts:
      - name: plugins
        mountPath: /plugins-storage
    deployment:
      kind: DaemonSet
      additionalVolumes:
        - name: plugins
          emptyDir: {}
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 192Mi
        cpu: 20m
    ports:
      web:
        port: 80
        hostPort: 80
        expose:
          default: true
        exposedPort: 80
      websecure:
        port: 443
        hostPort: 443
        expose:
          default: true
        exposedPort: 443
      websecure-proxy:
        port: 8443
        hostPort: 8443
        expose:
          default: true
        exposedPort: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-ingress
  namespace: base
spec:
  parentRefs:
    # LAN/VPN-only: not attached to websecure-proxy (the public-exposure listener).
    - name: srv0
      sectionName: websecure
  hostnames:
    - traefik.{{ .Values.SERVICES_DOMAIN }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: crowdsec-bouncer
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
