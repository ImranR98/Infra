---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: authelia
  namespace: base
spec:
  chart: authelia
  repo: https://charts.authelia.com
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 0.11.6
  valuesContent: |-
    pod:
      kind: Deployment
      securityContext:
        container:
          runAsUser: $MY_UID
          runAsGroup: $MY_UID
      resources:
        limits:
          memory: 2Gi
        requests:
          memory: 128Mi
      probes:
        startup:
          failureThreshold: 30
      extraVolumeMounts:
        - name: notifier-data
          mountPath: "/notifications"
        - name: users-database
          mountPath: "/config/users"
          readOnly: true
        - name: oidc-secrets
          mountPath: "/secrets/oidc"
          readOnly: true
      extraVolumes:
        - name: notifier-data
          emptyDir: {}
        - name: users-database
          secret:
            secretName: authelia-users
            items:
              - key: users-database.yaml
                path: users-database.yaml
        - name: oidc-secrets
          secret:
            secretName: authelia-oidc-secrets
    configMap:
      authentication_backend:
        ldap:
          enabled: false
        file:
          enabled: true
          password:
            algorithm: sha512
          path: /config/users/users-database.yaml
        password_reset:
          disable: true
      session:
        redis:
          enabled: true
          deploy: false
          host: "authelia-redis-master.base.svc.cluster.local"
          port: 6379
          username: ""
          password:
            value: "$AUTHELIA_REDIS_PASSWORD"
          database_index: 0
          maximum_active_connections: 8
          minimum_idle_connections: 0
          tls:
            enabled: false
          high_availability:
            enabled: false
            sentinel_name: "mysentinel"
            username: ""
            password:
              value: ""
            nodes: []
        cookies:
          - subdomain: "auth"
            domain: "$SERVICES_DOMAIN"

      storage:
        encryption_key:
          value: "$AUTHELIA_DB_ENCRYPTION_KEY"
        local:
          enabled: false
        postgres:
          enabled: true
          deploy: false
          address: "tcp://authelia-postgresql.base.svc.cluster.local:5432"
          timeout: "5 seconds"
          password:
            value: "$AUTHELIA_DB_PASSWORD"
          tls:
            enabled: false
      notifier:
        filesystem:
          enabled: true
          filename: /notifications/notification.txt
        smtp:
          enabled: false
      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            value: '$AUTHELIA_OIDC_HMAC_SECRET'
          jwks:
            - key:
                # NOTE: Authelia chart v0.11.6 does not support path: for
                # CryptographicKey objects — the PEM must be embedded as value:.
                # OIDC client secrets below use path: (simple strings are supported).
                value: |
                  $AUTHELIA_JWKS_KEY
          clients:
          - client_id: 'immich'
            client_name: 'immich'
            client_secret:
               path: '/secrets/oidc/oidc.immich.client-secret'
            public: false
            authorization_policy: 'two_factor'
            redirect_uris:
              - 'https://immich.$SERVICES_DOMAIN/auth/login'
              - 'https://immich.$SERVICES_DOMAIN/user-settings'
              - 'app.immich:/'
              - 'app.immich:///oauth-callback'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_post'
          - client_id: 'open-webui'
            client_name: 'Open WebUI'
            client_secret:
               path: '/secrets/oidc/oidc.openwebui.client-secret'
            public: false
            authorization_policy: 'two_factor'
            require_pkce: true
            redirect_uris:
              - 'https://gpt.$SERVICES_DOMAIN/oauth/oidc/callback'
            scopes:
              - 'openid'
              - 'profile'
              - 'groups'
              - 'email'
            response_types:
              - 'code'
            grant_types:
              - 'authorization_code'
            access_token_signed_response_alg: 'none'
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
      log:
        level: info
      totp:
        issuer: $SERVICES_DOMAIN
      access_control:
        default_policy: 'deny'
        rules:
          - domain: '*.$SERVICES_DOMAIN'
            resources:
            - '^/\.well-known/acme-challenge/.*$'
            policy: bypass
          - domain: tv.$SERVICES_DOMAIN # IGNORE INITIALLY
            policy: bypass # IGNORE INITIALLY
          - domain: ha.$SERVICES_DOMAIN # IGNORE INITIALLY
            policy: bypass # IGNORE INITIALLY
          - domain: send.$SERVICES_DOMAIN # IGNORE INITIALLY
            policy: bypass # IGNORE INITIALLY
          - domain: ntfy.$SERVICES_DOMAIN
            policy: bypass
          - domain: files.$SERVICES_DOMAIN # IGNORE INITIALLY
            resources: # IGNORE INITIALLY
            - '^/share([/?].*)?$' # IGNORE INITIALLY
            - '^/static([/?].*)?$' # IGNORE INITIALLY
            - '^/api/public([/?].*)?$' # IGNORE INITIALLY
            policy: bypass # IGNORE INITIALLY
          - domain: music.$SERVICES_DOMAIN # IGNORE INITIALLY
            policy: bypass # IGNORE INITIALLY
          - domain: immich.$SERVICES_DOMAIN # IGNORE INITIALLY
            policy: bypass # IGNORE INITIALLY
          - domain: auth.$SERVICES_DOMAIN
            policy: bypass
          - domain: opodsync.$SERVICES_DOMAIN # IGNORE INITIALLY
            policy: bypass # IGNORE INITIALLY
          - domain: gpt.$SERVICES_DOMAIN
            policy: bypass
          - domain: fmd.$SERVICES_DOMAIN
            policy: bypass
          - domain: nextcloud.$SERVICES_DOMAIN
            policy: bypass
          - domain: rss.$SERVICES_DOMAIN
            resources:
            - '^/api([/?].*)?$'
            - '^/p/i/?$'
            policy: bypass
          - domain: seerr.$SERVICES_DOMAIN
            policy: bypass
          - domain: '*.$SERVICES_DOMAIN'
            policy: two_factor
            subject:
            - 'group:admins'
      regulation:
        max_retries: 3
        find_time: 120
        ban_time: 300
