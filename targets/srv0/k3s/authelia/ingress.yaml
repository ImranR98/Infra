---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authelia-prod-tls
  namespace: base
spec:
  secretName: authelia-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - auth.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia-ingress
  namespace: base
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.$SERVICES_DOMAIN`)
      kind: Rule
      services:
        - name: authelia
          port: 80
  tls:
    secretName: authelia-prod-tls

