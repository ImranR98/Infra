apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-db-pvc
  namespace: base
spec:
  storageClassName: mayastor-install-single-replica
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-session-pvc
  namespace: base
spec:
  storageClassName: mayastor-install-single-replica
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-users
  namespace: base
type: Opaque
stringData:
  users-database.yaml: |
    $AUTHELIA_USERS_DATABASE
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-postgresql
  namespace: base
  labels:
    app.kubernetes.io/instance: authelia
type: Opaque
stringData:
  password: "$AUTHELIA_DB_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-redis
  namespace: base
  labels:
    app.kubernetes.io/instance: authelia
type: Opaque
stringData:
  redis-password: "$AUTHELIA_REDIS_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-postgresql
  namespace: base
  labels:
    app.kubernetes.io/instance: authelia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: authelia
      app.kubernetes.io/name: authelia-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: authelia
        app.kubernetes.io/name: authelia-postgresql
    spec:
      initContainers:
        - name: volume-permissions
          image: docker.io/bitnami/postgresql:latest@sha256:ac855a024049fc14d6b73e38ae3b53cf2d93ae69bf7c6174eda550a5de6f5227
          command:
            - chown
            - -R
            - "1001:1001"
            - /bitnami/postgresql
          securityContext:
            runAsUser: 0
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
      containers:
        - name: postgresql
          image: docker.io/bitnami/postgresql:latest@sha256:ac855a024049fc14d6b73e38ae3b53cf2d93ae69bf7c6174eda550a5de6f5227
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - authelia
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 15
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-postgresql
                  key: password
            - name: POSTGRES_USER
              value: authelia
            - name: POSTGRES_DATABASE
              value: authelia
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authelia-db-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-redis-master
  namespace: base
  labels:
    app.kubernetes.io/instance: authelia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: authelia
      app.kubernetes.io/name: authelia-redis-master
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: authelia
     app.kubernetes.io/name: authelia-redis-master
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-oidc-secrets
  namespace: base
type: Opaque
stringData:
  jwks.private-key.pem: |
    $AUTHELIA_JWKS_KEY
  oidc.immich.client-secret: "$plaintext$$AUTHELIA_IMMICH_CLIENT_SECRET"
  oidc.openwebui.client-secret: "$plaintext$$AUTHELIA_OPENWEBUI_CLIENT_SECRET"
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: redis
          image: docker.io/bitnami/redis:latest@sha256:1347d526ecec0c6537e99eac09e7c3405c21664f6044ff60e78b0898da37abd2
          ports:
            - name: tcp-redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 5
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-redis
                  key: redis-password
            - name: REDIS_REPLICATION_MODE
              value: master
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authelia-session-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: authelia-postgresql
  namespace: base
  labels:
    app.kubernetes.io/instance: authelia
spec:
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/instance: authelia
    app.kubernetes.io/name: authelia-postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: authelia-redis-master
  namespace: base
  labels:
    app.kubernetes.io/instance: authelia
spec:
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: tcp-redis
  selector:
    app.kubernetes.io/instance: authelia
    app.kubernetes.io/name: authelia-redis-master
