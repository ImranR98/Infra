---
# Per-node CDI spec generator. Each node scans its own /dev and writes
# /etc/cdi/infra.devices.json, so the grants follow the hardware, not a node
# label: whatever node the ConBee II (/dev/ttyACM*) or an Intel VAAPI render
# node (/dev/dri/renderD128) appears on gets the corresponding grant. Nodes
# with neither get an empty devices list and the plugin registers nothing.
#
# Resource names (per node, same everywhere):
#   infra.local/devices-conbee  -> first /dev/ttyACM*  (c 166:x)
#   infra.local/devices-dri     -> /dev/dri/renderD128 (c 226:128)
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdi-specs
  namespace: base
data:
  generate-spec.sh: |
    #!/bin/sh
    # Generates /etc/cdi/infra.devices.json from this node's actual devices.
    # Invoked: `--once` (init) or no args (hold container, regenerates every 5m
    # so a replug that changes device numbering heals itself).
    set -e

    OUT=/etc/cdi/infra.devices.json
    first=1

    emit_device() {
      n="$1" p="$2"
      [ -e "$p" ] || return 1
      t=$(stat -c %t "$p")
      t2=$(stat -c %T "$p")
      a=$(stat -c %a "$p")
      mjr=$((16#$t))
      mnr=$((16#$t2))
      fm=$((8#$a))
      [ "$first" -eq 0 ] && printf ',\n'
      printf '    {"name":"%s","containerEdits":{"deviceNodes":[{"path":"%s","hostPath":"%s","type":"c","major":%s,"minor":%s,"fileMode":%s}]}}' "$n" "$p" "$p" "$mjr" "$mnr" "$fm"
      first=0
    }

    generate() {
      first=1
      {
        printf '{\n'
        printf '  "cdiVersion": "0.7.0",\n'
        printf '  "kind": "infra.local/devices",\n'
        printf '  "devices": [\n'
        for d in /dev/ttyACM0 /dev/ttyACM1 /dev/ttyACM2 /dev/ttyACM3; do
          if [ -e "$d" ]; then emit_device conbee "$d"; break; fi
        done
        if [ -e /dev/dri/renderD128 ]; then emit_device dri /dev/dri/renderD128; fi
        printf '\n  ]\n'
        printf '}\n'
      } > "$OUT.tmp"
      mv "$OUT.tmp" "$OUT"
      chmod 644 "$OUT"
      echo "$(date +%T) wrote $OUT"
    }

    if [ "${1:-}" = "--once" ]; then
      generate
      exit 0
    fi

    while true; do
      generate || true
      sleep 300
    done
