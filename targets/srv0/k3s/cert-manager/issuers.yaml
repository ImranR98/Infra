# POST_APPLY: applied by cert-manager/post.sh
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: $DOMAIN_OWNER_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.tls: "false"
                  traefik.ingress.kubernetes.io/router.priority: "42" # Must be >0 to avoid conflict with default HTTP>HTTPS redirect. See https://www.reddit.com/r/Traefik/comments/giqiih/cant_figure_out_http_https_redirection_for/
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: $DOMAIN_OWNER_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.tls: "false"
                  traefik.ingress.kubernetes.io/router.priority: "42"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: self-signed-issuer
spec:
  selfSigned: {}
---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-local-ca
  namespace: base
spec:
  isCA: true
  commonName: k3s-local-ca
  secretName: k3s-local-ca-secret
  issuerRef:
    name: self-signed-issuer
    kind: ClusterIssuer
  duration: 175200h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: k3s-local-ca-secret
