---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: crowdsec
  namespace: base
spec:
  chart: crowdsec
  repo: https://crowdsecurity.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  version: 0.24.0
  valuesContent: |-
    container_runtime: containerd

    tls:
      enabled: true
      # Annotations prevent null secretTemplate rendering (CrowdSec chart v0.24.0 bug).
      certManager:
        secretTemplate:
          annotations:
            crowdsec.io/component: "true"

    appsec:
      enabled: true
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          appsec_config: crowdsecurity/virtual-patching
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
      service:
        type: ClusterIP
    config:
      profiles.yaml: |
        name: default_ip_remediation
        debug: false
        filters:
            - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
            - type: ban
              duration: 672h
        notifications:
            - http_default
        on_success: break

    agent:
      resources:
        limits:
          memory: 2Gi
        requests:
          memory: 128Mi
      podSecurityContext:
        fsGroup: $MY_UID
        seLinuxOptions:
          type: spc_t        # NOTE: crowdsec must run as root — /staging/ tini-init and SELinux
      containerSecurityContext:
        allowPrivilegeEscalation: false
      acquisition:
        - namespace: kube-system
          podName: traefik-*
          program: traefik
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/linux crowdsecurity/traefik"

    lapi:
      replicas: 1
      resources:
        limits:
          memory: 2Gi
        requests:
          memory: 128Mi
      podSecurityContext:
        fsGroup: $MY_UID
      containerSecurityContext:
        allowPrivilegeEscalation: false
      dashboard:
        enabled: false
      env:
        # TLS + AGENTS_ALLOWED_OU prevents appsec entering "unknown" after reboot.
        - name: AGENTS_ALLOWED_OU
          value: agent-ou,appsec-ou
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: bouncer-key
      extraVolumes:
        - name: crowdsec-lapi-configs
          secret:
            secretName: crowdsec-lapi-configs
            defaultMode: 0600
      extraVolumeMounts:
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/notifications/http.yaml
          subPath: http.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/navidrome.yaml
          subPath: navidrome.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/immich.yaml
          subPath: immich.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/homeassistant.yaml
          subPath: homeassistant.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/seerr.yaml
          subPath: seerr.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/plik.yaml
          subPath: plik.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/chibisafe.yaml
          subPath: chibisafe.whitelist.yaml
        - name: crowdsec-lapi-configs
          mountPath: /etc/crowdsec/postoverflows/s01-whitelist/linkwarden.yaml
          subPath: linkwarden.whitelist.yaml
      persistentVolume:
        config:
          enabled: false
        data:
          enabled: true
          existingClaim: crowdsec-pvc
      secrets:
        csLapiSecret: "$CROWDSEC_LAPI_SECRET"
