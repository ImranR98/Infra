apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-lapi-configs
  namespace: base
type: Opaque
stringData:
  http.yaml: |
    type: http
    name: http_default
    log_level: debug
    format: |
      {{.|toJson}}
    url: http://ntfy.base.svc.cluster.local:3000/${TARGET}_services_crowdsec
    method: POST
    headers:
      Authorization: Bearer $NTFY_WRITE_ONLY_ACCOUNT_TOKEN
      Title: CrowdSec on ${TARGET}
      Priority: min
  navidrome.whitelist.yaml: |
    name: imranr/navidrome
    description: "Whitelist for Navidrome"
    whitelist:
      reason: "Downloading from Navidrome using client apps can cause false positives"
      expression:
        - evt.Overflow.Alert.Events[0].GetMeta('target_fqdn') == 'music.$SERVICES_DOMAIN'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
  immich.whitelist.yaml: |
    name: imranr/immich
    description: "Whitelist for Immich"
    whitelist:
      reason: "Browsing Immich can cause false positives"
      expression:
        - evt.Overflow.Alert.Events[0].GetMeta('target_fqdn') == 'immich.$SERVICES_DOMAIN'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing']
        - evt.Overflow.Alert.Events[0].GetMeta('http_verb') == 'GET'
        - evt.Overflow.Alert.Events[0].GetMeta('http_status') == '404'
        - evt.Overflow.Alert.Events[0].GetMeta('http_path') matches '/api/assets/.+'
  homeassistant.whitelist.yaml: |
    name: imranr/homeassistant
    description: "Whitelist for HomeAssistant"
    whitelist:
      reason: "HomeAssistant webhooks can cause false positives"
      expression:
        - evt.Overflow.Alert.Events[0].GetMeta('target_fqdn') == 'ha.$SERVICES_DOMAIN'
        - evt.Overflow.Alert.GetScenario() in ['LePresidente/http-generic-403-bf']
        - evt.Overflow.Alert.Events[0].GetMeta('http_verb') == 'POST'
        - evt.Overflow.Alert.Events[0].GetMeta('http_path') matches '^/api/webhook/.+'
  seerr.whitelist.yaml: |
    name: imranr/seerr
    description: "Whitelist for Seerr"
    whitelist:
      reason: "Browsing Seerr without login causes 403 on API endpoints"
      expression:
        - evt.Overflow.Alert.Events[0].GetMeta('target_fqdn') == 'seerr.$SERVICES_DOMAIN'
        - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'LePresidente/http-generic-403-bf']
        - evt.Overflow.Alert.Events[0].GetMeta('http_status') == '403'
        - evt.Overflow.Alert.Events[0].GetMeta('http_path') matches '^/api/.*'
  chibisafe.whitelist.yaml: |
    name: imranr/chibisafe
    description: "Whitelist for Chibisafe"
    whitelist:
      reason: "Uploading files to Chibisafe can cause false positives"
      expression:
        - evt.Overflow.Alert.Events[0].GetMeta('target_fqdn') == 'send.$SERVICES_DOMAIN'
        - evt.Overflow.Alert.GetScenario() in ['LePresidente/http-generic-403-bf', 'crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
---
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-secrets
  namespace: base
type: Opaque
stringData:
  bouncer-key: "$CROWDSEC_BOUNCER_KEY"

