---
# RWX NFS-backed storage class for the shared PVC backup destination.
# Backend: nfs-server pod (pinned to srv0) exporting /exports/backups,
# which is the hostPath $PVC_BACKUP_DIR on srv0.
# NOTE: the fsid=0 export is /exports, so the pseudofs root IS /exports and
# sub-exports are addressed by their relative name (/backups, not /exports/backups).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-backup
provisioner: nfs.csi.k8s.io
parameters:
  server: nfs-server.base.svc.cluster.local
  share: /backups
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.2
