---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart: descheduler
  repo: https://kubernetes-sigs.github.io/descheduler
  failurePolicy: abort
  targetNamespace: kube-system
  createNamespace: false
  version: 0.36.0
  valuesContent: |-
    kind: CronJob
    schedule: "*/2 * * * *"
    # Rebalances pods that drifted due to soft constraints being evaluated
    # only at scheduling time. bigpc left the cluster; both plugins are now
    # inert backstops: RemovePodsViolatingNodeTaints guards any node that
    # rejoins with a taint, RemovePodsViolatingNodeAffinity guards any future
    # preferred-affinity workload. No pods currently match either rule.
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 2
      maxNoOfPodsToEvictPerNamespace: 3
      maxNoOfPodsToEvictTotal: 5
      profiles:
        - name: "k3s-rebalance"
          pluginConfig:
            - name: "DefaultEvictor"
              args:
                nodeFit: true
                minPodAge: 15m
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
            - name: "RemovePodsViolatingNodeTaints"
              args:
                includePreferNoSchedule: true
                includedTaints:
                  - scheduling-discouraged
                # Longhorn instance-managers are node-local volume pods that
                # legitimately run on tainted nodes; excluding them prevents
                # futile eviction attempts every cycle.
                namespaces:
                  exclude:
                    - longhorn-system
            - name: "RemovePodsViolatingNodeAffinity"
              args:
                nodeAffinityType:
                  - preferredDuringSchedulingIgnoredDuringExecution
          plugins:
            deschedule:
              enabled:
                - "RemovePodsViolatingNodeTaints"
                - "RemovePodsViolatingNodeAffinity"
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 128Mi
