---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dscpln
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dscpln
  template:
    metadata:
      labels:
        app: dscpln
    spec:
      securityContext:
        fsGroup: $MY_UID
      containers:
        - name: dscpln
          image: imranrdev/dscpln:latest@sha256:89ad11f983d92606caf4b1f742857793f1f9b4718934cbc9511e4ae3ad424e80
          securityContext:
            # runs as root: imranrdev image breaks with non-root uid
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3300
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 3300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: UV_USE_IO_URING
              value: "0"
            - name: TEXTFILE_DATA_PROVIDER_DATA_PATH
              value: "/data/$DSCPLN_DATA_FILE"
            - name: MONTHLY_LIMIT_NTFY_URL
              value: "http://ntfy.base.svc.cluster.local:3000/${TARGET}_services_dscpln"
            - name: WEEKLY_LIMIT_NTFY_URL
              value: "http://ntfy.base.svc.cluster.local:3000/${TARGET}_services_dscpln"
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dscpln-ntfy-token
                  key: token
            - name: TEXTFILE_BUDGET_INIT_AMT
              value: "$DSCPLN_BUDGET_INIT_AMT"
            - name: TEXTFILE_FIRST_WEEK_BIAS_INIT_AMT
              value: "$DSCPLN_FIRST_WEEK_BIAS_INIT_AMT"
          volumeMounts:
            - name: dscpln-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: dscpln-data
          persistentVolumeClaim:
            claimName: dscpln-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dscpln
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: dscpln
  ports:
    - port: 3300
      targetPort: 3300
