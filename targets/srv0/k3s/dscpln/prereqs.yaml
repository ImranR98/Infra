apiVersion: v1
kind: PersistentVolume
metadata:
  name: dscpln-data-pv
spec:
  capacity:
    storage: 4096Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: dscpln-data
    volumeAttributes:
      server: nfs-server.base-privileged.svc.cluster.local
      share: /dscpln
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dscpln-data-pvc
  namespace: apps
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  volumeName: dscpln-data-pv
   resources:
     requests:
       storage: 4096Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: dscpln-ntfy-token
  namespace: apps
type: Opaque
stringData:
  token: "$NTFY_WRITE_ONLY_ACCOUNT_TOKEN"

