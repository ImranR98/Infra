apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fmd-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Secret
metadata:
  name: fmd-secret
  namespace: apps
type: Opaque
stringData:
  FMD_REGISTRATIONTOKEN: "$FMD_REGISTRATIONTOKEN"
