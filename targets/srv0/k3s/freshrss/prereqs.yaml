apiVersion: v1
kind: PersistentVolume
metadata:
  name: freshrss-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: nfs-server.base.svc.cluster.local
    path: /k3s-state/freshrss-data
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-data-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
  volumeName: freshrss-data-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: freshrss-extensions-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: nfs-server.base.svc.cluster.local
    path: /k3s-state/freshrss-extensions
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-extensions-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
  volumeName: freshrss-extensions-pv
---
apiVersion: v1
kind: Secret
metadata:
  name: freshrss-user-credentials
  namespace: apps
type: Opaque
stringData:
  password: "$FRESHRSS_PASSWORD"

