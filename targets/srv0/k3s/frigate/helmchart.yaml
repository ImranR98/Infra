---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: frigate
  namespace: apps
spec:
  chart: frigate
  repo: https://blakeblackshear.github.io/blakeshome-charts/
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 7.8.0
  valuesContent: |-
    strategyType: Recreate
    # SELinux-enforcing host: privileged needed for hostPath media volume + /dev/dri
    # (same precedent as jellyfin; also recommended by Frigate docs)
    securityContext:
      privileged: true
    image:
      repository: ghcr.io/blakeblackshear/frigate
      tag: 0.14.1
    env:
      # {FRIGATE_*_PASSWORD} tokens in `config` are substituted by Frigate from these env vars
      FRIGATE_RTSP_PASSWORD: "$FRIGATE_RTSP_PASSWORD"
      FRIGATE_MQTT_PASSWORD: "$FRIGATE_MQTT_PASSWORD"
    config: |-
      mqtt:
        host: mosquitto
        port: 1883
        user: frigate
        password: '{FRIGATE_MQTT_PASSWORD}'
      ffmpeg:
        hwaccel_args: preset-vaapi
        retry_interval: 5
      go2rtc:
        streams:
          # Frigate owns the single persistent connection to the Pi; HA live view,
          # detect and record all consume the local restream, so feed open/close
          # churn never touches the Pi. #timeout=5 tears down a stale connection
          # (the Pi's USB webcam occasionally hiccups) and retries in seconds.
          cam: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@$RPI_CAMERA_IP:8554/cam#timeout=5
      detectors:
        cpu:
          type: cpu
      cameras:
        # Default camera: rpi go2rtc webcam stream (targets/rpi)
        cam:
          ffmpeg:
            inputs:
              - path: rtsp://127.0.0.1:8554/cam
                roles:
                  - detect
              - path: rtsp://127.0.0.1:8554/cam
                roles:
                  - record
          detect:
            width: 640
            height: 480
            fps: 15
          record:
            enabled: true
            events:
              retain:
                default: 7
          snapshots:
            enabled: true
    persistence:
      config:
        enabled: true
        existingClaim: frigate-config-pvc
      media:
        enabled: false
    # NFS-backed media (recordings stay on srv0's $SECONDARY_STORAGE_PATH/frigate,
    # exported by the nfs-server component) while Frigate runs on the GPU node
    extraVolumes:
      - name: frigate-media
        persistentVolumeClaim:
          claimName: frigate-media-pvc
      - name: dri
        hostPath:
          path: /dev/dri
    extraVolumeMounts:
      - name: frigate-media
        mountPath: /media/frigate
      - name: dri
        mountPath: /dev/dri
    # Prefer the AMD GPU node (bigpc, has-amdgpu=true) - same convention as jellyfin.
    # Falls back to srv0 (which also has /dev/dri) if bigpc is unavailable.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: has-amdgpu
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: scheduling-discouraged
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 128Mi
