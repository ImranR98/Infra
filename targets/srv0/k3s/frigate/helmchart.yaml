---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: frigate
  namespace: apps
spec:
  chart: frigate
  repo: https://blakeblackshear.github.io/blakeshome-charts/
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 7.8.0
  valuesContent: |-
    strategyType: Recreate
    # SELinux-enforcing host: privileged needed for hostPath media volume + /dev/dri
    # (same precedent as jellyfin; also recommended by Frigate docs)
    securityContext:
      privileged: true
    image:
      repository: ghcr.io/blakeblackshear/frigate
      # ROCm build: proper AMD GPU stack (vainfo works on the RX 9070/RDNA4).
      # The standard image's bundled Mesa hangs probing RDNA4.
      tag: 0.17.2-rocm
    env:
      # {FRIGATE_*_PASSWORD} tokens in `config` are substituted by Frigate from these env vars
      FRIGATE_RTSP_PASSWORD: "$FRIGATE_RTSP_PASSWORD"
      FRIGATE_MQTT_PASSWORD: "$FRIGATE_MQTT_PASSWORD"
    config: |-
      mqtt:
        host: mosquitto
        port: 1883
        user: frigate
        password: '{FRIGATE_MQTT_PASSWORD}'
      ffmpeg:
        # VAAPI decode pinned to the discrete GPU (renderD129 = RX 9070; the iGPU
        # is renderD128). Explicit device because the auto-selector probes devices
        # in arbitrary order. -hwaccel_output_format nv12: decode on the GPU but
        # deliver CPU frames, so the detect/record filter chains (fps, scale) work.
        # The ROCm image could also drive an ONNX detector (auto-detected) later.
        hwaccel_args: -hwaccel_flags allow_profile_mismatch -hwaccel vaapi -hwaccel_device /dev/dri/renderD129 -hwaccel_output_format nv12
        retry_interval: 5
      detectors:
        cpu:
          type: cpu
      # Deployment-specific config (go2rtc streams, cameras) comes from
      # FRIGATE_ADDITIONAL_CONFIG in targets/srv0/VARS.template.sh
      $FRIGATE_ADDITIONAL_CONFIG
    persistence:
      config:
        enabled: true
        existingClaim: frigate-config-pvc
      media:
        enabled: false
    # NFS-backed media (recordings stay on srv0's $SECONDARY_STORAGE_PATH/frigate,
    # exported by the nfs-server component) while Frigate runs on the GPU node
    extraVolumes:
      - name: frigate-media
        persistentVolumeClaim:
          claimName: frigate-media-pvc
      - name: dri
        hostPath:
          path: /dev/dri
      - name: kfd
        hostPath:
          path: /dev/kfd
    extraVolumeMounts:
      - name: frigate-media
        mountPath: /media/frigate
      - name: dri
        mountPath: /dev/dri
      - name: kfd
        mountPath: /dev/kfd
    # Bigpc is a hard requirement: the ROCm image needs /dev/kfd and decode is
    # pinned to the discrete GPU (renderD129), neither of which exists on srv0.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: has-amdgpu
                  operator: In
                  values:
                    - "true"
    tolerations:
      - key: scheduling-discouraged
        operator: Equal
        value: "true"
        effect: PreferNoSchedule
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 128Mi
