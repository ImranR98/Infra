---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geoipupdate
  namespace: base
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          securityContext:
            runAsUser: $MY_UID
            runAsGroup: $MY_UID
            fsGroup: $MY_UID
            runAsNonRoot: true
            # Shared with the geoip service pod via the geoip PVC: pods
            # writing/reading the same volume must share MCS category s0
            # (pod-level; container-level is ignored), otherwise files carry
            # their creator's random category and readers get EACCES.
            seLinuxOptions:
              level: s0
          restartPolicy: Never
          containers:
            - name: geoipupdate
              image: maxmindinc/geoipupdate:latest@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
              env:
                - name: GEOIPUPDATE_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: geoipupdate-secret
                      key: account-id
                - name: GEOIPUPDATE_LICENSE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: geoipupdate-secret
                      key: license-key
                - name: GEOIPUPDATE_EDITION_IDS
                  value: "GeoLite2-Country"
                - name: GEOIPUPDATE_DB_DIR
                  value: "/data"
              volumeMounts:
                - name: geoip-data
                  mountPath: /data
          volumes:
            - name: geoip-data
              persistentVolumeClaim:
                claimName: geoip-pvc
