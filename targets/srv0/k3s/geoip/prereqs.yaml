# --- prereqs.yaml ---
# PVC only — the Secret is created in post.sh (kustomize strips quotes from
# stringData values, turning numeric account IDs into bare integers that
# Kubernetes rejects).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geoip-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi
  storageClassName: longhorn
