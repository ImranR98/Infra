---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gokapi-prod-tls
  namespace: apps
spec:
  secretName: gokapi-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - send.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gokapi-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`send.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        - name: gokapi-svc
          port: 53842
  tls:
    secretName: gokapi-prod-tls
---
# In initial mode, send.$SERVICES_DOMAIN is protected by Authelia.
# This breaks Gokapi's first-time setup, so an internal
# LAN-only route is needed (defined below).
# Accessing the LAN-only route may require editing /etc/hosts
# temporarily if you are not running on a cluster node.
# In non-initial mode, we want to disable this LAN-only route, 
# so we make Authelia protect it (this is effectively a block),
# hence the 'IGNORE INITIALLY' comments below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gokapi-ingress-local
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`send.lan.localhost`)
      kind: Rule
      middlewares:
        - name: lan-whitelist
          namespace: base
        - name: forwardauth-authelia # IGNORE INITIALLY
          namespace: base # IGNORE INITIALLY
      services:
        - name: gokapi-svc
          port: 53842
  tls:
    secretName: local-tls
