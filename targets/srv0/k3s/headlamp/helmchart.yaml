---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: headlamp
  namespace: apps
spec:
  chart: headlamp
  repo: https://kubernetes-sigs.github.io/headlamp
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 0.45.0
  valuesContent: |-
    config:
      inCluster: true
      # Per-user OIDC identity is NOT enabled: the kube-apiserver has no OIDC
      # provider configured, so Authelia-issued tokens are rejected with 401
      # when Headlamp proxies them to the API. Headlamp therefore acts as its
      # own Service Account (read-only via the headlamp-readonly
      # ClusterRole in clusterRoleBinding below); the Authelia forward-auth
      # middleware on the IngressRoute is the sole identity gate.
      # To enable per-user identity instead (flip this to false):
      #   1. /etc/rancher/k3s/config.yaml.d/20-oidc.yaml:
      #      kube-apiserver-arg:
      #        - "oidc-issuer-url=https://auth.$SERVICES_DOMAIN"
      #        - "oidc-client-id=headlamp"
      #        - "oidc-username-claim=preferred_username"
      #        - "oidc-groups-claim=groups"
      #        - "oidc-username-prefix=authelia:"
      #        - "oidc-groups-prefix=authelia:"
      #   2. systemctl restart k3s
      #   3. The authelia-admins-cluster-admin ClusterRoleBinding (oidc-rbac.yaml)
      #      already grants the authelia:admins group cluster-admin.
      unsafeUseServiceAccountToken: true
      oidc:
        secret:
          create: true
          name: headlamp-oidc
        clientID: headlamp
        clientSecret: "$AUTHELIA_HEADLAMP_CLIENT_SECRET_HASHABLE"
        issuerURL: "https://auth.$SERVICES_DOMAIN"
        callbackURL: "https://k8s.$SERVICES_DOMAIN/oidc-callback"
        scopes: "openid profile email groups"
        usePKCE: true
      extraArgs:
        - "-log-level=debug"
    clusterRoleBinding:
      clusterRoleName: headlamp-readonly
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 128Mi
