---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-prod-tls
  namespace: apps
spec:
  secretName: headlamp-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - k8s.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`k8s.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
      services:
        - name: headlamp-headlamp
          port: 80
  tls:
    secretName: headlamp-prod-tls
