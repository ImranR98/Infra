---
# Binds the Authelia 'admins' group (as seen by the kube-apiserver via its
# OIDC configuration, prefixed with 'authelia:') to cluster-admin.
# This is what Headlamp's OIDC-logged-in users authenticate as.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authelia-admins-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "authelia:admins"
