---
# Read-only ClusterRole for Headlamp's ServiceAccount.
# Aggregates the built-in 'view' role (read-only on most resources, NO Secrets)
# plus any roles labeled rbac.authorization.k8s.io/aggregate-to-view (e.g.
# cert-manager-view). NOTE: when aggregationRule is set, the cluster's RBAC
# controller REPLACES this role's rules with the aggregated result, so
# additional permissions must live in separate labeled roles (see
# headlamp-readonly-nodes below). Any write verb is implicitly denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-readonly
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
---
# Cluster-scoped resources the built-in view role does not cover (nodes).
# The aggregate-to-view label merges these rules into headlamp-readonly
# (and into the built-in 'view' role; nothing binds 'view' in this cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-readonly-nodes
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
