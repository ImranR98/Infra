---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-dashboards
  namespace: apps
data:
  # YAML-mode Lovelace dashboard, mounted at /config/dashboards (see
  # helmchart.yaml additionalMounts) and registered in configuration.yaml via
  # lovelace.dashboards.frigate-nvr. Uses the Advanced Camera Card
  # (auto-installed by the integration-update init container into
  # /config/www/community and registered via frontend.extra_module_url).
  #
  # Every card config below was validated against the card's OWN zod schema
  # (advancedCameraCardConfigSchema from the v7.27.4 source, run via tsx) -
  # no keys are guessed. Note: `view` is an OBJECT (view.default), not a
  # string; a string fails the schema with "Expected object, received
  # string". camera_entity is required for engine (Frigate) detection.
  # go2rtc stream "rpi" comes from go2rtc.streams in FRIGATE_ADDITIONAL_CONFIG.
  frigate.yaml: |
    views:
      - title: Live
        path: live
        type: panel
        cards:
          - type: custom:advanced-camera-card
            cameras:
              - camera_entity: camera.rpi
                go2rtc:
                  stream: rpi
      - title: Timeline
        path: timeline
        type: panel
        cards:
          - type: custom:advanced-camera-card
            view:
              default: timeline
            cameras:
              - camera_entity: camera.rpi
                go2rtc:
                  stream: rpi
            timeline:
              # 1-day default window; zoom/pan back through retained history
              # (Frigate record.retain days, see FRIGATE_ADDITIONAL_CONFIG).
              window_seconds: 86400
              show_recordings: true
      - title: Recordings
        path: recordings
        type: panel
        cards:
          - type: custom:advanced-camera-card
            view:
              default: recordings
            cameras:
              - camera_entity: camera.rpi
                go2rtc:
                  stream: rpi
