---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homeassistant-prod-tls
  namespace: apps
spec:
  secretName: homeassistant-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ha.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homeassistant-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    # Static custom-card assets under /local/community skip the state-
    # dependent middlewares (crowdsec appsec + Authelia forward-auth). The
    # browser fetches dozens of hashed JS chunks on every page load (the
    # service worker only precaches HA's own frontend), so a transient
    # appsec/auth failure breaks custom card loading intermittently while
    # HA itself keeps working. The files are immutable GitHub release
    # assets (no auth needed); geoblock still applies.
    - match: Host(`ha.$SERVICES_DOMAIN`) && PathPrefix(`/local/community`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: local-no-store
          namespace: base
      services:
        - name: homeassistant-home-assistant
          port: 8080
    - match: Host(`ha.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: authelia-with-optional-header-gate
          namespace: base
      services:
        - name: homeassistant-home-assistant
          port: 8080
  tls:
    secretName: homeassistant-prod-tls
