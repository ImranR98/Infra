# Host-level PersistentVolumes — shared resources tied to specific cluster nodes.
# Each PV is paired with a PVC in the namespace of the app that consumes it.
# All are RWX so multiple pods can share the same host directory if needed.

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hostpath-main-node-main-parent-pv
spec:
  capacity:
    storage: 4096Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: $MAIN_PARENT_DIR
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostpath-main-node-main-parent-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 4096Gi
  volumeName: hostpath-main-node-main-parent-pv
---
apiVersion: v1
