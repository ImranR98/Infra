      nodeSelectorTerms:
        - matchExpressions:
            - key: external-exposed
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: external-exposed-node-syslog-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
