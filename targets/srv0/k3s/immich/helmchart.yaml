---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: immich
  namespace: apps
spec:
  chart: oci://ghcr.io/immich-app/immich-charts/immich
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 0.13.1
  valuesContent: |-
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 8Gi
                infra.local/devices-dri: "1"
              requests:
                memory: 128Mi
                infra.local/devices-dri: "1"
            env:
              DB_HOSTNAME: "immich-postgresql"
              DB_USERNAME: "postgres"
              DB_DATABASE_NAME: "immich"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: password

    defaultPodOptions:
      # Pin everything to srv0: the library PVC is RWO and VAAPI/OpenVINO
      # need the Iris Xe there. Without this, a RollingUpdate pod can land on
      # bigpc (PreferNoSchedule only discourages) and deadlock on the PVC.
      nodeSelector:
        hostpath-main: "true"
      securityContext:
        runAsUser: $MY_UID
        runAsGroup: $MY_UID
        fsGroup: $MY_UID
        # container_t + s0 (verified): SELinux allows container_t the
        # /dev/dri CDI grant, the external hostPath library read, and the
        # library PVC; s0 keeps files category-free so server/ML and the
        # pvc-backup pods can share them.
        seLinuxOptions:
          level: s0

    server:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.1.0
              securityContext:
                allowPrivilegeEscalation: false
              env:
                HWACCEL_VAAPI_ENABLED: "true"
      persistence:
        external:
          type: hostPath
          hostPath: $MEDIA_DIR_PATH
          globalMounts:
            - path: /external
              readOnly: true

    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.1.0-openvino
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                limits:
                  memory: 8Gi
                  infra.local/devices-dri: "1"
                requests:
                  memory: 128Mi
                  infra.local/devices-dri: "1"
      defaultPodOptions:
        nodeSelector:
          hostpath-main: "true"
        securityContext:
          seLinuxOptions:
            level: s0
        # No node affinity/tolerations: bigpc's scheduling-discouraged taint
        # keeps the pod on srv0; the descheduler evicts any drift. ML runs on
        # srv0's Iris Xe iGPU via OpenVINO (see tag above).

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc

    valkey:
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: "9.1"
      enabled: true
