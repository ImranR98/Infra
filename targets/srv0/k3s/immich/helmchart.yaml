---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: immich
  namespace: apps
spec:
  chart: oci://ghcr.io/immich-app/immich-charts/immich
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 0.13.1
  valuesContent: |-
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 2Gi
              requests:
                memory: 128Mi
            env:
              DB_HOSTNAME: "immich-postgresql"
              DB_USERNAME: "postgres"
              DB_DATABASE_NAME: "immich"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: password

    defaultPodOptions:
      securityContext:
        runAsUser: $MY_UID
        runAsGroup: $MY_UID
        fsGroup: $MY_UID

    server:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.0.3
              env:
                HWACCEL_VAAPI_ENABLED: "true"
      persistence:
        dri:
          type: hostPath
          hostPath: /dev/dri
          globalMounts:
            - path: /dev/dri
        external:
          type: hostPath
          hostPath: $MEDIA_DIR_PATH
          globalMounts:
            - path: /external
              readOnly: true

    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.0.3-rocm
      defaultPodOptions:
        tolerations:
          - key: scheduling-discouraged
            operator: Equal
            value: "true"
            effect: PreferNoSchedule
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: has-amdgpu
                      operator: In
                      values:
                        - "true"
      persistence:
        kfd:
          type: hostPath
          hostPath: /dev/kfd
          globalMounts:
            - path: /dev/kfd
        dri:
          type: hostPath
          hostPath: /dev/dri
          globalMounts:
            - path: /dev/dri

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc
      configurationKind: Secret
      configuration:
        ffmpeg:
          accel: vaapi
        passwordLogin:
          enabled: false
        oauth:
          autoLaunch: true
          autoRegister: true
          buttonText: "Login with Authelia"
          clientId: "immich"
          clientSecret: "$AUTHELIA_IMMICH_CLIENT_SECRET_HASHABLE"
          enabled: true
          issuerUrl: "https://auth.$SERVICES_DOMAIN"
          scope: "openid profile email"
        library:
          watch:
            enabled: true

    valkey:
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: "9.1"
      enabled: true
