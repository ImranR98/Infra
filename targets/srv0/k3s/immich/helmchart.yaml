---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: immich
  namespace: apps
spec:
  chart: oci://ghcr.io/immich-app/immich-charts/immich
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 0.13.1
  valuesContent: |-
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 8Gi
              requests:
                memory: 128Mi
            env:
              DB_HOSTNAME: "immich-postgresql"
              DB_USERNAME: "postgres"
              DB_DATABASE_NAME: "immich"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: password

    defaultPodOptions:
      securityContext:
        runAsUser: $MY_UID
        runAsGroup: $MY_UID
        fsGroup: $MY_UID

    server:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.1.0
              securityContext:
                privileged: true
                allowPrivilegeEscalation: true
              env:
                HWACCEL_VAAPI_ENABLED: "true"
      persistence:
        dri:
          type: hostPath
          hostPath: /dev/dri
          globalMounts:
            - path: /dev/dri
        external:
          type: hostPath
          hostPath: $MEDIA_DIR_PATH
          globalMounts:
            - path: /external
              readOnly: true

    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.1.0-openvino
              securityContext:
                privileged: true
                allowPrivilegeEscalation: true
              resources:
                limits:
                  memory: 8Gi
                requests:
                  memory: 128Mi
      defaultPodOptions: {}
        # No node affinity/tolerations: bigpc's scheduling-discouraged taint
        # keeps the pod on srv0; the descheduler evicts any drift. ML runs on
        # srv0's Iris Xe iGPU via OpenVINO (see tag above).
      persistence:
        dri:
          type: hostPath
          hostPath: /dev/dri
          globalMounts:
            - path: /dev/dri

    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc

    valkey:
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: "9.1"
      enabled: true
