apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-db-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: immich-db
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /k3s-state
      subDir: immich-db
      mountOptions: nolock
      mountPermissions: "0755"
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
  volumeName: immich-db-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: immich-library
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /k3s-state
      subDir: immich-library
      mountOptions: nolock
      mountPermissions: "0755"
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs
  volumeName: immich-library-pv
---
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-credentials
  namespace: apps
type: Opaque
stringData:
  password: "$IMMICH_DB_PASSWORD"
---
# PostgreSQL with VectorChord extension for Immich smart search
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgresql
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-postgresql
    spec:
      securityContext:
        fsGroup: $MY_UID
      containers:
      - name: postgresql
        image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
        securityContext:
          allowPrivilegeEscalation: false
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - postgres
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
          initialDelaySeconds: 15
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db-credentials
              key: password
        - name: POSTGRES_DB
          value: "immich"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: "--data-checksums"
        ports:
        - containerPort: 5432
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: immich-db-pvc
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgresql
  namespace: apps
spec:
  selector:
    app: immich-postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
