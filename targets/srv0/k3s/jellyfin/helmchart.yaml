---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: jellyfin
  namespace: apps
spec:
  chart: jellyfin
  repo: https://jellyfin.github.io/jellyfin-helm
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 3.2.0
  valuesContent: |-
    # Recreate: the config PVC is RWO Longhorn - RollingUpdate deadlocks (new pod
    # can't attach while the old one holds the volume, e.g. after node moves).
    deploymentStrategy:
      type: Recreate
    persistence:
      config:
        existingClaim: jellyfin-config-pvc
      media:
        enabled: false

    volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: tv
        persistentVolumeClaim:
          claimName: jellyfin-tv-pvc
      - name: youtube
        persistentVolumeClaim:
          claimName: jellyfin-youtube-pvc
      - name: arrstack-media
        persistentVolumeClaim:
          claimName: arrstack-media-pvc

    volumeMounts:
      - name: dri
        mountPath: /dev/dri
      - name: tv
        mountPath: /media/TV
        readOnly: true
      - name: youtube
        mountPath: /media/YouTube
        readOnly: true
      - name: arrstack-media
        mountPath: /media/Arrstack

    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 128Mi
    podSecurityContext:
      runAsUser: $MY_UID
      runAsGroup: $MY_UID
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
    # No node affinity: bigpc's scheduling-discouraged taint (PreferNoSchedule)
    # keeps non-tolerating pods on srv0; the descheduler evicts any drift.
    # VAAPI transcode runs on srv0's Iris Xe iGPU via the /dev/dri mount.
