---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-ratelimit
  namespace: apps
spec:
  rateLimit:
    average: 25
    burst: 50
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-prod-tls
  namespace: apps
spec:
  secretName: jellyfin-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - tv.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tv.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
        - name: jellyfin-ratelimit
          namespace: apps
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: jellyfin-prod-tls
---
# In initial mode, tv.$SERVICES_DOMAIN is protected by Authelia.
# This breaks Jellyfin's first-time setup, so a LAN-only route
# (defined below) provides unauthenticated access from private IPs.
#
# Add <cluster-ip> tv.lan.local to /etc/hosts, or configure your
# router's local DNS to resolve *.lan.local to the cluster IP.
#
# In non-initial mode this route is auto-blocked (Authelia applied).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-ingress-local
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tv.lan.local`)
      kind: Rule
      middlewares:
        - name: lan-whitelist
          namespace: base
        - name: forwardauth-authelia # IGNORE INITIALLY
          namespace: base # IGNORE INITIALLY
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: local-tls
