---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
  namespace: base
spec:
  chart: loki
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 7.3.0
  valuesContent: |-
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 2Gi
    # Chart validation: scalable targets must stay at 0 replicas while
    # singleBinary.replicas > 0 (the defaults are non-zero).
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # No canary/gateway: promtail and Grafana talk to the loki Service directly.
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
    loki:
      auth_enabled: false
      ingester:
        lifecycler:
          ring:
            # SingleBinary single replica: one ingester is the whole write path.
            replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin
        s3:
          endpoint: rustfs-svc.base.svc.cluster.local:9000
          region: us-east-1
          accessKeyId: "$RUSTFS_ACCESS_KEY"
          secretAccessKey: "$RUSTFS_SECRET_KEY"
          s3ForcePathStyle: true
          insecure: true
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: s3
      limits_config:
        # 90 days of logs; compactor enforces this against the object store.
        retention_period: 2160h
        # Keep the 7d default: the first tail of a pre-existing docker json
        # log would otherwise ship months of history through Loki -> RustFS
        # -> Longhorn and saturate the node's storage path (old batches are
        # dropped with a fast 400 instead).
        reject_old_samples: true
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # Prebuilt Loki dashboards (chart-bundled mixin) auto-imported by the
    # Grafana sidecar via the grafana_dashboard: "1" label, plus the
    # ServiceMonitor and recording rules that feed them.
    monitoring:
      dashboards:
        enabled: true
      serviceMonitor:
        enabled: true
        # The kube-prometheus-stack Prometheus CR selects ServiceMonitors
        # by release: monitoring.
        labels:
          release: monitoring
      rules:
        enabled: true
        labels:
          release: monitoring
        # Alert rules included in the rules bundle will evaluate but have no
        # alertmanager to fire into (disabled in the monitoring stack);
        # recording rules are what the dashboards need.
        alerting: true
