# RBAC for pod log reading — namespaced Roles instead of a ClusterRole:
# logtfy only tailes pods in apps (its own targets), base (authelia logins),
# and kube-system (traefik geoblock/access logs). See logtfy.json
# loggerArg values for the authoritative list.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logtfy-service-account
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-log-reader-binding
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: logtfy-service-account
    namespace: apps
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: base
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-log-reader-binding
  namespace: base
subjects:
  - kind: ServiceAccount
    name: logtfy-service-account
    namespace: apps
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-log-reader-binding
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: logtfy-service-account
    namespace: apps
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io
---
# Logtfy configuration
apiVersion: v1
kind: Secret
metadata:
  name: logtfy-config
  namespace: apps
type: Opaque
stringData:
  logtfy.json: |
    {
        "ntfyConfig": {
            "configs": [
                {
                    "id": "ntfy_self",
                    "host": "https://ntfy.$SERVICES_DOMAIN",
                    "authHeader": "Bearer $NTFY_WRITE_ONLY_ACCOUNT_TOKEN",
                    "topicPrefix": "${TARGET}_services_"
                },
                {
                    "id": "ntfy_official",
                    "host": "https://ntfy.sh",
                    "authHeader": null,
                    "topicPrefix": "$NTFY_FALLBACK_TOPIC"
                }
            ],
            "defaultConfig": "ntfy_self",
            "fallbackConfig": "ntfy_official"
        },
        "modulesEnabledByDefault": false,
        "moduleCustomization": [
            {
                "module": "ssh_logins",
                "ntfyTopic": "logtfy",
                "enabled": true
            },
            {
                "module": "authelia_logins_k8s",
                "loggerArg": "base",
                "ntfyTopic": "logtfy",
                "enabled": true
            },
            {
                "module": "traefik_geoblock_allowed_requests_k8s",
                "loggerArg": "kube-system",
                "ntfyTopic": "traefik",
                "defaultPriority": "1",
                "enabled": true
            },
            {
                "module": "traefik_accesslogs_custom_k8s",
                "loggerArg": "kube-system",
                "ntfyTopic": "logtfy",
                "parserArg": "DownstreamStatus\":200,.*fmd.*requestAccess",
                "enabled": true
            }
        ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logtfy
  namespace: apps
  labels:
    app: logtfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logtfy
  template:
    metadata:
      labels:
        app: logtfy
    spec:
      hostname: ${TARGET}
      serviceAccountName: logtfy-service-account
      securityContext:
        fsGroup: $MY_UID
      containers:
        - name: logtfy
          image: imranrdev/logtfy:latest@sha256:c234a89fe4969806c28b972509c3575ff2595f77ba4b3f1def540a7a2b0b07bd
          volumeMounts:
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: config
              mountPath: /logtfy/config.json
              subPath: logtfy.json
          env:
            - name: KUBE_API_SERVER
              value: "https://kubernetes.default.svc"
            - name: PYTHON_IO_URING
              value: "0"
            - name: PYTHON_IOURING
              value: "0"
          securityContext:
            # runs as root: imranrdev image breaks with non-root uid
            allowPrivilegeEscalation: false
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
      volumes:
        - name: journal
          persistentVolumeClaim:
            claimName: external-exposed-node-syslog-pvc
        - name: config
          secret:
            secretName: logtfy-config
            items:
              - key: logtfy.json
                path: logtfy.json
