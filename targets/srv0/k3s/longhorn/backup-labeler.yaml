---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-volumes
  namespace: longhorn-system
data:
  volumes: |
    fmd-pvc
    freshrss-data-pvc
    freshrss-extensions-pvc
    homeassistant-config-pvc
    jellyfin-config-pvc
    nextcloud-data-pvc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-labeler
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-labeler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["backup-volumes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-labeler
subjects:
  - kind: ServiceAccount
    name: backup-labeler
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backup-labeler
  namespace: longhorn-system
spec:
  ttlSecondsAfterFinished: 1
  template:
    spec:
      serviceAccountName: backup-labeler
      restartPolicy: OnFailure
      containers:
        - name: labeler
          image: bitnami/kubectl:latest@sha256:e2b97dde9666986c61c56d49aae85a714b89b69392baa531438e74ec34096fb4
          command:
            - /bin/bash
            - -ec
            - |
              VOLUMES=$(kubectl get configmap backup-volumes -o jsonpath='{.data.volumes}')
              echo "$VOLUMES" | while IFS= read -r PVC; do
                [ -z "$PVC" ] && continue
                for NS in base apps monitoring apps-privileged; do
                  PV=$(kubectl get pvc -n "$NS" "$PVC" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)
                  if [ -n "$PV" ]; then
                    kubectl label volume -n longhorn-system "$PV" \
                      recurring-job-group.longhorn.io/auto-backup=enabled --overwrite 2>/dev/null || true
                    break
                  fi
                done
              done
