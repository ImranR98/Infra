---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdscl-camera
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mdscl-camera
  template:
    metadata:
      labels:
        app: mdscl-camera
        app.kubernetes.io/component: mdscl
    spec:
      securityContext:
        fsGroup: $MY_UID
      containers:
        - name: mdscl-camera
          image: imranrdev/media-date-standardize-copy-loop:latest@sha256:d6e7368ab0846e01049fd62cc645e146bfc9c5a9804430dd4f43fc503ef373b3
          securityContext:
            runAsUser: $MY_UID
            runAsGroup: $MY_UID
            allowPrivilegeEscalation: false
          env:
            - name: NTFY_URL
              value: "http://ntfy.base.svc.cluster.local:3000/${TARGET}_services_mdscl_errors"
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mdscl-ntfy-token
                  key: token
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          volumeMounts:
            - name: mdscl-camera-src
              mountPath: /mdscl/source
            - name: mdscl-camera-dst
              mountPath: /mdscl/destination
      volumes:
        - name: mdscl-camera-src
          persistentVolumeClaim:
            claimName: hostpath-main-node-devicesync-camera-pvc
        - name: mdscl-camera-dst
          persistentVolumeClaim:
            claimName: hostpath-main-node-media-camera-pvc
