---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: base
  labels:
    app: mimir
spec:
  replicas: 1
  # Single replica + RWO PVC: Recreate avoids two pods fighting for the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      securityContext:
        fsGroup: 10001
      # Graceful descheduler/eviction shutdown: flush the TSDB head before
      # the pod dies instead of relying on WAL replay alone.
      terminationGracePeriodSeconds: 120
      containers:
        - name: mimir
          image: grafana/mimir:3.2.0
          args:
            # Monolithic mode (all targets in one process), single tenant.
            # Flags instead of a config file: any config change is a
            # Deployment change, so the pod rolls automatically on apply.
            - -target=all
            - -server.http-listen-port=8080
            - -auth.multitenancy-enabled=false
            # Object storage (RustFS): blocks/ruler/alertmanager inherit the
            # endpoint and credentials from common.storage; only the bucket
            # names are per-component.
            - -common.storage.backend=s3
            - -common.storage.s3.endpoint=rustfs-svc.base.svc.cluster.local:9000
            - -common.storage.s3.insecure=true
            - -common.storage.s3.access-key-id=$RUSTFS_ACCESS_KEY
            - -common.storage.s3.secret-access-key=$RUSTFS_SECRET_KEY
            - -blocks-storage.s3.bucket-name=mimir-blocks
            - -blocks-storage.tsdb.dir=/data/tsdb
            - -blocks-storage.bucket-store.sync-dir=/data/tsdb-sync
            - -compactor.data-dir=/data/compactor
            # Single ingester: the whole write path is one replica; tokens
            # persist on the PVC.
            - -ingester.ring.replication-factor=1
            - -ingester.ring.final-sleep=0s
            - -ingester.ring.num-tokens=512
            - -ingester.ring.tokens-file-path=/data/tokens
            - -ingester.ring.unregister-on-shutdown=false
            - -ruler-storage.s3.bucket-name=mimir-ruler
            - -alertmanager-storage.s3.bucket-name=mimir-alertmanager
            # 1 year of blocks.
            - -compactor.blocks-retention-period=8760h
            # Single trusted tenant (Prometheus): generous limits so backlog
            # flushes after downtime are never rejected, and the >150k series
            # the cluster scrapes fit under the per-user cap.
            - -distributor.ingestion-rate-limit=1000000
            - -distributor.ingestion-burst-size=1000000
            - -ingester.max-global-series-per-user=1000000
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: base
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: http
