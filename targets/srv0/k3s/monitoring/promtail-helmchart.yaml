---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: promtail
  namespace: base
spec:
  chart: promtail
  repo: https://grafana.github.io/helm-charts
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 6.17.1
  valuesContent: |-
    config:
      clients:
        - url: http://loki.base.svc.cluster.local:3100/loki/api/v1/push
      snippets:
        extraRelabelConfigs:
          # __tmp_controller_name is computed by the chart's default relabels
          # (controller name with the ReplicaSet hash stripped) - expose it as
          # a `deployment` label so logs can be filtered by workload.
          - source_labels:
              - __tmp_controller_name
            target_label: deployment
    # Kubernetes pod logs only (no docker-side scraping; the Compose sidecar
    # is out of scope for the logging stack).
    # SELinux host: spc_t (not privileged) is enough to read /var/log/pods
    # (hostPath, container_log_t) and write positions to /run/promtail.
    podSecurityContext:
      seLinuxOptions:
        type: spc_t
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
    defaultVolumes:
      - name: run
        hostPath:
          path: /run/promtail
      - name: pods
        hostPath:
          path: /var/log/pods
    defaultVolumeMounts:
      - name: run
        mountPath: /run/promtail
      - name: pods
        mountPath: /var/log/pods
        readOnly: true
