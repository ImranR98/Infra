apiVersion: v1
kind: PersistentVolume
metadata:
  name: mosquitto-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: mosquitto-data
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /k3s-state
      subDir: mosquitto-data
      mountOptions: nolock
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
  volumeName: mosquitto-data-pv
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: apps
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    allow_anonymous false
    password_file /mosquitto/config/password_file
    listener 1883
    listener 8883
      cafile /mosquitto/certs/ca.crt
      certfile /mosquitto/certs/tls.crt
      keyfile /mosquitto/certs/tls.key
      require_certificate false
    listener 9001
      protocol websockets
    log_type all
---
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-password
  namespace: apps
type: Opaque
stringData:
  password_file: $MOSQUITTO_CREDENTIALS
---
# TLS cert for internal cluster MQTT (hostPort exposure uses same cert; external
# LAN clients will see a hostname mismatch since they connect via host IP, not
# the cluster DNS name. require_certificate: false in mosquitto.conf disables
# client-side verification, so TLS encryption still works.)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
  namespace: apps
spec:
  secretName: mosquitto-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - mosquitto.apps.svc.cluster.local