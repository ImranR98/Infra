apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: apps
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    allow_anonymous false
    password_file /mosquitto/config/password_file
    listener 1883
    listener 8883
      cafile /mosquitto/certs/ca.crt
      certfile /mosquitto/certs/tls.crt
      keyfile /mosquitto/certs/tls.key
      require_certificate false
    listener 9001
      protocol websockets
    log_type all
---
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-password
  namespace: apps
type: Opaque
stringData:
  # Block scalar: multi-line MOSQUITTO_CREDENTIALS value (one "user:hash" line per
  # entry, all lines indented 4 spaces in VARS) renders as a column-0 password file.
  password_file: |-
    $MOSQUITTO_CREDENTIALS
---
# Single TLS cert for cluster + LAN.  External clients see hostname mismatch
# (connect via IP).  require_certificate: false disables verification; TLS still works.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
  namespace: apps
spec:
  secretName: mosquitto-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - mosquitto.apps.svc.cluster.local
