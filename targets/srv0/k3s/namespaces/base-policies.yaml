# ┌──────────────────────────────────────────────────────────────┐
# │  BASELINE NETWORK POLICIES — applied to all user namespaces  │
# │  These are the foundation. Component-specific rules live in  │
# │  each component's own network-policy.yaml file.              │
# └──────────────────────────────────────────────────────────────┘
#
# POLICY MODEL (per namespace):
#   deny-all-ingress      — block all ingress by default
#   allow-traefik-ingress — HTTP from kube-system/traefik
#
# Egress is unrestricted — there are no egress NetworkPolicies.
#
# ───────────────────────────────────────────────────────────────────

#
# === base ===
# Core infrastructure namespace: cert-manager, crowdsec, authelia, ntfy,
# and shared Traefik plugins/middlewares.
#
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: base
spec:
  podSelector: {}          # all pods in the namespace
  policyTypes:
    - Ingress              # deny all incoming unless explicitly allowed
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: base
spec:
  podSelector: {}          # crowdsec-lapi, authelia, ntfy, cert-manager-webhook
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress

#
# === apps ===
# User-facing applications: jellyfin, immich, nextcloud, ollama, etc.
#
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: apps
spec:
  podSelector: {}          # all app pods
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress

#
# === monitoring ===
# Observability: logtfy, future monitoring tools.
#
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: monitoring
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
