---
# PSA labels. enforce stays `privileged` — legitimate holdouts remain:
# nfs-server (kernel NFS), syncthing hostNetwork, mosquitto hostPorts,
# opencanary hostPorts. `audit: restricted` surfaces every remaining
# violation in metrics/logs so the distance to a real policy is measurable;
# `warn: privileged` is a no-op kept for visibility that enforcement is
# relaxed here.
apiVersion: v1
kind: Namespace
metadata:
  name: base
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/enforce: privileged
