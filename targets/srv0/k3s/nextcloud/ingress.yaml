---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nextcloud-prod-tls
  namespace: apps
spec:
  secretName: nextcloud-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - nextcloud.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`nextcloud.$SERVICES_DOMAIN`) && PathPrefix(`/heartbeat`)
      kind: Rule
      middlewares:
        - name: nextcloud-hsts
          namespace: apps
      services:
        - name: nextcloud
          port: 80
    - match: Host(`nextcloud.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: nextcloud-hsts
          namespace: apps
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        # No forwardauth-authelia: Nextcloud is fully bypassed in Authelia's
        # access control, and apps like Floccus send Authorization headers
        # that Authelia's regulation counts as failed 1FA attempts.
      services:
        - name: nextcloud
          port: 80
  tls:
    secretName: nextcloud-prod-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nextcloud-hsts
  namespace: apps
spec:
  headers:
    stsSeconds: 15552000
