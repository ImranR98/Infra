---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nfs-ingress
  namespace: base-privileged
spec:
  podSelector:
    matchLabels:
      app: nfs-server
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app: csi-nfs-node
  policyTypes:
    - Ingress
