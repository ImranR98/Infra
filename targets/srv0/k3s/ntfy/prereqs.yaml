apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-pvc
  namespace: base
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-server-config
  namespace: base
type: Opaque
stringData:
  server.yml: |
    base-url: "https://ntfy.$SERVICES_DOMAIN"
    cache-file: "/home/ntfy/cache.db"
    attachment-cache-dir: "/home/ntfy/attachments"
    behind-proxy: true
    listen-http: ":3000"
    # auth-file required for auth-default-access to take effect.
    auth-file: "/home/ntfy/user.db"
    auth-default-access: deny-all
---
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-auth
  namespace: base
type: Opaque
stringData:
  auth-users: "admin:$NTFY_ADMIN_PASSWORD_HASH:admin,service:$NTFY_WRITE_ONLY_ACCOUNT_PASSWORD_HASH:user"
  auth-tokens: "service:$NTFY_WRITE_ONLY_ACCOUNT_TOKEN"
  auth-access: "service:*:write-only"
