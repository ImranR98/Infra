---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openwebui-prod-tls
  namespace: apps
spec:
  secretName: openwebui-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - gpt.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openwebui-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`gpt.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
      services:
        - name: open-webui
          port: 80
  tls:
    secretName: openwebui-prod-tls
---
# LAN-only route exposing the raw Ollama API behind a secret path prefix.
# No Host matcher — reachable on any cluster IP: https://<ip>/$OLLAMA_LAN_PATH.
# lan-whitelist restricts sources to private IPs; stripPrefix removes the
# secret prefix so Ollama sees its normal paths (/api/chat, /api/tags, ...).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ollama-lan-strip-prefix
  namespace: apps
spec:
  stripPrefix:
    prefixes:
      - /$OLLAMA_LAN_PATH
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ollama-ingress-lan
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/$OLLAMA_LAN_PATH`)
      kind: Rule
      middlewares:
        - name: lan-whitelist
          namespace: base
        - name: ollama-lan-strip-prefix
          namespace: apps
      services:
        - name: ollama
          port: 11434
  tls: {}

