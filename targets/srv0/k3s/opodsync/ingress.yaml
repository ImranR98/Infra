---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opodsync-prod-tls
  namespace: apps
spec:
  secretName: opodsync-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - opodsync.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opodsync-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`opodsync.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        - name: opodsync
          port: 8080
  tls:
    secretName: opodsync-prod-tls

