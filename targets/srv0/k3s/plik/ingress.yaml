---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plik-prod-tls
  namespace: apps
spec:
  secretName: plik-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - send.$SERVICES_DOMAIN
    - dl.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plik-ingress
  namespace: apps
spec:
  entryPoints:
    - web
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`send.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        - name: plik
          port: 8080
  tls:
    secretName: plik-prod-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plik-ingress-dl
  namespace: apps
spec:
  entryPoints:
    - web
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`dl.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
      services:
        - name: plik
          port: 8080
  tls:
    secretName: plik-prod-tls
