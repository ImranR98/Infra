apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plik-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plik-state-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: plik-config
  namespace: apps
type: Opaque
stringData:
  # Separate key so the Deployment can pull the password via secretKeyRef
  # instead of an inline env value (readable via `get deployments`).
  admin-password: "$PLIK_ADMIN_PASSWORD"
  plikd.cfg: |
    Debug               = false
    LogLevel            = "INFO"
    ListenPort          = 8080
    ListenAddress       = "0.0.0.0"
    NoWebInterface      = false
    PlikDomain          = "https://send.$SERVICES_DOMAIN"
    AssumeHTTPS         = true
    SourceIpHeader      = "X-Forwarded-For"
    SessionTimeout      = "365d"

    DataBackend = "file"
    [DataBackendConfig]
        Directory = "/data/files"

    [MetadataBackendConfig]
        Driver = "sqlite3"
        ConnectionString = "/data/state/plik.db"

    MaxFileSizeStr      = "10GB"
    DefaultTTLStr       = "30d"
    MaxTTLStr           = "30d"

    feature_authentication = "forced"
    no_anonymous_uploads   = true
    feature_local_login     = "enabled"
    DefaultAdminLogin    = "admin"
    DefaultAdminPassword = "$PLIK_ADMIN_PASSWORD"

    feature_one_shot        = "enabled"
    feature_removable      = "enabled"
    feature_stream         = "enabled"
    feature_password       = "enabled"
    feature_comments       = "enabled"
    feature_set_ttl         = "enabled"
    feature_api_tokens      = "enabled"
    feature_e2ee           = "enabled"
    feature_text           = "enabled"
