---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup
  namespace: apps
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pvc-backup
          restartPolicy: Never
          securityContext:
            runAsUser: 0
          containers:
            - name: backup
              image: bitnami/kubectl:latest
              env:
                - name: BACKUP_DIR
                  value: "$PVC_BACKUP_DIR"
                - name: MY_UID
                  value: "$MY_UID"
              command:
                - sh
                - -c
                - |
                  set -eu
                  LABEL="auto-backup=true"
                  TIMESTAMP=$(date -Iseconds)
                  mkdir -p "$BACKUP_DIR"

                  # --- trap: on any exit (success or failure), restore all
                  #     scaled workloads and clean up temp pods ---
                  SCALED_FILE=$(mktemp)
                  trap 'restore_workloads; rm -f "$SCALED_FILE"' EXIT

                  restore_workloads() {
                    if [ -f "$SCALED_FILE" ]; then
                      while IFS= read -r entry; do
                        ns=$(echo "$entry" | cut -d/ -f1)
                        kind=$(echo "$entry" | cut -d/ -f2)
                        wname=$(echo "$entry" | cut -d/ -f3)
                        reps=$(echo "$entry" | cut -d/ -f4)
                        kubectl scale "$kind" "$wname" -n "$ns" --replicas="$reps" 2>/dev/null || true
                      done < "$SCALED_FILE"
                    fi
                    kubectl delete pod -A -l app=pvc-backup-temp --wait=false 2>/dev/null || true
                  }

                  # Clean up any orphaned temp pods from previous failed runs
                  kubectl delete pod -A -l app=pvc-backup-temp --wait=false 2>/dev/null || true

                  # --- main loop: iterate every PVC with the auto-backup label ---
                  for pvc in $(kubectl get pvc -A -l "$LABEL" -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'); do
                    ns="${pvc%%/*}"
                    name="${pvc##*/}"
                    echo "=== Backing up $ns/$name ==="

                    # --- scale down: find all Deployments/StatefulSets that
                    #     reference this PVC, record their replica counts,
                    #     and scale them to 0 ---
                    workloads=$(kubectl get deploy,sts,ds -n "$ns" -o json 2>/dev/null | \
                      jq -r --arg pvc "$name" \
                      '.items[] | select(.spec.template.spec.volumes[]?.persistentVolumeClaim.claimName == $pvc) | "\(.kind)/\(.metadata.name)"' 2>/dev/null || true)

                    scaled_replicas=""
                    for w in $workloads; do
                      wkind="${w%%/*}"
                      wname="${w##*/}"
                      reps=$(kubectl get "$wkind" "$wname" -n "$ns" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 1)
                      echo "$ns/$wkind/$wname/$reps" >> "$SCALED_FILE"
                      kubectl scale "$wkind" "$wname" -n "$ns" --replicas=0
                      echo "  Scaled $wkind/$wname to 0"
                    done

                    sleep 5

                    # --- backup pod: creates a temp pod that mounts both
                    #     the PVC (read-only via tar) and a hostPath backup dir.
                    #     Archives PVC contents + timestamp into a .tar.gz ---
                    podname="backup-$(echo "$name" | tr '_' '-')"
                    cat <<PODEOF | kubectl apply -f -
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: $podname
                      namespace: $ns
                      labels:
                        app: pvc-backup-temp
                    spec:
                      restartPolicy: Never
                      containers:
                      - name: backup
                        image: alpine:3.21
                        command:
                        - sh
                        - -c
                        - |
                          echo "$TIMESTAMP" > /tmp/timestamp.txt
                          tar czf /backup/"$name".tar.gz -C /tmp timestamp.txt -C /data .
                          chown ${MY_UID}:${MY_UID} /backup/"$name".tar.gz 2>/dev/null || true
                        volumeMounts:
                        - name: data
                          mountPath: /data
                        - name: backup-dest
                          mountPath: /backup
                      volumes:
                      - name: data
                        persistentVolumeClaim:
                          claimName: $name
                      - name: backup-dest
                        hostPath:
                          path: $BACKUP_DIR
                          type: DirectoryOrCreate
                    PODEOF

                    # --- cleanup: wait for pod to succeed, delete it,
                    #     then on to the next PVC ---
                    echo "  Waiting for temp pod..."
                    kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$podname" -n "$ns" --timeout=600s
                    kubectl delete pod "$podname" -n "$ns"

                    echo "  Done: $name"
                  done
                  echo "=== Backup complete ==="
      backoffLimit: 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-backup
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-backup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-backup
subjects:
  - kind: ServiceAccount
    name: pvc-backup
    namespace: apps
