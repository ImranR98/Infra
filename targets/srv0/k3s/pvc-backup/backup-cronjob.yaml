---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup
  namespace: apps
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pvc-backup
          restartPolicy: Never
          securityContext:
            runAsUser: 0
          containers:
            - name: backup
              image: bitnami/kubectl:latest
              securityContext:
                privileged: true
              env:
                - name: ATLAS_ROOT
                  value: "$ATLAS_ROOT"
                - name: MY_UID
                  value: "$MY_UID"
                - name: PVC_BACKUP_DIR
                  value: "$PVC_BACKUP_DIR"
              command:
                - bash
                - -c
                - |
                  set -eu
                  bash "$ATLAS_ROOT/commands/k3s/backup-pvc.sh" --all -y
              volumeMounts:
                - name: atlas-repo
                  mountPath: "$ATLAS_ROOT"
                - name: backup-dir
                  mountPath: "$PVC_BACKUP_DIR"
          volumes:
            - name: atlas-repo
              hostPath:
                path: "$ATLAS_ROOT"
                type: Directory
            - name: backup-dir
              hostPath:
                path: "$PVC_BACKUP_DIR"
                type: DirectoryOrCreate
      backoffLimit: 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-backup
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-backup
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-backup
subjects:
  - kind: ServiceAccount
    name: pvc-backup
    namespace: apps
