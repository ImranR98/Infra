---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        - name: qbittorrent-init
          image: busybox:1.38.0-uclibc
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
                mkdir -p /config/qBittorrent
                cat > /config/qBittorrent/qBittorrent.conf << 'EOF'
              [BitTorrent]
              Session\DefaultSavePath=/data/downloads
              Session\Port=56881

              [Preferences]
              Connection\PortRangeMin=56881
              Connection\UPnP=false
              Downloads\SavePath=/data/downloads/
              Downloads\TempPath=/data/downloads/incomplete/
              General\Locale=en
              WebUI\Address=*
              WebUI\ServerDomains=*
              EOF
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "mkdir -p /data/downloads/incomplete && chown 1000:1000 /data/downloads"]
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
            - containerPort: 56881
              hostPort: 56881
              protocol: TCP
            - containerPort: 56881
              hostPort: 56881
              protocol: UDP
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: PUID
              value: "$MY_UID"
            - name: PGID
              value: "$MY_UID"
            - name: TZ
              value: "$TZ"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: arrstack-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
