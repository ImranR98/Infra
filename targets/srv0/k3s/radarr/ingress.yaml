---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radarr-prod-tls
  namespace: apps
spec:
  secretName: radarr-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - radarr.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`radarr.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
      services:
        - name: radarr
          port: 7878
  tls:
    secretName: radarr-prod-tls
