---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.local`)
      kind: Rule
      middlewares:
        - name: lan-whitelist
          namespace: base
      services:
        - name: radarr
          port: 7878
  tls: {}
