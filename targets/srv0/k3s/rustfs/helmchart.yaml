---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: rustfs
  namespace: base
spec:
  chart: rustfs
  repo: https://charts.rustfs.com
  failurePolicy: abort
  targetNamespace: base
  createNamespace: false
  version: 1.0.0-rc.5
  valuesContent: |-
    fullnameOverride: rustfs
    replicaCount: 1
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    secret:
      rustfs:
        access_key: "$RUSTFS_ACCESS_KEY"
        secret_key: "$RUSTFS_SECRET_KEY"
    config:
      rustfs:
        console_enable: "true"
        # INFO is per-operation span tracing (~350k lines/hr of noise);
        # warn keeps real signal: errors, disk failures, healing events.
        log_level: "warn"
    # No web exposure: console (9001) and S3 API (9000) stay cluster-internal.
    ingress:
      enabled: false
    storageclass:
      name: longhorn
      dataStorageSize: 200Gi
      logStorageSize: 1Gi
