---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: seerr
  namespace: apps
spec:
  chart: oci://ghcr.io/seerr-team/seerr/seerr-chart
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 3.9.1
  valuesContent: |-
    fullnameOverride: seerr
    config:
      persistence:
        # existingClaim is used instead of inline PVC because the seerr Helm
        # chart does not support PVC labels — we need auto-backup: "true" on
        # the PVC, so we create it ourselves in prereqs.yaml.
        existingClaim: seerr-config
        size: 5Gi
        storageClass: longhorn
    extraEnv:
      - name: TZ
        value: $TZ
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 2Gi
    podSecurityContext:
      runAsUser: $MY_UID
      runAsGroup: $MY_UID
