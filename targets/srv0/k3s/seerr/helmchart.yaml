---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: seerr
  namespace: apps
spec:
  chart: oci://ghcr.io/seerr-team/seerr/seerr-chart
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 3.9.0
  valuesContent: |-
    fullnameOverride: seerr
    config:
      persistence:
        size: 5Gi
        storageClass: longhorn
    extraEnv:
      - name: TZ
        value: $TZ
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 2Gi
    podSecurityContext:
      runAsUser: $MY_UID
      runAsGroup: $MY_UID
