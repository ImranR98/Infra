---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.local`)
      kind: Rule
      middlewares:
        - name: lan-whitelist
          namespace: base
      services:
        - name: sonarr
          port: 8989
  tls: {}
