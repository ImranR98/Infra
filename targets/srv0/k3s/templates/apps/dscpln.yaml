{{- if .Values.apps.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dscpln
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dscpln
  template:
    metadata:
      labels:
        app: dscpln
    spec:
      securityContext:
        fsGroup: {{ .Values.MY_UID }}
        seLinuxOptions:
          level: s0
      containers:
        - name: dscpln
          image: imranrdev/dscpln:latest@sha256:89ad11f983d92606caf4b1f742857793f1f9b4718934cbc9511e4ae3ad424e80
          securityContext:
            # runs as root: imranrdev image breaks with non-root uid
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3300
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 3300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: UV_USE_IO_URING
              value: "0"
            - name: TEXTFILE_DATA_PROVIDER_DATA_PATH
              value: "/data/{{ .Values.DSCPLN_DATA_FILE }}"
            - name: MONTHLY_LIMIT_NTFY_URL
              value: "http://ntfy.base.svc.cluster.local:3000/{{ .Values.TARGET }}_services_dscpln"
            - name: WEEKLY_LIMIT_NTFY_URL
              value: "http://ntfy.base.svc.cluster.local:3000/{{ .Values.TARGET }}_services_dscpln"
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dscpln-ntfy-token
                  key: token
            - name: TEXTFILE_BUDGET_INIT_AMT
              value: "{{ .Values.DSCPLN_BUDGET_INIT_AMT }}"
            - name: TEXTFILE_FIRST_WEEK_BIAS_INIT_AMT
              value: "{{ .Values.DSCPLN_FIRST_WEEK_BIAS_INIT_AMT }}"
          volumeMounts:
            - name: dscpln-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: dscpln-data
          persistentVolumeClaim:
            claimName: dscpln-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dscpln
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: dscpln
  ports:
    - port: 3300
      targetPort: 3300
---
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dscpln-prod-tls
  namespace: apps
spec:
  secretName: dscpln-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - dscpln.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dscpln-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`dscpln.{{ .Values.SERVICES_DOMAIN }}`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        - name: dscpln
          port: 3300
  tls:
    secretName: dscpln-prod-tls
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dscpln-data-pv
spec:
  capacity:
    storage: 5Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  local:
    path: {{ .Values.DSCPLN_TRANSACTIONS_PATH }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: hostpath-main
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dscpln-data-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: hostpath
  resources:
    requests:
      storage: 5Mi
  volumeName: dscpln-data-pv
---
apiVersion: v1
kind: Secret
metadata:
  name: dscpln-ntfy-token
  namespace: apps
type: Opaque
stringData:
  token: "{{ .Values.NTFY_WRITE_ONLY_ACCOUNT_TOKEN }}"
{{- end }}
