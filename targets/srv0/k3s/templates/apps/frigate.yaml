{{- if .Values.apps.enabled }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: frigate
  namespace: apps
spec:
  chart: frigate
  repo: https://blakeblackshear.github.io/blakeshome-charts/
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 7.8.0
  # Secret values (env passwords) live in apps/frigate-values via
  # values-secret.yaml — merged as a later values file, so this CR stays
  # free of plaintext secrets.
  valuesSecrets:
    - name: frigate-values
      keys:
        - values.yaml
  valuesContent: |-
    strategyType: Recreate
    # Pin to srv0: config PVC is RWO, media is NFS from srv0, and VAAPI/
    # OpenVINO need the Iris Xe. PreferNoSchedule on bigpc is not enough —
    # the scheduler can still place the pod there (seen during rollout).
    nodeSelector:
      hostpath-main: "true"
    # Device access via CDI (infra.local/devices-dri, see cdi-specs) — no
    # privileged. container_t + s0 (verified): SELinux allows the NFS media
    # PVC + config PVC writes and the /dev/dri grant; s0 keeps config-PVC
    # files category-free for the pvc-backup pods.
    securityContext:
      seLinuxOptions:
        level: s0
      allowPrivilegeEscalation: false
      capabilities:
        add:
          # intel GPU stats polling (PMU) — CAP_PERFMON is enough, no root
          # equivalent needed. NOTE: under container_t SELinux still denies
          # perf_event_open, so the dashboard GPU-stats graph stays empty;
          # accepted in exchange for the tighter domain.
          - PERFMON
    image:
      repository: ghcr.io/blakeblackshear/frigate
      # Standard build: decode runs on srv0's Iris Xe iGPU via VAAPI. The
      # ROCm build was only needed for bigpc's RX 9070 (RDNA4) — its bundled
      # Mesa hangs probing that GPU.
      tag: 0.17.2
    config: |-
      mqtt:
        host: mosquitto
        port: 1883
        user: frigate
        password: '{FRIGATE_MQTT_PASSWORD}'
      ffmpeg:
        # VAAPI decode on srv0's Iris Xe (renderD128). Explicit device because
        # the auto-selector probes devices in arbitrary order. -hwaccel_output_format
        # nv12: decode on the GPU but deliver CPU frames, so the detect/record
        # filter chains (fps, scale) work. The standard image auto-detects
        # OpenVINO on the Intel GPU for the detector and enrichments.
        hwaccel_args: -hwaccel_flags allow_profile_mismatch -hwaccel vaapi -hwaccel_device /dev/dri/renderD128 -hwaccel_output_format nv12
        retry_interval: 5
      detectors:
        openvino:
          type: openvino
          device: GPU
      # Bundled OpenVINO default model (SSDLite MobileNet v2, FP16 IR).
      # device: GPU = the Iris Xe iGPU via OpenVINO.
      model:
        width: 300
        height: 300
        input_tensor: nhwc
        input_pixel_format: bgr
        path: /openvino-model/ssdlite_mobilenet_v2.xml
        labelmap_path: /openvino-model/coco_91cl_bkgr.txt
      # Deployment-specific config (go2rtc streams, cameras) comes from
      # FRIGATE_ADDITIONAL_CONFIG in targets/srv0/config_template/values.yaml
{{ .Values.FRIGATE_ADDITIONAL_CONFIG | indent 6 }}
    persistence:
      config:
        enabled: true
        existingClaim: frigate-config-pvc
      media:
        enabled: false
    # NFS-backed media: recordings stay on srv0's {{ .Values.SECONDARY_STORAGE_PATH }}/frigate
    # (exported by the nfs-server component). Kept on NFS deliberately so the
    # pod can move nodes without moving data.
    extraVolumes:
      - name: frigate-media
        persistentVolumeClaim:
          claimName: frigate-media-pvc
    extraVolumeMounts:
      - name: frigate-media
        mountPath: /media/frigate
    # No node affinity/tolerations: bigpc's scheduling-discouraged taint keeps
    # the pod on srv0; the descheduler evicts any drift. /dev/kfd + the ROCm
    # build were bigpc (RX 9070) requirements and are gone with it.
    resources:
      limits:
        memory: 2Gi
        infra.local/devices-dri: "1"
      requests:
        memory: 128Mi
        infra.local/devices-dri: "1"
---
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frigate-prod-tls
  namespace: apps
spec:
  secretName: frigate-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - frigate.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`frigate.{{ .Values.SERVICES_DOMAIN }}`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        # Frigate 0.17 serves 8971 (http-auth) over HTTPS with its own cert, which
        # Traefik's plain-HTTP backend forwarding can't handle. Use the plain 5000
        # listener instead - external access is still gated by Authelia here.
        - name: frigate
          port: 5000
  tls:
    secretName: frigate-prod-tls
---
---
# In-cluster consumers: Home Assistant's Frigate integration polls the API on
# 5000 and may proxy camera streams itself via go2rtc on 8554 (the browser's
# default live view goes through Traefik instead, covered by the baseline).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frigate-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frigate
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: homeassistant
      ports:
        - port: 5000
        - port: 8554
  policyTypes:
    - Ingress
---
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-media-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: frigate-media
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /frigate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs
  volumeName: frigate-media-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Secret
metadata:
  name: frigate-values
  namespace: apps
type: Opaque
stringData:
  values.yaml: |-
    env:
      # {FRIGATE_*_PASSWORD} tokens in `config` are substituted by Frigate
      # from these env vars. NOTE: this chart's `env` key only supports plain
      # string values — secretKeyRef cannot be used here (chart limitation).
      # The values ride in this Secret via spec.valuesSecrets instead, so they
      # stay out of the HelmChart CR (same namespace-scoped Secret surface as
      # the app's other secrets).
      FRIGATE_RTSP_PASSWORD: "{{ .Values.FRIGATE_RTSP_PASSWORD }}"
      FRIGATE_MQTT_PASSWORD: "{{ .Values.FRIGATE_MQTT_PASSWORD }}"
{{- end }}
