{{- if .Values.apps.enabled }}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: jellyfin
  namespace: apps
spec:
  chart: jellyfin
  repo: https://jellyfin.github.io/jellyfin-helm
  failurePolicy: abort
  targetNamespace: apps
  createNamespace: false
  version: 3.2.0
  valuesContent: |-
    # Recreate: the config PVC is RWO Longhorn - RollingUpdate deadlocks (new pod
    # can't attach while the old one holds the volume, e.g. after node moves).
    deploymentStrategy:
      type: Recreate
    persistence:
      config:
        existingClaim: jellyfin-config-pvc
      media:
        enabled: false

    volumes:
      - name: tv
        persistentVolumeClaim:
          claimName: jellyfin-tv-pvc
      - name: youtube
        persistentVolumeClaim:
          claimName: jellyfin-youtube-pvc
      - name: arrstack-media
        persistentVolumeClaim:
          claimName: arrstack-media-pvc

    volumeMounts:
      - name: tv
        mountPath: /media/TV
        readOnly: true
      - name: youtube
        mountPath: /media/YouTube
        readOnly: true
      - name: arrstack-media
        mountPath: /media/Arrstack

    resources:
      limits:
        memory: 2Gi
        infra.local/devices-dri: "1"
      requests:
        memory: 128Mi
        infra.local/devices-dri: "1"
    podSecurityContext:
      runAsUser: {{ .Values.MY_UID }}
      runAsGroup: {{ .Values.MY_UID }}
      # level s0: keeps PVC files category-free so the pvc-backup temp pods
      # (also s0) can read the config volume (see syncthing for precedent).
      seLinuxOptions:
        level: s0
    securityContext:
      # /dev/dri/renderD128 is granted via CDI (see cdi-specs component) —
      # container_t + uid 1000 works, no privileged needed (verified).
      allowPrivilegeEscalation: false
    # No node affinity: bigpc's scheduling-discouraged taint (PreferNoSchedule)
    # keeps non-tolerating pods on srv0; the descheduler evicts any drift.
    # VAAPI transcode runs on srv0's Iris Xe iGPU (renderD128 via CDI).
---
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyfin-ratelimit
  namespace: apps
spec:
  rateLimit:
    average: 25
    burst: 50
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-prod-tls
  namespace: apps
spec:
  secretName: jellyfin-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - tv.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`tv.{{ .Values.SERVICES_DOMAIN }}`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: base
        - name: authelia-with-optional-header-gate
          namespace: base
        - name: jellyfin-ratelimit
          namespace: apps
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: jellyfin-prod-tls
---
# In initial mode, tv.{{ .Values.SERVICES_DOMAIN }} is protected by the Authelia header gate
# while it is enabled. This breaks Jellyfin's first-time setup, so a LAN-only
# route (defined below) provides unauthenticated access from private IPs.
#
# Add <cluster-ip> tv.home.local to /etc/hosts, or configure your
# router's local DNS to resolve *.home.local to the cluster IP.
#
# The LAN route is always direct and unauthenticated (lan-whitelist only).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-ingress-local
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tv.home.local`)
      kind: Rule
      middlewares:
        - name: lan-whitelist
          namespace: base
      services:
        - name: jellyfin
          port: 8096
  tls: {}
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jellyfin-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: jellyfin
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: seerr
        - podSelector:
            matchLabels:
              app: radarr
        - podSelector:
            matchLabels:
              app: sonarr
      ports:
        - port: 8096
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-tv-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-tv
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /jellyfin-tv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-tv-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: jellyfin-tv-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-youtube-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-youtube
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /jellyfin-youtube
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-youtube-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: jellyfin-youtube-pv
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arrstack-media-pv
spec:
  capacity:
    storage: 4096Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: arrstack-media
    volumeAttributes:
      server: nfs-server.base.svc.cluster.local
      share: /arrstack-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrstack-media-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4096Gi
  storageClassName: nfs
  volumeName: arrstack-media-pv
{{- end }}
