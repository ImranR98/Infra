{{- if .Values.apps.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openwebui-prod-tls
  namespace: apps
spec:
  secretName: openwebui-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - gpt.{{ .Values.SERVICES_DOMAIN }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openwebui-ingress
  namespace: apps
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  routes:
    - match: Host(`gpt.{{ .Values.SERVICES_DOMAIN }}`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
      services:
        - name: open-webui
          port: 80
  tls:
    secretName: openwebui-prod-tls
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openwebui-redis-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: open-webui-redis
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
      ports:
        - port: 6379
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openwebui-pipelines-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pipelines
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: open-webui
      ports:
        - port: 9099
  policyTypes:
    - Ingress
---
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: open-webui
  namespace: apps
spec:
  chart: open-webui
  repo: https://helm.openwebui.com/
  targetNamespace: apps
  createNamespace: false
  failurePolicy: abort
  version: 16.5.0
  valuesContent: |-
    ollama:
      enabled: false
    ollamaUrls:
      - http://ollama.apps.svc.cluster.local:11434
    persistence:
      enabled: true
      existingClaim: open-webui-data-pvc
      storageClass: nfs
    pipelines:
      persistence:
        existingClaim: open-webui-pipelines-pvc
      resources:
        limits:
          memory: 8Gi
        requests:
          memory: 128Mi
    extraEnvVars:
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        value: "true"
      - name: OAUTH_PROVIDER_NAME
        value: "Authelia"
      - name: OPENID_PROVIDER_URL
        value: "https://auth.{{ .Values.SERVICES_DOMAIN }}/.well-known/openid-configuration"
      - name: OAUTH_CLIENT_ID
        value: "open-webui"
      - name: OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: openwebui-oidc
            key: client-secret
      - name: OAUTH_SCOPES
        value: "openid email profile groups"
      - name: ENABLE_OAUTH_ROLE_MANAGEMENT
        value: "true"
      - name: OAUTH_ALLOWED_ROLES
        value: "admins,dev,family"
      - name: OAUTH_ADMIN_ROLES
        value: "admins"
      - name: OAUTH_ROLES_CLAIM
        value: "groups"
      - name: WEBUI_URL
        value: "https://gpt.{{ .Values.SERVICES_DOMAIN }}"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: OAUTH_CODE_CHALLENGE_METHOD
        value: "S256"
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 128Mi
    # NOTE: open-webui, redis, and pipelines run as root — copy-app-data
    # init container copies files as root, sub-charts uncontrolled by parent.
    podSecurityContext:
      fsGroup: {{ .Values.MY_UID }}
    containerSecurityContext:
      allowPrivilegeEscalation: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data-pvc
  namespace: apps
  labels:
    auto-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pipelines-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-oidc
  namespace: apps
type: Opaque
stringData:
  client-secret: "{{ .Values.AUTHELIA_OPENWEBUI_CLIENT_SECRET_HASHABLE }}"
{{- end }}
