{{- if .Values.base.enabled }}
# Baseline network policies for all user namespaces.
# Component-specific rules in each component's network-policy.yaml.
#
# POLICY MODEL (per namespace):
#   deny-all-ingress      — block all ingress by default
#   allow-traefik-ingress — HTTP from kube-system/traefik
#
# Egress is unrestricted — there are no egress NetworkPolicies.
#
# ───────────────────────────────────────────────────────────────────

#
# === base ===
# Core infrastructure namespace: cert-manager, crowdsec, authelia, ntfy,
# and shared Traefik plugins/middlewares.
#
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: base
spec:
  podSelector: {}          # all pods in the namespace
  policyTypes:
    - Ingress              # deny all incoming unless explicitly allowed
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: base
spec:
  podSelector: {}          # crowdsec-lapi, authelia, ntfy, cert-manager-webhook
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress

#
# === apps ===
# User-facing applications: jellyfin, immich, nextcloud, ollama, etc.
#
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: apps
spec:
  podSelector: {}          # all app pods
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
---
#
# === kube-system ===
# System namespace. Allow DNS from all namespaces, Traefik ingress,
# the k3s metrics-server (kube-aggregator queries it on 10250), and
# the cert-manager webhook.
#
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns-metrics
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: base
      ports:
        - protocol: TCP
          port: 9153
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-server
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  ingress:
    - ports:
        - protocol: TCP
          port: 10250
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  ingress:
    - from:
        - namespaceSelector: {}
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-solver
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8089
---
---
# PSA labels. enforce stays `privileged` — legitimate holdouts remain:
# nfs-server (kernel NFS), syncthing hostNetwork, mosquitto hostPorts,
# opencanary hostPorts. `audit: restricted` surfaces every remaining
# violation in metrics/logs so the distance to a real policy is measurable;
# `warn: privileged` is a no-op kept for visibility that enforcement is
# relaxed here.
apiVersion: v1
kind: Namespace
metadata:
  name: base
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/enforce: privileged
{{- end }}
