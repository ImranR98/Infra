{{- if .Values.apps.enabled }}
# Seeding hook: Helm re-runs this Job on every install/upgrade
# (post-install,post-upgrade). It runs in-cluster via kubectl with scoped
# RBAC (see role below).

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-hooks
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-hooks
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-hooks
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-hooks
subjects:
  - kind: ServiceAccount
    name: helm-hooks
    namespace: apps
---
# Immich OAuth/password seeding. Idempotent: skips when OAuth is already
# configured. Runs in-cluster with scoped RBAC.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-seed
  namespace: apps
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: immich-seed
    spec:
      serviceAccountName: helm-hooks
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: bitnami/kubectl:latest
          env:
            - name: DOMAIN_OWNER_EMAIL
              value: "{{ .Values.DOMAIN_OWNER_EMAIL }}"
            - name: SERVICES_DOMAIN
              value: "{{ .Values.SERVICES_DOMAIN }}"
            - name: AUTHELIA_IMMICH_CLIENT_SECRET
              value: "{{ .Values.AUTHELIA_IMMICH_CLIENT_SECRET_HASHABLE }}"
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== Checking Immich configuration ==="
              kubectl -n apps wait --for=condition=Ready pod -l app.kubernetes.io/name=server,app.kubernetes.io/instance=immich --timeout=600s
              PWD=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
              kubectl exec -n apps deploy/immich-server -- immich-admin enable-password-login 2>/dev/null || true
              _try_login() {
                TOKEN=$(printf '{"email":"%s","password":"%s"}' "{{ .Values.DOMAIN_OWNER_EMAIL }}" "$1" | \
                  kubectl exec -i -n apps deploy/immich-server -- \
                  curl -sk -X POST http://localhost:2283/api/auth/login \
                    -H "Content-Type: application/json" \
                    -d @- 2>/dev/null | jq -r '.accessToken // empty' 2>/dev/null || echo "")
                [ -n "$TOKEN" ]
              }
              { printf '%s\n%s\n' "$PWD" "$PWD"; sleep 3; printf 'Y\n'; } | kubectl exec -i -n apps deploy/immich-server -- \
                timeout 30 immich-admin reset-admin-password 2>/dev/null || true
              sleep 2
              if ! _try_login "$PWD"; then
                printf '{"email":"%s","name":"Admin","password":"%s"}' "{{ .Values.DOMAIN_OWNER_EMAIL }}" "$PWD" | \
                  kubectl exec -i -n apps deploy/immich-server -- \
                  curl -sk -X POST "http://localhost:2283/api/auth/admin-sign-up" \
                    -H "Content-Type: application/json" \
                    -d @- 2>/dev/null
                sleep 2
                if ! _try_login "$PWD"; then
                  echo "Error: could not create or authenticate as admin" >&2
                  exit 1
                fi
              fi
              CLIENT_ID=$(printf '%s\n' "$TOKEN" | kubectl exec -i -n apps deploy/immich-server -- \
                sh -c 'IFS= read -r tok; curl -sk "http://localhost:2283/api/system-config" \
                    -H "Authorization: Bearer $tok" 2>/dev/null' | jq -r '.oauth.clientId // empty' 2>/dev/null || echo "")
              if [ -n "$CLIENT_ID" ] && [ "$CLIENT_ID" != "null" ]; then
                echo "OAuth already configured (clientId=$CLIENT_ID). Skipping."
                exit 0
              fi
              echo "OAuth not yet configured. Seeding configuration..."
              CONFIG_JSON=$(printf '%s\n' "$TOKEN" | kubectl exec -i -n apps deploy/immich-server -- \
                sh -c 'IFS= read -r tok; curl -sk "http://localhost:2283/api/system-config" \
                    -H "Authorization: Bearer $tok" 2>/dev/null')
              UPDATED_JSON=$(jq -c \
                --arg sec "$AUTHELIA_IMMICH_CLIENT_SECRET" \
                --arg iss "https://auth.{{ .Values.SERVICES_DOMAIN }}" \
                '.oauth.enabled=true
                 | .oauth.issuerUrl=$iss
                 | .oauth.clientId="immich"
                 | .oauth.clientSecret=$sec
                 | .oauth.buttonText="Login with Authelia"
                 | .oauth.autoRegister=true
                 | .oauth.autoLaunch=true
                 | .oauth.scope="openid profile email"
                 | .ffmpeg.accel="vaapi"
                 | .passwordLogin.enabled=false
                 | .library.watch.enabled=true' <<< "$CONFIG_JSON")
              { printf '%s\n' "$TOKEN"; printf '%s\n' "$UPDATED_JSON"; } | kubectl exec -i -n apps deploy/immich-server -- \
                sh -c 'IFS= read -r tok; curl -sk -X PUT "http://localhost:2283/api/system-config" \
                    -H "Authorization: Bearer $tok" \
                    -H "Content-Type: application/json" \
                    -d @- 2>/dev/null'
              echo "Immich configuration seeded."
{{- end }}
