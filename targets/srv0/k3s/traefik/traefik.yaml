---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--providers.kubernetescrd.allowCrossNamespace=true"
      - "--api.dashboard=true"
      - "--global.sendAnonymousUsage=false"
      - "--global.checkNewVersion=true"
      - "--log.level=INFO"
      - "--accesslog.format=json"
      - "--entryPoints.websecure-proxy.proxyProtocol.trustedIPs=127.0.0.1/32,10.42.0.0/16,10.43.0.0/16"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
      - "--entryPoints.web.http.redirections.entryPoint.priority=10"

      - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
      - "--experimental.plugins.geoblock.version=v0.3.7"
      - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.version=v1.6.0"
    additionalVolumeMounts:
      - name: plugins
        mountPath: /plugins-storage
    deployment:
      additionalVolumes:
        - name: plugins
          emptyDir: {}
    resources:
      limits:
        memory: 2Gi
      requests:
        memory: 128Mi
    ports:
      web:
        port: 80
        expose:
          default: true
        exposedPort: 80
      websecure:
        port: 443
        expose:
          default: true
        exposedPort: 443
      websecure-proxy:
        port: 8443
        expose:
          default: true
        exposedPort: 8443
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-prod-tls
  namespace: kube-system
spec:
  secretName: traefik-prod-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - traefik.$SERVICES_DOMAIN
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress
  namespace: kube-system
spec:
  entryPoints:
    - websecure
    - websecure-proxy
  tls:
    secretName: traefik-prod-tls
  routes:
    - match: Host(`traefik.$SERVICES_DOMAIN`)
      kind: Rule
      middlewares:
        - name: geoblock
          namespace: base
        - name: crowdsec-bouncer
          namespace: base
        - name: forwardauth-authelia
          namespace: base
      services:
        - name: api@internal
          kind: TraefikService
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ingress-local
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  tls:
    secretName: local-tls
  routes:
    - match: Host(`traefik.local`)
      kind: Rule
      middlewares:
        - name: cluster-only
          namespace: base
        - name: basicauth-cluster
          namespace: base
      services:
        - name: api@internal
          kind: TraefikService
