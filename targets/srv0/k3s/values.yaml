# values.yaml — committed defaults: release-scope gates + machine-independent
# built-ins. All secrets and target-specific config live in the gitignored
# secrets/VARS.srv0.yaml (passed as a later -f, so it wins on conflicts).
base:
  enabled: true
apps:
  enabled: true

# Non-root pod UID used across templates (1000 is the repo-wide convention).
MY_UID: 1000
