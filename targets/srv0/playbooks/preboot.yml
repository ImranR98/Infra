---
# Install the preboot frpc initramfs tunnel for remote LUKS unlock (srv0).
# Renders the frpc compose templates first (frpc-preboot.toml + mTLS certs),
# then runs the dracut-remote-luks-unlock setup. Re-run after rotating the
# preboot mTLS certs.
# Usage: ansible-playbook targets/srv0/playbooks/preboot.yml
- name: Preboot FRPC (srv0)
  hosts: srv0
  gather_facts: true

  vars:
    infra_root: "{{ playbook_dir }}/../../.."
    preboot_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"

  tasks:
    - name: Must run on srv0
      ansible.builtin.assert:
        that: ansible_hostname == inventory_hostname
        fail_msg: "Running on '{{ ansible_hostname }}' but this playbook targets {{ inventory_hostname }} — run it on that machine."

    - name: Stat compose inputs
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ infra_root }}/targets/srv0/VARS.template.env"
        - "{{ infra_root }}/targets/srv0/compose/compose.private.yaml"
      register: _compose_inputs

    - name: Set availability facts
      ansible.builtin.set_fact:
        compose_has_vars_template: "{{ _compose_inputs.results[0].stat.exists }}"
        compose_private_exists: "{{ _compose_inputs.results[1].stat.exists }}"

    - name: Validate VARS
      ansible.builtin.command: python3 {{ infra_root }}/lib/vars_validator.py srv0
      changed_when: false
      when: compose_has_vars_template

    - name: Render frpc compose templates
      ansible.builtin.include_role:
        name: compose
      vars:
        compose_infra_root: "{{ infra_root }}"

    - name: Install the frpc preboot initramfs module
      ansible.builtin.include_role:
        name: preboot
      vars:
        preboot_module: frpc
        preboot_infra_root: "{{ infra_root }}"

    - name: Reminder
      ansible.builtin.debug:
        msg: "Preboot FRPC installed — on the next boot, FRPC starts before root is mounted, tunneling SSH to FRPS :8887."
