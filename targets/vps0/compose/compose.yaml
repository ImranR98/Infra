name: vps0

x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

x-socket-proxy: &socket-proxy
    image: wollomatic/socket-proxy:1
    restart: unless-stopped
    read_only: true
    mem_limit: 128M
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges
    user: "65534:$DOCKER_GID"
    healthcheck:
        test: ["CMD", "./healthcheck"]
        interval: 10s
        timeout: 5s
        retries: 2
    logging: *logging

# Config files inlined so docker compose interpolates ${VARS} natively from
# config/vps0/compose.env (--env-file). Verbatim files live under ./files/,
# mTLS certs as real 0600 files under ../../../config/vps0/frps/.
configs:
    authelia_configuration:
        content: |
            jwt_secret: '${AUTHELIA_JWT_SECRET}'

            log:
              # Deliberate: logtfy parses the Authelia log for login notifications.
              level: debug

            totp:
              issuer: ${CLOUD_SERVICES_DOMAIN}

            authentication_backend:
              file:
                path: /config/users_database.yml

            access_control:
              default_policy: 'deny'
              # Admin catch-all below is two_factor (TOTP is Authelia's default second
              # factor); explicit one_factor rules (ytdl/ikom/sale) intentionally stay 1FA.
              rules:
                - domain: auth.${CLOUD_SERVICES_DOMAIN}
                  policy: bypass
                - domain: ytdl.${CLOUD_SERVICES_DOMAIN}
                  policy: one_factor
                  subject:
                  - 'group:family'
                  - 'group:guests'
                - domain: ikom.${CLOUD_SERVICES_DOMAIN}
                  policy: one_factor
                  subject:
                  - 'group:family'
                - domain: sale.${CLOUD_SERVICES_DOMAIN}
                  policy: one_factor
                  subject:
                  - 'group:family'
                - domain: '*.${CLOUD_SERVICES_DOMAIN}'
                  policy: two_factor
                  subject:
                  - 'group:admins'

            session:
              secret: '${AUTHELIA_SESSION_SECRET}'
              cookies:
                - domain: ${CLOUD_SERVICES_DOMAIN}
                  authelia_url: https://auth.${CLOUD_SERVICES_DOMAIN}

              redis:
                host: authelia-db
                port: 6379
                password: '${AUTHELIA_REDIS_PASSWORD}'

            regulation:
              max_retries: 3
              find_time: 120
              ban_time: 3600

            storage:
              encryption_key: '${AUTHELIA_DB_ENCRYPTION_KEY}'
              local:
                path: /config/db.sqlite3

            notifier:
              filesystem:
                filename: /config/notification.txt

    traefik_dynamic:
        content: |
            http:
              middlewares:
                authelia:
                  forwardAuth:
                    address: http://authelia:9091/api/verify?rd=https://auth.${CLOUD_SERVICES_DOMAIN}/
                    maxResponseBodySize: 1048576
                    trustForwardHeader: true
                    authResponseHeaders:
                      - Remote-User
                      - Remote-Groups
                      - Remote-Name
                      - Remote-Email
                geoblock:
                  plugin:
                    geoblock:
                      silentStartUp: false
                      allowLocalRequests: true
                      logLocalRequests: false
                      logAllowedRequests: true
                      logApiRequests: true
                      api: "https://get.geojs.io/v1/ip/country/{ip}"
                      apiTimeoutMs: 750
                      cacheSize: 15
                      forceMonthlyUpdate: true
                      allowUnknownCountries: false
                      unknownCountryApiResponse: "nil"
                      blackListMode: false
                      countries:
                        - CA
                        - TZ
                        - US
                        - GB
                crowdsec-bouncer:
                  plugin:
                    crowdsec-bouncer-traefik-plugin:
                      enabled: true
                      logLevel: INFO
                      crowdsecMode: stream
                      crowdsecLapiScheme: http
                      crowdsecLapiHost: crowdsec:8080
                      crowdsecLapiKey: ${CROWDSEC_BOUNCER_KEY}
                      crowdsecappsecenabled: true
                      crowdsecAppsecScheme: http
                      crowdsecAppsecHost: crowdsec:7422
                      crowdsecAppsecPath: "/"
                      forwardedheaderstrustedips: "127.0.0.1/32"
              routers:
                http-to-frps:
                  rule: "Host(`home.${BASE_SERVICES_DOMAIN}`) || Host(`*.home.${BASE_SERVICES_DOMAIN}`)"
                  entryPoints: [web]
                  service: http-frps
                  priority: 100
              services:
                http-frps:
                  loadBalancer:
                    servers:
                      - url: "http://frps:8080"

            tcp:
              serversTransports:
                frps-proxy:
                  proxyProtocol:
                    version: 2
              routers:
                https-to-frps:
                  rule: "HostSNI(`home.${BASE_SERVICES_DOMAIN}`) || HostSNI(`*.home.${BASE_SERVICES_DOMAIN}`)"
                  entryPoints: [websecure]
                  service: https-frps
                  tls:
                    passthrough: true
              services:
                https-frps:
                  loadBalancer:
                    serversTransport: frps-proxy
                    servers:
                      - address: "frps:8443"

    crowdsec_http_notifications:
        content: |
            type: http
            name: http_default
            log_level: debug
            format: |
              {{.|toJson}}
            url: https://ntfy.home.${BASE_SERVICES_DOMAIN}/${TARGET}_services_crowdsec
            method: POST
            headers:
              Authorization: Bearer ${NTFY_WRITE_ONLY_ACCOUNT_TOKEN}
              Title: CrowdSec on ${TARGET}
              Priority: min

    crowdsec_plausible_whitelist:
        content: |
            name: imranr/plausible
            description: "Whitelist for Plausible"
            whitelist:
              reason: "Plausible is a SPA: the dashboard fetches the stats API in bursts, tripping crawl scenarios"
              expression:
                - evt.Meta.target_fqdn == 'plausible.${BASE_SERVICES_DOMAIN}'
                - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
                - evt.Meta.http_verb == 'GET'
                - evt.Meta.http_path matches '^/api/.+'

    crowdsec_webui_whitelist:
        content: |
            name: imranr/crowdsec-webui
            description: "Whitelist for CrowdSec Web UI"
            whitelist:
              reason: "The web UI is a SPA: the dashboard fetches the API in bursts, tripping crawl scenarios"
              expression:
                - evt.Meta.target_fqdn == 'crowdsec.${CLOUD_SERVICES_DOMAIN}'
                - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
                - evt.Meta.http_verb == 'GET'
                - evt.Meta.http_path matches '^/api/.+'

    logtfy_config:
        content: |
            {
                "ntfyConfig": {
                    "configs": [
                        {
                            "id": "ntfy_home",
                            "host": "https://ntfy.home.${BASE_SERVICES_DOMAIN}",
                            "authHeader": "Bearer ${NTFY_WRITE_ONLY_ACCOUNT_TOKEN}",
                            "topicPrefix": "${TARGET}_services_"
                        },
                        {
                            "id": "ntfy_official",
                            "host": "https://ntfy.sh",
                            "authHeader": null,
                            "topicPrefix": "${NTFY_FALLBACK_TOPIC}"
                        }
                    ],
                    "defaultConfig": "ntfy_home",
                    "fallbackConfig": "ntfy_official"
                },
                "modulesEnabledByDefault": false,
                "moduleCustomization": [
                    {
                        "module": "ssh_logins",
                        "ntfyTopic": "logtfy",
                        "enabled": true,
                        "loggerArg": "ssh"
                    },
                    {
                        "module": "authelia_logins",
                        "ntfyTopic": "logtfy",
                        "enabled": true
                    },
                    {
                        "module": "generic_logs",
                        "moduleInstances": [
                            {
                                "name": "frps_ssh_preboot",
                                "enabled": true,
                                "loggerArg": "frps stderr2stdout",
                                "parserArg": "{\"regex\":\"\\\\[ssh-preboot\\\\] get a user connection\",\"title\":\"FRP: SSH preboot connection\",\"message\":\"New connection to the ssh-preboot tunnel:\"}",
                                "ntfyTopic": "logtfy"
                            }
                        ]
                    }
                ]
            }

services:
    # FRP server - reverse proxy tunnel for home server
    frps:
        image: fatedier/frps:v0.71.0
        container_name: frps
        restart: always
        mem_limit: 128M
        volumes:
          - ./files/frps/frps.toml:/frps.toml:ro
          - ../../../config/vps0/frps/server.crt:/etc/frp/server.crt:ro
          - ../../../config/vps0/frps/server.key:/etc/frp/server.key:ro
          - ../../../config/vps0/frps/ca.crt:/etc/frp/ca.crt:ro
        ports:
            - "7000:7000"
            - "8887:8887"
            - "8888:8888"
            - "56881:56881"
            - "56881:56881/udp"
        networks:
            - traefik
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:7500/healthz || exit 1"]
            interval: 30s
            timeout: 10s
            start_period: 1m
            retries: 3
        logging: *logging
        command: "-c /frps.toml"

    # https://github.com/wollomatic/socket-proxy for Traefik and other read-only needs
    dockerproxy:
        <<: *socket-proxy
        container_name: dockerproxy
        command:
            - "-loglevel=info"
            - '-allowGET=(/v1\..{1,2})?/(version|info|containers/.*|events.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy:/socket/

    # Authelia - 2FA Authentication
    authelia:
        image: authelia/authelia:latest@sha256:a039d87fb842f0af4f83c03434f5fb6ec45d4b46e86b8b3ac571cc104bbe6e6d
        container_name: authelia
        user: "$MY_UID:$MY_UID"
        depends_on:
            authelia-db:
                condition: service_healthy
        volumes:
            - ../../../current_target/compose_live_state/authelia/config:/config
            - ../../../config/vps0/authelia/users_database.yml:/config/users_database.yml:ro
        configs:
          - source: authelia_configuration
            target: /config/configuration.yml
            uid: "$MY_UID"
            gid: "$MY_UID"
            mode: 0400
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.authelia.rule=Host(`auth.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.authelia.entryPoints=websecure"
            - "traefik.http.routers.authelia.tls.certresolver=le"
            - "traefik.http.routers.authelia.tls=true"
            - "traefik.http.routers.authelia.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
        expose:
            - 9091
        restart: unless-stopped
        mem_limit: 256M
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:9091/api/health || exit 1"]
            interval: 30s
            timeout: 10s
            start_period: 1m
            retries: 3
        logging: *logging

    authelia-db:
        image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        container_name: authelia-db
        user: "$MY_UID:$MY_UID"
        environment:
            - AUTHELIA_REDIS_PASSWORD=$AUTHELIA_REDIS_PASSWORD
        command: sh -c 'exec redis-server --requirepass "$$AUTHELIA_REDIS_PASSWORD"'
        volumes:
            - ../../../current_target/compose_live_state/authelia/db:/data
        networks:
            - traefik
        expose:
            - 6379
        restart: unless-stopped
        mem_limit: 128M
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$AUTHELIA_REDIS_PASSWORD\" --no-auth-warning ping || exit 1"]
            start_period: 1m
        logging: *logging

    # Traefik - Reverse Proxy
    traefik:
        image: traefik:v3
        container_name: traefik
        depends_on:
            dockerproxy:
                condition: service_started
            crowdsec:
                condition: service_started
        command:
            - "--api=true"
            - "--api.dashboard=true"
            - "--global.sendAnonymousUsage=false"
            - "--global.checkNewVersion=true"
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--accesslog.filePath=/var/log/traefik/access.log"
            - "--accesslog.format=json"
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--providers.file.filename=/etc/traefik/dynamic-configuration.yaml"
            - "--entryPoints.web=true"
            - "--entryPoints.web.address=:80"
            - "--entryPoints.websecure=true"
            - "--entryPoints.websecure.address=:443"
            - "--entryPoints.rtmp=true"
            - "--entryPoints.rtmp.address=:1935"
            - "--certificatesresolvers.le.acme.email=$DOMAIN_OWNER_EMAIL"
            - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
            # TLS-ALPN-01 avoids intercepting /.well-known/acme-challenge/ on :80,
            # letting srv0 cert-manager pass through the FRP tunnel.
            - "--certificatesresolvers.le.acme.tlsChallenge=true"
            - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
            - "--experimental.plugins.geoblock.version=v0.3.8"
            - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
            - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.version=v1.7.1"
            - "--providers.docker.endpoint=unix:///socket/docker.sock"
            - "--providers.docker.network=traefik"
        ports:
            - "80:80"
            - "443:443"
            - "1935:1935"
        volumes:
            - ../../../current_target/compose_live_state/traefik/acme:/acme
            - ../../../current_target/compose_live_state/traefik/logs:/var/log/traefik/
            - dockerproxy:/socket/:ro
        configs:
          - source: traefik_dynamic
            target: /etc/traefik/dynamic-configuration.yaml
            mode: 0440
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
            - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
            - "traefik.http.routers.traefik-dashboard.tls=true"
            - "traefik.http.routers.traefik-dashboard.service=api@internal"
            - "traefik.http.routers.traefik-dashboard.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.routers.catchall-redirect.rule=HostRegexp(`.+`)"
            - "traefik.http.routers.catchall-redirect.entrypoints=web"
            - "traefik.http.routers.catchall-redirect.priority=1"
            - "traefik.http.routers.catchall-redirect.middlewares=redirect-to-https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
        restart: unless-stopped
        mem_limit: 384M
        networks:
            - traefik
        logging: *logging

    # CrowdSec - Intrusion Prevention (LAPI + agent + AppSec in one container)
    crowdsec:
        image: crowdsecurity/crowdsec:latest@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
        container_name: crowdsec
        restart: unless-stopped
        mem_limit: 512M
        networks:
            - traefik
        expose:
            - 8080
            - 7422
            - 6060
        environment:
            - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
            - CUSTOM_HOSTNAME=crowdsec
            - BOUNCER_KEY_TRAEFIK=$CROWDSEC_BOUNCER_KEY
        volumes:
            - ../../../current_target/compose_live_state/crowdsec/config:/etc/crowdsec
            - ../../../current_target/compose_live_state/crowdsec/data:/var/lib/crowdsec/data
            - ../../../current_target/compose_live_state/traefik/logs:/var/log/traefik:ro
            - ./files/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
            - ./files/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
            - ./files/crowdsec/postoverflows/s01-whitelist/internal.yaml:/etc/crowdsec/postoverflows/s01-whitelist/internal.yaml:ro
        configs:
          - source: crowdsec_http_notifications
            target: /etc/crowdsec/notifications/http.yaml
            mode: 0400
          - source: crowdsec_plausible_whitelist
            target: /etc/crowdsec/postoverflows/s01-whitelist/plausible.yaml
            mode: 0440
          - source: crowdsec_webui_whitelist
            target: /etc/crowdsec/postoverflows/s01-whitelist/crowdsec-webui.yaml
            mode: 0440
        logging: *logging

    # CrowdSec Web UI - dashboard for the local LAPI (machine password auth)
    crowdsec_web_ui:
        image: ghcr.io/theduffman85/crowdsec-web-ui:2026.8.3
        container_name: crowdsec_web_ui
        restart: unless-stopped
        mem_limit: 512M
        user: "$MY_UID:$MY_UID"
        depends_on:
            - crowdsec
        environment:
            - CONFIG_INSTANCE_LAPI_URL=http://crowdsec:8080
            - CONFIG_INSTANCE_LAPI_AUTH_USERNAME=crowdsec-web-ui
            - CONFIG_INSTANCE_LAPI_AUTH_PASSWORD=$CROWDSEC_WEBUI_LAPI_PASSWORD
            - CONFIG_INSTANCE_METRICS_URL=http://crowdsec:6060/metrics
        volumes:
            - ../../../current_target/compose_live_state/crowdsec-web-ui/data:/app/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.crowdsec_web_ui.rule=Host(`crowdsec.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.crowdsec_web_ui.entrypoints=websecure"
            - "traefik.http.routers.crowdsec_web_ui.tls.certresolver=le"
            - "traefik.http.routers.crowdsec_web_ui.tls=true"
            - "traefik.http.routers.crowdsec_web_ui.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.crowdsec_web_ui.loadbalancer.server.port=3000"
        expose:
            - 3000
        networks:
            - traefik
        logging: *logging

    # Plausible - Web Analytics
    plausible_db:
        image: postgres:16-alpine
        container_name: plausible_db
        user: "$MY_UID:$MY_UID"
        restart: unless-stopped
        mem_limit: 512M
        volumes:
            - ../../../current_target/compose_live_state/plausible/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=$PLAUSIBLE_DB_PASSWORD
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            start_period: 1m
        networks:
            - traefik
        logging: *logging
    plausible_events_db:
        image: clickhouse/clickhouse-server:24.12-alpine
        restart: unless-stopped
        mem_limit: 3G
        container_name: plausible_events_db
        depends_on:
            state-fixperms:
                condition: service_completed_successfully
        networks:
            - traefik
        volumes:
            - ../../../current_target/compose_live_state/plausible/event_data:/var/lib/clickhouse
            - ../../../current_target/compose_live_state/plausible/event_logs:/var/log/clickhouse-server
            - ./files/plausible/clickhouse-config.xml:/etc/clickhouse-server/config.d/clickhouse-config.xml:ro
        environment:
            - CLICKHOUSE_SKIP_USER_SETUP=1
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
                ]
            start_period: 1m
        logging: *logging
    # One-shot: chowns the state dirs of the containers that run as a FIXED
    # non-MY_UID user (ClickHouse 101, Plausible 999) — self-heals ownership
    # drift (e.g. a host-side chown). Re-runs on every up after a down.
    state-fixperms:
        image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        container_name: state-fixperms
        restart: no
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
        security_opt:
            - no-new-privileges
        volumes:
            - ../../../current_target/compose_live_state/plausible/event_data:/var/lib/clickhouse
            - ../../../current_target/compose_live_state/plausible/event_logs:/var/log/clickhouse-server
            - ../../../current_target/compose_live_state/plausible/data:/var/lib/plausible
        command: chown -R 101:101 /var/lib/clickhouse /var/log/clickhouse-server && chown -R 999:999 /var/lib/plausible
    plausible:
        image: ghcr.io/plausible/community-edition:v3
        restart: unless-stopped
        mem_limit: 768M
        container_name: plausible
        command: sh -c "for i in \$(seq 1 30); do /entrypoint.sh db createdb 2>/dev/null && break; sleep 2; done && /entrypoint.sh db migrate && /entrypoint.sh run"
        depends_on:
            state-fixperms:
                condition: service_completed_successfully
            traefik:
                condition: service_started
            plausible_db:
                condition: service_healthy
            plausible_events_db:
                condition: service_healthy
        networks:
            - traefik
        volumes:
            - ../../../current_target/compose_live_state/plausible/data:/var/lib/plausible
        ulimits:
            nofile:
                soft: 65535
                hard: 65535
        environment:
            - BASE_URL=https://plausible.$BASE_SERVICES_DOMAIN
            - SECRET_KEY_BASE=$PLAUSIBLE_SECRET_KEY
            - TOTP_VAULT_KEY=$PLAUSIBLE_TOTP_VAULT_KEY
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.plausible.rule=Host(`plausible.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.plausible.entrypoints=websecure"
            - "traefik.http.routers.plausible.tls.certresolver=le"
            - "traefik.http.routers.plausible.tls=true"
            - "traefik.http.routers.plausible.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.plausible.loadbalancer.server.port=8000"
        logging: *logging

    # PixelNtfy - Tracking Pixels
    pixelntfy:
        container_name: pixelntfy
        image: imranrdev/pixel-ntfy:latest@sha256:b6facde3707bbacae686ac7de2b41ca9190fe52a0f828aa8fe8be0505d9118e3
        restart: unless-stopped
        mem_limit: 128M
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.pixelntfy.rule=Host(`pixelntfy.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.pixelntfy.entrypoints=websecure"
            - "traefik.http.routers.pixelntfy.tls.certresolver=le"
            - "traefik.http.routers.pixelntfy.tls=true"
            - "traefik.http.routers.pixelntfy.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.pixelntfy.loadbalancer.server.port=80"
        environment:
            - NTFY_TOPIC=$PIXELNTFY_TOPIC
            - NTFY_SERVER_URL=https://ntfy.sh
            - PORT=80
            - ANALYTICS_SCRIPT_ELEMENT=<script defer data-domain="pixelntfy.$CLOUD_SERVICES_DOMAIN" src="https://plausible.$BASE_SERVICES_DOMAIN/js/script.js"></script>
        networks:
            - traefik
        logging: *logging

    # ISBN Lookup
    isbn-lookup:
        container_name: isbn-lookup
        image: imranrdev/isbn-lookup:latest@sha256:d3132424eeec7d432fead4adddd501f519d972110578bbc719a96c41d3097ba9
        restart: unless-stopped
        mem_limit: 128M
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.isbn-lookup.rule=Host(`isbn.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.isbn-lookup.entrypoints=websecure"
            - "traefik.http.routers.isbn-lookup.tls.certresolver=le"
            - "traefik.http.routers.isbn-lookup.tls=true"
            - "traefik.http.routers.isbn-lookup.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.isbn-lookup.loadbalancer.server.port=80"
        environment:
            - PORT=80
            - ANALYTICS_SCRIPT_ELEMENT=<script defer data-domain="isbn.$CLOUD_SERVICES_DOMAIN" src="https://plausible.$BASE_SERVICES_DOMAIN/js/script.js"></script>
        networks:
            - traefik
        logging: *logging

    # MeTube - YouTube Downloader
    metube:
        image: ghcr.io/alexta69/metube:latest@sha256:397778fccf13d83adf9325fe813b260617a082d1772aff6d678c5b9256dd01fb
        container_name: metube
        volumes:
            - ../../../current_target/compose_live_state/metube:/downloads
        networks:
            - traefik
        depends_on:
            - traefik
        restart: unless-stopped
        mem_limit: 384M
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.metube.rule=Host(`ytdl.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.metube.entrypoints=websecure"
            - "traefik.http.routers.metube.tls.certresolver=le"
            - "traefik.http.routers.metube.tls=true"
            - "traefik.http.routers.metube.middlewares=crowdsec-bouncer@file,authelia@file"
            - "traefik.http.services.metube.loadbalancer.server.port=8081"
        logging: *logging

    # Obtainium Apps
    obtainium_apps:
        container_name: obtainium_apps
        image: imranrdev/apps.obtainium.imranr.dev:latest@sha256:79d00e798ffad260b563d8341ca1e93709ae6ca4274b181852bdd017560a0cd8
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.obtainium_apps.rule=Host(`apps.obtainium.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.obtainium_apps.entrypoints=websecure"
            - "traefik.http.routers.obtainium_apps.tls.certresolver=le"
            - "traefik.http.routers.obtainium_apps.tls=true"
            - "traefik.http.routers.obtainium_apps.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.obtainium_apps.loadbalancer.server.port=8080"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 192M
        logging: *logging

    # IKOM - Kitchen order manager
    ikom:
        container_name: ikom
        image: imranrdev/order-manager:latest@sha256:32b9961588be61da8775fe9dd8cb8446c9e9464b17df4ef0d2817d79c57f62f2
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.ikom.rule=Host(`ikom.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.ikom.entrypoints=websecure"
            - "traefik.http.routers.ikom.tls.certresolver=le"
            - "traefik.http.routers.ikom.tls=true"
            - "traefik.http.routers.ikom.middlewares=crowdsec-bouncer@file,authelia@file"
            - "traefik.http.routers.ikom-redirect.rule=Host(`ikom.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.ikom-redirect.entryPoints=websecure"
            - "traefik.http.routers.ikom-redirect.tls.certresolver=le"
            - "traefik.http.routers.ikom-redirect.tls=true"
            - "traefik.http.routers.ikom-redirect.middlewares=ikom-redirect-rewrite"
            - 'traefik.http.middlewares.ikom-redirect-rewrite.redirectregex.regex=^https://ikom\.$BASE_SERVICES_DOMAIN/(.*)'
            - 'traefik.http.middlewares.ikom-redirect-rewrite.redirectregex.replacement=https://ikom.$CLOUD_SERVICES_DOMAIN/$${1}'
            - 'traefik.http.middlewares.ikom-redirect-rewrite.redirectregex.permanent=true'
            - "traefik.http.services.ikom.loadbalancer.server.port=3000"
        volumes:
            - "../../../current_target/compose_live_state/ikom:/app/data"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 128M
        logging: *logging

    # CCT26 - Reddit + LLM tool
    cct26:
        container_name: cct26
        image: imranrdev/cct26:latest@sha256:a280a9651c9e43dd72e3df085c664be05ee8367d98e1b93e2d73947e484b65f1
        restart: unless-stopped
        mem_limit: 128M
        depends_on:
            - traefik
        volumes:
            - ../../../current_target/compose_live_state/cct26:/app/data
        environment:
            - REDDIT_COOKIE=$CCT26_REDDIT_COOKIE
            - LLM_BASE_URL=$CCT26_LLM_BASE_URL
            - LLM_MODEL=$CCT26_LLM_MODEL
            - LLM_API_KEY=$CCT26_LLM_API_KEY
            - NTFY_URL=$CCT26_NTFY_URL
            - NTFY_AUTH=$CCT26_NTFY_AUTH
            - SCRAPE_INTERVAL_HOURS=168
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.cct26.rule=Host(`cct26.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.cct26.entrypoints=websecure"
            - "traefik.http.routers.cct26.tls.certresolver=le"
            - "traefik.http.routers.cct26.tls=true"
            - "traefik.http.routers.cct26.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.cct26.loadbalancer.server.port=3000"
        networks:
            - traefik
        logging: *logging

    # Attention Game
    attentiongame:
        container_name: attentiongame
        image: imranrdev/attentiongame:latest@sha256:452f7e070aefdcf93339765ad40f04a3c755dd35365d399714519b82a2b2bd59
        user: "$MY_UID:$MY_UID"
        depends_on:
            - traefik
        volumes:
            - ../../../current_target/compose_live_state/attentiongame:/app/stories/private
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.attentiongame.rule=Host(`attentiongame.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.attentiongame.entrypoints=websecure"
            - "traefik.http.routers.attentiongame.tls.certresolver=le"
            - "traefik.http.routers.attentiongame.tls=true"
            - "traefik.http.routers.attentiongame.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.attentiongame.loadbalancer.server.port=3000"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 128M
        logging: *logging

    # Moving Sale - Moving Sale 2027
    moving-sale:
        container_name: moving-sale
        image: imranrdev/moving-sale-2027
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.moving-sale.rule=Host(`sale.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.moving-sale.entrypoints=websecure"
            - "traefik.http.routers.moving-sale.tls.certresolver=le"
            - "traefik.http.routers.moving-sale.tls=true"
            - "traefik.http.routers.moving-sale.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.moving-sale.loadbalancer.server.port=3000"
        environment:
            - ADMIN_PASSWORD=$MOVING_SALE_ADMIN_PASSWORD
            - CONTACT_EMAIL=$DOMAIN_OWNER_EMAIL
            - NTFY_URL=https://ntfy.home.$BASE_SERVICES_DOMAIN/moving_sale_2027
            - NTFY_AUTH=Bearer $NTFY_WRITE_ONLY_ACCOUNT_TOKEN
            - PICKUP_TEXT=$MOVING_SALE_PICKUP_TEXT
            - PLAUSIBLE_SCRIPT=$MOVING_SALE_PLAUSIBLE_SCRIPT_URL
        volumes:
            - ../../../current_target/compose_live_state/moving-sale/data:/app/data
            - ../../../current_target/compose_live_state/moving-sale/uploads:/app/uploads
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 128M
        logging: *logging

    # Owncast Auth - Token-based access control for Owncast viewer
    owncast-auth:
        image: python:3-alpine
        container_name: owncast-auth
        restart: unless-stopped
        mem_limit: 64M
        command: python3 /app/auth.py
        environment:
            - OWNCAST_ACCESS_TOKEN=$OWNCAST_ACCESS_TOKEN
        volumes:
            - ./files/owncast-auth/auth.py:/app/auth.py:ro
        networks:
            - traefik
        logging: *logging

    # Owncast - Live streaming server
    owncast:
        image: owncast/owncast:0.3.0
        container_name: owncast
        restart: unless-stopped
        mem_limit: 512M
        depends_on:
            - traefik
        volumes:
            - ../../../current_target/compose_live_state/owncast:/app/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.owncast.rule=Host(`owncast.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.owncast.entrypoints=websecure"
            - "traefik.http.routers.owncast.tls.certresolver=le"
            - "traefik.http.routers.owncast.tls=true"
            - "traefik.http.routers.owncast.middlewares=crowdsec-bouncer@file,owncast-auth,geoblock@file"
            - "traefik.http.middlewares.owncast-auth.forwardauth.address=http://owncast-auth:3000/"
            - "traefik.http.services.owncast.loadbalancer.server.port=8080"
            - "traefik.tcp.routers.owncast-rtmp.rule=HostSNI(`owncast.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.tcp.routers.owncast-rtmp.entrypoints=rtmp"
            - "traefik.tcp.routers.owncast-rtmp.service=owncast-rtmp"
            - "traefik.tcp.routers.owncast-rtmp.tls=true"
            - "traefik.tcp.routers.owncast-rtmp.tls.certresolver=le"
            - "traefik.tcp.services.owncast-rtmp.loadbalancer.server.port=1935"
        networks:
            - traefik
        logging: *logging

    # Logtfy - Log Monitoring and ntfy Alerting
    logtfy:
        image: imranrdev/logtfy:latest@sha256:5c501d62c914d2082be2276fafdef48e664437d71e0e2c7b89bc009f86f8244c
        container_name: logtfy
        hostname: $TARGET
        restart: unless-stopped
        mem_limit: 256M
        depends_on:
            - dockerproxy
        volumes:
            - /var/log/journal:/var/log/journal:ro
            - dockerproxy:/socket/:ro
        configs:
          - source: logtfy_config
            target: /logtfy/config.json
            mode: 0400
        environment:
            - DOCKER_HOST=unix:///socket/docker.sock
        logging: *logging

    # strelaysrv - Syncthing Relay Server
    strelaysrv:
        image: syncthing/relaysrv:latest@sha256:a3fa4279ea2aec918817ff54152b8f5d936e1576d95b06be8ffbdc06fd68a815
        container_name: strelaysrv
        restart: unless-stopped
        mem_limit: 128M
        volumes:
            - strelaysrv:/var/strelaysrv
        command:
            - "-global-rate=5000000"
            - "-provided-by=$STRELAYSRV_PROVIDED_BY"
        ports:
            - "22067:22067"
            - "22070:22070"
        logging: *logging

    # Shlink - URL Shortener
    shlink:
        image: shlinkio/shlink:stable@sha256:666cc24edf7290cca17019d2ef654c301695a646e2db82d4d116c3cd954d8232
        container_name: shlink
        environment:
            - SHORT_DOMAIN_HOST=ln.$BASE_SERVICES_DOMAIN
            - SHORT_DOMAIN_SCHEMA=https
            - DB_DRIVER=postgres
            - DB_HOST=shlink_db
            - DB_USER=postgres
            - DB_PASSWORD=$SHLINK_DB_PASSWORD
            - INITIAL_API_KEY=$SHLINK_API_KEY
            - GEOLITE_LICENSE_KEY=$GEOLITE_LICENSE_KEY
        networks:
            - traefik
        depends_on:
            - traefik
            - shlink_db
        restart: unless-stopped
        mem_limit: 512M
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.shlink.rule=Host(`ln.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.shlink.entrypoints=websecure"
            - "traefik.http.routers.shlink.tls.certresolver=le"
            - "traefik.http.routers.shlink.tls=true"
            - "traefik.http.routers.shlink.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.shlink.loadbalancer.server.port=8080"
        logging: *logging
    shlink_db:
        image: postgres:17-alpine
        container_name: shlink_db
        restart: unless-stopped
        user: "$MY_UID:$MY_UID"
        mem_limit: 256M
        volumes:
            - ../../../current_target/compose_live_state/shlink/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=$SHLINK_DB_PASSWORD
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            start_period: 1m
        networks:
            - traefik
        logging: *logging
    shlink_web_client:
        image: shlinkio/shlink-web-client:stable@sha256:dc8bf3565a25bd0602ff11ee352920830ce457ab58a2b2c62f2ebb23e8c8b9ee
        container_name: shlink_web_client
        environment:
            - SHLINK_SERVER_URL=https://ln.$BASE_SERVICES_DOMAIN
            - SHLINK_SERVER_NAME=ln.$BASE_SERVICES_DOMAIN
            - SHLINK_SERVER_API_KEY=$SHLINK_API_KEY
        networks:
            - traefik
        depends_on:
            - traefik
            - shlink
        restart: unless-stopped
        mem_limit: 64M
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.shlink_web_client.rule=Host(`ui.ln.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.shlink_web_client.entrypoints=websecure"
            - "traefik.http.routers.shlink_web_client.tls.certresolver=le"
            - "traefik.http.routers.shlink_web_client.tls=true"
            - "traefik.http.routers.shlink_web_client.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.shlink_web_client.loadbalancer.server.port=8080"
        logging: *logging

    # Dozzle - Docker container health/log viewer (headlamp equivalent for the
    # compose stack). Read-only: talks to the existing dockerproxy socket proxy
    # (GET rules only), so no write access to the docker socket is exposed.
    dozzle:
        image: amir20/dozzle:v11.0.1
        container_name: dozzle
        restart: unless-stopped
        mem_limit: 128M
        depends_on:
            - dockerproxy
        environment:
            - DOCKER_HOST=unix:///socket/docker.sock
            - DOZZLE_LEVEL=info
            - DOZZLE_ENABLE_ACTIONS=false
        volumes:
            - dockerproxy:/socket/:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.dozzle.rule=Host(`docker.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.dozzle.entrypoints=websecure"
            - "traefik.http.routers.dozzle.tls.certresolver=le"
            - "traefik.http.routers.dozzle.tls=true"
            - "traefik.http.routers.dozzle.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
        networks:
            - traefik
        logging: *logging

    # Uptime Kuma - Service Uptime Monitoring
    uptime:
        image: louislam/uptime-kuma:2
        container_name: uptime
        restart: unless-stopped
        mem_limit: 512M
        depends_on:
            - traefik
        environment:
            - PUID=$MY_UID
            - PGID=$MY_UID
        volumes:
            - ../../../current_target/compose_live_state/uptime:/app/data/
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.uptime.rule=Host(`uptime.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.uptime.entrypoints=websecure"
            - "traefik.http.routers.uptime.tls.certresolver=le"
            - "traefik.http.routers.uptime.tls=true"
            - "traefik.http.routers.uptime.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.uptime.loadbalancer.server.port=3001"
        networks:
            - traefik
        logging: *logging
        # If services are unreachable: ufw allow from 172.19.0.0/24 to any port 443 proto tcp

networks:
    traefik:
        name: traefik
        ipam:
            config:
                - subnet: 172.19.0.0/24

volumes:
    dockerproxy:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
    strelaysrv:
