name: vps0

x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

x-socket-proxy: &socket-proxy
    image: wollomatic/socket-proxy:1@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    read_only: true
    mem_limit: 128M
    cpus: 0.5
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges
    user: "65534:$DOCKER_GID"
    healthcheck:
        test: ["CMD", "./healthcheck"]
        interval: 10s
        timeout: 5s
        retries: 2
    logging: *logging

# Config files inlined so docker compose interpolates ${VARS} natively from
# config/vps0/compose.env (--env-file). Verbatim files live under ./files/,
# the public-exposure tunnel conf as a real 0600 file under
# ../../../config/vps0/public-exposure/.
configs:
    authelia_configuration:
        content: |
            jwt_secret: '${AUTHELIA_JWT_SECRET}'

            log:
              # Deliberate: logtfy parses the Authelia log for login notifications.
              level: debug

            totp:
              issuer: ${CLOUD_SERVICES_DOMAIN}

            authentication_backend:
              file:
                path: /config/users_database.yml

            access_control:
              default_policy: 'deny'
              # Admin catch-all below is two_factor (TOTP is Authelia's default second
              # factor); explicit one_factor rules (ytdl/ikom) intentionally stay 1FA.
              # Sale sites: public sale pages bypass Authelia; only /admin + /api/admin
              # require a login (any Authelia user).
              rules:
                - domain: auth.${CLOUD_SERVICES_DOMAIN}
                  policy: bypass
                - domain: ytdl.${CLOUD_SERVICES_DOMAIN}
                  policy: one_factor
                  subject:
                  - 'group:family'
                  - 'group:guests'
                - domain: ikom.${CLOUD_SERVICES_DOMAIN}
                  policy: one_factor
                  subject:
                  - 'group:family'
                - domain: times.${CLOUD_SERVICES_DOMAIN}
                  policy: one_factor
                  subject:
                  - 'group:jaan'
                - domain: tech.sale.${CLOUD_SERVICES_DOMAIN}
                  resources:
                  - '^/admin([/?].*)?$'
                  - '^/api/admin([/?].*)?$'
                  policy: one_factor
                - domain: tech.sale.${CLOUD_SERVICES_DOMAIN}
                  policy: bypass
                - domain: home.sale.${CLOUD_SERVICES_DOMAIN}
                  resources:
                  - '^/admin([/?].*)?$'
                  - '^/api/admin([/?].*)?$'
                  policy: one_factor
                - domain: home.sale.${CLOUD_SERVICES_DOMAIN}
                  policy: bypass
                - domain: sale.${CLOUD_SERVICES_DOMAIN}
                  resources:
                  - '^/admin([/?].*)?$'
                  - '^/api/admin([/?].*)?$'
                  policy: one_factor
                - domain: sale.${CLOUD_SERVICES_DOMAIN}
                  policy: bypass
                - domain: '*.${CLOUD_SERVICES_DOMAIN}'
                  policy: two_factor
                  subject:
                  - 'group:admins'

            session:
              secret: '${AUTHELIA_SESSION_SECRET}'
              cookies:
                - domain: ${CLOUD_SERVICES_DOMAIN}
                  authelia_url: https://auth.${CLOUD_SERVICES_DOMAIN}

              redis:
                host: authelia-db
                port: 6379
                password: '${AUTHELIA_REDIS_PASSWORD}'

            regulation:
              max_retries: 3
              find_time: 120
              ban_time: 3600

            storage:
              encryption_key: '${AUTHELIA_DB_ENCRYPTION_KEY}'
              local:
                path: /config/db.sqlite3

            notifier:
              filesystem:
                filename: /config/notification.txt

    traefik_dynamic:
        content: |
            http:
              middlewares:
                authelia:
                  forwardAuth:
                    address: http://authelia:9091/api/verify?rd=https://auth.${CLOUD_SERVICES_DOMAIN}/
                    maxResponseBodySize: 1048576
                    trustForwardHeader: true
                    authResponseHeaders:
                      - Remote-User
                      - Remote-Groups
                      - Remote-Name
                      - Remote-Email
                geoblock:
                  plugin:
                    geoblock:
                      silentStartUp: false
                      allowLocalRequests: true
                      logLocalRequests: false
                      logAllowedRequests: false
                      logApiRequests: false
                      api: "https://get.geojs.io/v1/ip/country/{ip}"
                      apiTimeoutMs: 750
                      cacheSize: 50000
                      forceMonthlyUpdate: true
                      allowUnknownCountries: false
                      unknownCountryApiResponse: "nil"
                      blackListMode: false
                      countries:
                        - CA
                        - TZ
                        - US
                        - GB
                crowdsec-bouncer:
                  plugin:
                    crowdsec-bouncer-traefik-plugin:
                      enabled: true
                      logLevel: INFO
                      crowdsecMode: stream
                      crowdsecLapiScheme: http
                      crowdsecLapiHost: crowdsec:8080
                      crowdsecLapiKey: ${CROWDSEC_BOUNCER_KEY}
                      crowdsecappsecenabled: true
                      crowdsecAppsecScheme: http
                      crowdsecAppsecHost: crowdsec:7422
                      crowdsecAppsecPath: "/"
                      forwardedheaderstrustedips:
                        - 127.0.0.1/32
                        - 173.245.48.0/20
                        - 103.21.244.0/22
                        - 103.22.200.0/22
                        - 103.31.4.0/22
                        - 141.101.64.0/18
                        - 108.162.192.0/18
                        - 190.93.240.0/20
                        - 188.114.96.0/20
                        - 197.234.240.0/22
                        - 198.41.128.0/17
                        - 162.158.0.0/15
                        - 104.16.0.0/13
                        - 104.24.0.0/14
                        - 172.64.0.0/13
                        - 131.0.72.0/22
                        - 2400:cb00::/32
                        - 2606:4700::/32
                        - 2803:f800::/32
                        - 2405:b500::/32
                        - 2405:8100::/32
                        - 2a06:98c0::/29
                        - 2c0f:f248::/32
              routers:
                http-to-public-exposure:
                  rule: "Host(`home.${BASE_SERVICES_DOMAIN}`) || Host(`*.home.${BASE_SERVICES_DOMAIN}`)"
                  entryPoints: [web]
                  service: http-public-exposure
                  priority: 100
              services:
                http-public-exposure:
                  loadBalancer:
                    servers:
                      - url: "http://10.99.0.2:80"

            tcp:
              serversTransports:
                public-exposure-proxy:
                  proxyProtocol:
                    version: 2
              routers:
                https-to-public-exposure:
                  rule: "HostSNI(`home.${BASE_SERVICES_DOMAIN}`) || HostSNI(`*.home.${BASE_SERVICES_DOMAIN}`)"
                  entryPoints: [websecure]
                  service: https-public-exposure
                  tls:
                    passthrough: true
              services:
                https-public-exposure:
                  loadBalancer:
                    serversTransport: public-exposure-proxy
                    servers:
                      - address: "10.99.0.2:8443"

    crowdsec_http_notifications:
        content: |
            type: http
            name: http_default
            log_level: debug
            format: |
              {{.|toJson}}
            url: https://ntfy.home.${BASE_SERVICES_DOMAIN}/${TARGET}_services_crowdsec
            method: POST
            headers:
              Authorization: Bearer ${NTFY_WRITE_ONLY_ACCOUNT_TOKEN}
              Title: CrowdSec on ${TARGET}
              Priority: min

    crowdsec_plausible_whitelist:
        content: |
            name: imranr/plausible
            description: "Whitelist for Plausible"
            whitelist:
              reason: "Plausible is a SPA: the dashboard fetches the stats API in bursts, tripping crawl scenarios"
              expression:
                - evt.Meta.target_fqdn == 'plausible.${BASE_SERVICES_DOMAIN}'
                - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
                - evt.Meta.http_verb == 'GET'
                - evt.Meta.http_path matches '^/api/.+'

    crowdsec_webui_whitelist:
        content: |
            name: imranr/crowdsec-webui
            description: "Whitelist for CrowdSec Web UI"
            whitelist:
              reason: "The web UI is a SPA: the dashboard fetches the API in bursts, tripping crawl scenarios"
              expression:
                - evt.Meta.target_fqdn == 'crowdsec.${CLOUD_SERVICES_DOMAIN}'
                - evt.Overflow.Alert.GetScenario() in ['crowdsecurity/http-probing', 'crowdsecurity/http-crawl-non_statics']
                - evt.Meta.http_verb == 'GET'
                - evt.Meta.http_path matches '^/api/.+'

    logtfy_config:
        content: |
            {
                "ntfyConfig": {
                    "configs": [
                        {
                            "id": "ntfy_home",
                            "host": "https://ntfy.home.${BASE_SERVICES_DOMAIN}",
                            "authHeader": "Bearer ${NTFY_WRITE_ONLY_ACCOUNT_TOKEN}",
                            "topicPrefix": "${TARGET}_services_"
                        },
                        {
                            "id": "ntfy_official",
                            "host": "https://ntfy.sh",
                            "authHeader": null,
                            "topicPrefix": "${NTFY_FALLBACK_TOPIC}"
                        }
                    ],
                    "defaultConfig": "ntfy_home",
                    "fallbackConfig": "ntfy_official"
                },
                "modulesEnabledByDefault": false,
                "moduleCustomization": [
                    {
                        "module": "ssh_logins",
                        "ntfyTopic": "logtfy",
                        "enabled": true,
                        "loggerArg": "ssh"
                    },
                    {
                        "module": "authelia_logins",
                        "ntfyTopic": "logtfy",
                        "enabled": true
                    },
                    {
                        "module": "generic_logs",
                        "moduleInstances": [
                            {
                                "name": "public_exposure_preboot",
                                "enabled": true,
                                "loggerArg": "public-exposure-watch stderr2stdout",
                                "parserArg": "{\"regex\":\"PREBOOT handshake\",\"title\":\"Public exposure: preboot client online\",\"message\":\"The LUKS-unlock tunnel just handshaked:\"}",
                                "ntfyTopic": "logtfy"
                            }
                        ]
                    }
                ]
            }

services:
    # Public-exposure hub (WireGuard): creates pubexp-server0 in the host netns
    # and maps the public service ports to the tunnel via kernel DNAT
    # (files/public-exposure/forwards.conf). Host effects are lifecycle-bound:
    # stopping the container removes the interface, DNAT and firewall rules.
    public-exposure-server-wg:
        image: lscr.io/linuxserver/wireguard:latest@sha256:e2f655e1956a6db476bc879bf721f3f8bfed49c6d8fbcf39495d7ecb991d8228
        container_name: public-exposure-server-wg
        restart: always
        network_mode: host
        cap_add:
            - NET_ADMIN
        volumes:
          - ../../../config/vps0/public-exposure/pubexp-server0.conf:/etc/wireguard/pubexp-server0.conf:ro
          - ./files/public-exposure/server-entrypoint.sh:/usr/local/bin/server-entrypoint.sh:ro
          - ./files/public-exposure/apply-forwards.sh:/usr/local/bin/apply-forwards.sh:ro
          - ./files/public-exposure/forwards.conf:/etc/public-exposure/forwards.conf:ro
        entrypoint: ["/bin/bash", "/usr/local/bin/server-entrypoint.sh"]
        healthcheck:
            test: ["CMD", "wg", "show", "pubexp-server0"]
            interval: 30s
            timeout: 10s
            start_period: 15s
            retries: 3
        logging: *logging

    # Prints one line per preboot-client handshake so logtfy can alert on it.
    public-exposure-watch:
        image: lscr.io/linuxserver/wireguard:latest@sha256:e2f655e1956a6db476bc879bf721f3f8bfed49c6d8fbcf39495d7ecb991d8228
        container_name: public-exposure-watch
        restart: unless-stopped
        network_mode: host
        cap_add:
            - NET_ADMIN
        volumes:
          - ./files/public-exposure/watch.sh:/usr/local/bin/watch.sh:ro
        entrypoint: ["/bin/bash", "/usr/local/bin/watch.sh"]
        mem_limit: 64M
        cpus: 0.25
        logging: *logging

    # https://github.com/wollomatic/socket-proxy for Traefik and other read-only needs
    dockerproxy:
        <<: *socket-proxy
        container_name: dockerproxy
        command:
            - "-loglevel=info"
            - '-allowGET=(/v1\..{1,2})?/(version|info|containers/.*|events.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy:/socket/

    # Authelia - 2FA Authentication
    authelia:
        image: authelia/authelia:latest@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
        container_name: authelia
        user: "$MY_UID:$MY_UID"
        depends_on:
            authelia-db:
                condition: service_healthy
        volumes:
            - ../../../current_target/compose_live_state/authelia/config:/config
            - ../../../config/vps0/authelia/users_database.yml:/config/users_database.yml:ro
        configs:
          - source: authelia_configuration
            target: /config/configuration.yml
            uid: "$MY_UID"
            gid: "$MY_UID"
            mode: 0400
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.authelia.rule=Host(`auth.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.authelia.entryPoints=websecure"
            - "traefik.http.routers.authelia.tls.certresolver=le"
            - "traefik.http.routers.authelia.tls=true"
            - "traefik.http.routers.authelia.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
        expose:
            - 9091
        restart: unless-stopped
        mem_limit: 256M
        cpus: 1.0
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:9091/api/health || exit 1"]
            interval: 30s
            timeout: 10s
            start_period: 1m
            retries: 3
        logging: *logging

    authelia-db:
        image: redis:alpine@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
        container_name: authelia-db
        user: "$MY_UID:$MY_UID"
        environment:
            - AUTHELIA_REDIS_PASSWORD=$AUTHELIA_REDIS_PASSWORD
        command: sh -c 'exec redis-server --requirepass "$$AUTHELIA_REDIS_PASSWORD"'
        volumes:
            - ../../../current_target/compose_live_state/authelia/db:/data
        networks:
            - traefik
        expose:
            - 6379
        restart: unless-stopped
        mem_limit: 128M
        cpus: 0.5
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$AUTHELIA_REDIS_PASSWORD\" --no-auth-warning ping || exit 1"]
            start_period: 1m
        logging: *logging

    # Traefik - Reverse Proxy
    traefik:
        image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
        container_name: traefik
        depends_on:
            dockerproxy:
                condition: service_started
            crowdsec:
                condition: service_started
        command:
            - "--api=true"
            - "--api.dashboard=true"
            - "--global.sendAnonymousUsage=false"
            - "--global.checkNewVersion=true"
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--accesslog.filePath=/var/log/traefik/access.log"
            - "--accesslog.format=json"
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--providers.file.filename=/etc/traefik/dynamic-configuration.yaml"
            - "--entryPoints.web=true"
            - "--entryPoints.web.address=:80"
            - "--entryPoints.websecure=true"
            - "--entryPoints.websecure.address=:443"
            - "--entryPoints.rtmp=true"
            - "--entryPoints.rtmp.address=:1935"
            # Cloudflare-proxied hostnames (plausible, obtainium_apps): restore the real
            # client IP from X-Forwarded-For so CrowdSec/logs never see CF edge IPs.
            - "--entryPoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
            - "--entryPoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
            - "--certificatesresolvers.le.acme.email=$DOMAIN_OWNER_EMAIL"
            - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
            # TLS-ALPN-01 avoids intercepting /.well-known/acme-challenge/ on :80,
            # letting srv0 cert-manager pass through the public-exposure tunnel.
            - "--certificatesresolvers.le.acme.tlsChallenge=true"
            - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
            - "--experimental.plugins.geoblock.version=v0.3.8"
            - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
            - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.version=v1.8.1"
            - "--providers.docker.endpoint=unix:///socket/docker.sock"
            - "--providers.docker.network=traefik"
        ports:
            - "80:80"
            - "443:443"
            - "1935:1935"
        volumes:
            - ../../../current_target/compose_live_state/traefik/acme:/acme
            - ../../../current_target/compose_live_state/traefik/logs:/var/log/traefik/
            - dockerproxy:/socket/:ro
        configs:
          - source: traefik_dynamic
            target: /etc/traefik/dynamic-configuration.yaml
            mode: 0440
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
            - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
            - "traefik.http.routers.traefik-dashboard.tls=true"
            - "traefik.http.routers.traefik-dashboard.service=api@internal"
            - "traefik.http.routers.traefik-dashboard.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.routers.catchall-redirect.rule=HostRegexp(`.+`)"
            - "traefik.http.routers.catchall-redirect.entrypoints=web"
            - "traefik.http.routers.catchall-redirect.priority=1"
            - "traefik.http.routers.catchall-redirect.middlewares=redirect-to-https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
        restart: unless-stopped
        mem_limit: 384M
        cpus: 2.0
        networks:
            - traefik
        logging: *logging

    # Traefik logrotate - caps the host-mounted access log (CrowdSec's acquisition source)
    traefik-logrotate:
        image: vitess/logrotate:latest@sha256:a65c0993f0d2564bd6aa7f211f31aa2d17d52476e1b31c50531cdd4b7e0c0e42
        container_name: traefik-logrotate
        restart: unless-stopped
        mem_limit: 64M
        cpus: 0.25
        volumes:
            - ../../../current_target/compose_live_state/traefik/logs:/var/log/traefik
            - ./files/logrotate/traefik-access.conf:/vt/logrotate.conf:ro
        logging: *logging

    # CrowdSec - Intrusion Prevention (LAPI + agent + AppSec in one container)
    crowdsec:
        image: crowdsecurity/crowdsec:latest@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
        container_name: crowdsec
        restart: unless-stopped
        mem_limit: 512M
        cpus: 1.0
        networks:
            - traefik
        expose:
            - 8080
            - 7422
            - 6060
        environment:
            - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
            - CUSTOM_HOSTNAME=crowdsec
            - BOUNCER_KEY_TRAEFIK=$CROWDSEC_BOUNCER_KEY
        volumes:
            - ../../../current_target/compose_live_state/crowdsec/config:/etc/crowdsec
            - ../../../current_target/compose_live_state/crowdsec/data:/var/lib/crowdsec/data
            - ../../../current_target/compose_live_state/traefik/logs:/var/log/traefik:ro
            - ./files/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
            - ./files/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
            - ./files/crowdsec/postoverflows/s01-whitelist/internal.yaml:/etc/crowdsec/postoverflows/s01-whitelist/internal.yaml:ro
        configs:
          - source: crowdsec_http_notifications
            target: /etc/crowdsec/notifications/http.yaml
            mode: 0400
          - source: crowdsec_plausible_whitelist
            target: /etc/crowdsec/postoverflows/s01-whitelist/plausible.yaml
            mode: 0440
          - source: crowdsec_webui_whitelist
            target: /etc/crowdsec/postoverflows/s01-whitelist/crowdsec-webui.yaml
            mode: 0440
        logging: *logging

    # CrowdSec Web UI - dashboard for the local LAPI (machine password auth)
    crowdsec_web_ui:
        image: ghcr.io/theduffman85/crowdsec-web-ui:2026.10.10
        container_name: crowdsec_web_ui
        restart: unless-stopped
        mem_limit: 512M
        cpus: 0.5
        user: "$MY_UID:$MY_UID"
        depends_on:
            - crowdsec
        environment:
            - CONFIG_INSTANCE_LAPI_URL=http://crowdsec:8080
            - CONFIG_INSTANCE_LAPI_AUTH_USERNAME=crowdsec-web-ui
            - CONFIG_INSTANCE_LAPI_AUTH_PASSWORD=$CROWDSEC_WEBUI_LAPI_PASSWORD
            - CONFIG_INSTANCE_METRICS_URL=http://crowdsec:6060/metrics
        volumes:
            - ../../../current_target/compose_live_state/crowdsec-web-ui/data:/app/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.crowdsec_web_ui.rule=Host(`crowdsec.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.crowdsec_web_ui.entrypoints=websecure"
            - "traefik.http.routers.crowdsec_web_ui.tls.certresolver=le"
            - "traefik.http.routers.crowdsec_web_ui.tls=true"
            - "traefik.http.routers.crowdsec_web_ui.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.crowdsec_web_ui.loadbalancer.server.port=3000"
        expose:
            - 3000
        networks:
            - traefik
        logging: *logging

    # Plausible - Web Analytics
    plausible_db:
        image: postgres:16-alpine
        container_name: plausible_db
        user: "$MY_UID:$MY_UID"
        restart: unless-stopped
        mem_limit: 512M
        cpus: 1.0
        volumes:
            - ../../../current_target/compose_live_state/plausible/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=$PLAUSIBLE_DB_PASSWORD
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            start_period: 1m
        networks:
            - traefik
        logging: *logging
    plausible_events_db:
        image: clickhouse/clickhouse-server:24.12-alpine
        restart: unless-stopped
        mem_limit: 4G
        cpus: 2.0
        container_name: plausible_events_db
        depends_on:
            state-fixperms:
                condition: service_completed_successfully
        networks:
            - traefik
        volumes:
            - ../../../current_target/compose_live_state/plausible/event_data:/var/lib/clickhouse
            - ../../../current_target/compose_live_state/plausible/event_logs:/var/log/clickhouse-server
            - ./files/plausible/clickhouse-config.xml:/etc/clickhouse-server/config.d/clickhouse-config.xml:ro
            - ./files/plausible/clickhouse-low-resources.xml:/etc/clickhouse-server/users.d/low-resources.xml:ro
        environment:
            - CLICKHOUSE_SKIP_USER_SETUP=1
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
                ]
            start_period: 1m
        logging: *logging
    # One-shot: chowns the state dirs of the containers that run as a FIXED
    # non-MY_UID user (ClickHouse 101, Plausible 999) — self-heals ownership
    # drift (e.g. a host-side chown). Re-runs on every up after a down.
    state-fixperms:
        image: alpine:latest@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
        container_name: state-fixperms
        restart: no
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
        security_opt:
            - no-new-privileges
        volumes:
            - ../../../current_target/compose_live_state/plausible/event_data:/var/lib/clickhouse
            - ../../../current_target/compose_live_state/plausible/event_logs:/var/log/clickhouse-server
            - ../../../current_target/compose_live_state/plausible/data:/var/lib/plausible
        command: chown -R 101:101 /var/lib/clickhouse /var/log/clickhouse-server && chown -R 999:999 /var/lib/plausible
    plausible:
        image: ghcr.io/plausible/community-edition:v3@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
        restart: unless-stopped
        mem_limit: 768M
        cpus: 1.0
        container_name: plausible
        command: sh -c "for i in \$(seq 1 30); do /entrypoint.sh db createdb 2>/dev/null && break; sleep 2; done && /entrypoint.sh db migrate && /entrypoint.sh run"
        depends_on:
            state-fixperms:
                condition: service_completed_successfully
            traefik:
                condition: service_started
            plausible_db:
                condition: service_healthy
            plausible_events_db:
                condition: service_healthy
        networks:
            - traefik
        volumes:
            - ../../../current_target/compose_live_state/plausible/data:/var/lib/plausible
        ulimits:
            nofile:
                soft: 65535
                hard: 65535
        environment:
            - BASE_URL=https://plausible.$BASE_SERVICES_DOMAIN
            - SECRET_KEY_BASE=$PLAUSIBLE_SECRET_KEY
            - TOTP_VAULT_KEY=$PLAUSIBLE_TOTP_VAULT_KEY
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.plausible.rule=Host(`plausible.$BASE_SERVICES_DOMAIN`) && !PathRegexp(`^/[^/]+/export`)"
            - "traefik.http.routers.plausible.entrypoints=websecure"
            - "traefik.http.routers.plausible.tls=true"
            - "traefik.http.routers.plausible.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.plausible.loadbalancer.server.port=8000"
        logging: *logging

