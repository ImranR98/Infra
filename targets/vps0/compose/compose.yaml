x-logging: &logging
    options:
        max-size: 10m
        max-file: 5

x-socket-proxy: &socket-proxy
    image: wollomatic/socket-proxy:1
    restart: unless-stopped
    read_only: true
    mem_limit: 512M
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges
    user: "65534:$DOCKER_GID"
    healthcheck:
        test: ["CMD", "./healthcheck"]
        interval: 10s
        timeout: 5s
        retries: 2
    logging: *logging

services:
    # FRP server - reverse proxy tunnel for home server
    frps:
        image: fatedier/frps:v0.71.0
        container_name: frps
        restart: always
        volumes:
          - $COMPOSE_STATE_DIR/frps/frps.toml:/frps.toml:ro
          - $COMPOSE_STATE_DIR/frps/server.crt:/etc/frp/server.crt:ro
          - $COMPOSE_STATE_DIR/frps/server.key:/etc/frp/server.key:ro
          - $COMPOSE_STATE_DIR/frps/ca.crt:/etc/frp/ca.crt:ro
        ports:
            - "7000:7000"
            - "8887:8887"
            - "8888:8888"
            - "56881:56881"
            - "56881:56881/udp"
        networks:
            - traefik
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:7500/healthz || exit 1"]
            interval: 30s
            timeout: 10s
            start_period: 1m
            retries: 3
        logging: *logging
        command: "-c /frps.toml"

    # https://github.com/wollomatic/socket-proxy for Traefik and other read-only needs
    dockerproxy:
        <<: *socket-proxy
        container_name: dockerproxy
        command:
            - "-loglevel=info"
            - '-allowGET=(/v1\..{1,2})?/(version|info|containers/.*|events.*)'
            - "-allowHEAD=/_ping"
            - "-shutdowngracetime=5"
            - "-watchdoginterval=600"
            - "-stoponwatchdog"
            - "-proxysocketendpoint=/socket/docker.sock"
            - "-proxysocketendpointfilemode=0600"
            - "-allowhealthcheck"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - dockerproxy:/socket/

    # Authelia - 2FA Authentication
    authelia:
        image: authelia/authelia:latest@sha256:936134132eaf01bfa2faf85055afbc1e0cc1cc5ca4547e9c06408fd0dd784646
        container_name: authelia
        user: "$MY_UID:$MY_UID"
        depends_on:
            authelia-db:
                condition: service_healthy
        volumes:
            - $COMPOSE_STATE_DIR/authelia/config:/config
        networks:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.authelia.rule=Host(`auth.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.authelia.entryPoints=websecure"
            - "traefik.http.routers.authelia.tls.certresolver=le"
            - "traefik.http.routers.authelia.tls=true"
            - "traefik.http.routers.authelia.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
        expose:
            - 9091
        restart: unless-stopped
        mem_limit: 2G
        healthcheck:
            test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:9091/api/health || exit 1"]
            interval: 30s
            timeout: 10s
            start_period: 1m
            retries: 3
        logging: *logging

    authelia-db:
        image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        container_name: authelia-db
        user: "$MY_UID:$MY_UID"
        volumes:
            - $COMPOSE_STATE_DIR/authelia/db:/data
        networks:
            - traefik
        expose:
            - 6379
        restart: unless-stopped
        mem_limit: 512M
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping || exit 1"]
            start_period: 1m
        logging: *logging

    # Traefik - Reverse Proxy
    traefik:
        image: traefik:v3
        container_name: traefik
        depends_on:
            dockerproxy:
                condition: service_started
            crowdsec:
                condition: service_started
        command:
            - "--api=true"
            - "--api.dashboard=true"
            - "--global.sendAnonymousUsage=false"
            - "--global.checkNewVersion=true"
            - "--log.level=INFO"
            - "--accesslog=true"
            - "--accesslog.filePath=/var/log/traefik/access.log"
            - "--accesslog.format=json"
            - "--providers.docker=true"
            - "--providers.docker.exposedByDefault=false"
            - "--providers.file.filename=/etc/traefik/dynamic-configuration.yaml"
            - "--entryPoints.web=true"
            - "--entryPoints.web.address=:80"
            - "--entryPoints.websecure=true"
            - "--entryPoints.websecure.address=:443"
            - "--entryPoints.rtmp=true"
            - "--entryPoints.rtmp.address=:1935"
            - "--certificatesresolvers.le.acme.email=$DOMAIN_OWNER_EMAIL"
            - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
            # TLS-ALPN-01 avoids intercepting /.well-known/acme-challenge/ on :80,
            # letting srv0 cert-manager pass through the FRP tunnel.
            - "--certificatesresolvers.le.acme.tlsChallenge=true"
            - "--experimental.plugins.geoblock.modulename=github.com/PascalMinder/geoblock"
            - "--experimental.plugins.geoblock.version=v0.3.8"
            - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
            - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.version=v1.7.1"
            - "--providers.docker.endpoint=unix:///socket/docker.sock"
            - "--providers.docker.network=traefik"
        ports:
            - "80:80"
            - "443:443"
            - "1935:1935"
        volumes:
            - $COMPOSE_STATE_DIR/traefik/acme:/acme
            - $COMPOSE_STATE_DIR/traefik/dynamic-configuration.yaml:/etc/traefik/dynamic-configuration.yaml
            - $COMPOSE_STATE_DIR/traefik/logs:/var/log/traefik/
            - dockerproxy:/socket/:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
            - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
            - "traefik.http.routers.traefik-dashboard.tls=true"
            - "traefik.http.routers.traefik-dashboard.service=api@internal"
            - "traefik.http.routers.traefik-dashboard.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.routers.catchall-redirect.rule=HostRegexp(`.+`)"
            - "traefik.http.routers.catchall-redirect.entrypoints=web"
            - "traefik.http.routers.catchall-redirect.priority=1"
            - "traefik.http.routers.catchall-redirect.middlewares=redirect-to-https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
        restart: unless-stopped
        mem_limit: 2G
        networks:
            - traefik
        logging: *logging

    # CrowdSec - Intrusion Prevention (LAPI + agent + AppSec in one container)
    crowdsec:
        image: crowdsecurity/crowdsec:latest@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
        container_name: crowdsec
        restart: unless-stopped
        mem_limit: 2G
        networks:
            - traefik
        expose:
            - 8080
            - 7422
        environment:
            - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
            - CUSTOM_HOSTNAME=crowdsec
            - BOUNCER_KEY_TRAEFIK=$CROWDSEC_BOUNCER_KEY
        volumes:
            - $COMPOSE_STATE_DIR/crowdsec/config:/etc/crowdsec
            - $COMPOSE_STATE_DIR/crowdsec/data:/var/lib/crowdsec/data
            - $COMPOSE_STATE_DIR/traefik/logs:/var/log/traefik:ro
            - $COMPOSE_STATE_DIR/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
            - $COMPOSE_STATE_DIR/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
            - $COMPOSE_STATE_DIR/crowdsec/notifications/http.yaml:/etc/crowdsec/notifications/http.yaml:ro
            - $COMPOSE_STATE_DIR/crowdsec/postoverflows/s01-whitelist/internal.yaml:/etc/crowdsec/postoverflows/s01-whitelist/internal.yaml:ro
            - $COMPOSE_STATE_DIR/crowdsec/postoverflows/s01-whitelist/plausible.yaml:/etc/crowdsec/postoverflows/s01-whitelist/plausible.yaml:ro
        logging: *logging

    # Plausible - Web Analytics
    plausible_db:
        image: postgres:16-alpine
        container_name: plausible_db
        user: "$MY_UID:$MY_UID"
        restart: unless-stopped
        mem_limit: 8G
        volumes:
            - $COMPOSE_STATE_DIR/plausible/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=$PLAUSIBLE_DB_PASSWORD
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            start_period: 1m
        networks:
            - traefik
        logging: *logging
    plausible_events_db:
        image: clickhouse/clickhouse-server:24.12-alpine
        restart: unless-stopped
        mem_limit: 8G
        container_name: plausible_events_db
        networks:
            - traefik
        volumes:
            - $COMPOSE_STATE_DIR/plausible/event_data:/var/lib/clickhouse
            - $COMPOSE_STATE_DIR/plausible/event_logs:/var/log/clickhouse-server
            - $COMPOSE_STATE_DIR/plausible/config/clickhouse-config.xml:/etc/clickhouse-server/config.d/clickhouse-config.xml:ro
        environment:
            - CLICKHOUSE_SKIP_USER_SETUP=1
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
                ]
            start_period: 1m
        logging: *logging
    plausible-init:
        image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        container_name: plausible-init
        restart: no
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - FOWNER
        security_opt:
            - no-new-privileges
        volumes:
            - $COMPOSE_STATE_DIR/plausible/data:/var/lib/plausible
        command: chown -R 999:999 /var/lib/plausible
    plausible:
        image: ghcr.io/plausible/community-edition:v3
        restart: unless-stopped
        mem_limit: 8G
        container_name: plausible
        command: sh -c "for i in \$(seq 1 30); do /entrypoint.sh db createdb 2>/dev/null && break; sleep 2; done && /entrypoint.sh db migrate && /entrypoint.sh run"
        depends_on:
            plausible-init:
                condition: service_completed_successfully
            traefik:
                condition: service_started
            plausible_db:
                condition: service_healthy
            plausible_events_db:
                condition: service_healthy
        networks:
            - traefik
        volumes:
            - $COMPOSE_STATE_DIR/plausible/data:/var/lib/plausible
        ulimits:
            nofile:
                soft: 65535
                hard: 65535
        environment:
            - BASE_URL=https://plausible.$BASE_SERVICES_DOMAIN
            - SECRET_KEY_BASE=$PLAUSIBLE_SECRET_KEY
            - TOTP_VAULT_KEY=$PLAUSIBLE_TOTP_VAULT_KEY
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.plausible.rule=Host(`plausible.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.plausible.entrypoints=websecure"
            - "traefik.http.routers.plausible.tls.certresolver=le"
            - "traefik.http.routers.plausible.tls=true"
            - "traefik.http.routers.plausible.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.plausible.loadbalancer.server.port=8000"
        logging: *logging

    # PixelNtfy - Tracking Pixels
    pixelntfy:
        container_name: pixelntfy
        image: imranrdev/pixel-ntfy:latest@sha256:b6facde3707bbacae686ac7de2b41ca9190fe52a0f828aa8fe8be0505d9118e3
        restart: unless-stopped
        mem_limit: 512M
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.pixelntfy.rule=Host(`pixelntfy.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.pixelntfy.entrypoints=websecure"
            - "traefik.http.routers.pixelntfy.tls.certresolver=le"
            - "traefik.http.routers.pixelntfy.tls=true"
            - "traefik.http.routers.pixelntfy.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.pixelntfy.loadbalancer.server.port=80"
        environment:
            - NTFY_TOPIC=$PIXELNTFY_TOPIC
            - NTFY_SERVER_URL=https://ntfy.sh
            - PORT=80
            - ANALYTICS_SCRIPT_ELEMENT=<script defer data-domain="pixelntfy.$CLOUD_SERVICES_DOMAIN" src="https://plausible.$BASE_SERVICES_DOMAIN/js/script.js"></script>
        networks:
            - traefik
        logging: *logging

    # ISBN Lookup
    isbn-lookup:
        container_name: isbn-lookup
        image: imranrdev/isbn-lookup:latest@sha256:d3132424eeec7d432fead4adddd501f519d972110578bbc719a96c41d3097ba9
        restart: unless-stopped
        mem_limit: 512M
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.isbn-lookup.rule=Host(`isbn.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.isbn-lookup.entrypoints=websecure"
            - "traefik.http.routers.isbn-lookup.tls.certresolver=le"
            - "traefik.http.routers.isbn-lookup.tls=true"
            - "traefik.http.routers.isbn-lookup.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.isbn-lookup.loadbalancer.server.port=80"
        environment:
            - PORT=80
            - ANALYTICS_SCRIPT_ELEMENT=<script defer data-domain="isbn.$CLOUD_SERVICES_DOMAIN" src="https://plausible.$BASE_SERVICES_DOMAIN/js/script.js"></script>
        networks:
            - traefik
        logging: *logging

    # MeTube - YouTube Downloader
    metube:
        image: ghcr.io/alexta69/metube:latest@sha256:397778fccf13d83adf9325fe813b260617a082d1772aff6d678c5b9256dd01fb
        container_name: metube
        volumes:
            - $COMPOSE_STATE_DIR/metube:/downloads
        networks:
            - traefik
        depends_on:
            - traefik
        restart: unless-stopped
        mem_limit: 2G
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.metube.rule=Host(`ytdl.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.metube.entrypoints=websecure"
            - "traefik.http.routers.metube.tls.certresolver=le"
            - "traefik.http.routers.metube.tls=true"
            - "traefik.http.routers.metube.middlewares=crowdsec-bouncer@file,authelia@file"
            - "traefik.http.services.metube.loadbalancer.server.port=8081"
        logging: *logging

    # Obtainium Apps
    obtainium_apps:
        container_name: obtainium_apps
        image: imranrdev/apps.obtainium.imranr.dev:latest@sha256:79d00e798ffad260b563d8341ca1e93709ae6ca4274b181852bdd017560a0cd8
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.obtainium_apps.rule=Host(`apps.obtainium.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.obtainium_apps.entrypoints=websecure"
            - "traefik.http.routers.obtainium_apps.tls.certresolver=le"
            - "traefik.http.routers.obtainium_apps.tls=true"
            - "traefik.http.routers.obtainium_apps.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.obtainium_apps.loadbalancer.server.port=8080"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 512M
        logging: *logging

    # IKOM - Kitchen order manager
    ikom:
        container_name: ikom
        image: imranrdev/order-manager:latest@sha256:32b9961588be61da8775fe9dd8cb8446c9e9464b17df4ef0d2817d79c57f62f2
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.ikom.rule=Host(`ikom.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.ikom.entrypoints=websecure"
            - "traefik.http.routers.ikom.tls.certresolver=le"
            - "traefik.http.routers.ikom.tls=true"
            - "traefik.http.routers.ikom.middlewares=crowdsec-bouncer@file,authelia@file"
            - "traefik.http.routers.ikom-redirect.rule=Host(`ikom.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.ikom-redirect.entryPoints=websecure"
            - "traefik.http.routers.ikom-redirect.tls.certresolver=le"
            - "traefik.http.routers.ikom-redirect.tls=true"
            - "traefik.http.routers.ikom-redirect.middlewares=ikom-redirect-rewrite"
            - 'traefik.http.middlewares.ikom-redirect-rewrite.redirectregex.regex=^https://ikom\.$BASE_SERVICES_DOMAIN/(.*)'
            - 'traefik.http.middlewares.ikom-redirect-rewrite.redirectregex.replacement=https://ikom.$CLOUD_SERVICES_DOMAIN/$${1}'
            - 'traefik.http.middlewares.ikom-redirect-rewrite.redirectregex.permanent=true'
            - "traefik.http.services.ikom.loadbalancer.server.port=3000"
        volumes:
            - "$COMPOSE_STATE_DIR/ikom:/app/data"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 2G
        logging: *logging

    # CCT26 - Reddit + LLM tool
    cct26:
        container_name: cct26
        image: imranrdev/cct26:latest@sha256:a280a9651c9e43dd72e3df085c664be05ee8367d98e1b93e2d73947e484b65f1
        restart: unless-stopped
        mem_limit: 2G
        depends_on:
            - traefik
        volumes:
            - $COMPOSE_STATE_DIR/cct26:/app/data
        environment:
            - REDDIT_COOKIE=$CCT26_REDDIT_COOKIE
            - LLM_BASE_URL=$CCT26_LLM_BASE_URL
            - LLM_MODEL=$CCT26_LLM_MODEL
            - LLM_API_KEY=$CCT26_LLM_API_KEY
            - NTFY_URL=$CCT26_NTFY_URL
            - NTFY_AUTH=$CCT26_NTFY_AUTH
            - SCRAPE_INTERVAL_HOURS=168
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.cct26.rule=Host(`cct26.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.cct26.entrypoints=websecure"
            - "traefik.http.routers.cct26.tls.certresolver=le"
            - "traefik.http.routers.cct26.tls=true"
            - "traefik.http.routers.cct26.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.cct26.loadbalancer.server.port=3000"
        networks:
            - traefik
        logging: *logging

    # Attention Game
    attentiongame:
        container_name: attentiongame
        image: imranrdev/attentiongame:latest@sha256:452f7e070aefdcf93339765ad40f04a3c755dd35365d399714519b82a2b2bd59
        user: "$MY_UID:$MY_UID"
        depends_on:
            - traefik
        volumes:
            - $COMPOSE_STATE_DIR/attentiongame:/app/stories/private
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.attentiongame.rule=Host(`attentiongame.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.attentiongame.entrypoints=websecure"
            - "traefik.http.routers.attentiongame.tls.certresolver=le"
            - "traefik.http.routers.attentiongame.tls=true"
            - "traefik.http.routers.attentiongame.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.attentiongame.loadbalancer.server.port=3000"
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 512M
        logging: *logging

    # Moving Sale - Moving Sale 2027
    moving-sale:
        container_name: moving-sale
        image: imranrdev/moving-sale-2027
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.moving-sale.rule=Host(`sale.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.moving-sale.entrypoints=websecure"
            - "traefik.http.routers.moving-sale.tls.certresolver=le"
            - "traefik.http.routers.moving-sale.tls=true"
            - "traefik.http.routers.moving-sale.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.moving-sale.loadbalancer.server.port=3000"
        environment:
            - ADMIN_PASSWORD=$MOVING_SALE_ADMIN_PASSWORD
            - CONTACT_EMAIL=$DOMAIN_OWNER_EMAIL
            - NTFY_URL=https://ntfy.home.$BASE_SERVICES_DOMAIN/moving_sale_2027
            - NTFY_AUTH=Bearer $NTFY_WRITE_ONLY_ACCOUNT_TOKEN
            - PICKUP_TEXT=$MOVING_SALE_PICKUP_TEXT
            - PLAUSIBLE_SCRIPT=$MOVING_SALE_PLAUSIBLE_SCRIPT_URL
        volumes:
            - $COMPOSE_STATE_DIR/moving-sale/data:/app/data
            - $COMPOSE_STATE_DIR/moving-sale/uploads:/app/uploads
        networks:
            - traefik
        restart: unless-stopped
        mem_limit: 512M
        logging: *logging

    # Owncast Auth - Token-based access control for Owncast viewer
    owncast-auth:
        image: python:3-alpine
        container_name: owncast-auth
        restart: unless-stopped
        mem_limit: 64M
        command: python3 /app/auth.py
        environment:
            - OWNCAST_ACCESS_TOKEN=$OWNCAST_ACCESS_TOKEN
        volumes:
            - $COMPOSE_STATE_DIR/owncast-auth/auth.py:/app/auth.py:ro
        networks:
            - traefik
        logging: *logging

    # Owncast - Live streaming server
    owncast:
        image: owncast/owncast:0.3.0
        container_name: owncast
        restart: unless-stopped
        mem_limit: 2G
        depends_on:
            - traefik
        volumes:
            - $COMPOSE_STATE_DIR/owncast:/app/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.owncast.rule=Host(`owncast.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.owncast.entrypoints=websecure"
            - "traefik.http.routers.owncast.tls.certresolver=le"
            - "traefik.http.routers.owncast.tls=true"
            - "traefik.http.routers.owncast.middlewares=crowdsec-bouncer@file,owncast-auth,geoblock@file"
            - "traefik.http.middlewares.owncast-auth.forwardauth.address=http://owncast-auth:3000/"
            - "traefik.http.services.owncast.loadbalancer.server.port=8080"
            - "traefik.tcp.routers.owncast-rtmp.rule=HostSNI(`owncast.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.tcp.routers.owncast-rtmp.entrypoints=rtmp"
            - "traefik.tcp.routers.owncast-rtmp.service=owncast-rtmp"
            - "traefik.tcp.routers.owncast-rtmp.tls=true"
            - "traefik.tcp.routers.owncast-rtmp.tls.certresolver=le"
            - "traefik.tcp.services.owncast-rtmp.loadbalancer.server.port=1935"
        networks:
            - traefik
        logging: *logging

    # Logtfy - Log Monitoring and ntfy Alerting
    logtfy:
        image: imranrdev/logtfy:latest@sha256:c234a89fe4969806c28b972509c3575ff2595f77ba4b3f1def540a7a2b0b07bd
        container_name: logtfy
        hostname: $TARGET
        restart: unless-stopped
        mem_limit: 2G
        depends_on:
            - dockerproxy
        volumes:
            - $COMPOSE_STATE_DIR/logtfy/config.json:/logtfy/config.json:ro
            - /var/log/journal:/var/log/journal:ro
            - dockerproxy:/socket/:ro
        environment:
            - DOCKER_HOST=unix:///socket/docker.sock
        logging: *logging

    # strelaysrv - Syncthing Relay Server
    strelaysrv:
        image: syncthing/relaysrv:latest@sha256:04659c950fe54e02420dd1c5c9a1b496bebe46b23b6af4aed712b64272d5dd6d
        container_name: strelaysrv
        restart: unless-stopped
        mem_limit: 2G
        volumes:
            - strelaysrv:/var/strelaysrv
        command:
            - "-global-rate=5000000"
            - "-provided-by=$STRELAYSRV_PROVIDED_BY"
        ports:
            - "22067:22067"
            - "22070:22070"
        logging: *logging

    # Shlink - URL Shortener
    shlink:
        image: shlinkio/shlink:stable@sha256:666cc24edf7290cca17019d2ef654c301695a646e2db82d4d116c3cd954d8232
        container_name: shlink
        environment:
            - SHORT_DOMAIN_HOST=ln.$BASE_SERVICES_DOMAIN
            - SHORT_DOMAIN_SCHEMA=https
            - DB_DRIVER=postgres
            - DB_HOST=shlink_db
            - DB_USER=postgres
            - DB_PASSWORD=$SHLINK_DB_PASSWORD
            - INITIAL_API_KEY=$SHLINK_API_KEY
            - GEOLITE_LICENSE_KEY=$GEOLITE_LICENSE_KEY
        networks:
            - traefik
        depends_on:
            - traefik
            - shlink_db
        restart: unless-stopped
        mem_limit: 2G
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.shlink.rule=Host(`ln.$BASE_SERVICES_DOMAIN`)"
            - "traefik.http.routers.shlink.entrypoints=websecure"
            - "traefik.http.routers.shlink.tls.certresolver=le"
            - "traefik.http.routers.shlink.tls=true"
            - "traefik.http.routers.shlink.middlewares=crowdsec-bouncer@file"
            - "traefik.http.services.shlink.loadbalancer.server.port=8080"
        logging: *logging
    shlink_db:
        image: postgres:17-alpine
        container_name: shlink_db
        restart: unless-stopped
        user: "$MY_UID:$MY_UID"
        mem_limit: 2G
        volumes:
            - $COMPOSE_STATE_DIR/shlink/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_PASSWORD=$SHLINK_DB_PASSWORD
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            start_period: 1m
        networks:
            - traefik
        logging: *logging
    shlink_web_client:
        image: shlinkio/shlink-web-client:stable@sha256:dc8bf3565a25bd0602ff11ee352920830ce457ab58a2b2c62f2ebb23e8c8b9ee
        container_name: shlink_web_client
        environment:
            - SHLINK_SERVER_URL=https://ln.$BASE_SERVICES_DOMAIN
            - SHLINK_SERVER_NAME=ln.$BASE_SERVICES_DOMAIN
            - SHLINK_SERVER_API_KEY=$SHLINK_API_KEY
        networks:
            - traefik
        depends_on:
            - traefik
            - shlink
        restart: unless-stopped
        mem_limit: 512M
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.shlink_web_client.rule=Host(`ui.ln.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.shlink_web_client.entrypoints=websecure"
            - "traefik.http.routers.shlink_web_client.tls.certresolver=le"
            - "traefik.http.routers.shlink_web_client.tls=true"
            - "traefik.http.routers.shlink_web_client.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.shlink_web_client.loadbalancer.server.port=8080"
        logging: *logging

    # Dozzle - Docker container health/log viewer (headlamp equivalent for the
    # compose stack). Read-only: talks to the existing dockerproxy socket proxy
    # (GET rules only), so no write access to the docker socket is exposed.
    dozzle:
        image: amir20/dozzle:v10.10.0
        container_name: dozzle
        restart: unless-stopped
        mem_limit: 512M
        depends_on:
            - dockerproxy
        environment:
            - DOCKER_HOST=unix:///socket/docker.sock
            - DOZZLE_LEVEL=info
            - DOZZLE_ENABLE_ACTIONS=false
        volumes:
            - dockerproxy:/socket/:ro
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.dozzle.rule=Host(`docker.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.dozzle.entrypoints=websecure"
            - "traefik.http.routers.dozzle.tls.certresolver=le"
            - "traefik.http.routers.dozzle.tls=true"
            - "traefik.http.routers.dozzle.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
        networks:
            - traefik
        logging: *logging

    # Uptime Kuma - Service Uptime Monitoring
    uptime:
        image: louislam/uptime-kuma:2
        container_name: uptime
        restart: unless-stopped
        mem_limit: 2G
        depends_on:
            - traefik
        environment:
            - PUID=$MY_UID
            - PGID=$MY_UID
        volumes:
            - $COMPOSE_STATE_DIR/uptime:/app/data/
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.uptime.rule=Host(`uptime.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.uptime.entrypoints=websecure"
            - "traefik.http.routers.uptime.tls.certresolver=le"
            - "traefik.http.routers.uptime.tls=true"
            - "traefik.http.routers.uptime.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            - "traefik.http.services.uptime.loadbalancer.server.port=3001"
        networks:
            - traefik
        logging: *logging
        # If services are unreachable: ufw allow from 172.19.0.0/24 to any port 443 proto tcp

networks:
    traefik:
        name: traefik
        ipam:
            config:
                - subnet: 172.19.0.0/24

volumes:
    dockerproxy:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=1k,uid=65534,gid=0,mode=0700,noexec
    strelaysrv:
