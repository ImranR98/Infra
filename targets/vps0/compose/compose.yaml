        logging: *logging

    # IKOM - Kitchen order manager
    ikom:
        container_name: ikom
        image: ghcr.io/imranr98/order-manager:latest@sha256:7e395d77b5754bd428c4a561416c7042d97d49356ba0e065d89e5da94d6d0784
        depends_on:
            - traefik
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.ikom.rule=Host(`ikom.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.ikom.entrypoints=websecure"
            - "traefik.http.routers.ikom.tls.certresolver=le"
