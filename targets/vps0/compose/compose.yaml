    our-times:
        container_name: our-times
        image: ghcr.io/imranr98/our-times:latest@sha256:bf2e75e3056928acd83156dd21f774d934ca723ae998f4803e73852021e62862
        user: "$MY_UID:$MY_UID"
        depends_on:
            - traefik
        environment:
            - PORT=3000
            - PUBLIC_URL=https://times.$CLOUD_SERVICES_DOMAIN
        volumes:
            - ../../../current_target/compose_live_state/our-times:/app/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.our-times.rule=Host(`times.$CLOUD_SERVICES_DOMAIN`)"
            - "traefik.http.routers.our-times.entrypoints=websecure"
            - "traefik.http.routers.our-times.tls.certresolver=le"
            - "traefik.http.routers.our-times.tls=true"
            - "traefik.http.routers.our-times.middlewares=crowdsec-bouncer@file,authelia@file,geoblock@file"
            # PWA shell assets must be fetchable without SSO (browsers request the
            # manifest/service worker without credentials); the app serves them
            # header-free and only caches static files.
            - "traefik.http.routers.our-times-static.rule=Host(`times.$CLOUD_SERVICES_DOMAIN`) && (Path(`/manifest.webmanifest`) || Path(`/sw.js`) || Path(`/offline.html`) || PathPrefix(`/icons/`))"
            - "traefik.http.routers.our-times-static.entrypoints=websecure"
            - "traefik.http.routers.our-times-static.tls.certresolver=le"
            - "traefik.http.routers.our-times-static.tls=true"
            - "traefik.http.routers.our-times-static.middlewares=crowdsec-bouncer@file,geoblock@file"
            - "traefik.http.routers.our-times-static.priority=100"
            - "traefik.http.routers.our-times-static.service=our-times"
            - "traefik.http.services.our-times.loadbalancer.server.port=3000"
        networks:
