# Public-exposure port mappings, applied by apply-forwards.sh inside the
# public-exposure-server-wg container. Format:
#   <tcp|udp> <public_port> <tunnel_ip> <target_port> [masq]
# Add "masq" when the target's reply would leave via its own default route
# instead of the tunnel (host-network services/preboot): the source is then
# SNAT'd to the hub so replies come back through the tunnel. Leave it off for
# targets whose own default route is the tunnel (qBittorrent) so the real
# client IP survives.
# Add a mapping, then restart public-exposure-server-wg to apply it.
tcp 8887   10.99.0.4 22      masq  # public-exposure-preboot-client-wg (initramfs SSH)
tcp 56881  10.99.0.3 56881         # qbittorrent-wg peers (real source IP)
udp 56881  10.99.0.3 56881         # qbittorrent-wg peers (real source IP)
udp 51820  10.99.0.2 51830   masq  # remote-access-amneziawg user VPN
