# Lines ending with 'IGNORE INITIALLY' are commented-out on first copy
# (skips 'bypass' policies until accounts are configured).  Included on
# subsequent updates.

jwt_secret: '$AUTHELIA_JWT_SECRET'

log:
  level: debug

totp:
  issuer: $SERVICES_DOMAIN

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: 'deny'
  rules:
    - domain: $TARGET.$SERVICES_DOMAIN
      policy: bypass
    - domain: pixelntfy.$SERVICES_DOMAIN
      policy: bypass
    - domain: isbn.$SERVICES_DOMAIN
      policy: bypass
    - domain: sb25.$SERVICES_DOMAIN
      policy: bypass
    - domain: ln.$SERVICES_DOMAIN
      policy: bypass
    - domain: plausible.$SERVICES_DOMAIN # IGNORE INITIALLY
      policy: bypass # IGNORE INITIALLY
    - domain: ytdl.$SERVICES_DOMAIN
      policy: one_factor
      subject:
      - 'group:family'
      - 'group:guests'
    - domain: ikom.$SERVICES_DOMAIN
      policy: one_factor
      subject:
      - 'group:family'
    - domain: bin.$SERVICES_DOMAIN
      policy: bypass
    - domain: '*.$SERVICES_DOMAIN'
      policy: one_factor
      subject:
      - 'group:admins'

session:
  secret: '$AUTHELIA_SESSION_SECRET'
  cookies:
    - domain: $SERVICES_DOMAIN
      authelia_url: https://$TARGET.$SERVICES_DOMAIN

  redis:
    host: authelia-db
    port: 6379
    password: $AUTHELIA_REDIS_PASSWORD

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 900

storage:
  encryption_key: '$AUTHELIA_DB_ENCRYPTION_KEY'
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
